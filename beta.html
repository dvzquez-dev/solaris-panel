function _arrancarGis_(){

        'background:none;color:#F4F3F3;border-radius:9px;padding:10px 16px;cursor:pointer">Recargar</button>'); }

function abrirModal(html){
  $('#modal-body').innerHTML=html;
  $('#modal').classList.add('on');
  $('#modal .card').scrollTop=0;
}
function cerrarModal(){ $('#modal').classList.remove('on'); }
document.addEventListener('click',function(e){
  if(!e.target||!e.target.closest) return;
  if(e.target.id==='modal' || e.target.closest('[data-cerrar]')) cerrarModal();
});

/* ═══════════════════════════════════════════════════════════════════════════
   PULSAR — acuse barato (<120 ms) y NUNCA bajo el dedo.
   ═══════════════════════════════════════════════════════════════════════════ */
document.addEventListener('pointerdown',function(e){
  if(!e.target||!e.target.closest) return;
  var el=e.target.closest('[data-p]');
  if(!el) return;
  el.classList.add('pulsa');
  setTimeout(function(){el.classList.remove('pulsa');},120);
});
function tost(m){
  var t=$('#tost'); if(!t) return;
  t.textContent=m; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove('on');},2400);
}

/* `silencioso`: repinta sin representar la funcion otra vez.

   La regla es la de siempre —si el repintado molesta se repinta MENOS, no se apaga la
   animacion—, pero `pintar()` no puede saber solo si viene de un dedo o de una respuesta
   del servidor: se lo dice quien llama. Con dedo, todo se anima. Con dato de fondo, cada
   animacion se salta pintando su estado FINAL (no el inicial), asi que nada queda a cero.

   Sin esto, el login pintaba dos veces y el refresco en vivo una cada 90 s, y en cada una
   se repetian la entrada de la vista, la cascada del medidor y el crecimiento de las
   barras. Con el mismo dato. Daniel: «se recarga solo por la cara». */
/* RED DE SEGURIDAD. Una preferencia guardada que rompe el pintado no es un fallo: es un
   LADRILLO. Vive en `localStorage`, asi que recargar no la quita y la app no vuelve a
   arrancar nunca — hasta que alguien sepa borrar el almacenamiento del navegador, que no es
   algo que se le pueda pedir a nadie. Paso el 28/07 en la beta.

   Asi que si pintar revienta, se tira LA PREFERENCIA -no los datos, que son de verdad- y se
   reintenta una vez. Si vuelve a reventar, se propaga: a partir de ahi el problema no es la
   preferencia y taparlo seria peor. */
function pintar(silencioso){
  try{ return _pintar_(silencioso); }
  catch(e){
    if(pintar._rescatando) throw e;
    pintar._rescatando=true;
    try{
      PREF.ocultar={}; PREF.escala=''; _guardarPref_(); _aplicarEscala_();
      var r=_pintar_(silencioso);
      try{ tost('Se han restablecido las preferencias de pantallas: una de ellas impedía dibujar la app.'); }catch(_){}
      return r;
    } finally { pintar._rescatando=false; }
  }
}

  /* `el` acotado a proposito: sin el, `root||document` recorreria TAMBIEN la barra de la
     otra vista -que sigue en el DOM, oculta- y le machacaria su memoria con un ancho que
     no le toca. Si `el` no existe no se anima nada, que es lo correcto. */
  /* En Estado ya no hay barra de horas (se fue a Horas y solo a Horas), pero si el
     medidor. `animarBarras` se queda porque la pantalla tiene otras barras. */
  if(el && ST.vista==='estado'){ armarMedidor(silencioso); animarBarras(el, silencioso); }
  if(el && ST.vista==='horas'){ animarBarras(el, silencioso); animarDeltas(el); }
  if(ST.vista==='fichar'){ medirAristas(); validarFichaje(); }
  enganchar();
}
function irA(k){
  /* Al abrir Reuniones se pide ya, sin esperar al reloj: entras justo para ver quien ha
     contestado, y esperar 20 s para eso es raro. */
  if(k==='reu') setTimeout(_refrescarReuAbierta_, 60);
  if(k===ST.vista) return;
  /* pintar() recoloca el indicador y deja ultimoX en la posicion NUEVA. Hay que
     guardarla antes y restituirla, o la distancia sale 0 y no vuela nada: ni el
     arco, ni la comba proporcional, ni la estela, ni las chispas. */
  var xPrevio=ultimoX;
  ST.vista=k;
  $('#main').scrollTop=0;
  pintar();
  ultimoX=xPrevio;
  colocarViaje(true);
}

/* ── la estrella que viaja: comba PROPORCIONAL a la distancia ────────────── */
var ultimoX=null;
function colocarViaje(animar){
  var nav=$('#nav'), viaje=$('#viaje'), sombra=$('#sombra'), chi=$('#chispas');
  var act=$('.tab.on',nav); if(!act||!viaje) return;
  var rn=nav.getBoundingClientRect(), ra=act.getBoundingClientRect();
  var x=ra.left-rn.left+ra.width/2;
  var x0=(ultimoX==null)?x:ultimoX;
  var d=Math.abs(x-x0);
  var comba=Math.min(46,12+d*0.22);

  viaje.style.setProperty('--comba','-'+comba.toFixed(0)+'px');
  viaje.style.transform='translateX('+x.toFixed(1)+'px)';
  if(sombra) sombra.style.transform='translateX('+x.toFixed(1)+'px)';

  if(animar && !redu() && d>2){
    [viaje,sombra].forEach(function(el){
      if(!el) return;
      el.classList.remove('vuela'); void el.offsetWidth; el.classList.add('vuela');
      setTimeout(function(){el.classList.remove('vuela');},460);
    });
    /* la estela: Bézier cuadrática revelada por dashoffset */
    var p=$('#estelaP');
    if(p){
      p.setAttribute('d','M '+x0.toFixed(1)+' 3 Q '+((x0+x)/2).toFixed(1)+' '+(3-comba).toFixed(1)+' '+x.toFixed(1)+' 3');
      var L=1; try{L=p.getTotalLength()||1;}catch(e){}
      p.style.strokeDasharray=L; p.style.setProperty('--L',L);
      p.style.animation='none'; void p.getBoundingClientRect();
      p.style.animation='estelaAnim .52s cubic-bezier(.34,1.42,.5,1)';
    }
    /* brillito de aterrizaje */
    if(chi){
      chi.style.transform='translateX('+x.toFixed(1)+'px)';
      chi.classList.remove('on'); void chi.offsetWidth;
      setTimeout(function(){ chi.classList.add('on'); }, 300);
      setTimeout(function(){ chi.classList.remove('on'); }, 820);
    }
  } else if(chi){
    chi.style.transform='translateX('+x.toFixed(1)+'px)';
  }
  ultimoX=x;
}
window.addEventListener('resize',function(){ ultimoX=null; colocarViaje(false); });

      if(q==='cuota'){ abrirModal(_cuotaHTML_()); return; }
      if(q==='cierre'){ _abrirCierre_(); return; }
      if(q==='novedades'){ if(_puedeVerNovedades_()) abrirModal(_novedadesHTML_()); return; }
      if(q==='equipo'){ abrirModal(_coordinacionHTML_()); return; }
      if(q==='ajustes'){ abrirModal(_ajustesHTML_());
        /* Se piden al abrir y no al arrancar: es una llamada mas al backend y esta
           pantalla la abre casi nadie casi nunca. */
        _cargarNotis_();
        $$('[data-plg]').forEach(function(h){
          h.onclick=function(){
            var c=h.parentNode.querySelector('.plgc'), sv=h.querySelector('svg');
            if(c.hasAttribute('hidden')){ c.removeAttribute('hidden'); sv.style.transform='rotate(180deg)'; }
            else { c.setAttribute('hidden',''); sv.style.transform=''; }
          };
        });
        $$('#ajEscala [data-esc]').forEach(function(be){
          be.onclick=function(){
            PREF.escala=be.dataset.esc; _guardarPref_(); _aplicarEscala_();
            $$('#ajEscala [data-esc]').forEach(function(x){ x.classList.toggle('on', x===be); });
          };
        });
        $$('[data-ocultar]').forEach(function(b3){
          b3.onclick=function(){
            var k=b3.dataset.ocultar;
            PREF.ocultar=PREF.ocultar||{};
            PREF.ocultar[k]=!PREF.ocultar[k]; _guardarPref_();
            b3.textContent=_seOculta_(k)?'Sí':'No';
            /* `pintar()` ENTERO, no `pintarNav()` suelto. Y esta es la razon, que costo dos
               intentos: `pintarNav()` BORRA las pestañas y las vuelve a crear, pero **no les
               pone el manejador de clic** — eso lo hace `enganchar()`, al final de `pintar()`.
               Llamando solo a `pintarNav()` la barra se redibujaba MUERTA: todo se veia, los
               medidores seguian animando y no se podia navegar. Daniel: «peta la app y se queda
               congelada, o sea los gauges se mueven pero no puedes navegar».
               Silencioso para no re-animar la pantalla de debajo por un ajuste. */
            pintar(true);
          };
        });
      }
    };
  });

  /* bloque de sanciones: MARCAR no aplica nada */
  $$('.decs button').forEach(function(b){
    b.onclick=function(){
      var id=+b.parentNode.dataset.lid;
      LOTE.items.forEach(function(x){ if(x.id===id) x.dec=b.dataset.dec; });
      pintar();
    };
  });
  /* El «cerrar bloque» se retiro: solo cambiaba memoria local y hacia creer que la sancion
     quedaba aplicada. Se decide en el escritorio. */
  var blt=$('#btnLote');
  if(blt) blt.onclick=function(){ tost('Las sanciones se deciden desde el escritorio.'); };
  var bsn=$('#btnSancionar'); if(bsn) bsn.onclick=sancionarModal;
}

/* ⛔ ERA UNA SOLA FUNCIÓN DE 338 LÍNEAS, y es la que engancha TODA la cara. Ahora es la
   lista de lo que se engancha, y cada pieza se lee sola. El corte es MECÁNICO: se cortó
   por los comentarios de sección que ya estaban, en el mismo orden, sin mover una línea de
   dentro. Lo único que podía romperlo era una variable local que cruzara de sección, y se
   comprobó que ninguna lo hace — las dos que lo parecían (`be`, `x`) eran parámetros de
   callbacks distintos, no la misma variable. */
function enganchar(){
  _engNav_();
  _engAvisos_();
  _engMedidor_();
  _engFichar_();
  _engReuniones_();
  _engPlegables_();
  _engTurnosYDocs_();
  _engConv_();
  _engPartesDec_();
  _engPartesRev_();
  _engNov_(pintar);
}
/* decisiones sobre un documento (dentro del modal) */
document.addEventListener('click',function(ev){
  var b=ev.target&&ev.target.closest?ev.target.closest('[data-dec][data-id]'):null;
  if(!b) return;
  var acc=b.dataset.dec, id=+b.dataset.id;
  var e=ENTREGABLES.concat(ENT_REV).filter(function(x){return x.id===id;})[0];
  if(!e) return;
  var mot=($('#dMot')&&$('#dMot').value||'').trim();
  if((acc==='cambios'||acc==='rechazado') && !mot){
    if($('#dMot')){ $('#dMot').focus(); $('#dMot').style.borderColor='var(--red)'; }
    tost('Cambios y rechazo exigen motivo.');
    return;
  }
  /* Aplica la decision al objeto local. Se usa DESPUES de que el servidor la acepte, o
     directamente cuando no hay backend (maqueta). */
  var _aplicar=function(){
    if(acc==='reenviar'){ e.estado='revision'; e.nota=null; }
    else if(acc==='aprobado'||acc==='anot'){
      if(acc==='anot'){ var nt=(($('#dTit')&&$('#dTit').value)||'').trim(); if(nt) e.titulo=nt; }
      e.estado='publicado';
    }
    else if(acc==='cambios'){ e.estado='cambios'; e.nota=mot; }
    else { e.estado='rechazado'; e.nota=mot; }
    if(acc!=='reenviar') e.revisor=_pilaDeM_(yoNombre());   /* constancia de quien decidio */
  };
  var _aviso={reenviar:'Reenviado a revisión.',
    aprobado:'Aprobado · publicado en Notion y en el Libro de Datos.',
    anot:'Aprobado con anotaciones · título ajustado.',
    cambios:'Cambios pedidos: le llega al autor.',
    rechazado:'Rechazado.'}[acc]||'Hecho.';

  /* PERSISTE. Antes esto solo mutaba memoria: el revisor creia que habia firmado y no
     habia firmado nada. Si el servidor dice que no, no se toca el estado ni se miente. */
  if(typeof backendOK!=='undefined' && backendOK && SESION){
    if(b.disabled) return;
    b.disabled=true;
    var extra=null;
    if(acc==='anot'){ var t2=(($('#dTit')&&$('#dTit').value)||'').trim(); if(t2) extra={titulo:t2}; }
    api.decidir(id, acc, mot||null, extra).then(function(){
      _aplicar(); cerrarModal(); tost(_aviso); pintar();
    }).catch(function(err){
      b.disabled=false;
      tost('No se pudo registrar la decisión: '+((err&&err.message)||err));
    });
    return;
  }
  _aplicar(); cerrarModal(); tost(_aviso+' (sin conexión: solo en este teléfono)'); pintar();
});

/* reloj de la barra de estado + cronómetro de la sesión */
setInterval(function(){
  var d=new Date();
  var r=$('#reloj'); if(r) r.textContent=pad(d.getHours())+':'+pad(d.getMinutes());
  if(!ST.ses.cloudIni && ST.ses.estado==='corriendo' && minSes()>=840){
    /* 14 h (solo en DEMO local): la sesión se cierra sola. En la nube esto lo hace el
       backend (cerrarFichajesVencidos, barrido del gate), no el navegador. */
    ST.ses.acum=840; ST.ses.estado='pausada'; ST.ses.ini=null;
    tost('Sesión cerrada automáticamente a las 14 h. Ajústala antes de enviarla.');
    if(ST.vista==='fichar') pintar();
  }
  if(ST.vista==='fichar' && ST.ses.estado==='corriendo'){
    var el=$('#relSes'); if(el) el.innerHTML=fmtHM(minSes());
    var s=$('#sesion'); if(s) s.classList.toggle('larga', minSes()>=600);
    var e2=$('#estSes'); if(e2 && minSes()>=600) e2.textContent='MÁS DE 10 H ABIERTA · CIÉRRALA';
  }
}, 1000);

/* conmutador de rol — solo de la maqueta: enseña los tres estados de la app
   (miembro · coordinador · PD) sin tener que cambiar de cuenta. */
$$('#rolsel button').forEach(function(b){
  b.onclick=function(){
    ST.rol=b.dataset.rol;
    $$('#rolsel button').forEach(function(x){x.classList.toggle('on',x===b);});
    var n=$('#hNom'), r=$('#hRol');
    if(ST.rol==='pd'){ n.textContent='Lois'; r.textContent='DIRECCIÓN · PROJECT DIRECTOR'; }
    else if(ST.rol==='coord'){ n.textContent='Xoán'; r.textContent='ESTRUCTURAS · COORDINADOR'; }
    else { n.textContent='Nerea'; r.textContent='ESTRUCTURAS · MIEMBRO'; }
    pintar();
  };
});

/* arranque */
pintar();
setTimeout(function(){ colocarViaje(false); }, 60);
/* Registra el service worker y, si ya habia permiso y sesion, re-guarda la suscripcion:
   los navegadores la rotan y, si no se vuelve a guardar, los avisos dejan de llegar sin
   que nadie se entere. No pide permiso por su cuenta: eso solo pasa si pulsas el boton. */
setTimeout(function(){ try{ _pushInit_(); }catch(_){} }, 800);

/* Login OBLIGATORIO (salvo ?demo para verla en local): reanuda sesión guardada
   (<50 min) sin pasar por Google; si no, muestra el gate de marca. La app publicada
   NUNCA entra a datos falsos. */
if(GOOGLE_CLIENT_ID && !DEMO){
  _gate_(SPLASH+'<div style="opacity:.7">Cargando…</div>');
  /* PRIMERO LAS NOTIFICACIONES, ANTES DE PODER SIQUIERA INICIAR SESION (Daniel, 28/07).
     Estaba despues de resolver la identidad y eso es tarde: te dejaba escribir el correo,
     elegir cuenta y esperar a que cargue todo para luego decirte que no pasas. */
  var _entrar=function(){
    var _sg=null; try{ _sg=JSON.parse(localStorage.getItem('sol_sess')||'null'); }catch(_){}
    var _tok=(_sg && _sg.token && (Date.now()-(_sg.ts||0) < 50*60*1000)) ? _sg.token : null;
    if(_tok) _onCredencial_({credential:_tok}, true);
    else _arrancarGis_();
  };
  var _faltaN=_faltanNotis_();
  if(_faltaN) _gateNotis_(_faltaN, _entrar); else _entrar();
}
</script>
