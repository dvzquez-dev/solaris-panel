var medTimers=[];
/* LA SECUENCIA DE ARMADO SE QUEDA, SIEMPRE. La quite para matar un «parece que se recarga»
   y me carge lo que a Daniel mas le gustaba del medidor: los tramos encendiendose en orden.
   Si el repintado molesta, se arregla repintando menos, NO apagando la animacion. */
function armarMedidor(silencioso){
  var med=$('#med'); if(!med) return;
  medTimers.forEach(clearTimeout); medTimers=[];
  var p=YO.puntos, giro=p*MSTEP-MGAP/2+MTIP;
  var tip=$('#medTip'), num=$('#medN');

  /* CALLADO = APARECER LLENO, sin pasar por vacio.

     Esto sale ARRIBA del todo a proposito. Debajo hay un rebobinado que quita `arm`
     (vacia el anillo), pone el puntero a 0 grados, el numero a 0 y fuerza un reflow — y ese
     reflow hace que el vacio SE PINTE. Aunque justo despues se volviera a armar de golpe,
     el ojo ya ha visto el cero: es el «se resetea por la cara» que se ve cada vez que
     llega un dato de fondo. No basta con no animar: hay que NO REBOBINAR.

     Se apaga la transicion mientras se coloca, para que el anillo no se dibuje ni el
     puntero gire; y se devuelve despues, para que el siguiente cambio de verdad si
     transicione en vez de saltar. */
  if(redu() || silencioso){
    var segs=$$('.seg.on',med);
    segs.forEach(function(x){ x.style.transition='none'; });
    if(tip) tip.style.transition='none';
    med.classList.add('arm');
    if(num) num.textContent=p;
    if(tip) tip.style.transform='rotate('+giro+'deg)';
    void med.offsetWidth;
    segs.forEach(function(x){ x.style.transition=''; });
    if(tip) tip.style.transition='';
    return;
  }
  /* rebobinado instantáneo, para que solo el ARMADO vaya escalonado */
  med.classList.remove('arm');
  $$('.seg.on',med).forEach(function(s){s.style.transition='none';s.classList.remove('fog');});
  $$('.tk',med).forEach(function(t){
    t.classList.remove('chispa','chRoj','chOro','chAzu','chVer');
    t.style.stroke='';                     // vuelve al color que le toca por CSS
  });
  if(tip){tip.style.transition='none';tip.style.transform='rotate(0deg)';}
  if(num) num.textContent='0';
  void med.offsetWidth;
  $$('.seg.on',med).forEach(function(s){s.style.transition='';});
  if(tip) tip.style.transition='';

  /* Armado instantaneo: el estado FINAL, sin recorrerlo. Vale para quien pidio menos
     movimiento y para el repintado de fondo, que son el mismo caso -nadie ha pedido ver
     esto- aunque por motivos distintos. El color final ya lo pone el markup
     (`_colorSeg_`/`_colorTick_`), asi que aqui solo falta encenderlo. */
  /* (el caso callado/reduced ya salio arriba, antes de rebobinar) */
  med.classList.add('arm');
  if(tip) tip.style.transform='rotate('+giro+'deg)';

  var segs=$$('.seg.on',med);
  var PASO=78;          // ms entre barra y barra DENTRO de una ola
  var DESFASE=3;        // barras que va cada ola por detras de la anterior

  function fogonazo(sg){
    if(!sg) return;
    sg.classList.add('fog');
    medTimers.push(setTimeout(function(){ sg.classList.remove('fog'); },240));
  }
  /* Cada ola da un paso de mas al final, sin tramo: es para la barrita que marca TUS
     puntos. Con 10 es la de las 12, que es la misma que la del 0 —el medidor es un circulo
     y ahi la vuelta se cierra—; con 9, la del 9, cuyo tramo esta vacio y por eso ninguna
     ola normal la tocaria. */

  /* UNA OLA: recorre el anillo pintando cada tramo al pasar por el. Todas van al MISMO
     paso, asi que ninguna adelanta a la de delante: la distancia entre olas es constante y
     eso es lo que se lee como continuidad. `pinta(k)` devuelve el color del tramo k, o null
     si esta ola no tiene nada que decir ahi (la verde, en los ocho primeros).
     `p+1` pasos: el ultimo es solo la barrita de cierre. */
  function ola(t0, pinta, tinta, chispa, cuenta){
    for(var k=0;k<=p;k++){
      (function(k){
        medTimers.push(setTimeout(function(){
          var cierre = (k===p);
          var col = cierre ? null : pinta(k);
          if(col){ var sg=segs[k]; if(sg){ sg.style.stroke=col; fogonazo(sg); } }
          var iTk = cierre ? (p>=10?0:p) : k;   // el cierre con 10 es la del 0: es un circulo
          var tk = $('.tk[data-i="'+iTk+'"]',med);
          var tn = tinta(iTk);
          if(tk && tn){
            tk.style.stroke=tn;
            tk.classList.remove('chispa','chRoj','chOro','chAzu','chVer');
            tk.classList.add(chispa);
            void tk.getBoundingClientRect();   // reinicia la animacion; sin esto no repite
            tk.classList.add('chispa');
          }
          if(cuenta && num && !cierre) num.textContent=k+1;
        }, t0+k*PASO));
      })(k);
    }
  }

  var eleg = estadoPts(p)==='elegible';
  /* Sin elegibilidad, UNA ola y la de siempre. La cascada tiene que estar reservada o deja
     de significar nada. Aqui no se toca el color: el del markup ya es el bueno. */
  if(!eleg){
    ola(140, function(){ return null; }, function(){ return null; }, 'chRoj', true);
    return;
  }

  /* ELEGIBLE. Cuatro olas a 3 barras de distancia. El anillo arranca en ROJO aunque el dato
     ya sea de elegible: si no, la ola roja iria pintando de rojo lo que ya esta azul, que es
     la pelicula al reves. */
  med.classList.remove('aura');
  segs.forEach(function(sg){ sg.style.stroke='url(#gRed)'; });
  var ROJO='var(--red2)', ORO='#F2C94C', AZUL='var(--tel)', VERDE='#7BE3BE';
  /* QUIEN es verde lo deciden `_colorSeg_`/`_colorTick_`, que son las que pintan el estado
     final. Aqui habia dos reglas nuevas escritas a mano: con 10 puntos coincidian y con 9
     NO —ponia verdes tramos y barritas que no lo son—. Una regla, un sitio. */
  function verdeSeg(k){ return _colorSeg_(k,p)==='url(#gVer)'; }
  function verdeTk(i){ return _colorTick_(i,p)==='cierra'; }

  ola(140, function(){ return 'url(#gRed)'; }, function(){ return ROJO; }, 'chRoj', true);
  ola(140 + DESFASE*PASO, function(){ return ORO; }, function(){ return ORO; }, 'chOro', false);
  /* El aura -halo que respira y estrella dorada- entra con la ola AZUL, que es el color de
     elegible. Antes seria celebrar algo que todavia no se ve. */
  medTimers.push(setTimeout(function(){ med.classList.add('aura'); }, 140 + 2*DESFASE*PASO));
  ola(140 + 2*DESFASE*PASO, function(){ return 'url(#gAzu)'; }, function(){ return AZUL; }, 'chAzu', false);
  /* La VERDE arranca en 0 como las demas y da los mismos pasos; simplemente no tiene nada
     que pintar hasta llegar a los dos ultimos. No es un caso especial: es la misma ola.
     (Daniel: «como si empezase en 0 pero no se nota hasta donde es visible».) */
  ola(140 + 3*DESFASE*PASO,
      function(k){ return verdeSeg(k) ? 'url(#gVer)' : null; },
      function(i){ return verdeTk(i)  ? VERDE : null; },
      'chVer', false);
}

/* ═══════════════════════════════════════════════════════════════════════════
   LA BARRA ASINTÓTICA — más horas, más a la derecha; nunca se sale.
   w(h) = 100·(1 − e^(−h/K)). K elegido para que el umbral caiga sobre el 58 %.
   ═══════════════════════════════════════════════════════════════════════════ */
var K_BAR=13.6;
function wBar(h){ return 100*(1-Math.exp(-Math.max(0,h)/K_BAR)); }
/* LA COMPARATIVA, pegada a la barra (Daniel, 28/07: «un espacio abajo en el mismo div»).

   Dos filas y no cuatro:
   · **vs mes anterior** — lo unico que dice si vas mejor o peor que tu, y no lo dice nada mas
     en toda la app. Necesita `YO.hAnt`; mientras el backend no lo mande, la fila no se pinta
     (en vez de inventarse un 0, que saldria como «+100 %»).
   · **vs equipo** — la media por persona del equipo. Es INDIVIDUAL: el ranking dice en que
     puesto estas, no cuanto te separa de la media, que es otra pregunta.

   Se cayeron a proposito «vs objetivo» (el objetivo ya es la marca de la propia barra, tres
   pixeles mas arriba) y «vs unidad» (Daniel: «el de vs unidad tambien [lo borraria]»). */
function _compHorasHTML_(base){
  var f='';
  if(typeof YO.hAnt==='number' && YO.hAnt>0)
    f+=deltaHTML('vs. '+(YO.mesAnt||'mes anterior'), base, YO.hAnt, nf(YO.hAnt,1)+' h en '+(YO.mesAnt||'el mes anterior'));
  var me=_mediaEquipo_();
  if(me>0) f+=deltaHTML('vs. equipo', base, me, 'media '+nf(me,1)+' h/persona');
  return f ? '<div class="comph">'+f+'</div>' : '';
}
function barraHorasHTML(id){
  /* La MISMA puerta que las dos tarjetas (`_hMesReal_`): esta era la TERCERA copia de

  var _hm=_hMesReal_(YO), notion=(_hm!=null);
  var cont=notion?_hm:sumaE('otor'), p=sumaE('pend');   /* otorgadas = todo lo que cuenta */
  /* La barra NUNCA se llena (escala asintótica), pero dentro del ancho que ocupa el total
     (otorgadas+pendientes) el reparto es LINEAL: si 4 de 20 h están pendientes, el rayado
     ocupa 1/5 de lo pintado — no un pixel al final como si fueran un extra. */
  var tot=cont+p, wtot=wBar(tot);
  var wco = tot>0 ? wtot*(cont/tot) : 0, wcop = wtot;

     el reparto es lineal, así que el objetivo cae en wtot*(UMBRAL/tot). Con la escala asintótica
     se descolocaba (con 87 h la barra llega casi al borde y el objetivo se quedaba a media barra).
     Si aún no hay horas, o el objetivo queda más a la derecha que el total, se ancla al final. */
  var wu = tot>0 ? Math.min(98, wtot*(UMBRAL/tot)) : wBar(UMBRAL);
  /* `data-k` es la clave de la MEMORIA de anchos, y a proposito NO es el id.
     Estado y Horas pintan LA MISMA barra con el mismo dato y distinto id
     (`barEstado` / `barHoras`), asi que indexando por id cada pantalla tenia su propia
     memoria: mirabas tus horas en Estado, pulsabas Horas... y la misma barra volvia a
     crecer desde cero. Con una clave por DATO, las dos comparten pasado. */
  return '<div class="barh" id="'+id+'" data-k="horasMes">'+
      '<i class="otor" data-w="'+wco.toFixed(2)+'"></i>'+
      '<i class="pend" data-l="'+wco.toFixed(2)+'" data-w="'+(wcop-wco).toFixed(2)+'"></i>'+
      '<span class="mk" data-l="'+wu.toFixed(2)+'"></span>'+
    '</div>'+
    '<div class="barhet"><span data-l="'+wu.toFixed(2)+'">objetivo '+nf(UMBRAL,1)+' h</span></div>'+

/* Cuanto medía cada barra la ultima vez, para poder IR de ahi al valor nuevo.

   `pintar()` reconstruye el DOM, asi que cada barra nace SIN PASADO y crecia desde cero:
   al refrescar los datos, en vez de deslizarse de 87 a 91, se vaciaba y volvia a llenarse
   entera. (Daniel: «en lugar de transicionar interpoladamente entre un estado y otro
   resetea y la barra va de 0 a 91».) Se guarda el ancho fuera del DOM —que es lo unico que
   sobrevive al repintado— y se arranca de ahi: la transicion CSS hace el resto.

   La clave es el id de la barra + la posicion del tramo dentro de ella; las dos son
   estables entre repintados. */
/* LA MEMORIA DE ANCHOS SOBREVIVE A LA RECARGA. Vivia solo en memoria, asi que CUALQUIER
   recarga la vaciaba y la barra volvia a crecer desde cero. Y en un iPhone con la app en
   la pantalla de inicio eso no es raro: iOS descarta las paginas de fondo y las recarga al
   volver. Desde fuera se ve como «se resetea cuando le sale de los huevos», que es
   exactamente lo que reporto Daniel — y por eso no habia forma de reproducirlo navegando.
   Con `localStorage` la barra crece de cero UNA vez en la vida del dispositivo. */
var _anchoPrev_={};
try{ var _ap=JSON.parse(localStorage.getItem('sol_anchos')||'null');
     if(_ap && typeof _ap==='object') _anchoPrev_=_ap; }catch(_){}
function _guardarAnchos_(){ try{ localStorage.setItem('sol_anchos',JSON.stringify(_anchoPrev_)); }catch(_){} }
function animarBarras(root, silencioso){
  $$('.barh',root||document).forEach(function(b){
    $$('i',b).forEach(function(i,ix){
      var l=i.dataset.l, w=i.dataset.w;
      i.style.left=(l||0)+'%';

         el navegador lo descarta y el tramo se queda en el `width:0` de la hoja, o sea
         creciendo desde cero sin que nadie lo haya pedido. Si no es un numero, no se
         guarda ni se anima. */
      if(!isFinite(parseFloat(w))){ i.style.width='0%'; return; }
      _anchoPrev_[k]=w;

         llamadas lo pasaban... y el cuerpo no lo leia nunca. Lo unico que evitaba que un
         repintado de fondo reanimara la barra era el atajo `prev===w`, o sea: funcionaba
         de casualidad mientras el dato no cambiase, y en cuanto cambiaba -o la memoria
         estaba vacia- la barra se reiniciaba sin que nadie hubiera tocado nada.
         Callado = ancho final y punto. La regla del proyecto es «repintar menos, no
         apagar la animacion»: esto no apaga nada, solo deja de animar lo que no ha
         pedido el usuario. */
      if(silencioso || redu()){ i.style.width=w+'%'; return; }
      /* De donde parte: de lo que media antes si ya estaba pintada, y de cero solo la
         primera vez —que ahi si se quiere ver crecer—. */
      /* 🔴 EL SALTO A `prev` TIENE QUE SER UN SALTO, NO UNA TRANSICION.
         `.barh i` nace con `width:0` por CSS (regla de arriba) y `pintar()` fuerza DOS
         reflows sincronos entre el `innerHTML` y esta linea: `colocarViaje()` lee
         `getBoundingClientRect()` y `armarMedidor()` hace `void med.offsetWidth`. Un
         reflow CONFIRMA el 0 como estilo anterior, asi que asignar `prev%` deja de ser
         una colocacion instantanea y dispara `transition:width 1s`: la barra barre de
         CERO a `prev`, y 70 ms despues se redirige a `w`. Con el dato IDENTICO.
         Eso es el «se resetea y arranca de 0» que Daniel llevaba viendo: no dependia de
         los datos ni de la memoria, sino del reflow que hace otra funcion por el medio.
         Mismo remedio que ya usa `armarMedidor`: apagar la transicion, colocar, forzar
         el reflow y devolverla. */
      i.style.transition='none';
      i.style.width=(prev!=null?prev:0)+'%';
      void i.offsetWidth;
      i.style.transition='';
      if(prev===w) return;                    // mismo dato: ni se toca
      /* setTimeout, no rAF: en pestaña de fondo rAF no dispara y quedaría a cero */
      setTimeout(function(){ i.style.width=w+'%'; }, 70);
    });
    $$('.mk',b).forEach(function(m){ m.style.left=m.dataset.l+'%'; });
  });
  _guardarAnchos_();
  $$('.barhet span',root||document).forEach(function(s){ s.style.left=s.dataset.l+'%'; });
}

/* ── deltas ─────────────────────────────────────────────────────────────── */
function deltaHTML(k,v,ref,txt){

  var w=Math.min(Math.abs(d),80)/80*50, left=d>=0?50:(50-w);
  return '<div class="dlt '+cls+'" data-w="'+w.toFixed(2)+'" data-l="'+left.toFixed(2)+'">'+
    '<span class="k">'+k+'</span>'+
    '<span class="tr"><i class="z"></i><b class="f"></b><s class="m"></s></span>'+
    '<span class="vv"><span class="'+(d>=0?'up':'dn')+'">'+pc(d)+'</span>'+
    '<span class="rr">'+esc(txt)+'</span></span></div>';
}
function animarDeltas(root){
  $$('.dlt',root||document).forEach(function(el){
    var w=parseFloat(el.dataset.w), l=parseFloat(el.dataset.l);
    var f=$('.f',el), m=$('.m',el);
    f.style.width='0'; f.style.left='50%'; m.style.left='50%';
    setTimeout(function(){
      f.style.width=w+'%'; f.style.left=l+'%';

/* `bloqueDeltas` se RETIRO el 28/07 (MEJ-M-2026-07-27-2, Adrian). Pintaba cuatro

/* En la maqueta el reloj corre acelerado (1 s real = 1 min de trabajo) para que
   se pueda ver el aviso de las 10 h y el autocierre de las 14 h sin esperar un
   día. En la app real DEMO_X vale 1. */
var DEMO_X=60;
/* v27: minutos de pausa de la sesión en la nube (tramos cerrados; el abierto cuenta hasta ahora). */
/* GEMELA EN OTRO RUNTIME: `_pausaMs_` del backend hace esta MISMA cuenta en
   milisegundos (suma de tramos `{ini,fin}`; el tramo abierto cuenta hasta ahora). No se
   pueden fundir -son runtimes distintos- pero **si cambia la semantica de `pausas`, hay
   que tocar las dos**. Mapa §5, D7. */
function _pausaMinMovil_(pausas){ var now=Date.now(), t=0; (pausas||[]).forEach(function(p){ var pi=Date.parse(p.ini), pf=p.fin?Date.parse(p.fin):now; if(pf>pi) t+=(pf-pi); }); return Math.round(t/60000); }
function minSes(){
  var s=ST.ses;
  if(s.cloudIni) return Math.max(0, Math.min(840, Math.round((Date.now()-Date.parse(s.cloudIni))/60000)) - _pausaMinMovil_(s.pausas));  // nube: REAL menos pausas, tope 14 h (en pausa el reloj se congela)
  if(s.estado==='parada') return 0;
  if(s.estado==='pausada') return s.acum;
  return s.acum + Math.round((Date.now()-s.ini)/60000*DEMO_X);
}
/* al cerrar se redondea a cuartos de hora con suelo de 15 min: nadie declara 0 h */
function horasSesion(){ return Math.max(0.25, Math.round(minSes()/15)/4); }
function fmtHM(m){ return pad(Math.floor(m/60))+'<span class="c">:</span>'+pad(m%60); }
function durForm(){
  var a=ST.form.ini.split(':'), b=ST.form.fin.split(':');
  var d=(+b[0]*60 + +b[1]) - (+a[0]*60 + +a[1]);
  if(d<0) d+=1440;
  return Math.round(d/15)/4;
}
function optHoras(sel){

  for(var m=0;m<24*60;m+=15){

    s+='<option value="'+v+'"'+(v===sel?' selected':'')+'>'+v+'</option>';
  }
  return s;
}

/* validación: los tres nodos y las dos aristas */
function validarFichaje(){
  var f=ST.form;
  var declP = f.declararId!=null ? PARTES.filter(function(x){return x.id===f.declararId;})[0] : null;
  var haySes = !!declP || ST.modo!=='vivo' || minSes()>0 || !!ST.ses.cloudIni;   /* declarar: ya hay sesión cerrada */
  var dur = declP ? declP.q : (ST.modo==='vivo' ? ((minSes()>0||ST.ses.cloudIni)?horasSesion():0) : durForm());
  var n1 = declP ? true : (haySes && dur>0 && dur<=12);
  /* la regla de qué es "la imputación" vive en _imputacion_(): un solo sitio, para que si
     cambia no haya que acordarse de tocar aquí Y en enviarFichaje (antes no daba error, solo
     desincronizaba silenciosamente lo que se valida de lo que se envía). */
  var imput = _imputacion_(f);
  var n2 = !!imput;
  var n3 = f.just.trim().length>=25;

  var e1=$('#e1'), e2=$('#e2'), e3=$('#e3');
  /* Debajo de cada estrella NO va el valor: que se encienda ya dice que ese requisito
     esta cubierto, y repetirlo recargaba el dibujo. La unica excepcion es pasarse de
     12 h, que no es adorno sino un tope que bloquea el envio. */
  if(e1) e1.textContent = (dur>12) ? 'excede 12 h' : '';
  if(e2) e2.textContent = '';
  if(e3) e3.textContent = '';

  [['n1',n1],['n2',n2],['n3',n3]].forEach(function(x){
    var el=$('#'+x[0]); if(el) el.classList.toggle('on',x[1]);
  });
  /* Cada arista une DOS vertices y se dibuja cuando los dos estan encendidos. La base
     (ar3) es la que CIERRA el triangulo, y por eso solo aparece con los tres. */
  var a1=$('#ar1'), a2=$('#ar2'), a3=$('#ar3');
  if(a1) a1.classList.toggle('on', n1&&n2);
  if(a2) a2.classList.toggle('on', n1&&n3);
  if(a3) a3.classList.toggle('on', n2&&n3);

  /* el aro de la justificación */
  var pct=Math.min(1,f.just.trim().length/25);
  var aro=$('#aroJ'), p=$('.p',aro||document), n=$('#aroN'), tx=$('#justTx');
  if(p) p.style.strokeDashoffset=(100-pct*100).toFixed(1);
  if(aro) aro.classList.toggle('ok',n3);
  if(n) n.textContent=Math.min(25,f.just.trim().length);
  if(tx) tx.innerHTML = n3
    ? 'Justificación suficiente. <b>Cuanto más concreta, antes te la firman.</b>'
    : 'Te faltan <b>'+(25-f.just.trim().length)+' caracteres</b>.';

  var todo=n1&&n2&&n3;
  var msg=$('#figMsg');
  if(msg){
    msg.classList.toggle('ok',todo);
    $('span:last-child',msg).textContent = todo
      ? 'Todo listo: ya se puede enviar.'
      : 'Faltan datos: todavía no se puede enviar.';
  }
  var b=$('#btnEnviar'), l=$('#lblEnviar');
  if(b){
    b.disabled=!todo;
    if(l) l.textContent = todo ? ('Enviar '+nf(dur,2)+' h a aprobación')
      : (!n1?'Falta la duración':(!n2?'Falta a qué imputarlas':'Falta la justificación'));
  }
  return todo;
}
/* La longitud REAL de cada arista, que es de donde salen el trazo y su desplazamiento.
   Si se queda en el fallback, la linea se dibuja a trazos en vez de entera: un dasharray
   de 80 sobre una arista de 113 es «trazo, hueco, trozo». Pasaba de verdad, porque
   `getTotalLength()` devuelve 0 mientras la pantalla no esta renderizada y `pintar()` mide
   en el mismo tick en que la enseña. Por eso se fuerza el calculo de estilo antes, y se
   reintenta en el siguiente frame si alguna sigue sin medir. */
function medirAristas(){
  var svg=$('.const svg.ar'); if(!svg) return;
  void svg.getBoundingClientRect();           // fuerza el layout: sin esto mide 0
  var faltan=false;
  ['ar1','ar2','ar3'].forEach(function(id){
    var p=$('#'+id); if(!p) return;
    var L=0; try{ L=p.getTotalLength(); }catch(e){}
    if(L>0) p.style.setProperty('--L',L); else faltan=true;
  });
  if(faltan) requestAnimationFrame(medirAristas);
}
function _dmyAISO_(f){ f=String(f||''); var m=f.match(/^(\d{2})\/(\d{2})\/(\d{4})$/); return m?(m[3]+'-'+m[2]+'-'+m[1]):f; }
/* Envío del fichaje. Con cuenta real y sesión EN VIVO → api.ficharSalida: la NUBE cierra
   la sesión abierta y calcula las horas (de la entrada al momento del envío). Un BLOQUE
   declarado a mano → api.pushParte (sin fichaje). Sin backend: memoria (semilla). */
function _imputacion_(f){ return f.cat==='tareas' ? (f.tarea==='__otro__' ? f.detalle.trim() : f.tarea) : f.detalle.trim(); }
async function enviarFichaje(){
  if(!validarFichaje()) return;
  var f=ST.form, imput=_imputacion_(f);
  if(f.declararId!=null && backendOK && SESION){   // declarar un parte 'sin declarar' ya cerrado
    tost('Declarando…');
    try{ var p=await api.declararParte(f.declararId, imput, f.just.trim(), f.cat);
      if(p){ var i=PARTES.findIndex(function(x){return x.id===f.declararId;}); if(i>=0) PARTES[i]=normPMovil(p); }
      f.declararId=null; f.just=''; f.tarea=''; f.detalle='';
      tost('Declarado · a la cola de tu coordinador.'); irA('horas');
    }catch(e){ tost('No se pudo declarar: '+((e&&e.message)||e)); }
    return;
  }
  if(backendOK && SESION){
    tost('Enviando…');
    try{
      var nuevo=null, h=0;
      if(ST.modo==='vivo' && ST.ses.cloudIni){
        var r=await api.ficharSalida(imput, f.just.trim(), f.cat);   // la nube cierra, calcula y guarda la categoría
        if(r && r.parte){ nuevo=normPMovil(r.parte); h=r.parte.horas; }
      } else {
        var dur=durForm();
        var rec=await api.pushParte({ fecha:_dmyAISO_(f.fecha), tarea:imput, categoria:f.cat, horas:dur,
          ini:f.ini, fin:f.fin, justificacion:f.just.trim(), sinFichaje:true });
        if(rec&&rec.partes&&rec.partes[0]){ nuevo=normPMovil(rec.partes[0]); h=dur; }
      }
      if(nuevo) PARTES.unshift(nuevo);
      ST.ses={estado:'parada'}; f.just=''; f.tarea=''; f.detalle='';
      tost('Fichaje enviado · '+nf(h,2)+' h a la cola de tu coordinador');
      irA('horas');
    }catch(e){ tost('No se pudo enviar: '+((e&&e.message)||e)); }
    return;
  }
  var durd = ST.modo==='vivo' ? horasSesion() : durForm();   // demo local (sin backend)
  PARTES.unshift({id:++SEQ, f:f.fecha, t:imput, cat:f.cat, q:durd, e:'pend',
    ini:f.ini, fin:f.fin, just:f.just.trim(),
    sinFichaje: ST.modo==='bloque'});
  ST.ses={estado:'parada',ini:null,acum:0,desde:null,ult:ST.ses.ult};
  f.just=''; f.tarea=''; f.detalle='';
  tost('Enviado · '+nf(durd,2)+' h pendientes de firma');
  irA('horas');
}

/* ═══════════════════════════════════════════════════════════════════════════
   PANTALLA 3 · HORAS
   ═══════════════════════════════════════════════════════════════════════════ */
/* Etiqueta de la CATEGORÍA de Notion a la que suma cada imputación (fichaje u otorgamiento).
   El miembro la ve para reconciliar: 'esta hora cayó en Reuniones', 'esta en Carga tareas'.
   null = cajón por defecto (Compensaciones), igual que hace el motor (aplicar_horas.py). */
var CAT_ETI={tareas:'Carga tareas',reunion:'Reuniones',turno:'Turnos fabric.',compensacion:'Compensaciones'};
function catEti(c){ return CAT_ETI[c]||CAT_ETI.compensacion; }
/* Desglose de lo que TUS imputaciones sumaron a cada categoría (no el total de la categoría en
   Notion, que además lleva reuniones auto, cursos, etc.): es la parte que puedes verificar tú. */
function desgloseCat(ps){
  if(!ps.length) return '';
  var g={}, orden=['reunion','tareas','turno','compensacion'];
  ps.forEach(function(p){ var k=(p.cat in CAT_ETI)?p.cat:'compensacion'; g[k]=(g[k]||0)+p.q; });
  var chips=orden.filter(function(k){return g[k];}).map(function(k){
    return '<span class="pil neu" style="margin:0 6px 6px 0">'+esc(CAT_ETI[k])+' <b class="mono">'+nf(g[k],1)+' h</b></span>';
  }).join('');
  return '<div style="display:flex;flex-wrap:wrap;margin:2px 0 4px">'+chips+'</div>';
}
/* ═══ LOS ULTIMOS MOVIMIENTOS · UNA SOLA PUERTA PARA HORAS Y PARA PUNTOS ═══════════
   Daniel (30/07): «deberia mostrar las ultimas 5 acciones de suma o resta... y al inicio de
   temporada resetearse. Igual que muestre los ultimos 10. **aun asi el registro debe ser
   permanente**».

   Esa ultima frase es la que manda, y separa dos cosas que es facil confundir:
     · **LA VISTA** se corta por temporada y se queda en los ultimos `MOVS_N`. Un historial que
       solo crece es basura infinita en una pantalla de movil.
     · **EL REGISTRO** no se toca NUNCA. Los partes siguen enteros, el cierre mensual los
       conserva y las sanciones viven en el KV. Aqui no se borra nada: se PINTA menos.
   Se dice en pantalla, ademas, para que nadie crea que su historial se ha perdido.

   Sustituye a `_delMesEnCurso_`, que cortaba por MES: el corte bueno es la temporada, que es
   la unidad en la que se reinician los puntos (RRI Art. 29) y en la que se miden las horas. */
var MOVS_N=5;                              /* cuantos se pintan. Daniel dudo entre 5 y 10: es
                                               este numero y nada mas, cambiarlo no toca nada. */
/* La temporada va de septiembre a agosto · GEMELA de `reglas/disciplina.py:temporada_de`.
   Si esto y el Python discrepan, el que manda es el Python: ahi se calculan los puntos. */
function _temporadaDe_(d){
  var ini = (d.getMonth()+1) >= 9 ? d.getFullYear() : d.getFullYear()-1;
  return String(ini).slice(2)+'/'+String(ini+1).slice(2);
}
/* `DD/MM/AAAA` -> `Date`. Pasa por `_dmyAISO_`, que YA EXISTE y es GEMELA en las dos caras
   (mapa funcional §4.2). La primera version de esto traia su propio `match` de la fecha: un
   TERCER parser de la misma familia, que es justo lo que el mapa prohibe en su punto 2. */
function _fechaDMY_(s){
  var iso=_dmyAISO_(s);
  /* `_dmyAISO_` CONVIERTE, no valida: lo que no reconoce lo devuelve tal cual (probado:
     'no' sale 'no'). Reutilizar la puerta buena no exime de comprobar lo que sale, o la
     basura entra como `Invalid Date` y se cuela en los filtros. */
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(iso||''))) return null;
  var p=iso.split('-'), d=new Date(+p[0], (+p[1])-1, +p[2]);
  /* Y `new Date(2026,12,32)` NO falla: rueda al mes siguiente. Se contrasta que lo que sale
     es lo que entro, o una fecha imposible pasaria por buena. */
  return (d.getFullYear()===+p[0] && d.getMonth()===(+p[1])-1 && d.getDate()===+p[2]) ? d : null;
}
function _deEstaTemporada_(d){ return !!d && _temporadaDe_(d)===_temporadaDe_(_hoyDateM_()); }
/* ⛔ CADA MAGNITUD SE REINICIA CON LO SUYO, y confundirlo hace que la app diga otra cosa que el
   Panel de Rendimientos (Daniel, 30/07):
     · PUNTOS -> por TEMPORADA (RRI Art. 29).
     · HORAS  -> por MES. El cierre mensual pone a cero Carga tareas, Reuniones, Cursos y
       Turnos (`flujos/cierre.py`), asi que enseñar la temporada en Horas seria enseñar horas
       que el panel ya no cuenta. */
function _deEsteMes_(d){
  var h=_hoyDateM_();
  return !!d && d.getMonth()===h.getMonth() && d.getFullYear()===h.getFullYear();
}
/* Los nombres de mes. El escritorio lleva la misma lista suelta dentro de su formateador de
   fechas; candidata a unificar si algun dia se tocan las dos. */
var MESES_L=['enero','febrero','marzo','abril','mayo','junio','julio','agosto',
             'septiembre','octubre','noviembre','diciembre'];
function _mesLargo_(d){ return MESES_L[d.getMonth()]+' '+d.getFullYear(); }
/* LA COMPENSACION MENSUAL · GEMELA de `flujos/cierre.py:COMPENSACION`.
   Son horas que se reciben TODOS los meses sin fichar nada, y el cierre las restaura al defecto
   del cargo. Sin ellas el desglose no cuadra con el panel y parece que faltan horas.

   ⛔ EL VALOR BUENO ES EL DE NOTION, y `COMP_CARGO` es solo el respaldo. El cierre admite
   «extras oficiales» encima del defecto (`flujos/cierre.py` los mide en `compensacion_perdida`),
   asi que deducirlo del cargo le ensenaba MENOS horas de las que tiene a quien tuviera uno, y
   sin decirlo. Desde el backend v54 llega en `YO.compensaciones`, superpuesto EN VIVO desde
   Notion por `_notionDisciplina_` — no guardado en el KV, que seria congelarlo (el error de
   `horasMes`: 62,5 h donde habia 91).

   Con un backend anterior el campo no llega y se cae al defecto, que es el comportamiento de
   siempre: la cara puede publicarse antes que el backend sin romper nada. Pero entonces
   **no se rotula como si fuera tuyo**, porque no se sabe: eso lo decide `_compEsReal_`. */
var COMP_CARGO={'Project Director':7.0,'Coordinador':3.5};
function _compBase_(m){ var c=(m&&m.cargo)||null; return COMP_CARGO[c]!=null?COMP_CARGO[c]:2.0; }
function _compEsReal_(m){ var v=m&&m.compensaciones; return typeof v==='number' && isFinite(v); }
function _compMensual_(m){ return _compEsReal_(m) ? m.compensaciones : _compBase_(m); }
/* LO QUE HAY POR ENCIMA DE LA BASE, que es una cosa DISTINTA y se ensena aparte.
   Daniel (02/08): «cuando se esta extra en turnos etc yo asigno horas de compensacion... no es
   parte de la compensacion base, es una compensacion extra». La base llega sola por el puesto;
   el extra se lo ha ganado alguien y se lo asigna el a mano, asi que meterlos en la misma cifra
   esconde lo unico de los dos que reconoce algo que esa persona hizo.
   Notion guarda UN solo numero (base + extras), asi que esto se deriva — misma cuenta que
   `flujos/cierre.py:compensacion_perdida`. Se redondea al centimo porque la resta en coma
   flotante saca cosas como 2.0999999999999996 y eso no se le ensena a nadie. */
function _compExtra_(m){
  if(!_compEsReal_(m)) return 0;                 // sin el dato de Notion no se puede saber
  return Math.round((m.compensaciones-_compBase_(m))*100)/100;
}
/* Devuelve `{total, ultimos, suma}` de ESTA temporada. `fecha` saca el `DD/MM/AAAA` de cada
   elemento, que es como los escribe el resto de la app.
   ⚠️ Lo que NO tiene fecha legible **no se esconde**: se ve y se nota. Esconder un apunte roto
   es la forma mas rapida de que nadie se entere de que esta roto. */
function _ultimosMov_(lista, fecha, cuanto, ambito){
  var dentro = (ambito==='mes') ? _deEsteMes_ : _deEstaTemporada_;
  var conD=[], sinD=[], suma=0;
  (lista||[]).forEach(function(x){
    var d=_fechaDMY_(fecha(x));
    if(!d){ sinD.push(x); suma+=(cuanto?(+cuanto(x)||0):0); return; }
    if(!dentro(d)) return;
    conD.push({x:x,d:d}); suma+=(cuanto?(+cuanto(x)||0):0);
  });
  conD.sort(function(a,b){ return b.d-a.d; });
  var todos=sinD.concat(conD.map(function(o){ return o.x; }));
  return { total: todos.length, ultimos: todos.slice(0,MOVS_N), todos: todos, suma: suma };
}
/* La coletilla que aparece en los dos libros. Una sola frase, en un sitio. */
function _notaRegistro_(total, ambito){
  var d = (ambito==='mes') ? 'de este mes' : 'de la temporada';
  return total>MOVS_N
    ? 'Se enseñan los <b>'+MOVS_N+'</b> más recientes '+d+', de '+total+'. '+
      'El registro completo <b>se conserva</b>: aquí solo se pinta menos.'
    : 'Todo lo '+d+'. El registro completo <b>se conserva</b>.';
}
function filaParte(p){
  var cls = p.e==='conf'?'borde-ok':p.e==='otor'?'borde-ot':(p.e==='rech'||p.e==='cad')?'borde-no':'borde-pe';
  var pil = p.e==='conf'?'<span class="pil conf">aprobada</span>'
          : p.e==='otor'?'<span class="pil otor">otorgada</span>'
          : p.e==='rech'?'<span class="pil no">rechazada</span>'
          : p.e==='det' ?'<span class="pil pend">falta detalle</span>'
          : p.e==='cad' ?'<span class="pil no">caducada</span>'
          : p.e==='sindecl'?'<span class="pil pend">sin declarar</span>'
          : '<span class="pil pend">en cola</span>';
  var sub = p.e==='otor' ? (p.nota?esc(p.nota):(p.f+(p.ini?' · '+p.ini+'–'+p.fin:'')))
          : p.e==='pend' ? 'esperando aprobación'
          : p.e==='det'  ? 'te piden más detalle · edítala y vuelve a enviarla'
          : p.e==='rech' ? 'rechazada'+(p.nota?' · '+esc(p.nota):'')
          : p.e==='sindecl' ? (p.f+(p.ini?' · '+p.ini+'–'+p.fin:'')+(p.caduca?' · caduca '+_isoADMY_((''+p.caduca).slice(0,10)):''))
          : (p.f+(p.ini?' · '+p.ini+'–'+p.fin:''));
  var catTxt = (p.e==='conf'||p.e==='otor') ? ' · sumó a '+catEti(p.cat)
             : p.e==='pend' ? ' · irá a '+catEti(p.cat) : '';
  var accion = p.e==='sindecl' ? '<button class="btn mini" data-declarar="'+p.id+'" data-p style="margin-right:7px">Declarar</button>' : '';
  return '<div class="fila '+cls+'"><div class="a"><b>'+esc(p.t||'Fichaje sin declarar')+'</b><small>'+sub+catTxt+
    _origenParte_(p)+'</small></div>'+
    '<div class="d">'+accion+pil+' <b class="mono">'+nf(p.q,1)+' h</b></div></div>';
}
/* ═══ LAS HORAS DEL MES: UN SOLO DESPLEGABLE, BAJO LA CIFRA ═══════════════════════
   Daniel pidio UNO y yo le deje DOS —«Ver desglose» aqui y «Que se te ha contado este mes» al
   fondo—, que es lo que canto el 31/07: «ahora esta duplicado lo de las horas». Lo que dijo,
   las dos veces y en este orden:
     · «pondria ULTIMOS MOVIMIENTOS y DENTRO de ese desplegable una opcion de ver el desglose
        completo de este mes»
     · «el desglose deberia aparecer como desplegable opcional DONDE ESTAN LAS HORAS, no aparte»
   O sea: un desplegable, pegado a la cifra, y la ventana colgando de el. Sustituye a
   `_desgloseHorasHTML_` y a `_historialHTML_`, que eran esas dos mitades. */
function _movHorasHTML_(confs){
  var r=_ultimosMov_(confs, function(p){ return p.f; }, function(p){ return p.q; }, 'mes');
  var _cr=_compEsReal_(YO), _cb=_compBase_(YO), _cx=_compExtra_(YO), comp=_compMensual_(YO);
  /* El rotulo dice lo que SE SABE. Sin el dato de Notion no se puede afirmar que sea el tuyo:
     es el defecto del cargo y se dice asi. Llamar «tuyo» a un numero deducido es la clase de
     mentira pequena que hace que nadie se fie del resto de la pantalla. */
  var _cet = _cr ? 'la que te toca por tu cargo · no se ficha'
                 : 'se te asigna cada mes · no se ficha';
  /* LA EXTRA, EN SU PROPIA FILA. Ver `_compExtra_`: no es mas cantidad de lo mismo, es otra
     cosa — la base llega por el puesto y la extra la asigna el PD por trabajo de mas. */
  var _fx = !_cx ? '' :
    '<div class="fila borde-ot"><div class="a"><b>Compensación extra</b>'+
      '<small>'+(_cx>0?'te la ha asignado el Project Director por trabajo de más':
                       'ajuste sobre la base de tu cargo')+' · solo de este mes</small></div>'+
      '<div class="d"><b class="mono">'+(_cx>0?'+':'')+nf2(_cx)+' h</b></div></div>';
  return '<div class="plg" style="margin-top:11px"><div class="plgh" data-plg data-p>'+
      '<b>Últimos movimientos</b><small>'+r.total+' apunte'+(r.total===1?'':'s')+' este mes · '+
        'de qué se componen estas horas</small>'+
      '<svg viewBox="0 0 24 24" style="margin-left:auto;width:15px;height:15px;fill:none;'+
        'stroke:currentColor;stroke-width:2.4;transition:transform .3s"><path d="M6 9l6 6 6-6"/></svg></div>'+
    '<div class="plgc" hidden>'+
      /* LA COMPENSACION POR CARGO VA LA PRIMERA: es la contribucion que nadie ve venir -no la
         fichas, te la dan- y la que hace que la cuenta cuadre con el Panel de Rendimientos. */
      '<div class="fila borde-ot"><div class="a"><b>Compensación'+(_cr?' por tu cargo':' mensual por cargo')+'</b>'+
        '<small>'+esc(_cet)+'</small></div>'+
        '<div class="d"><b class="mono">'+nf2(_cr?_cb:comp)+' h</b></div></div>'+_fx+
      (r.total ? desgloseCat(r.todos) : '')+
      '<p class="rnota" style="margin:8px 0 10px">'+
        (r.total
          ? 'A qué categoría del Panel de Rendimientos sumó cada una de tus horas de este mes. '+
            _notaRegistro_(r.total,'mes')
          : 'Este mes todavía no se te ha contado ningún fichaje. Al cerrar el mes esto vuelve a '+
            'empezar; el registro <b>no se borra</b>.')+'</p>'+
      /* LA COMPENSACION CUENTA COMO UNO DE LOS CINCO (Daniel, 03/08: «los ultimos 5 tambien
         son los ultimos 5 del mes, INCLUYENDO la compensacion inicial»). Antes se pintaba
         aparte y encima de los 10, asi que la pantalla anunciaba un numero y ensenaba otro.
         La extra, cuando la hay, va DENTRO de ese mismo apunte: es la misma contribucion. */
      r.todos.slice(0, Math.max(0, MOVS_N-1)).map(filaParte).join('')+
      '<button class="btn mini" data-desgmes data-p style="margin-top:9px">'+
        'Ver el desglose completo de este mes</button>'+
    '</div></div>';
}
/* ═══ EL DESGLOSE COMPLETO DEL MES, EN UNA VENTANA ════════════════════════════════
   Daniel (30/07): «algo de ver desglose completo y que te abra una ventana con todo pq en
   algunos casos sera inmenso, y ha de aparecer CADA CONTRIBUCION, incluida la compensacion
   mensual pasiva inicial».

   Por eso va en modal y no en la tarjeta: sin tope de filas. Y empieza por la compensacion
   por cargo, que es la contribucion que nadie ve venir —no la fichas, te la dan— y sin la
   cual el total no cuadra con el Panel de Rendimientos. */
function _desgloseMesHTML_(confs){
  var r=_ultimosMov_(confs, function(p){ return p.f; }, function(p){ return p.q; }, 'mes');
  var comp=_compMensual_(YO), total=r.suma+comp;
  var cargo=(YO&&YO.cargo)||'miembro', _cr=_compEsReal_(YO), _cb=_compBase_(YO), _cx=_compExtra_(YO);
  var fila=
    '<div class="fila borde-ot"><div class="a"><b>Compensación'+(_cr?' por tu cargo':' mensual por cargo')+'</b>'+
      '<small>'+esc(cargo)+' · se te asigna cada mes, no se ficha · vuelve a asignarse en el '+
      'cierre</small></div>'+
    '<div class="d"><span class="pil otor">automática</span> <b class="mono">'+nf2(_cr?_cb:comp)+' h</b></div></div>'+
    /* La EXTRA va en su propia fila: es trabajo reconocido, no mas base. Sin el dato de Notion
       (`_compExtra_` devuelve 0) esta fila no existe, en vez de ensenar un cero que no dice nada. */
    (!_cx ? '' :
    '<div class="fila borde-ot"><div class="a"><b>Compensación extra</b>'+
      '<small>'+(_cx>0?'asignada por el Project Director por trabajo de más (turnos extra y demás)':
                       'ajuste sobre la base de tu cargo')+' · <b>solo de este mes</b>: en el cierre '+
      'la compensación vuelve a la base</small></div>'+
    '<div class="d"><span class="pil otor">asignada</span> <b class="mono">'+(_cx>0?'+':'')+nf2(_cx)+' h</b></div></div>');
  return '<div class="mtit">Desglose de '+esc(_mesLargo_(_hoyDateM_()))+'</div>'+
    '<div class="msub">Todas tus contribuciones de este mes, sin recortar.</div>'+
    '<div class="tarj">'+
      '<div class="cifh"><span class="g mono">'+nf2(total)+'</span><span class="sc">h este mes</span></div>'+
      desgloseCat(r.todos)+
    '</div>'+
    '<div class="tarj">'+fila+r.todos.map(filaParte).join('')+'</div>'+
    '<p class="rnota">'+(_cr
      ? 'La <b>base</b> te toca por el cargo (Project Director 7 h · Coordinador 3,5 h · miembro '+
        '2 h) y llega sola. La <b>extra</b> la asigna el Project Director cuando haces trabajo de '+
        'más, y <b>no se arrastra</b>: en el cierre la compensación vuelve a la base.'
      : 'La compensación por cargo es la <b>base</b> (Project Director 7 h · Coordinador 3,5 h · '+
        'miembro 2 h). Si tienes extras oficiales encima, están en Notion y esta pantalla '+
        '<b>todavía no los conoce</b>: hace falta el backend v54.')+'<br>'+
      'El registro <b>no se borra nunca</b>: al cerrar el mes estas horas pasan al histórico y '+
      'aquí empieza el mes nuevo.</p>';
}
/* LA CUOTA, en el menu ⋮ (Daniel, 28/07: «moveria la parte entera de cuota al menu de los 3
   puntos»). Es una cifra que se consulta dos veces al año: en Horas solo alargaba la pantalla. */
function _cuotaHTML_(){
  var eur=function(n){return nf(n,2)+' €';};

/* ── TAREAS — activas ordenadas por urgencia y fecha; finalizadas al cajón ── */
var TK_ORD={alta:0,media:1,baja:2};
function vTareas(){
  var hoy=new Date(_dmyAISO_(HOY)+'T00:00:00');   // mismo origen que HOY, no una fecha aparte
  var fin=TAREAS.filter(function(t){return /hech|finaliz|complet|termin|cerrad/i.test(t.e);})
    /* por FECHA real: comparar 'DD/MM/AAAA' como texto pone 12/06 por delante de 03/07 */
    .sort(function(a,b){ return String(_dmyAISO_(b.l)||'').localeCompare(String(_dmyAISO_(a.l)||'')); });
  var act=TAREAS.filter(function(t){return !/hech|finaliz|complet|termin|cerrad/i.test(t.e);})
    /* sin fecha limite van al final; `a.l.localeCompare` sobre null tumbaba la pantalla */
    .sort(function(a,b){
      var d=(TK_ORD[a.u]-TK_ORD[b.u]); if(d) return d;
      if(!a.l) return 1; if(!b.l) return -1;
      return String(_dmyAISO_(a.l)).localeCompare(String(_dmyAISO_(b.l)));
    });
  /* Una tarea puede no tener fecha limite: el backend manda `l:null` y es legitimo.
     Antes `l.split` reventaba y la pantalla entera se quedaba en blanco. */
  function vence(l){
    if(!l) return ['sin fecha límite',false];
    var p=String(l).split('/');
    if(p.length<3) return ['sin fecha límite',false];
    var d=Math.round((new Date(p[2]+'-'+p[1]+'-'+p[0])-hoy)/86400000);
    if(isNaN(d)) return ['sin fecha límite',false];
    if(d<0) return ['venció hace '+(-d)+' día'+(-d===1?'':'s'),true];
    if(d===0) return ['vence hoy',true];
    return ['vence en '+d+' día'+(d===1?'':'s'),d<=3];
  }
  function fila(t){
    var v=vence(t.l);
    return '<div class="fila"><div class="a"><b>'+esc(t.n)+'</b>'+
      '<small>'+esc(t.s)+' · '+esc(t.pr)+' · <span style="color:'+(v[1]?'var(--red2)':'var(--ink3)')+'">'+v[0]+'</span></small></div>'+
      '<div class="d"><span class="pil '+(t.e==='Revisando'?'conf':t.e==='En desarrollo'?'pend':'neu')+'">'+esc(t.e)+'</span></div></div>';
  }
  return '<div class="h1">Mis tareas</div><p class="h1s">'+act.length+' activa'+(act.length===1?'':'s')+
    ' · ordenadas por urgencia y fecha límite.</p>'+
    '<div class="tarj">'+(act.length?act.map(fila).join(''):
      vacio('Sin tareas asignadas','No tienes ninguna tarea asignada ahora mismo. Cuando tu coordinador '+
        'te asigne una, aparecerá aquí.','',false))+'</div>'+
    (act.length?'<div class="tarj" style="background:rgba(63,158,214,.05);border-color:rgba(63,158,214,.3)">'+
      '<p class="rnota" style="margin:0">Al fichar puedes imputar tus horas a cualquiera de estas tareas. '+
      'Si crees que una no te corresponde, puedes apelarla (Art. 34).</p></div>':'')+
    /* mismo cajon que en Turnos: cuenta y la ultima, para que las dos pantallas se lean igual */
    (fin.length?'<div class="cajon" data-caj data-p><span>Tareas pasadas <b>· '+fin.length+'</b>'+
        (fin[0]&&fin[0].l?' <span style="color:var(--ink3)">· la última, '+esc(fin[0].l)+'</span>':'')+'</span>'+
      '<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></div>'+
      '<div class="cajsec"><div class="tarj">'+fin.map(fila).join('')+'</div></div>':'');
}

function _idDrive_(u){ var m=String(u||'').match(/\/d\/([A-Za-z0-9_-]{20,})/); return m?m[1]:null; }

/* ═══ EL VISOR DE DOCUMENTOS · GEMELA (movil/escritorio) ═══════════════════════
   Habia TRES copias de esto -la memoria de un turno, la revision documental del movil y la
   del escritorio-, identicas salvo en el texto de «cargando» y en si nacian plegadas. Daniel
   lo cazo por el sintoma: «no esta la pantalla completa en las revisiones documentales como
   si lo estaba en ordenes del dia... las separaste por pereza». Tenia razon: una mejora
   puesta en una copia no le llegaba a las otras.

   Ahora es una sola, y las dos diferencias son parametros:
     · `plegado` — nace cerrada (la memoria de un turno se abre para ver quien va, no para
       leer el informe) o abierta (una revision documental existe PARA leerlo).
     · `queEs`   — «la memoria» / «el documento», que es lo unico que cambiaba del texto.

   El iframe se crea **al desplegar**, nunca antes: tres visores de Drive cargando a la vez en
   una ficha es medio megabyte que casi nadie va a mirar. */
function _visorHTML_(o){
  var abierto = !o.plegado;
  return '<div class="doc" data-visor>'+
    '<div class="dh" data-vabrir="'+esc(o.id||'')+'" data-p style="cursor:pointer">'+
      '<b>'+esc(o.titulo)+'</b><small>'+esc(o.sub||'')+(o.plegado?' · pulsa para leerlo':'')+'</small>'+
      /* La pantalla completa va en la cabecera y NO despliega: `stopPropagation` en su
         manejador. Sin eso, pulsarla plegaba el visor a la vez que lo maximizaba. */
      '<button class="vfull" data-vfull data-p title="Pantalla completa" aria-label="Pantalla completa">'+
        '<svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>'+
      '<svg class="vchev" viewBox="0 0 24 24" style="width:15px;height:15px;fill:none;'+
        'stroke:currentColor;stroke-width:2.4;transition:transform .3s'+(abierto?';transform:rotate(180deg)':'')+'">'+
        '<path d="M6 9l6 6 6-6"/></svg></div>'+
    '<div class="vcuerpo"'+(abierto?'':' hidden')+' data-quees="'+esc(o.queEs||'el documento')+'">'+
      (abierto?'<div class="dcar">Cargando '+esc(o.queEs||'el documento')+'…</div>':'')+'</div>'+
    (o.url?'<a class="da" href="'+esc(o.url)+'" target="_blank" rel="noopener">abrir en Drive</a>':'')+
  '</div>';
}
/* Mete el iframe de Drive en un cuerpo ya visible. Si no carga -permisos, CSP del hosting- se
   DICE y se ofrece el enlace: un hueco blanco eterno es peor, porque quien revisa no sabe si
   esperar o si esta roto. */
function _cargarVisor_(cuerpo, id){
  if(cuerpo.dataset.cargado) return; cuerpo.dataset.cargado='1';
  var que=cuerpo.dataset.quees||'el documento';
  if(!id){ cuerpo.innerHTML='<div class="dcar">El enlace no es un archivo de Drive reconocible.<br>'+
    'Ábrelo con el enlace de abajo.</div>'; return; }
  cuerpo.innerHTML='<div class="dcar">Cargando '+que+'…</div>';
  var f=document.createElement('iframe');
  f.className='dv'; f.setAttribute('loading','lazy'); f.setAttribute('allow','autoplay');
  f.src='https://drive.google.com/file/d/'+id+'/preview';
  var fallo=setTimeout(function(){ if(cuerpo.dataset.ok) return;
    cuerpo.innerHTML='<div class="dcar">No se pudo incrustar el visor.<br>Ábrelo en Drive con el enlace de abajo.</div>'; }, 6000);
  f.onload=function(){ cuerpo.dataset.ok='1'; clearTimeout(fallo); };
  cuerpo.innerHTML=''; cuerpo.appendChild(f);
}
function _cablearVisor_(raiz){
  var R=raiz||document;
  $$('[data-visor] .vcuerpo',R).forEach(function(c){          // los que nacen abiertos
    if(!c.hasAttribute('hidden')){
      var h=c.parentNode.querySelector('[data-vabrir]');
      _cargarVisor_(c, h && h.dataset.vabrir);
    }
  });
  $$('[data-vabrir]',R).forEach(function(h){
    h.onclick=function(){
      var caja=h.parentNode, cuerpo=caja.querySelector('.vcuerpo'), sv=caja.querySelector('.vchev');
      if(!cuerpo.hasAttribute('hidden')){ cuerpo.setAttribute('hidden',''); if(sv) sv.style.transform=''; return; }
      cuerpo.removeAttribute('hidden'); if(sv) sv.style.transform='rotate(180deg)';
      _cargarVisor_(cuerpo, h.dataset.vabrir);
    };
  });
  $$('[data-vfull]',R).forEach(function(b){
    b.onclick=function(ev){
      ev.stopPropagation();                                    // no despliega: solo maximiza
      var caja=b.closest('.doc'), cuerpo=caja.querySelector('.vcuerpo');
      var yaEsta=caja.classList.toggle('full');
      document.body.style.overflow = yaEsta ? 'hidden' : '';
      /* Maximizar con el visor plegado no enseñaria nada: se abre y se carga. */
      if(yaEsta && cuerpo.hasAttribute('hidden')){
        cuerpo.removeAttribute('hidden');
        var sv=caja.querySelector('.vchev'); if(sv) sv.style.transform='rotate(180deg)';
        _cargarVisor_(cuerpo, (caja.querySelector('[data-vabrir]')||{dataset:{}}).dataset.vabrir);
      }
    };
  });
  if(!_cablearVisor_._esc){
    _cablearVisor_._esc=true;
    document.addEventListener('keydown', function(e){
      if(e.key!=='Escape') return;
      var f=document.querySelector('.doc.full');
      if(f){ f.classList.remove('full'); document.body.style.overflow=''; }
    });
  }
}

  turnos:'Turnos',docs:'Documentos',reu:'Reuniones'};

/* ═══════════════════════════════════════════════════════════════════════════
   FOTO EN EL BUZÓN Y PINTOR — diseño de Daniel (28/07)
   ═══════════════════════════════════════════════════════════════════════════ */
var BZ_FOTO=null;                 // {url, w, h} — lo que se enviará, ya fusionado
var PINT_MAX=1600;                // lado mayor. Una captura de iPhone son 1179x2556 y 4 MB
var PINT_COLORES=['#E41E25','#F2C94C','#3EB489','#3f9ed6','#FFFFFF','#111111'];
var PINT_GROSORES=[0.004,0.008,0.016];   // fracción del lado mayor: el trazo escala con la foto

/* Reduce ANTES de nada. No es solo por el peso del envío: pintar sobre un lienzo de 12 Mpx
   en un móvil va a tirones, y la captura se sigue leyendo a 1600. */
function _leerImagen_(file){
  return new Promise(function(ok,mal){
    if(!file){ mal(new Error('sin fichero')); return; }
    if(!/^image\//.test(file.type||'')){ mal(new Error('eso no es una imagen')); return; }
    var fr=new FileReader();
    fr.onerror=function(){ mal(new Error('no se pudo leer el fichero')); };
    fr.onload=function(){
      var im=new Image();
      im.onerror=function(){ mal(new Error('no se pudo abrir la imagen')); };
      im.onload=function(){
        var k=Math.min(1, PINT_MAX/Math.max(im.naturalWidth, im.naturalHeight));
        var w=Math.max(1,Math.round(im.naturalWidth*k)), h=Math.max(1,Math.round(im.naturalHeight*k));
        var c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(im,0,0,w,h);
        ok({ url:c.toDataURL('image/jpeg',0.85), w:w, h:h });
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function _pesoKB_(dataUrl){
  var i=(dataUrl||'').indexOf(',');
  return i<0 ? 0 : Math.round((dataUrl.length-i-1)*0.75/1024);   // base64 → bytes
}

/* EL PINTOR. `alTerminar(dataUrl)` recibe las dos capas YA fusionadas, o no se llama si
   se cancela. Todo el estado vive aquí dentro: al cerrarse no queda nada. */
function _abrirPintor_(fondoUrl, alTerminar){
  var caja=$('#pintor'), zona=$('#pzona'), lienzo=$('#plienzo');
  var img=$('#pfondo'), cv=$('#ptrazos');
  if(!caja||!img||!cv) return;
  var ctx=cv.getContext('2d');
  /* TRAZOS, no píxeles: cada uno es {color, grosor, pts:[[x,y],…]} en coordenadas de
     IMAGEN. Deshacer es quitar el último y repintar. Con capturas de pantalla a resolución
     completa, guardar un snapshot por trazo se come la memoria de un móvil. */
  var trazos=[], activo=null;
  var color=PINT_COLORES[0], grosor=PINT_GROSORES[1], modo='pintar';
  var vista={e:1, x:0, y:0}, punteros={}, pellizco=null;

  function aplicarVista(){
    lienzo.style.transform='translate('+vista.x.toFixed(1)+'px,'+vista.y.toFixed(1)+'px) scale('+vista.e.toFixed(4)+')';
  }
  function repintar(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.lineCap='round'; ctx.lineJoin='round';
    trazos.concat(activo?[activo]:[]).forEach(function(t){
      if(!t.pts.length) return;
      ctx.strokeStyle=t.color; ctx.lineWidth=t.grosor;
      ctx.beginPath(); ctx.moveTo(t.pts[0][0], t.pts[0][1]);
      /* Un toque sin arrastre es un punto: sin esto, marcar algo pequeño no pinta nada. */
      if(t.pts.length===1) ctx.lineTo(t.pts[0][0]+0.01, t.pts[0][1]);
      else for(var i=1;i<t.pts.length;i++) ctx.lineTo(t.pts[i][0], t.pts[i][1]);
      ctx.stroke();
    });
  }
  /* LA CONVERSIÓN QUE IMPORTA. El lienzo va dentro de un contenedor con `transform`, así
     que su `getBoundingClientRect()` YA incluye zoom y desplazamiento: dividir por el ancho
     del rectángulo da la coordenada en píxeles de imagen sin tocar la matriz a mano. Con
     cuentas propias, el trazo se desplaza en cuanto haces zoom. */
  function aImagen(ev){
    var r=cv.getBoundingClientRect();
    return [ (ev.clientX-r.left)/r.width*cv.width, (ev.clientY-r.top)/r.height*cv.height ];
  }
  function encajar(){
    var rz=zona.getBoundingClientRect();
    var k=Math.min(rz.width/cv.width, rz.height/cv.height);
    vista.e=k; vista.x=(rz.width-cv.width*k)/2; vista.y=(rz.height-cv.height*k)/2;
    aplicarVista();
  }
  function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }

  zona.onpointerdown=function(ev){
    /* La captura va en `try` y ANTES de nada: `setPointerCapture` LANZA si el navegador no
       reconoce ese puntero, y sin el try la excepción se lleva por delante el resto del
       manejador — el dedo no se registra, `punteros` se queda con uno solo y el pellizco no
       llega a existir. Que la captura falle no puede impedir seguir el gesto. */
    try{ zona.setPointerCapture(ev.pointerId); }catch(_){}
    punteros[ev.pointerId]={x:ev.clientX,y:ev.clientY};
    var ids=Object.keys(punteros);
    if(ids.length===2){
      /* DOS DEDOS SIEMPRE HACEN ZOOM, aunque estés en modo pintar: es el gesto que todo el
         mundo prueba primero. Si había un trazo empezado se descarta, porque era el primer
         dedo del pellizco y no un trazo de verdad. */
      activo=null; repintar();
      var a=punteros[ids[0]], b=punteros[ids[1]], rz=zona.getBoundingClientRect();
      /* El punto medio se guarda RELATIVO al area, que es el sistema en el que vive
         `vista.x`. Con coordenadas de pantalla se mezclan dos origenes distintos. */
      pellizco={ d:dist(a,b), cx:(a.x+b.x)/2-rz.left, cy:(a.y+b.y)/2-rz.top,
                 e:vista.e, x:vista.x, y:vista.y };
      return;
    }
    if(ids.length>2) return;
    if(modo==='pintar'){
      var p=aImagen(ev);
      activo={ color:color, grosor:Math.max(1, grosor*Math.max(cv.width,cv.height)), pts:[p] };
      repintar();
    } else {
      /* Arrastrar es un DELTA, asi que aqui el origen da igual; se guarda en pantalla.
         `d:0` es lo que distingue arrastre de pellizco. */
      pellizco={ d:0, cx:ev.clientX, cy:ev.clientY, e:vista.e, x:vista.x, y:vista.y };
    }
  };
  zona.onpointermove=function(ev){
    if(!punteros[ev.pointerId]) return;
    punteros[ev.pointerId]={x:ev.clientX,y:ev.clientY};
    var ids=Object.keys(punteros);
    if(ids.length>=2 && pellizco && pellizco.d){
      var a=punteros[ids[0]], b=punteros[ids[1]];
      var k=Math.max(0.2, Math.min(8, dist(a,b)/pellizco.d));
      var e2=Math.max(0.1, Math.min(12, pellizco.e*k));
      var kk=e2/pellizco.e;
      /* El punto medio de los dedos se queda quieto: es lo que hace que el pellizco se
         sienta bien. Sin esto la imagen se va del dedo al ampliar. */
      var rz=zona.getBoundingClientRect();
      var cx=(a.x+b.x)/2-rz.left, cy=(a.y+b.y)/2-rz.top;
      vista.e=e2;
      vista.x=cx-(pellizco.cx-pellizco.x)*kk;
      vista.y=cy-(pellizco.cy-pellizco.y)*kk;
      aplicarVista(); return;
    }
    if(activo && modo==='pintar'){
      var p=aImagen(ev);
      var u=activo.pts[activo.pts.length-1];
      /* Se descartan los puntos que no aportan: con el dedo llegan decenas por segundo y
         guardarlos todos engorda el repintado sin cambiar el trazo. */
      if(Math.hypot(p[0]-u[0], p[1]-u[1]) > 0.7){ activo.pts.push(p); repintar(); }
      return;
    }
    if(pellizco && !pellizco.d && modo==='mover'){
      vista.x=pellizco.x+(ev.clientX-pellizco.cx);
      vista.y=pellizco.y+(ev.clientY-pellizco.cy);
      aplicarVista();
    }
  };
  function soltar(ev){
    delete punteros[ev.pointerId];
    if(!Object.keys(punteros).length){
      pellizco=null;
      if(activo){ trazos.push(activo); activo=null; repintar(); }
    }
  }
  zona.onpointerup=soltar; zona.onpointercancel=soltar; zona.onpointerleave=soltar;

  /* la paleta: los presets más el selector de color del sistema, que es el «típico» */
  var pc=$('#pcolores');
  pc.innerHTML=PINT_COLORES.map(function(c,i){
    return '<button class="pcol'+(i===0?' on':'')+'" data-pc="'+c+'" style="background:'+c+'" data-p aria-label="color"></button>';
  }).join('')+'<input type="color" id="pcolorlibre" value="'+PINT_COLORES[0]+'" aria-label="otro color">';
  function marcarColor(c){
    color=c;
    $$('#pcolores .pcol').forEach(function(b){ b.classList.toggle('on', b.dataset.pc===c); });
  }
  $$('#pcolores .pcol').forEach(function(b){ b.onclick=function(){ marcarColor(b.dataset.pc); }; });
  var cl=$('#pcolorlibre'); if(cl) cl.oninput=function(){ marcarColor(cl.value); };

  var pg=$('#pgrosor');
  pg.innerHTML=PINT_GROSORES.map(function(g,i){
    var d=Math.round(4+i*4);
    return '<button data-pg="'+g+'"'+(i===1?' class="on"':'')+' data-p aria-label="grosor">'+
      '<i style="width:'+d+'px;height:'+d+'px"></i></button>';
  }).join('');
  $$('#pgrosor button').forEach(function(b){ b.onclick=function(){
    grosor=+b.dataset.pg;
    $$('#pgrosor button').forEach(function(x){ x.classList.toggle('on', x===b); }); }; });

  $$('#pmodo button').forEach(function(b){ b.onclick=function(){
    modo=b.dataset.pm;
    $$('#pmodo button').forEach(function(x){ x.classList.toggle('on', x===b); }); }; });
  $('#pdeshacer').onclick=function(){
    if(!trazos.length){ tost('No hay nada que deshacer.'); return; }
    trazos.pop(); repintar();
  };

  function cerrar(){ caja.classList.remove('on'); caja.setAttribute('aria-hidden','true'); }
  $('#pcancelar').onclick=function(){
    if(trazos.length && !confirm('Vas a salir sin guardar lo que has pintado. ¿Seguro?')) return;
    cerrar();
  };
  $('#plisto').onclick=function(){
    /* LA FUSIÓN POR CAPAS: la de abajo es la foto tal cual, la de arriba lo pintado. Sale
       un solo fichero, que es lo que se puede abrir en cualquier parte. */
    var out=document.createElement('canvas');
    out.width=cv.width; out.height=cv.height;
    var o=out.getContext('2d');
    o.drawImage(img, 0, 0, out.width, out.height);
    o.drawImage(cv, 0, 0);
    cerrar();
    alTerminar(out.toDataURL('image/jpeg', 0.82), trazos.length);
  };

  img.onload=function(){
    cv.width=img.naturalWidth; cv.height=img.naturalHeight;
    img.style.width=cv.width+'px'; img.style.height=cv.height+'px';
    repintar(); encajar();
  };
  img.src=fondoUrl;
  caja.classList.add('on'); caja.setAttribute('aria-hidden','false');
  if(img.complete && img.naturalWidth) img.onload();
}

function _cablearFotoBuzon_(repinta){
  var f=$('#bzFile'), adj=$('#bzAdj'), pin=$('#bzPintar'), qui=$('#bzQuitar');
  if(adj&&f) adj.onclick=function(){ f.click(); };
  if(f) f.onchange=async function(){
    var file=f.files&&f.files[0]; if(!file) return;
    try{
      var im=await _leerImagen_(file);
      BZ_FOTO={url:im.url, w:im.w, h:im.h, trazos:0};
      repinta();
      /* Se abre el pintor solo: casi siempre se adjunta PARA marcar algo, y así no hay que
         descubrir el lápiz. Salir sin pintar deja la foto igual. */
      _abrirPintor_(BZ_FOTO.url, function(url, n){
        BZ_FOTO={url:url, w:im.w, h:im.h, trazos:n}; repinta(); });
    }catch(e){ tost('No se pudo usar esa imagen: '+((e&&e.message)||e)); }
  };
  if(pin) pin.onclick=function(){
    /* Se vuelve a pintar sobre lo ya fusionado: los trazos anteriores quedan dentro de la
       foto y no se pueden deshacer, pero se pueden tapar. Guardar la original aparte para
       poder rehacer sería otra copia en memoria por cada reporte. */
    _abrirPintor_(BZ_FOTO.url, function(url,n){
      BZ_FOTO={url:url, w:BZ_FOTO.w, h:BZ_FOTO.h, trazos:(BZ_FOTO.trazos||0)+n}; repinta(); });
  };
  if(qui) qui.onclick=function(){ BZ_FOTO=null; repinta(); };
}

function vReu(){

  var hib=(R.modalidad==='hibrida') && !!R.pond;

      pintaba nada.)

     rejilla solo guarda UNA franja por instante, y las reuniones de antes del modelo de slot

     franja que nunca ganaba ningun instante y no se pintaba NADA; y la de trabajo, fijada en

  var fijRango={};

/* ── CUBRIR DISPONIBILIDAD — pintar a dedo/arrastre, ciclo según modalidad ─

function cubrirModal(){

  var modo=R.modalidad;

          : '<span><i style="background:var(--red)"></i>presencial + telemático</span><span><i style="background:var(--tel)"></i>solo telemático</span>';

    (_minS>1?'<p class="rnota" style="margin:-4px 0 10px">La reunión dura <b>'+_durTxt_(_minS*_slot)+

function engancharRejilla(){

  var minS=_slotsMin_(R.duracion, slot);          // casillas seguidas que exige la reunión
  var ofer={}; (R.bloques||[]).forEach(function(b){ ofer[b[0]+'_'+b[1]]=1; });

  var sig=function(cur){ return modo==='presencial'?(cur===2?0:2) : modo==='telematica'?(cur===1?0:1) : ((cur||0)+1)%3; };
  /* La unidad es el HUECO, no la casilla: una racha mas corta que la reunion no sirve
     para nada -no puedes ir- y ademas el pipeline de sanciones te daria por «cubierto». */
  var rachas=function(di){
    var out=[], f=0;
    while(f<nF){
      if(!ST.sel.get(di+'_'+f)){ f++; continue; }
      var a=f; while(f<nF && ST.sel.get(di+'_'+f)) f++;

  };
  /* Lo que queda corto se QUITA, nunca se completa: completarlo seria inventarle
     disponibilidad a una persona, y de aqui salen sanciones reales. */
  var sanear=function(){
    var n=0;
    R.dias.forEach(function(_,di){
      rachas(di).forEach(function(r){
        if(r[1]-r[0]+1>=minS) return;
        for(var i=r[0];i<=r[1];i++) ST.sel.delete(di+'_'+i);

  var cont=function(){
    var e=$('#ecount'); if(!e) return;
    var hue=0, cas=0, p=0, t=0;
    R.dias.forEach(function(_,di){ rachas(di).forEach(function(r){ hue++; cas+=r[1]-r[0]+1; }); });
    ST.sel.forEach(function(v){ v===2?p++:t++; });
    e.innerHTML = !hue
      ? 'Sin marcar todavía'+(minS>1?(' · cada toque marca '+_durTxt_(minS*slot)):'')
      : '<b>'+hue+'</b> hueco'+(hue===1?'':'s')+' · '+_durTxt_(cas*slot)+' en total'+

  };

  var cabe=function(di,f){ for(var i=0;i<minS;i++) if(!hay(di,f+i)) return false; return true; };

    return { d0:Math.min(A[0],B[0]), d1:Math.max(A[0],B[0]), f0:f0, f1:Math.min(nF-1,f1) };
  };
  var barrer=function(fn){
    var r=rango();
    for(var d=r.d0; d<=r.d1; d++) for(var f=r.f0; f<=r.f1; f++) if(hay(d,f)) fn(d+'_'+f);
  };
  var limpia=function(){ $$('.ecel.prev',grid).forEach(function(c){ c.classList.remove('prev'); }); };
  var prev=function(){ limpia(); barrer(function(k){
    var c=grid.querySelector('[data-k="'+k+'"]'); if(c) c.classList.add('prev'); }); };
  /* Se repinta la rejilla ENTERA porque `sanear` puede tocar casillas fuera del arrastre. */
  var repinta=function(){
    $$('.ecel[data-k]',grid).forEach(function(c){
      var v=ST.sel.get(c.dataset.k)||0;
      c.classList.remove('on1','on2');
      if(v===1) c.classList.add('on1'); else if(v===2) c.classList.add('on2');
    });
  };
  var commit=function(){
    barrer(function(k){ if(target===0) ST.sel.delete(k); else ST.sel.set(k,target); });
    var q=sanear();
    limpia(); repinta(); cont();
    if(q) tost(q===1 ? ('Un hueco se quedó por debajo de '+_durTxt_(minS*slot)+' y se ha quitado.')

  };

    if(!borra && !cabe(A[0],A[1])){

  /* GUARDA EN EL SERVIDOR. Antes solo ponia una marca local y decia «guardada»: en el
     servidor no quedaba nada, y de ahi come el pipeline de sanciones. `valores` va
     alineado a la POSICION de cada bloque, que es como lo espera `responder`. */
  if(g) g.onclick=async function(){
    if(g.disabled) return;
    var R2=REUNION;
    var vals=(R2.bloques||[]).map(function(b){ return ST.sel.get(b[0]+'_'+b[1])||0; });
    if(typeof backendOK!=='undefined' && backendOK && SESION){
      g.disabled=true; var prev=g.textContent; g.textContent='Guardando…';
      try{
        await api.responder(R2.id, (YO&&YO.nombre)||'', vals);
        if(!R2.resp) R2.resp={};
        R2.resp[(YO&&YO.nombre)||'']=vals;
        var re=_normReuM_(R2); REUNION=re;                    // recalcula el mapa con lo tuyo dentro
        var ix=REUNIONES_M.findIndex(function(x){ return x.id===re.id; });
        if(ix>=0) REUNIONES_M[ix]=re;
        ST._selDe=null;
        cerrarModal(); tost('Disponibilidad guardada.'); pintar();
      }catch(e){
        g.disabled=false; g.textContent=prev;
        tost('No se pudo guardar: '+((e&&e.message)||e)+'. Vuelve a intentarlo.');
      }
      return;
    }
    tost('Sin conexión no se puede guardar la disponibilidad.');
  };
}

/* UNA SOLA REJILLA para todos los dias, contigua y anclada al tamano de slot.
   Antes cada dia generaba SUS franjas desde SU hora de inicio y con una «cadencia» que
   podia solaparlas: un dia a las 17:00 y otro a las 17:30 daban franjas alternas, y con
   cadencia de 15 min y franja de 1 h salian cuatro franjas por hora pisandose entre si.
   Ahora el origen es comun (el inicio mas temprano, bajado al multiplo del slot) y cada
   dia solo OFERTA los slots que le caben enteros. Asi no hay solapes que dibujar.
   `rangos` son horas decimales [inicio, fin] por dia; [0,0] = dia apagado. */
function _genUnion_(rangos, slot){
  slot=Math.max(5, Math.min(240, +slot||60));
  var act=rangos.filter(function(r){ return r && r[1]>r[0]; });
  if(!act.length) return { F:[], perDia:rangos.map(function(){ return []; }) };
  var m0=Math.min.apply(null, act.map(function(r){ return Math.round(r[0]*60); }));
  var m1=Math.max.apply(null, act.map(function(r){ return Math.round(r[1]*60); }));
  m0=Math.floor(m0/slot)*slot;                       // el origen cae en la rejilla
  var F=[];
  for(var t=m0; t+slot<=m1+1e-9 && F.length<400; t+=slot)
    F.push({ini:pad(Math.floor(t/60))+':'+pad(t%60), dur:slot});
  var perDia=rangos.map(function(r){
    var out=[]; if(!(r && r[1]>r[0])) return out;
    var a=Math.round(r[0]*60), b=Math.round(r[1]*60);
    F.forEach(function(_,i){ var ti=m0+i*slot; if(ti>=a && ti+slot<=b) out.push(i); });
    return out;                                      // solo los slots que caben ENTEROS
  });
  return { F:F, perDia:perDia };
}
/* Hora de inicio y de fin de una franja, para escribir un hueco como «18:00–19:00». */
function _hFranja_(R,fi){ var f=(R.franjas||[])[fi]; return f ? _hmMin_(_minHM_(f)) : '—'; }
function _hFinFranja_(R,fi){ var f=(R.franjas||[])[fi];
  return f ? _hmMin_(_minHM_(f) + (+f.dur>0 ? +f.dur : 60)) : '—'; }
/* Cuantas casillas seguidas hacen falta para cubrir la reunión. Se redondea HACIA ARRIBA:
   media casilla no existe, y quedarse corto es no poder ir. Sin `duracion` (reuniones de
   antes de este modelo) da 1, que es como se comportaba la app hasta ahora. */
function _slotsMin_(duracion, slot){
  var d=+duracion||0, s=Math.max(5, +slot||60);
  return Math.max(1, Math.ceil(d/s) || 1);
}
function _durTxt_(min){
  min=Math.max(0, Math.round(+min||0));
  var h=Math.floor(min/60), m=min%60;
  if(!h) return m+' min';
  return h+' h'+(m?' '+m+' min':'');
}

  var renderDias=function(){ var ds=_diasLargos_(val('ceModo'), val('ceD0'), val('ceD1'), val('ceFecha')||_dmyAISO_(HOY), Math.max(1,+val('ceND')||1));

  function upd(){

    if(h) h.innerHTML='Se pintan casillas de <b>'+_durTxt_(sl)+'</b> y hay que juntar '+
      '<b>'+nS+' seguida'+(nS===1?'':'s')+'</b> ('+_durTxt_(nS*sl)+') para que cuente.'+

    var p=$('#cePrev'); if(p) p.innerHTML=(u.F.length&&nb)

        (per()?' (horario por día)':'')+' · <b>'+INV.size+'</b> convocados.'
      : 'Revisa fechas u horario: no sale ninguna casilla.';
  }
  var tipoUpd=function(){ var t=val('ceTipo');
    if($('#ceMixW')) $('#ceMixW').style.display=(t==='mixta')?'':'none';

  $('#ceTipo').onchange=tipoUpd;
  $$('#ceMix .cmixb').forEach(function(b){ b.onclick=function(){ b.classList.toggle('on');

    invRender(); upd(); }; });
  var inp=$('#ceInv');
  if(inp){ inp.oninput=function(){ sugRender(inp.value); };
    inp.onblur=function(){ setTimeout(function(){ if($('#ceSug')) $('#ceSug').style.display='none'; },180); }; }
  ['ceModo','ceH0','ceH1','ceSlot','ceDura','ceND','ceD0','ceD1','ceLim','ceLimH'].forEach(function(id){

  $('#cePerdia').onchange=function(){ if(per()) renderDias(); upd(); };
  var cop=$('#ceCopiar');

    if(c.titulo && $('#ceTit')) $('#ceTit').value=c.titulo;
    ['ceModo','ceH0','ceH1','ceSlot','ceDura','ceND'].forEach(function(id){ if(c[id]!=null && $('#'+id)) $('#'+id).value=c[id]; });
    if(c.modalidad && $('#ceMod')) $('#ceMod').value=c.modalidad;
    $('#cePerdia').checked=!!c.perdia; if(per()) renderDias(); upd(); };
  var hints={publica:'Cualquiera puede tocar un hueco y ver quién puede en esa franja.',
    anonima:'El equipo ve el mapa de calor con los totales, sin nombres.',
    oculta:'El equipo no ve el mapa; solo tú, para decidir.'};
  var vision='anonima';
  $$('#ceVision button').forEach(function(b){
    b.onclick=function(){ $$('#ceVision button').forEach(function(x){x.classList.remove('on');});
      b.classList.add('on'); vision=b.dataset.v; $('#ceHint').textContent=hints[vision]; }; });
  tipoUpd();
  /* crear: construye la reunión y la PERSISTE (api.crearReunion). Sin backend, queda local. */
  $('#btnCrearOK').onclick=async function(){
    var bt=$('#btnCrearOK'); if(bt.disabled) return;
    var ds=dias(); if(!ds.length){ tost('Revisa las fechas: no hay días.'); return; }
    var _sl=+val('ceSlot')||30, _du=+val('ceDura')||60;
    var u=_genUnion_(rangos(), _sl), bloques=[];
    u.perDia.forEach(function(idxs,d){ idxs.forEach(function(fi){ bloques.push([d,fi]); }); });
    if(!u.F.length || !bloques.length){ tost('Con ese horario no sale ninguna casilla.'); return; }
    /* El aviso de «los días no empiezan a la misma hora, el mapa saldrá a huecos» se
       retiró: con la rejilla única ya no puede pasar. Lo que sí hay que decir es si
       algún día se queda demasiado corto para que quepa la reunión entera. */
    var _nS=_slotsMin_(_du,_sl);
    var _cortos=u.perDia.filter(function(idxs,i){ return (rangos()[i]||[0,0])[1]>(rangos()[i]||[0,0])[0] && idxs.length<_nS; }).length;
    if(_cortos && !window.__avisoCorto__){
      window.__avisoCorto__=1;
      tost('Ojo: '+_cortos+' día'+(_cortos===1?'':'s')+' no da'+(_cortos===1?'':'n')+' para '+_durTxt_(_nS*_sl)+

      bt.disabled=false; return;
    }
    var lim=val('ceLim') ? (val('ceLim')+(val('ceLimH')?' '+val('ceLimH'):'')) : null;
    var reu={ titulo:(val('ceTit')||'').trim()||'Reunión sin título', tipo:val('ceTipo')||'trabajo',
      modalidad:val('ceMod')||'hibrida', convocante:(YO&&YO.nombre)||'', invitados:Array.from(INV),
      dias:ds, franjas:u.F, bloques:bloques, total:bloques.length, limite:lim,
      slot:_sl, duracion:_nS*_sl,          // lo que hay que juntar seguido para que valga
      ordenDia:(val('ceOrden')||'').trim(), vision:vision, resp:{} };
    PLANTILLAS_M.unshift({ titulo:reu.titulo, ceModo:val('ceModo'), ceH0:val('ceH0'), ceH1:val('ceH1'),
      ceSlot:val('ceSlot'), ceDura:val('ceDura'), ceND:val('ceND'), modalidad:reu.modalidad, perdia:per() });
    if(PLANTILLAS_M.length>8) PLANTILLAS_M.length=8;
    bt.disabled=true; var prev=bt.textContent; bt.textContent='Creando…';
    if(typeof backendOK!=='undefined' && backendOK && SESION){
      try{ var d=await api.crearReunion(reu); if(d&&d.id) reu.id=d.id;
        cerrarModal();
        tost('Reunión convocada · '+reu.invitados.length+' convocados, '+bloques.length+' bloques.');
        /* Se RECARGA la lista del servidor. Antes se llamaba a `pintar()` sin haber metido
           la reunion nueva en `REUNIONES_M`: se repintaba lo mismo de antes y parecia que
           no se habia creado. Y se recarga en vez de fabricar una copia local, que es como
           se acaba enseñando algo que en la nube no esta. */
        CARGA.reuniones=false; pintar();            // «cargando», no «no tienes»
        await _cargarReunionesM_();
        var _nueva=(REUNIONES_M||[]).filter(function(x){ return x.id===reu.id; })[0];
        if(_nueva){ REUNION=_nueva; await _hidratarReuM_(_nueva); }
        ST.vista='reu'; pintar();
      }catch(e){ bt.disabled=false; bt.textContent=prev; tost('No se pudo convocar: '+((e&&e.message)||e)); }
      return;
    }
    cerrarModal(); tost('Sin conexión: la reunión no se ha guardado.');
  };
}
/* ── FIJAR FECHA — día + rango contiguo de franjas ─────────────────────── */
function fijarModal(){
  var R=REUNION;
  abrirModal('<div class="mtit">Fijar la reunión</div>'+
    '<div class="msub">Elige el <b>día</b> y toca donde <b>empieza</b>: se marcan solas las '+
    ('<b>'+_slotsMin_(R.duracion,R.slot)+'</b> franjas que dura'+(R.duracion?' ('+_durTxt_(R.duracion)+')':'')+'. ')+
    'Puedes estirar hacia la derecha, pero no dejarlo en menos. El resultado sale en verde en el mapa.</div>'+
    '<label class="campo"><span class="sc">Día</span><select id="fjDia">'+
      R.dias.map(function(d,i){return '<option value="'+i+'">'+esc(_diaTxtM_(d))+'</option>';}).join('')+'</select></label>'+
    '<span class="sc" style="display:block;margin-bottom:7px">Franjas de ese día</span>'+
    /* La hora de fin sale de la FRANJA, no de «la hora siguiente»: con slots de 15 o 30
       min, dar por hecho que cada franja dura una hora es sencillamente falso. */
    '<div class="pasos" id="fjSlots">'+R.franjas.map(function(f,i){
      return '<button data-k="'+i+'" data-p>'+_hFranja_(R,i)+'–'+_hFinFranja_(R,i)+'</button>';
    }).join('')+'</div>'+
    '<div class="sc" id="fjSel" style="margin:11px 0 0;color:var(--ok);font-size:12px"></div>'+
    '<button class="btn pri full" style="margin-top:13px" data-p id="btnFijarOK">Confirmar</button>');
  var anchor=-1,last=-1;
  /* EL MINIMO ES EL MISMO QUE AL CUBRIR. Una reunion de 1 h 30 con slots de 30 min ocupa
     TRES franjas, se este cubriendo o fijando: aqui se dejo el «toca la primera y la ultima»
     a pelo y se podia fijar en menos tiempo del que dura la reunion. (Daniel: «puse de 18:30
     a 20:00 y se marca como si fuera de 19:00 a 20:00».) */
  var MIN=_slotsMin_(R.duracion, R.slot), NF=R.franjas.length;
  var pintaSlots=function(){
    var lo=anchor<0?-1:Math.min(anchor,last), hi=anchor<0?-1:Math.max(anchor,last);
    $$('#fjSlots button').forEach(function(b,k){
      var on=(k>=lo&&k<=hi);
      b.style.background=on?'rgba(62,180,137,.16)':''; b.style.borderColor=on?'var(--ok)':'';
      b.style.color=on?'var(--ok)':''; b.style.fontWeight=on?'700':'';
    });
    var s=$('#fjSel');
    if(s) s.textContent = lo<0 ? '' : ('Elegido: '+_hFranja_(REUNION,lo)+'–'+_hFinFranja_(REUNION,hi));
  };
  $$('#fjSlots button').forEach(function(b,k){
    /* Si desde aqui no caben las franjas que dura, no se puede empezar aqui. Se apaga en vez
       de dejar tocar y corregir despues: lo mismo que hace la rejilla de cubrir. */
    if(k+MIN>NF){ b.disabled=true; b.style.opacity='.35'; b.title='No caben '+MIN+' franjas seguidas desde aquí'; }
    b.onclick=function(){
      if(b.disabled) return;
      if(anchor<0 || anchor!==last){
        anchor=k; last=Math.min(NF-1, k+MIN-1);      // un toque = el minimo, hacia la derecha
      } else {
        /* estirar es libre, pero nunca por debajo del minimo */
        last = (k>=anchor) ? Math.max(k, anchor+MIN-1) : k;
        if(k<anchor){ anchor=k; last=Math.max(last, k+MIN-1); }
        if(last>NF-1) last=NF-1;
      }
      pintaSlots();
    };
  });
  $('#btnFijarOK').onclick=async function(){
    var b=$('#btnFijarOK'); if(b.disabled) return;
    if(anchor<0){ tost('Toca dónde empieza la reunión.'); return; }
    if(Math.abs(last-anchor)+1 < MIN){ tost('La reunión dura '+MIN+' franjas: no se puede fijar en menos.'); return; }
    var R2=REUNION, di=+$('#fjDia').value;
    var lo=Math.min(anchor,last), hi=Math.max(anchor,last);
    var etiqueta=_diaTxtM_(R2.dias[di])+' · '+_hFranja_(R2,lo)+'–'+_hFinFranja_(R2,hi);
    /* Los BLOQUES son lo que el mapa pinta en verde. Sin ellos solo quedaba el borde de
       «mejor franja», que significa otra cosa. */
    var bloques=[]; for(var f=lo; f<=hi; f++) bloques.push([di,f]);
    if(typeof backendOK==='undefined' || !backendOK || !SESION){
      tost('Sin conexión no se puede fijar: no llegaría a nadie más.'); return; }
    b.disabled=true; var prev=b.textContent; b.textContent='Fijando…';
    try{
      await api.fijar(R2.id, {label:etiqueta, bloques:bloques, franjas:[lo,hi]});
      R2.fijada=etiqueta; R2.fijadaBl=bloques;
      cerrarModal();
      tost('Reunión fijada: '+etiqueta+'. La disponibilidad queda cerrada.');
      pintar();
    }catch(e){ b.disabled=false; b.textContent=prev;
      tost('No se pudo fijar: '+((e&&e.message)||e)); }
  };
}

/* ═══════════════════════════════════════════════════════════════════════════
   PANEL PD — cola de sanciones por BLOQUES (marcar + confirmar entero)
   Regla cerrada: dentro de un bloque NO se decide una a una. Se MARCA la
   decisión de cada persona y el bloque se cierra ENTERO con un solo botón,
   porque aprobar de una en una podía aplicar medio bloque.
   ═══════════════════════════════════════════════════════════════════════════ */
function panelPD(){
  /* LA COLA REAL. Antes se pintaba `LOTE`, la semilla de maqueta, y sus botones solo
     tocaban memoria: con cuenta real salia vacia y aun asi se podia «cerrar el bloque».
     Ahora sale de `SANC_M` (`getSanciones`), y si todavia no ha llegado se DICE, en vez de
     enseñar un cero que parece una respuesta. Decidir sigue siendo del escritorio. */
  if(SANC_M===null) return '<h2 class="sec">Panel del PD<span class="ln"></span>disciplina</h2>'+
    '<div class="tarj">'+vacio('Cargando la cola…','Buscando qué sanciones esperan decisión.','',true)+'</div>';
  if(!SANC_M.length) return '<h2 class="sec">Panel del PD<span class="ln"></span>disciplina</h2>'+
    '<div class="tarj">'+vacio('Nada pendiente','Ninguna sanción espera decisión ahora mismo.','',false)+'</div>';
  var porLote={};
  SANC_M.forEach(function(x){ var k=x.lote||'(sueltas)'; (porLote[k]=porLote[k]||[]).push(x); });
  return '<h2 class="sec">Panel del PD<span class="ln"></span>disciplina</h2>'+
    Object.keys(porLote).map(function(k){
      var it=porLote[k];
      return '<div class="tarj"><div class="lote"><div class="lote-h">'+
        '<b>'+it.length+' '+(it.length===1?'sanción':'sanciones')+'</b>'+
        '<span class="mono" style="color:var(--red2)">'+esc(k)+'</span></div>'+
        it.slice(0,8).map(function(x){
          return '<div class="lote-i"><span class="n">'+esc(_pilaDeM_(x.nombre)||x.nombre||'')+'</span>'+
            '<span class="mono" style="color:var(--ink3);font-size:10.5px">'+esc(x.motivo||'')+'</span></div>';
        }).join('')+
        (it.length>8?'<div class="lote-m">y '+(it.length-8)+' más</div>':'')+
        '<p class="rnota">Se deciden desde el <b>escritorio</b>, que es donde están el motivo, el '+
        'artículo y el comunicado. Aquí solo se consultan.</p></div></div>';
    }).join('');
}

    lote+
