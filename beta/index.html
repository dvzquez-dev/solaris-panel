/*CHANGELOG_INI*/var CHANGELOG_MD="# Changelog — Panel Solaris\n\nQué cambió en cada versión de la app, en corto. Escrito **para el equipo**, no para el que la\nprograma: si algo no se nota usándola, no está aquí.\n\nEstás leyendo el de **esta** app: lo que cambió aquí. Lo que además cambió en la otra cara sale\nbajo «Las dos caras». Se abre desde el menú **⋮**, y la versión que llevas está en Ajustes (móvil)\no en el pie (escritorio).\n\n---\n\n## v0.15 — *29/10/2026 · backend v90 (el servidor del mini PC)*\n\n### 29/10/2026 — 🖥️📱 Parte de bloque de una reunión, y sanciones más rápidas\n\n- 🖥️📱 En la ficha de una reunión, quien la convoca puede darle a **Empezar** y, al acabar, a **Finalizar**: elige quién\n  ha estado (por defecto, los invitados), escribe un resumen y se crea un **parte para cada uno**, pendiente de aprobar.\n  Si alguien se fue antes, se le pueden bajar las horas. También se puede **declarar a mano** sin cronómetro.\n- 🖥️📱 Los partes de un bloque los aprueba el Project Director **de una vez**, en una sola tarjeta; se pueden rechazar\n  líneas sueltas con motivo.\n- 🖥️ Decidir, agrupar o revocar sanciones va más rápido: la pantalla ya no recarga la lista entera después.\n- 🖥️📱 Las sanciones por **no abrir la app** salen **apiladas en un bloque por mes** («Sin abrir la app · octubre\n  2026»), ya marcadas en Acepta, en vez de una a una. Vale para las que se generen a partir de ahora.\n\n## v0.14 — *29/10/2026 · backend v90 (el servidor del mini PC)*\n\n### 29/10/2026 — 🖥️📱 Cierre del mes más cómodo\n\n- 🖥️📱 Al hacer algo en una pantalla (aprobar un parte, decidir una sanción…) **ya no te devuelve arriba del todo**: te\n  quedas donde estabas. Cambiar de pestaña sí te lleva arriba, como siempre.\n- 🖥️📱 En el bloque de sanciones, la **compensación por responder más del 67 %**, las de **no responder la encuesta o no\n  llegar al mínimo** y las de **no abrir la app** salen ya marcadas en **Acepta**: sólo tienes que cambiar las excepciones.\n  Vale para s retocarlo antes de aprobar.\n  Mientras trabaja, el panel se bloquea.\n- 🖥️📱 Si lo prefieres, **«A mano»** esconde la caja y cambias los campos tú.\n- 🖥️📱 «Con anotaciones» sin cambiar nada ya no se envía: te pide que cambies algo (si no hay nada que cambiar, es\n  **Aprobar**).\n\n### 26/10/2026 — 🖥️📱 Fijar con el plazo abierto avisa\n\n- 🖥️📱 **Fijar** una reunión cuando el plazo para contestar aún está abierto te avisa antes: cuándo cierra, cuántos faltan\n  por contestar y que, al fijarla, se cierra el plazo para todos. Con el plazo ya cerrado no pregunta.\n- 🖥️📱 Convocar mientras **ves la app como otra persona** lo dice antes: la reunión sale a su nombre.\n- 🖥️📱 Si la app creía que tu sesión había caducado y vuelves a entrar, la pantalla vuelve a actualizarse sola.\n- 🖥️📱 **El plazo de una tarea** lo mueve el coordinador de su unidad o el PD: al sancionar por plazo sólo salen las tareas\n  que puedes mover.\n- 🖥️📱 El PD puede **revertir sus propios partes** ya firmados, igual que los firma (con motivo).\n- 📱 Mientras nadie lo haya firmado, puedes **retirar** un parte tuyo o **corregirle las horas** desde «Tus partes». Quien\n  lo firma ve que lo corregiste y de cuánto era.\n- 🖥️📱 Un parte que se quedó **pendiente en un cierre forzado** y se aprobó después ya se puede **revertir**: cuenta el\n  mes en que contó de verdad, y sólo se bloquea lo que ya llegó a Notion.\n- 🖥️📱 **El objetivo de horas del mes** ya no baja a mitad de mes si el equipo trabaja igual: el mes en curso cuenta por\n  su ritmo.\n- 🖥️📱 Si tienes instaladas la beta y la de producción, **cada aviso te llega una vez** (en la beta), no dos.\n\n### 25/10/2026 — 🖥️📱 Lo que se pedía y no llegaba, y la noche del cambio de hora\n\n- 📱 Si fichas y ya tenías una sesión abierta **en pausa** (desde otro aparato), se pinta en pausa.\n- 📱 **Tus partes** se actualiza solo cuando te aprueban uno, y el aviso de «estas horas contarán en…» sabe cuándo cerró\n  el último mes, seas quien seas.\n- 📱 En **Mis movimientos**, la fecha es la del día de aquí (lo decidido de madrugada ya no sale con el día anterior).\n- 🖥️ Al cerrar un bloque de sanciones con una revocación que se queda pendiente, dice **«A MEDIAS»** y cuántas quedan.\n- 📱 Una **captura muy detallada** en un reporte se comprime hasta caber, en vez de tumbar el reporte.\n- 🖥️📱 Un parte escrito **a mano** que cruce las 02:00–03:00 la noche del cambio de hora cuenta las horas de verdad\n  (01:30–03:30 en octubre son 3 h, no 2).\n\n### 22/10/2026 — 🖥️📱 Los coches de un turno, a la vista\n\n- 📱 La ficha de un turno dice **en qué coche vas**: quién conduce, de dónde a dónde (y la vuelta, si es distinta) y quién\n  más va.\n- 🖥️ La lista de turnos tiene una columna **Coches** (pasa por encima para ver el detalle), y **«Van»** cuenta personas\n  que van seguro; los «posible» o «reserva» salen aparte como «+N ?».\n- 🖥️ Al convocar un turno, **«Dónde se trabaja»** empieza sin elegir (antes salía CITI aunque no lo tocaras).\n- 🖥️📱 Al **reutilizar la disponibilidad** de la semana anterior, si esa semana no hubo convocatoria se dice así (decía\n  «no marcaste nada»).\n\n### 22/10/2026 — 🖥️📱 Quien entra nuevo, y quien se va\n\n- 📱 Si acabas de entrar, **Horas** ya no te compara con el equipo en rojo («−100 %») por días en los que no estabas:\n  te dice que la comparación sale tras tu primer cierre. Y el ranking ya no pinta rayas vacías debajo del último.\n- 🖥️ El Panel de mando no cuenta a quien acaba de entrar «bajo el umbral», y el Registro no llama «media» a una sola\n  ficha.\n- 🖥️📱 Quien se da de baja ya no cuenta en los **convocados** de una reunión ni sale «en riesgo»; y deja de recibir los\n  avisos de reunión y de turno.\n- 📱 Si no tienes partes en cola, **Horas** dice «Ningún parte en cola» (decía que el servidor no había contestado).\n- 🖥️📱 Al **editar los convocados** de una reunión, quien ya se dio de baja no sale marcado ni se vuelve a guardar.\n\n### 22/10/2026 — 🖥️📱 El cierre del mes dice si se está aplicando, y cómo acabó\n\n- 🖥️ Al pulsar **«Aplicar el cierre»**, el botón pasa a **«Aplicando…»** y se bloquea mientras se escribe; si el último\n  «Aplicar» no terminó, se dice con su día y su motivo. 📱 El cierre del móvil lo dice también.\n- 🖥️📱 Nada más sellar, se lee **«El último cierre, el de octubre, está aplicado»** (con cuántas fichas) en vez de\n  «no cuenta»; y mientras el mes corre, el chip dice **«MES EN CURSO»**.\n- 🖥️ En el cierre de **temporada**, la cabeza del ranking enseña el **ritmo (h/mes)** que decide el orden.\n- ⚙️ Si alguien toca Notion entre «Calcular» y «Aplicar», el cierre **se planta sin escribir nada** en vez de quedarse a\n  medias; y un plan calculado antes del 05/10 ya no duplica el mes en el Registro.\n\n### 21/10/2026 — 🖥️📱 Avisos: cada uno a su pantalla, y la portada dice lo que te toca\n\n- 📱 Tocar un aviso abre **su pantalla** (Horas, Docs, Reuniones, Turnos), no la portada; con la app abierta cambia de\n  pestaña **sin recargar**.\n- 📱 La **portada** avisa de lo que te toca: partes por firmar, tus fichajes sin declarar, documentos por revisar y la\n  disponibilidad de turnos sin contestar. Y el número de **Horas** cuenta eso mismo.\n- 🖥️ La tarjeta de sanciones del Panel de mando dice cuántas hay por decidir **en total**; «Sin declarar» sale para todos.\n- 🖥️ Automatismos: «Comprobarlo ahora» ya no deja la pantalla en «Sin fecha»; el «el motor pasó hace…» se refresca.\n- 📱🖥️ Ajustes: Reuniones avisa también al convocarte; turnos y reuniones «no se pueden apagar aquí».\n\n### 21/10/2026 — 🖥️📱 Ranking y cuota: las cifras de cada uno, como las calcula el servidor\n\n- 📱 «Horas por subsistema» ya no te pone tu unidad primera con «1 personas».\n- 🖥️ Un coordinador ve su puesto en Ranking («Vas 5.º de 22»); Coche dice 0 a quien no ha ido con coche.\n- 🖥️ El Registro del mes y el titular «quien más horas lleva» se ordenan por la cifra que enseñan.\n- 📱🖥️ Un plazo escrito corto (6/9/2026) o en UTC se lee bien.\n\n### 21/10/2026 — 🖥️📱 Sanciones: lo or dentro\n\n- **Cuatro personas no podían entrar y ya pueden.** El backend tenía mal su dirección de\n  correo — se había dado por hecho que todo el mundo usa nombre y **dos** apellidos, y no\n  es así. Si entrabas y te decía *«Entraste, pero no llegaron tus datos»*, era esto.\n- **Entrar es más rápido**: el backend ya no vuelve a leer la hoja entera en cada\n  petición. Y cuando se empujan datos nuevos, lo guardado se tira, así que **nunca ves lo\n  de antes**.\n\n## v0.5 — *en beta desde el 06/10/2026 · backend v86*\n\n### 📱 En el móvil\n\n- **La app abre antes.** Pesa **153 KB menos** al arrancar: se dejó de descargar un texto\n  interno que esta versión no llega a enseñar.\n- **En «Pendientes de decidir», los botones ya no se montan encima del texto.** El motivo\n  de cada sanción se lee entero y «Aprobar» y «Rechazar» quedan debajo, en su sitio.\n- **Turnos ya no te dice que no has entrado cuando sí.** Si al abrir la pantalla tu sesión\n  todavía estaba cargando, antes se quedaba con *«no hay sesión, entra con tu cuenta»*\n  **para siempre**; ahora lo dice como lo que es —*todavía cargando*— y **vuelve a\n  preguntar solo** en cuanto llega.\n\n### ⚙️ Por dentro\n\n- **Las horas de la temporada dejan de mantenerse a mano**: salen del histórico, así que\n  la cuota y el ranking no dependen de que alguien se acuerde de teclearlas.\n- **Y el aviso del panel dice lo que mide**, en vez de una explicación escrita hace meses\n  que ya no era cierta.\n\n## v0.4 — *en beta desde el 05/10/2026 · backend v84*\n\n### 🖥️ En el ordenador\n\n- **«Bajo el umbral» deja de marcar a todo el equipo a principio de mes.** La tarjeta\n  compara tu **media de la temporada** — que es lo que su etiqueta decía — y no las horas\n  que llevas de este mes.\n\n### 📱 En el móvil\n\n- **Tus tareas se mueven desde la app.** Una tarea sin empezar trae el botón **Empezar**, y\n  cuando la entregas, **Entregada**: pasa a «revisando». Si te equivocas, **Deshacer** la\n  devuelve al paso anterior, y )*\n\n### 06/10/2026 — El mes que ves es el de TRABAJO, no el del calendario\n\n🖥️ **Horas › Horas por miembro.** El título y la columna del mes salían del **reloj**, y el mes de trabajo va **de cierre a cierre**. Los primeros días de cada mes eso ponía el nombre del mes **nuevo** encima de los partes del **viejo** — *el fallo nunca fue comparar con junio: fue llamarlo julio*. Ahora dicen el mes que de verdad está abierto.\n\n📱 **Y en el móvil el «Desglose de…» ya lo hacía bien**, pero cada cara lo calculaba por su cuenta. Ahora las dos preguntan en el mismo sitio, así que no pueden volver a decir cosas distintas.\n\n### 06/10/2026 — «vs. objetivo» compara con lo que toca a día de hoy, y lo dice en horas\n\n🖥️ **Horas › Horas por miembro, última columna.** Compara tus horas del mes contra el objetivo **del mes entero**, así que el día 10 salía en rojo casi todo el equipo — y quién iba al **doble** del ritmo, también. Una columna que dice lo mismo para casi todos casi todo el mes no informa de nada. Ahora compara contra **la parte del objetivo que toca a día de hoy**.\n\n🖥️ **Y lo dice en horas.** Al principio del mes el objetivo a hoy es pequeño, y un porcentaje sobre él se iba a cuatro cifras. En horas se lee a la primera: **+6,3 h** es ir seis horas por delante de lo que te toca, y la resta se puede comprobar con las dos columnas de al lado.\n\n🖥️ **Y a quien no le han llegado las horas, la tabla lo dice.** Antes salía un **0,0**, que se lee como «no ha hecho nada». Ahora sale una raya.\n\n### 06/10/2026 — Horas por subsistema, ahora también en el escritorio\n\n🖥️ **Equipo › Horas por subsistema.** El ranking de unidades por **media de horas por persona** estaba **sólo en el móvil**, así que para mirarlo había que sacar el teléfono — y es justo la pantalla que se mira en junta y en consejo, delante de un ordenador. Ahora está aquí, con su barra, el puesto de cada unidad y **cuánta gente hay en cada una**, que es lo que dice si una media alta se sostiene sobre cuatro personas o sobre una.\n\n🖥️ **Y se calcula con la gente que tienes delante**, en vivo: si el servidor todavía no ha mandado qué unidades compiten, la pantalla **lo dice** en vez de enseñar un ranking a medias.\n\n### 05/10/2026 — La tarjeta de Horas ya cuenta UN solo mes, y enseña de qué se compone\n\n📱 **«Últimos movimientos» enseñaba casi nada, y no era que no hubieras hecho nada.** La cifra\ngrande cuenta el mes de trabajo —**de cierre a cierre**— y el desglose de abajo contaba el mes\ndel **calendario**: del día 1 hasta que se cierra el mes anterior ponía tu total arriba y\n**«todavía no se te ha contado ningún fichaje»** justo debajo. Ahora las dos mitades cuentan lo\nmismo, y ahí salen tus partes del mes **con su concepto** — la jornada de bienvenida, el\nNewSpace, el póster, lo que sea.\n\n📱 **Y lo que está esperando firma también sale**, con el mismo rayado que la barra usa para\n«pendientes · no cuentan» y con su propio rótulo: va aparte porque todavía **no** suma al total\nde arriba. Sólo lo que de verdad espera una decisión — lo rechazado o caducado no espera nada\nde nadie.\n\n### 05/10/2026 — Desde el móvil ya se puede deshacer un «pedir detalle»\n\n📱 **En «Ya decidiste», un parte al que le pediste detalle ya se puede revertir desde el\nteléfono.** Hasta hoy sólo desde el ordenador: el servidor lo admitía, el escritorio lo ofrecía\ny **esta cara no** — y es la cara desde la que se decide sobre la marcha.\n✅ Y la lista de lo que se puede deshacer vive ahora en **un solo sitio**, así que las dos caras\nno pueden volver a contestar distinto.\n\n### 04/10/2026 — El objetivo de horas del mes se calcula, ya no viene congelado\n\n📱 **La marca vertical de la barra de Horas —el objetivo del mes— se calcula ahora con la\ngente que está de alta**, y los meses cerrados sólo cuentan si son **de esta temporada**.\nAntes llegaba hecho desde el servidor, y lo que llegaba era **de julio**: 32 personas y media\n15,58, cuando los 23 de alta dan 18,91. El objetivo pasa de **12,85 a 12,60 h**.\n\n### 04/10/2026 — Las horas por subsistema, con la gente que tienes delante\n\n📱 **La tarjeta de subsistemas ya no enseña una foto del servidor.** Los **nombres** los sigue\nponiendo el motor; los **números** se calculan con los miembros de alta que la pantalla tiene\ndelante, así que no pueden discrepar de ella. La foto anterior era **del 23/09**: daba\n**GNC 32,2** cuando sus miembros dan **22,7**, y metía dentro a Org&Mark, que no compite.\n\n### 04/10/2026 — La demostración ya no afirma una fecha que no tiene\n\n📱 **Abriendo el panel sin conexión con el servidor se ve una demostración**, y su pie ponía\n**«SOLARIS · datos a 24/07/2026»** y **«ciclo 25/26»** con la misma cara que un dato de verdad\n— una fecha de julio leída en octubre. Ahora, sin datos, **cada rótulo se calla**; con datos\nvuelve a decirse.\n⚠️ El escritorio ya lo distinguía: era el móvil el que no.\n\n### 02/10/2026 — Al convocar, las tres responsabilidades llegan de verdad\n\n🖥️ **Marcar «Responsable audiovisual» o «Responsable de memoria» al convocar NO llegaba a\nningún sitio.** Se marcaba, se convocaba, y el turno volvía de Notion **sin esas dos\nasignaciones**: al reparto sólo pasaban el responsable de turno y el coche. Ya pasan las tres.\n✅ **Y arriba del reparto hay un recuadro con las responsabilidades pendientes de asignar**, que\nse vacía al repartirlas. Antes eso sólo te lo decía el botón de convocar — o sea cuando ya lo\nintentabas. **Una por persona**, y la misma persona puede llevar varias.\n\n### 02/10/2026 — Revocar una sanción, otra vez desde el escritorio\n\n🖥️ **Vuelve la vía de apelación del Art. 34.** Estaba en el panel viejo y se había quedado\npor el camino: ahora en **Sanciones** hay un bloque **«Se pueden revocar»** con las que ya\nestán aplicadas. Escribes el **motivo** — obligatorio — y la revocación entra en la cola\n**como pendiente**: se confirma con su bloque igual que una sanción, y sale **un solo\ncomunicado**.\n⚠️ **No borra la sanción rector.\n- ⚙️ **El backend, al día**: iba con el código del **13/08**. Con él entran los avisos de\n  documentos y el cierre automático de fichajes a las 24 h.\n\n### 14/09/2026 — Cada parte aprobado dice quién lo aprobó y cuándo\n\n📱🖥️ **Tus partes aprobados dicen quién los aprobó, cuándo y a qué mes cuentan.** Antes el móvil no lo decía, y el\nordenador, si no sabía quién había decidido, ponía un nombre igualmente. Si falta un dato, ahora lo dice.\n⚠️ El mes sólo aparece cuando se puede saber; si no, pone *sin mes confirmado*.\n\n### 14/09/2026 — Borrar una reunión en el móvil ya dice cuántas respuestas tiene\n\n📱 **El aviso antes de eliminar una reunión cuenta bien las respuestas.** Si pulsabas **Eliminar** justo al\nabrirla, podía decir *«Todavía no la ha cubierto nadie»* aunque tuviera respuestas, y borrarla se las lleva\ntodas. Ahora dice cuántas hay desde el primer momento.\n\n### 14/09/2026 — Contestar un «más detalle» ya no dice que caduca\n\n📱 **Si te piden más detalle de un parte, la tarjeta te enseña la pregunta y no te mete prisa.** Al abrirlo para\ncontestar decía *«Fichaje sin declarar… Si no, caduca a los 7 días»*, y era falso: ese parte ya está declarado y\n**no caduca**. Ahora dice **«Te piden más detalle»**, lo que te preguntaron, y que corrijas lo que ya mandaste.\n\n### 14/09/2026 — Tu documento ya decidido te lo cuenta también el ordenador\n\n🖥️ **Si abres un documento TUYO que ya está decidido, el ordenador ya no dice «lo firma X».** Aprobado,\naprobado con anotaciones o rechazado: salía *«Es tuyo: lo firma X»*, esperando a alguien que ya había\nfirmado. Ahora dice qué decidieron, quién y cuándo, qué te ajustaron, el motivo si te lo rechazaron y, si\nestá publicado, cómo mandar una versión nueva. Lo mismo que ya decía el móvil.\n\n📱🖥️ **Un documento tuyo que se está publicando ya lo dice.** En el móvil caía a *«Este expediente lo revisa\nX. Tú no decides aquí»* sobre tu propio documento ya aprobado.\n\n### 12/09/2026 — Lo que la app daba por sabido sin saberlo, y lo que se llevaba por delante\n\n> Cinco cosas que no daban ningún error. Cuatro son la misma: **una pantalla afirmando algo que\n> no sabía**. La quinta es lo contrario — trabajo tuyo que se perdía sin avisar.\n\n📱 **Tu cuota dice ahora que es una ESTIMACIÓN.** Salía como una cifra en verde con «€ al\naño» y nada más, y eso se lee como una factura. **La cuota es anual**: se cierra en agosto con\nlas horas de toda la temporada, y no se paga mes a mes. El número no cambia; cambia lo que\nsignifica.\n\n📱 **«Ver como» ya no dice «ningún parte en cola» cuando no ha podido preguntarlo.** Mirando\nla ficha de otra persona, si el servidor no contestaba la pantalla afirmaba **«No tienes horas\nesperando firma»** sobre alguien de quien no se había leído nada — y es la pantalla desde la que\nse otorgan horas. Ahora dice que no ha podido leerlos.\n\n🖥️ **Un fallo de red ya no se lleva el reporte que acabas de escribir.** Al reportar desde el\nordenador se contestan varias preguntas y, si quieres, se marca una captura a lápiz. Si al\nenviarlo fallaba la red, salía un aviso y **se perdía todo**, sin nada que pulsar. Ahora se\nguarda y la próxima vez que pulses **Reportar** te ofrece enviarlo tal cual.\n\n🖥️ **El mapa de turnos ya no dice que nadie puede liderar el turno.** Al pasar el ratón por\nuna casilla, la cesta **Pueden ser responsables** salía con «nadie del consejo puede» en\n**todas** — porque la convocatoria que baja del servidor no trae la lista del consejo y ese hueco\nse leía como un «no hay nadie». Ahora usa la lista que ya llega, y si de verdad no la sabe, lo\ndice.\n\n📱 **Reintentar un reporte que no salió ya no lo manda dos veces.** Si fallaba la red, el\nbotón volvía a habilitarse —bien— y al pulsarlo otra vez el reporte entraba **dos veces**, porque\ncada pulsación le ponía una marca distinta. Y al revés también: abrir el buzón para reportar\notra cosa empieza con marca nueva, así que no se pierde ninguno.\n\n🖥️ **El panel de sanciones ya no enseña un bloque de gente inventada.** Si el servidor no\ncontestaba, la pantalla de inicio seguía mostrando **«Bloque abierto · 5 personas»** con nombres\nde **ejemplo** — su globo rojo, sus puntos y con **«Acepta» ya marcado** —, y el botón decía que\niba a aplicarlo en Notion y mandar el comunicado. Era la semilla de demostración, que sólo\ndebería verse **sin** servidor. Ahora, con sesión abierta y sin respuesta, no se pinta.\n\n### 12/09/2026 — Se podía declarar el parte de otra persona, y un «Reintentar» que no reintentaba\n\n> Tres cosas que estaban rotas **sin dar ningún error**. Las dos primeras se veían bien en\n> pantalla: el fallo era que la app creía saber algo que no sabía.\n\n📱 **Nadie puede declarar el parte de otra persona.** La regla estaba escrita y **no\nfuncionaba**: al preparar cada parte para pintarlo no se copiaba quién lo había escrito, así que\nla comprobación contestaba siempre «es tuyo». Mirando a alguien con **Ver como** salían sus\nbotones de **Declarar** y **Responder**, y al pulsarlos su parte se enviaba con **tu** tarea,\n**tu** categoría y **tu** justificación — y perdía su fecha límite.\n\n🖥️ **El «Reintentar» del mapa de turnos ya reintenta.** Cuando el servidor no contestaba salía\n*«No se pudo preguntar · Reintentar»* y el botón **no hacía nada**. Como es lo único que vuelve\na pedir los datos, una caída de red dejaba el mapa **y** «Tu disponibilidad» muertos el resto de\nla sesión — con lo que quien iba a contestar perdía la semana.\n\n📱 **La captura de un reporte ya no se cuela en el siguiente.** Si adjuntabas una foto al buzón\ny cerrabas sin enviar, se quedaba puesta: el reporte siguiente se mandaba con **la imagen de la\npantalla anterior**. Al cambiar entre «fallo» y «mejora» sí se conserva, que es cuando toca.\n\n### 11/09/2026 — El cierre de temporada ya no dice «APLICADO» con dos fichas escritas\n\n> El cierre anual se aplica **una vez al año** y escribe en las fichas de las 32 personas. Si se\n> paraba a mitad — por esas horas\n  contaran en el mes equivocado — y que se sumaran mes tras mes.\n- **Un parte ya no se puede mandar dos veces sin querer.** El botón no se apagaba: dos toques\n  seguidos —o uno mientras el envío viajaba— mandaban **las mismas horas dos veces**. Ahora se\n  bloquea mientras se envía y vuelve si falla; y si se corta la red y lo reintentas a mano, el\n  servidor **reconoce el envío** en vez de guardarlo otra vez.\n- **Revertir ya no se ofrece sobre un mes que está cerrado.** Donde antes salía el botón —con su\n  promesa «revertir le resta N h»— ahora sale la razón. Pasaba todos los meses, entre el día 1 y el\n  día del cierre.\n- **Tu cuota se recalcula sola, con tus horas de ahora.** Ya no es la del último cierre: fichabas\n  cuatro turnos y el número no se movía hasta que se volvía a subir el panel. Y si el equipo aún no\n  ha cargado, te lo dice: **«es la última cifra que sirvió el servidor»**.\n- **Tu documento rechazado ya te dice por qué**: el motivo, quién lo decidió y cuándo. Antes ahí\n  ponía «Este expediente lo revisa Fulano. Tú no decides aquí» —sobre tu propio documento— y el\n  motivo sólo llegaba por correo. Lo mismo cuando te lo **aprueban**, y si fue **con anotaciones**,\n  **qué te cambiaron** (el título, las etiquetas): te cambiaban el título de tu documento y te\n  enterabas comparándolo de memoria. Y en la lista, un expediente **rechazado** se pintaba **en\n  verde**, el mismo color que uno aprobado, con la palabra interna del sistema («publicando»,\n  «anot») en vez de su nombre: ya sale **en rojo** y en castellano.\n- **Un cierre del mes que acaba corto ya no se da por hecho.** Cuando a alguien ya no se le\n  encuentra la ficha en Notion, el cierre se titulaba **«Ya está aplicado»**, en verde y **sin\n  botón**: no había forma de terminarlo. Ahora sale **«Aplicado a medias»** en rojo, con **cuántas\n  faltan de cuántas**, y vuelve el botón para terminar lo que queda. Si se paró por un descuadre,\n  el botón **no** vuelve: eso hay qu  y devolver a revisión»**. Lo tenía el escritorio y aquí no, y ésta\n  es la cara desde la que se revisa: quien se equivocaba de botón se quedaba mirando un candado que\n  decía «solo alguien de más rango puede cambiarlo». Sale **sólo si hay una decisión que\n  deshacer**, pregunta antes —**borra la firma de otra persona**— y deja el expediente **como\n  estaba**: en revisión y **sin revisor**. No lo firma quien lo deshace.\n\n### 15/08 — Cerrar un turno, y la cuota deja de llamarse «lo que pagas»\n\n**📱 Móvil**\n\n- **Al declarar un bloque a mano, si pones la salida antes que la entrada ahora se te dice.** Antes\n  se daba por hecho que cruzaba medianoche **sin avisar**, así que equivocarse de casilla no daba\n  ningún error: daba una duración creíble que se mandaba a firmar.\n- **La cuota se presenta como lo que es: una estimación.** La entrada del menú prometía «Lo que te\n  toca pagar esta temporada»; la cuota es **anual** y se cierra al final, así que lo que ves hoy es\n  a cuánto **va camino** de irte. Ahora se llama **«Estimación de la cuota de esta temporada»**.\n- ⚠️ **Y lo que NO está arreglado, para que no te pille**: quien no tiene ningún mes cerrado\n  **sigue apareciendo en la clasificación**, y su estimación sale de dividir por sus meses. **El 1\n  de septiembre pasa por ahí el equipo entero a la vez.**\n\n### 14/08 — Convocar la disponibilidad de turnos ya llega al servidor\n\n**📱 Móvil**\n\n- **Convocar una semana estaba escrito entero —el botón, el calendario, la rejilla— y no llegaba al\n  servidor**: la convocatoria se calculaba y se quedaba en el ordenador de quien la lanzaba. Por\n  eso Turnos decía siempre «no hay ninguna semana convocada» y el reparto se hacía a ojo. Ya se\n  sube.\n- **El mínimo de 4 horas por turno se perdía por el camino**: al marcar una casilla se marcaba\n  **una sola hora** en vez del bloque entero, así que se podía decir «puedo» sin llegar al mínimo y\n  sin que nada avisara. *(Necesita el backend desplegado.)*\n\n### 13/08 — Horas y el medidor, contando sólo lo que de verdad saben\n\n**📱 Móvil**\n\n- **«Horas por subsistema» dejó de enseñar datos que no eran tuyos.** Enseñaba **cinco unidades de\n  la maqueta** —Aviónica, GNC, Aeroestructuras, Propulsión, Org&Mark— con medias inventadas y\n  numeradas como un ranking, porque el servidor todavía no manda esa lista. Ahora dice que falta el\n  dato. Y las unidades nuevas (Recovery, Documentación Técnica, Seguridad y Verificación,\n  Logística, Patrocinios) ya no quedan fuera de su propia pantalla.\n- **En esa misma pantalla, «este mes» quería decir dos cosas distintas**: la cifra grande contaba\n  el mes de trabajo (de cierre a cierre) y el desglose de abajo, el mes del calendario de tu móvil.\n  Del día 1 al día del cierre, arriba ponía «37 h este mes» y abajo «todavía no se te ha contado\n  ningún fichaje». Ahora las dos mitades cuentan lo mismo.\n- **La nota que explica tu ritmo enseñaba una división que no daba ese ritmo**: decía «1,65 h/día\n  (20 h en 10 días)», y 20 ÷ 10 = 2. El ritmo va **sin la compensación base** de tu cargo y el\n  paréntesis enseñaba las horas en bruto. Ahora enseña el número de verdad y dice por qué no son\n  tus horas del mes.\n- **Tu fila del ranking no se pintaba si eras la última persona del equipo**: el total estaba\n  escrito a mano en 32 y ahora sale del dato del servidor. Veías dos rayas anónimas y ninguna pista\n  de que faltaba la tuya. Y en esa misma fila, quien todavía no tiene ningún mes cerrado veía **«∞\n  h»**: ahora sale una raya — no se sabe, y se dice.\n- **El medidor de conducta se contradecía a sí mismo.** Con **2 puntos exactos** ponía «En\n  evaluación.» arriba y, justo debajo, «por debajo de 2 puntos se abre expediente» — o sea que aún\n  te quedaba margen. El expediente se abre **con 2** (RRI Art. 32). Ahora el número de la frase\n  sale de la propia regla, así que no pueden volver a separarse.\n\n### 12/08 — cuatro pantallas que escondían un dato que sí tenían\n\n> Todas son lo mismo por dentro: la app **tenía** el dato y no te lo enseñaba. Ninguna daba\n> error, así que no había forma de notarlas salvo fiándote de la pantalla — que es justo lo que\n> hacían mal.\n\n**📱 Móvil**\n\n- **Tus tareas decían todas «sin fecha límite»**, tuvieran plazo o no — y por eso **ninguna\n  salía en rojo**. La pantalla que existe para que no se te pase un plazo era la que te lo\n  tapaba. Ahora dice el plazo («vence en 3 días», «vence hoy», «venció hace 2 días») y avisa en\n  rojo cuando corre prisa. ⚠️ Si te ha caducado algo estos días, **puede que sea por esto**.\n- **El orden del día de una reunión salía siempre vacío** aunque estuviera puesto, y el botón de\n  quitarlo no se pintaba. Y lo peor: **guardar con el campo vacío borraba el enlace para todo el\n  equipo**. Ya no.\n- **El libro de horas anunciaba un número y enseñaba otro.** Con exactamente cinco fichajes decía\n  «Todo lo de este mes» **escondiendo uno**, y con seis o más decía «se enseñan los 5» enseñando\n  cuatro. Si entrabas a comprobar si te habían contado un parte, **uno que de verdad faltara era\n  indistinguible del que la vista escondía**.\n\n**Las dos caras**\n\n- **La disponibilidad de los demás te llega sin sus nombres**, salvo que repartas turnos o hayas\n  convocado tú la reunión. El mapa de calor, la mejor franja y el «ya has cubierto» se ven\n  exactamente igual: lo único que cambia es que **quién dijo que no podía deja de ser público**.\n\n**⚙️ Y en el servidor, pendiente de desplegar**\n\n- Al **revertir un parte** de un bloque atrasado, las horas se restaban del **mes en curso** en\n  vez del mes en que se trabajó.\n- Los **expedientes de la Unidad de Documentación Técnica** no le llegaban a su coordinador: se\n  iban todos al Project Director.\n\n### Agosto — turnos, horas y el fichaje *(backend v58 → v79)*\n\n**📱 Móvil — 09/08**\n\n- **El escritorio también dice el plazo en palabras** (panel de convocatorias): decía «cierra\n  el 20/08/2026» mientras el móvil ya decía «cierra HOY». Y entiende las fechas en los **dos**\n  formatos: con una en `DD/MM/AAAA` antes salía «sin límite» — la pantalla diciendo que no hay\n  plazo cuando sí lo hay.\n- **El aviso de la portada dice si el plazo es HOY.** «Te falta cubrir una disponibilidad»\n  terminaba en «cierra el 20/08/2026»: dentro de una alerta, y aún así había que mirar el\n  calendario. Ahora acaba en **«cierra HOY»**, «cierra mañana» o «el plazo cerró el 07/08».\n- **El plazo para cubrir se dice en palabras.** Antes ponía «cierra el 20/08/2026» y tenías que\n  mirar el calendario; ahora dice **«cierra HOY»**, «cierra mañana» o «cierra en 2 días» cuando\n  corre prisa, y **«el plazo cerró el 08/08»** si ya venció. En la lista, en la ficha y en la\n  tarjeta de *Próxima reunión*. Ese plazo es el que mira el motor de sanciones.\n\n- **Cada reunión dice lo que dura**, en la lista y en la ficha, junto a cuándo cierra y cuánta\n  gente hay convocada. Antes ese dato solo salía **dentro** de «Cubrir mi disponibilidad», así\n  que no sabías si te cuadraba hasta estar dentro. Las reuniones de antes de este modelo no lo\n  traen y **no dicen nada**, en vez de inventarse una hora.\n\n**🔧 Arreglos del 09/08**\n\n- **Fijar una reunión ya no la deja en menos de lo que dura** (escritorio). Los desplegables\n  *Desde* y *Hasta* admitían cualquier cosa, así que una reunión de 1 h 30 se podía fijar en\n  media hora **sin ningún aviso**. Ahora el panel dice cuántas franjas dura, se estira sola al\n  mínimo si te quedas corto —y te lo dice— y no la fija si desde esa hora no cabe entera. En el\n  móvil ya funcionaba así.\n\n**🔧 Arreglos del 08/08 — se notan cuando algo va mal**\n\n- **Si el inicio de sesión de Google no carga, ahora te lo dice.** Antes entrabas directamente en\n  la app **con datos de demostración**, con pinta de funcionar: cualquier decisión que tomaras\n  ahí era sobre cifras inventadas. Ahora sale un aviso con **Reintentar**, y ver la demo es una\n  elección tuya, no algo que pasa solo.\n- **La app instalada de beta vuelve a abrir.** Al mudar la web a carpetas, el acceso directo de\n  la pantalla de inicio arrancaba en una página que ya no existía.\n- **Las notificaciones vuelven a llevar su icono.** Estaban pidiendo una imagen que se había\n  movido, así que llegaban peladas.\n\n**📱 Móvil**\n\n- **Cubrir tu disponibilidad para los turnos**, como en las reuniones: pintas a dedo los ratos que\n  puedes, y con coche o sin coche. Lo que marques queda en el servidor, no en tu teléfono.\n- **Aprobar horas desde el teléfono.** Los coordinadores y el PD tienen «Esperan tu decisión» lo\n  primero de Horas: aprobar, **pedir detalle** o rechazar, con motivo obligatorio en los dos\n  últimos.\n- **Elegir con qué cargo fichas.** Si tienes más de un perfil —tu subsistema y una coordinación—\n  eliges cuál usas al fichar, y eso decide quién firma esas horas. Con un solo perfil no se pinta:\n  un desplegable de una opción no decide nada.\n- **Los partes dicen de dónde salen sus horas**: si vienen de un fichaje, de una compensación que\n  te otorgaron, de una corrección o de una declaración a mano.\n- **Deshacer un parte que ya firmaste.** Si te equivocaste al aprobar, se revierte: se emite la\n  contraparte y las horas vuelven a su sitio. No se puede en un mes ya cerrado — esas horas ya\n  están contadas y la cuota salió de ellas.\n- **La comparativa de debajo de la barra ya no miente.** Comparaba tu mes **a medias** contra el\n  mes anterior **entero**, así que a principios de mes decía «vas peor» a quien iba **mejor**, y lo\n  decía todos los meses. Ahora compara el **ritmo** (h/día). Y «vs. equipo» usa la media real del\n  equipo este mes, no un número fijo escrito en el código.\n- **Y esa comparativa ya no cuenta la compensación de tu cargo.** Las horas que te llegan por ser\n  coordinador o PD no se trabajan: se cobran por el puesto y son las mismas todos los meses, así\n  que medían tu **cargo** en vez de tu trabajo — y comparado contigo mismo el número no se movía\n  nunca. Se descuentan en los dos lados de la fila, y también en la media del equipo.\n  **La compensación extra sí sigue contando**: esa te la dan por hacer algo de más.\n- **El mes con el que te compara es el de verdad.** Se había quedado fijo en un mes viejo, porque\n  el número salía de los datos de ejemplo y no de los tuyos. Si no hay dato del mes anterior, la\n  fila **no se pinta** en vez de inventarse un cero.\n- **La app entra de una pasada.** El bloque de fichar se dibujaba dos veces de más al abrir, y\n  ya no se dibuja ninguna: al entrar, la app volvía a pedir turnos, tareas, reuniones y tus datos\n  **justo después de haberlos recibido**, y repintaba la pantalla encima de la recién hecha.\n- **Un mes dura de cierre a cierre, y ahora la app lo cuenta así.** Un mes de trabajo no dura\n  lo que dice el calendario: dura desde que se cerró el anterior hasta que se cierra ese. Julio se\n  cerró el 4 de agosto, así que agosto empezó ese día. La app dividía tus horas entre los días\n  del calendario, y a principios de mes eso sacaba un ritmo de **poco más de la mitad** del real\n  — a todo el equipo a la vez y sin que saltara ningún error.\n- **Y el mes con el que te compara también.** Si junio se cerró el 29 y julio el 4 de agosto,\n  julio duró **37 días**, no 31. Hacen falta dos cierres guardados para saberlo: hasta el próximo\n  cierre mensual se sigue usando el calendario — aproximado, pero no inventado — y a partir de\n  ahí sale solo, sin tocar nada.\n- **La comparación con el mes pasado sale del registro del Drive**, que es donde está el dato\n  bueno. Si se corrige algo a mano en el panel, la app lo respeta en vez de ignorarlo.\n- **El medidor de conducta recuerda tus puntos entre recargas.** Se vaciaba y volvía a llenarse\n  al entrar aunque no hubiera pasado nada. Ahora, si no han cambiado, aparece lleno y ya; si han\n  cambiado, se anima — que es cuando la animación dice algo. Si lo tocas, se rearma desde cero a\n  propósito.\n- **Tus partes salen en orden**, del más reciente al más viejo.\n- **Turnos ya no se queda en blanco** cuando no hay ninguna semana convocada: dice qué pasa, y a\n  quien puede convocar le dice dónde se hace.\n- Un parte aprobado **desaparece** de la lista de pendientes en vez de quedarse ahí.\n\n**Las dos caras**\n\n- **Lo que marcas como visto en Novedades ya no se queda en tu móvil**: viaja al servidor, así que\n  lo ves igual desde el ordenador.\n- **Los avisos de la convocatoria los enciendes tú.** Nacen apagados: hasta que se enciende el\n  interruptor no le llega nada a nadie, y mientras tanto queda escrito el texto exacto que\n  mandaría.\n- 🔴 **Una notificación de la beta abría la app del equipo.** El aviso llegaba desde la versión de\n  pruebas y al tocarlo se abría producción.\n\n**⚙️ Backend v58 → v73**\n\n- **Los días del mes se cuentan desde el último cierre**, no desde el 1 del calendario — y el\n  servidor es quien los manda, para que un reloj mal puesto en un teléfono no cambie la\n  comparativa de nadie.\n- **La duración del mes anterior sale de un histórico de cierres** que se apunta al aplicar cada\n  uno. Hacía falta porque solo se guardaba **el último**: en cuanto se cerraba un mes, la fecha\n  con la que empezó el anterior se perdía para siempre.\n- **Las horas del mes pasado se leen del Registro del Drive**, que recoge también las correcciones\n  hechas a mano. Sumar los partes se las saltaba.\n- **La media del equipo descuenta la compensación de cada cargo**, igual que la fila individual:\n  con el descuento en un solo lado, la comparación era peor que sin él.\n- Disponibilidad de turnos: se guarda, se agrega y se sirve la convocatoria vigente sin pedirle el\n  identificador.\n- Revertir un parte de horas, con **clave de un solo uso** para que un reintento no reste dos\n  veces, y **cortado en los meses ya cerrados**.\n- El perfil con el que se ficha viaja con el fichaje, y el enrutado sale del servidor, no de lo que\n  diga la pantalla.\n- La media de horas del equipo del mes se sirve como **agregado sin nombres**, que es lo que\n  necesita la comparativa.\n- El identificador de una página de Notion se lee bien también cuando el enlace trae el título\n  delante.\n\n**Las dos caras**\n\n- Ya se puede sancionar por **incumplir un plazo**. El formulario ofrecía **tus** tareas en vez de\n  las de la persona sancionada, así que con el PD —que no tiene tareas— la lista salía vacía y la\n  sanción por plazo era imposible de poner **contra nadie**.\n- Los motivos de sanción llevan **su artículo real del RRI** (30b tarea importante o urgente, 30c\n  cualquier otra), en vez de una clave interna.\n- Las horas se escriben con los decimales que tienen: **0,25 h** ya no sale como «0,3 h».\n- El distintivo **«beta»** de la cabecera es ahora el **enlace de vuelta a producción**.\n- **El plan del cierre ya no se contradice a sí mismo.** Decía «todavía no se ha aplicado» y\n  «aplicarlo no se hace desde aquí» **siempre** —incluso con el cierre ya hecho y con el botón de\n  aplicar justo debajo—, mientras el bloque de al lado decía «aplicado». Ahora las dos partes\n  leen el mismo dato.\n\n**📱 Móvil**\n\n- Los expedientes dicen **«en revisión»**, no `revision`: fuera los estados internos del servidor.\n- **El «Desglose de puntos» ya enseña algo.** Cada subida o bajada, con su motivo, su artículo del\n  RRI y su fecha. Antes existía la pantalla y salía siempre vacía. *(Necesita el backend v53.)*\n- **Horas y puntos enseñan tus últimos 10 movimientos**: las horas **del mes** (se reinician con\n  el cierre, igual que el Panel de Rendimientos) y los puntos **de la temporada**. **No se borra\n  nada**: el registro completo se conserva, lo que cambia es cuánto se pinta — y la pantalla lo\n  dice.\n- **El desglose de tus horas cuelga de la propia cifra**, como desplegable opcional: ya no hay\n  que bajar al fondo de la pantalla para saber de qué se componen.\n- **«Ver el desglose completo de este mes»**: una ventana con **todas** tus contribuciones del\n  mes, sin recortar, empezando por la **compensación mensual que te toca por cargo** — esas horas\n  que se asignan solas y que antes no aparecían por ningún lado.\n\n- **Tus horas de compensación, y separadas en las dos que son.** La app las deducía de tu cargo\n  (Project Director 7 h · Coordinador 3,5 h · miembro 2 h), así que si te habían asignado horas\n  **por encima de eso** —por cubrir turnos de más, por ejemplo— no las veías por ningún lado: la\n  pantalla te enseñaba menos horas de las que tenías. Ahora aparecen las dos, cada una en su fila:\n  la **compensación por tu cargo**, que llega sola, y la **compensación extra**, que te asigna el\n  Project Director por trabajo de más y **solo cuenta ese mes**.\n  *(Necesita el backend v54; hasta entonces la pantalla avisa de que está usando la base.)*\n\n**⚙️ Backend v57**\n\n- **«Cerrar el mes» pasa a llamarse «calcular el cierre»**, que es lo que hace: fabrica la\n  propuesta, no cierra nada. El que cierra sigue siendo «aplicar el cierre». El nombre viejo hacía\n  creer que ya estaba hecho a quien mirara el registro.\n- **Org&Mark deja de convertirse en «Org y Mark»**, un nombre que no existe en ningún sitio y que\n  dejaba a esa persona con una unidad que nadie reconocía.\n- **La Unidad de Coordinación Técnica es la Unidad de Documentación Técnica**, su nombre de 26/27.\n- **Un reporte del buzón ya publicado o descartado no se puede reescribir.**\n\n**⚙️ Backend v56**\n\n- El **cierre mensual** ya se puede **aplicar** desde el panel, no solo calcular. Solo el Project\n  Director, y deja las fichas listas para que él las revise.\n\n**⚙️ Backend v55**\n\n- **Los avisos de turnos, reuniones y sanciones ya no se pueden desactivar.** Llevan plazo y\n  consecuencias: perdérselos no es una molestia, es una sanción. Documentos y horas los sigues\n  eligiendo tú.\n- El servidor entiende las **unidades nuevas** (Recovery, Documentación Técnica, Seguridad y\n  Verificación, Patrocinios y Relaciones Externas, Logística).\n\n**⚙️ Backend v54**\n\n- Tu campo **`Compensaciones`** de Notion llega a la app **en vivo**, con los extras que te hayan\n  asignado. Antes la app lo deducía de tu cargo y los extras no se veían.\n\n**⚙️ Backend v52**\n\n- `getTareas` admite `nombre`: devuelve las tareas de **a quien puedes sancionar**, con la misma\n  regla que la sanción.\n\n---\n\n## v0.1 — 28/07/2026 · backend v51\n\nEl **primer release numerado**. Recoge todo lo que producción no tenía desde las 07:37 de ese día.\n\n**Las dos caras**\n\n- **Buzón de bugs y mejoras**, cuatro buzones separados (bug/mejora × móvil/escritorio). Se reporta\n  desde el menú ⋮ y **la cara va dentro del identificador**, para que se sepa de qué se habla.\n- **Fotos en el reporte, con pintor encima**: adjuntas una imagen, se abre a pantalla completa y la\n  marcas —paleta, tres grosores, deshacer, zoom con dos dedos—; al enviar se fusionan las capas.\n- **Poner y decidir sanciones**, con su **modelo de autoridad**: cada uno solo alcanza a quien le\n  corresponde, y **lo comprueba el servidor**, no solo la pantalla.\n- **Un solo visor de documentos**, con pantalla completa. Antes había tres copias distintas.\n- El **fichaje reintenta** cuando el envío se pierde por el camino. Antes fallaba a la primera y\n  decía «respuesta no válida».\n\n**📱 Móvil**\n\n- **Notificaciones obligatorias**: sin activarlas la app no arranca, y el aviso va **antes** del\n  login. Con **preferencias por tipo** en Ajustes.\n- Vuelve la **comparativa de horas**: contra tu **mes anterior** y contra el **equipo**.\n- **Documentos** se ve por defecto; **Tareas** y **Documentos** se pueden ocultar desde Ajustes.\n- **Horas** reordenada: partes arriba, historial al fondo, plegado y solo del mes en curso.\n- La **cuota** pasa al menú ⋮.\n- Botón **«ver todos los turnos»**.\n- El móvil **deja de estirarse** en pantalla de ordenador.\n\n**⚙️ Backend v43 → v51**\n\n- Buzón: estados, anotaciones y capturas a Drive.\n- Preferencias de notificación, con el filtro **en el servidor**.\n- `getFichajesAbiertos` y `getDatos`.\n- `moverLimiteTarea`: mueve la fecha límite de una tarea **en Notion**.\n- La **autoridad de sanciones**, comprobada por persona.\n- **Último acceso** de cada persona, el dato que pide la regla semanal del RRI.\n- El **id de Notion** se lee bien aunque el título lleve guiones.\n\n---\n\n## Antes de los números — hasta el 28/07/2026, 07:37\n\nLo que había en producción **sin versión**: la app se publicaba directamente y el backend iba por su\ncuenta. No hay historial versión a versión porque no se numeraba; esto es el resumen de lo que ya\nfuncionaba cuando empezaron los números.\n\n**Las dos caras**\n\n- **Reuniones y disponibilidad** propias, en sustitución de Xoyondo y when2meet: convocar con tipos\n  gateados por cargo, pintar tu disponibilidad a dedo, **mapa de calor** agregado con la mejor\n  franja, y **slot + duración** en vez de franjas solapadas.\n- **Documentos**: revisar y aprobar expedientes con las cuatro decisiones reales, enrutado por\n  ámbito, bloqueo mutuo y desempate por rango.\n- **Turnos** leídos en vivo de Notion y **tareas** de los cuatro Kanban.\n- **Fichaje** y partes de horas.\n- **Refresco en vivo**: lo que miras se actualiza solo, sin borrarte lo que estés escribiendo.\n- La app **dice qué versión es** (`BUILD`), para no depurar dos builds distintos sin saberlo.\n\n**📱 Móvil**\n\n- Seis pestañas, medidor de conducta y **cascada** al ser elegible.\n- **Estado**, **Turnos**, **Tareas**, **Reuniones**, **Horas** y **Equipo**.\n\n---\n\n> **Cómo se actualiza este fichero**: al hacer un release se añade su bloque **en ese momento**, con\n> bullets cortos y separados por cara. Un changelog que se escribe «cuando haya tiempo» se escribe\n> de memoria, y de memoria se escribe mal. La lista de qué se toca al publicar está en\n> `ARRANQUE.md` §5.\n>\n> ⛔ **TODA versión nueva tiene su bloque aquí — beta y producción** (Daniel, 02/08/2026). Y no\n> depende de que nadie se acuerde: `flujos/publicar_web.py` **no deja salir un release** cuya\n> versión no aparezca en este fichero, y avisa en beta si la versión en vuelo no tiene bloque.\n>\n> ⛔ **La versión NO sube por iniciativa de un agente.** Se sube cuando el cambio es fuerte y lo\n> dice Daniel —o se le pide—. Entre subida y subida, **todo se acumula en el bloque de la versión\n> en vuelo**: la beta cambia de `BUILD` sin cambiar de `VERSION`, que es justo lo que hay que\n> poder distinguir al leer un reporte.\n";/*CHANGELOG_FIN*/

/* Repintar SIN que se note: `pintar()` reconstruye `#main`, asi que el navegador manda el
   scroll a cero y parece que la app se ha recargado. Cuando el repintado no lo ha pedido el
   usuario -llega un dato de fondo- hay que devolverlo a donde estaba. */
function _repintarSuave_(){
  var m=document.getElementById('main');
  var y=m?m.scrollTop:0;
  pintar(true);                  // CALLADO: lo ha pedido un dato, no el usuario
  if(m && y) m.scrollTop=y;
}
/* `silencioso`: repinta sin representar la funcion otra vez.

   La regla es la de siempre —si el repintado molesta se repinta MENOS, no se apaga la
   animacion—, pero `pintar()` no puede saber solo si viene de un dedo o de una respuesta
   del servidor: se lo dice quien llama. Con dedo, todo se anima. Con dato de fondo, cada
   animacion se salta pintando su estado FINAL (no el inicial), asi que nada queda a cero.

   Sin esto, el login pintaba dos veces y el refresco en vivo una cada 90 s, y en cada una
   se repetian la entrada de la vista, la cascada del medidor y el crecimiento de las
   barras. Con el mismo dato. Daniel: «se recarga solo por la cara». */
/* RED DE SEGURIDAD. Una preferencia guardada que rompe el pintado no es un fallo: es un
   LADRILLO. Vive en `localStorage`, asi que recargar no la quita y la app no vuelve a
   arrancar nunca — hasta que alguien sepa borrar el almacenamiento del navegador, que no es
   algo que se le pueda pedir a nadie. Paso el 28/07 en la beta.

   Asi que si pintar revienta, se tira LA PREFERENCIA -no los datos, que son de verdad- y se
   reintenta una vez. Si vuelve a reventar, se propaga: a partir de ahi el problema no es la
   preferencia y taparlo seria peor. */
function pintar(silencioso){
  var _m=$('#main'), _y=_scrollGuardar_(_m, ST.vista);
  try{ return _pintarConScroll_(silencioso, _m, _y); }
  catch(e){
    if(pintar._rescatando) throw e;
    pintar._rescatando=true;
    try{
      PREF.ocultar={}; PREF.escala=''; _guardarPref_(); _aplicarEscala_();
      var r=_pintarConScroll_(silencioso, _m, _y);
      try{ tost('Se han restablecido las preferencias de pantallas: una de ellas impedía dibujar la app.'); }catch(_){}
      return r;
    } finally { pintar._rescatando=false; }
  }
}
function _pintarConScroll_(silencioso, m, y){
  var r=_pintar_(silencioso);
  _scrollRestaurar_(m, y);
  return r;
}
function _pintar_(silencioso){
  /* Si la vista en la que estas ha dejado de mostrarse -decidiste el ultimo documento y
     Docs se retira- hay que sacarte: si no, te quedas en una pantalla sin boton
     encendido y el indicador viajero no tiene a donde apuntar. */
  if(!_destVisibles_().some(function(d){return d[0]===ST.vista;})) ST.vista='estado';
  var f=VISTAS[ST.vista];
  var el=$('#v-'+ST.vista);
  /* ⛔ `cambio` MANDA SOBRE `silencioso`, y son dos cosas distintas: `silencioso` dice
     QUIEN pide la pintada (un dedo o una respuesta); `cambio` dice SI HAY ALGO NUEVO.
     Sin dato nuevo no se anima **ni aunque lo pida un dedo**, que es lo que pidio
     Daniel: *«si no cambia nada no se repinta»*. */
  var cambio=false;
  if(f&&el){
    cambio=_pintarSiCambia_(el, ST.vista, f());
    if(cambio && !silencioso){ el.classList.add('entra'); setTimeout(function(){el.classList.remove('entra');},360); }
  }
  $$('.vis').forEach(function(s){s.classList.toggle('on', s.id==='v-'+ST.vista);});
  pintarNav();
  colocarViaje(false);
  /* `el` acotado a proposito: sin el, `root||document` recorreria TAMBIEN la barra de la
     otra vista -que sigue en el DOM, oculta- y le machacaria su memoria con un ancho que
     no le toca. Si `el` no existe no se anima nada, que es lo correcto. */
  /* En Estado ya no hay barra de horas (se fue a Horas y solo a Horas), pero si el
     medidor. `animarBarras` se queda porque la pantalla tiene otras barras. */
  /* ⚠️ Y LAS ANIMACIONES TAMBIEN SE SALTAN SI NO HUBO CAMBIO: reconstruir el DOM no
     es lo unico que se nota. `animarDeltas` pone las barras a cero y las vuelve a
     crecer, y sin el nodo nuevo delante eso es un parpadeo sobre el mismo dato. */
  if(el && cambio && ST.vista==='estado'){ armarMedidor(silencioso); animarBarras(el, silencioso); }
  /* ⛔ `animarDeltas` RECIBE `silencioso`, y hasta hoy era la UNICA de las tres que no
     lo recibia -- su vecina de la misma linea si--. Por eso en Horas las barras se
     caian a cero en cada refresco de fondo. §3c-37: medir al lado de lo que decide. */
  if(el && cambio && ST.vista==='horas'){ animarBarras(el, silencioso); animarDeltas(el, silencioso); }
  if(ST.vista==='fichar'){ medirAristas(); validarFichaje(); }
  enganchar();
}
function irA(k){
  /* Al abrir Reuniones se pide ya, sin esperar al reloj: entras justo para ver quien ha
     contestado, y esperar 20 s para eso es raro. */
  if(k==='reu') setTimeout(_refrescarReuAbierta_, 60);
  if(k===ST.vista) return;
  /* pintar() recoloca el indicador y deja ultimoX en la posicion NUEVA. Hay que
     guardarla antes y restituirla, o la distancia sale 0 y no vuela nada: ni el
     arco, ni la comba proporcional, ni la estela, ni las chispas. */
  var xPrevio=ultimoX;
  ST.vista=k;
  $('#main').scrollTop=0;
  pintar();
  ultimoX=xPrevio;
  colocarViaje(true);
}

/* ── la estrella que viaja: comba PROPORCIONAL a la distancia ────────────── */
var ultimoX=null;
function colocarViaje(animar){
  var nav=$('#nav'), viaje=$('#viaje'), sombra=$('#sombra'), chi=$('#chispas');
  var act=$('.tab.on',nav); if(!act||!viaje) return;
  var rn=nav.getBoundingClientRect(), ra=act.getBoundingClientRect();
  var x=ra.left-rn.left+ra.width/2;
  var x0=(ultimoX==null)?x:ultimoX;
  var d=Math.abs(x-x0);
  var comba=Math.min(46,12+d*0.22);

  viaje.style.setProperty('--comba','-'+comba.toFixed(0)+'px');
  viaje.style.transform='translateX('+x.toFixed(1)+'px)';
  if(sombra) sombra.style.transform='translateX('+x.toFixed(1)+'px)';

  if(animar && !redu() && d>2){
    [viaje,sombra].forEach(function(el){
      if(!el) return;
      el.classList.remove('vuela'); void el.offsetWidth; el.classList.add('vuela');
      setTimeout(function(){el.classList.remove('vuela');},460);
    });
    /* la estela: Bézier cuadrática revelada por dashoffset */
    var p=$('#estelaP');
    if(p){
      p.setAttribute('d','M '+x0.toFixed(1)+' 3 Q '+((x0+x)/2).toFixed(1)+' '+(3-comba).toFixed(1)+' '+x.toFixed(1)+' 3');
      var L=1; try{L=p.getTotalLength()||1;}catch(e){}
      p.style.strokeDasharray=L; p.style.setProperty('--L',L);
      p.style.animation='none'; void p.getBoundingClientRect();
      p.style.animation='estelaAnim .52s cubic-bezier(.34,1.42,.5,1)';
    }
    /* brillito de aterrizaje */
    if(chi){
      chi.style.transform='translateX('+x.toFixed(1)+'px)';
      chi.classList.remove('on'); void chi.offsetWidth;
      setTimeout(function(){ chi.classList.add('on'); }, 300);
      setTimeout(function(){ chi.classList.remove('on'); }, 820);
    }
  } else if(chi){
    chi.style.transform='translateX('+x.toFixed(1)+'px)';
  }
  ultimoX=x;
}
window.addEventListener('resize',function(){ ultimoX=null; colocarViaje(false); });

/* ══ EL ALTO DEL ARMAZON, RE-FIJADO EN LOS CUATRO MOMENTOS QUE IMPORTAN ══════════
   ⛔⛔ Daniel, 10/09: *«esta tapada hasta que minimizo y vuelvo a abrir la app»*. El gesto de
   minimizar y volver es lo que hacia que el navegador recalculara el alto; aqui se hace solo.
   ⚠️ Y son CUATRO porque cada uno cubre un camino distinto, no por barrer: `visibilitychange`
   es literalmente el gesto que lo curaba a mano; `pageshow` cubre volver desde la cache de
   atras; `resize` cubre que el navegador ajuste su barra; `orientationchange` cubre girar.
   ⛔ Se llama tambien AL ARRANCAR: sin eso, el primer pintado —que es justo el malo— se
   quedaria con el `100dvh` de la cascada, que es el valor que dejaba la barra debajo. */
(function(){
  function _rearmarAlto_(){
    if (typeof _fijarAlto_ === 'function') _fijarAlto_(document, window);
  }
  _rearmarAlto_();
  window.addEventListener('resize', _rearmarAlto_);
  window.addEventListener('orientationchange', _rearmarAlto_);
  window.addEventListener('pageshow', _rearmarAlto_);
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden) _rearmarAlto_();
  });
})();

     eso el 19/08 se puso tambien en `_decidirDoc_`; esta de aqui es para no gastar un

     regla del servidor — y que el título no quede vacío. Y no se decide con SolarIA a medias: su respuesta llegaría
     después y pisaría lo que ya se envió. */
  var _anotX=null;
  if(acc==='aprobado' && _anotEditadoSinAnot_(e, 'd')){ tost(_AVISO_APROBAR_EDITADO_, _tostLargo_(_AVISO_APROBAR_EDITADO_)); return; }
  if(acc==='anot'){

    if(!_anotChkOK_('d')){

     hacía, y es la cara en la que revisa Daniel; un dedo que se escurre cerraba el documento de otro). */
  /* 21/10 (auditor 11, 🟡 13): sin prometer lo no decidido (cómo reenvía un rechazado es pregunta de Daniel) ni un

    (e.revisor||'quien la tomó')+'. ¿Seguro?')) return;

  /* Aplica la decision al objeto local. Se usa DESPUES de que el servidor la acepte, o
     directamente cuando no hay backend (maqueta).
     ⛔ EL CUERPO VIVE EN `documentos.movil.js` (`_aplicarDecDoc_`) Y NO AQUI: suelto dentro
        de este listener no lo podia ejecutar ningun banco, y escondia un `else` que convertia
        cualquier accion desconocida en **rechazado**. */
  var _aplicar=function(){
    var nt=(($('#dTit')&&$('#dTit').value)||'').trim();
    var ne=_etiquetasDeTexto_(($('#dEtq')&&$('#dEtq').value)||'');
    if(!_aplicarDecDoc_(e, acc, mot, nt, ne, _anotX)) tost('Acción desconocida: no se ha tocado nada.');
  };
  /* ⛔ EL AVISO CONFIRMABA ALGO QUE NO HA PASADO. Quien pulsa sin haber subido el
     archivo recibia «Reenviado a revision.» --una confirmacion ACTIVA-- y ademas su
     globo se apagaba, asi que se iba convencido. `Codigo.gs:967` no toca `enlaceDrive`:
     el revisor abriria la version vieja. */
  var _aviso={reenviar:'Devuelto a revisión. Si todavía no has subido el archivo corregido por el formulario, el revisor abrirá la versión anterior.',
    aprobado:'Aprobado. Se publica en un par de minutos.',   /* 31/10: documentos_ciclo.py pasa cada minuto (el 4201 tardó 73 s) */
    anot:'Aprobado con anotaciones. Se publica en un par de minutos, con los campos ajustados.',
    cambios:'Cambios pedidos: le llega al autor.',
    deshacer:'Decisión deshecha: vuelve a revisión.',
    rechazado:'Rechazado.'}[acc]||'Hecho.';

  /* PERSISTE. Antes esto solo mutaba memoria: el revisor creia que habia firmado y no
     habia firmado nada. Si el servidor dice que no, no se toca el estado ni se miente. */
  if(typeof backendOK!=='undefined' && backendOK && SESION){
    if(b.disabled) return;
    b.disabled=true;
    var extra=null;
    /* ⛔ LAS DOS MITADES DE LA ACCION. `extra.etiquetas` lo aplica `Codigo.gs:992` y la app
       publicada ya lo mandaba (`app.html:1213`); se perdio al partir la pantalla en dos
       caras. Y va aunque la lista quede VACIA -a diferencia del titulo-: borrar todas las
       etiquetas es una decision del revisor, y tratarla como «no ha tocado nada» hace que
       la unica forma de quitarlas sea no tenerlas nunca. */
    /* ✅ 28/10: lo que viaja es `_anotX` (`_anotExtra_`, calculado en la guarda de arriba): SÓLO lo que cambia de los
       cuatro campos, más la indicación que se le dio a SolarIA. Vaciar las etiquetas sigue siendo un cambio. */
    if(acc==='anot') extra=_anotX;
    api.decidir(id, acc, mot||null, extra, e && e.ref).then(function(upd){
      /* ⛔ 21/10 (auditor 11, 🟡 8): con red manda LO QUE DEVUELVE EL SERVIDOR (como el escritorio): la copia local de
         `_aplicarDecDoc_` dejaba revisor y decisión viejos al reenviar. Sin respuesta útil, la copia local. */
      if(upd && typeof upd==='object' && upd.id!=null && String(upd.id)===String(e.id)){ Object.assign(e, upd); delete e._aviso; }
      else _aplicar();
      /* ⛔ 21/10 (auditor 11, 🟠 3): y la ficha se VUELVE A ABRIR con el estado nuevo. Se cerraba en seco, el expediente
         decidido salía de las listas del móvil y el «Deshacer» de abajo —que existe para el error de dedo— no se
         alcanzaba nunca. (Tras deshacer o reenviar no hace falta: vuelve a la lista de pendientes.) */
      /* 21/10 (auditor 19, 🟡 7): el aviso al reenviar son ~190 caracteres — en 2,6 s no se leen. Largo → fijo. */
      var _tav=_avisoDocTxt_(_aviso, upd);
      cerrarModal(); tost(_tav, _tostLargo_(_tav)); pintar(); if(acc!=='deshacer' && acc!=='reenviar') verDoc(e.id);
    }).catch(function(err){
      b.disabled=false;
      tost('No se pudo registrar la decisión: '+((err&&err.message)||err));
    });
    return;
  }
  /* ⛔ 20/10 (ficha «sin backend el móvil aplica en local y avisa "publicado en Notion"»). Aquí se aplicaba en local y
     se decía «Aprobado · publicado en Notion y en el Libro de Datos. (sin conexión: solo en este teléfono)»: la primera
     mitad niega la segunda, y fuera de la maqueta el revisor se iba creyendo que había firmado. Como el escritorio: sin
     conexión NO se guarda nada y se dice. Sólo la maqueta local (`_demoLocal_`) lo aplica en memoria, sin prometer
     ninguna publicación. */
  var _dec=_decSinRedDoc_(_aviso, (typeof _demoLocal_==='function') && _demoLocal_());
  if(_dec.aplicar){ _aplicar(); cerrarModal(); }
  tost(_dec.txt, _tostLargo_(_dec.txt)); if(_dec.aplicar) pintar();   // 🟡 7 (auditor 19)
});

/* reloj de la barra de estado + cronómetro de la sesión */
setInterval(function(){
  var d=new Date();
  var r=$('#reloj'); if(r) r.textContent=pad(d.getHours())+':'+pad(d.getMinutes());
  if(!ST.ses.cloudIni && ST.ses.estado==='corriendo' && minSes()>=840){
    /* 14 h (solo en DEMO local): la sesión se cierra sola. En la nube esto lo hace el
       backend (cerrarFichajesVencidos, barrido del gate), no el navegador. */
    ST.ses.acum=840; ST.ses.estado='pausada'; ST.ses.ini=null;
    tost('Se cerró sola a las 14 h. Declárala antes de que caduque.');
    if(ST.vista==='fichar') pintar();
  }
  if(ST.vista==='fichar' && ST.ses.estado==='corriendo'){
    var el=$('#relSes'); if(el) el.innerHTML=fmtHM(minSes());
    var s=$('#sesion'); if(s) s.classList.toggle('larga', minSes()>=600);
    var e2=$('#estSes'); if(e2 && minSes()>=600) e2.textContent='MÁS DE 10 H ABIERTA · CIÉRRALA';
  }
}, 1000);

/* conmutador de rol — solo de la maqueta: enseña los tres estados de la app
   (miembro · coordinador · PD) sin tener que cambiar de cuenta. */
/* ⛔ 929.ª: Y CAMBIA DE PERSONA, NO SÓLO DE RÓTULO. Sólo tocaba `ST.rol` y la cabecera: con «Coord.» la
   cabecera decía Xoán y `YO` seguía siendo Nerea, así que «Mis documentos» eran los de ella y Estado le
   decía a Xoán «Un documento tuyo tiene cambios pedidos». Con cuenta real `YO` es quien entra y los
   documentos se reparten por autor (`_repartirEntregablesM_`); aquí se hace lo mismo con la semilla. */
function _cambiarRolDemo_(rol){
  var quien={miembro:'Nerea Ferreiro Lamas', coord:'Xo\u00e1n Berm\u00fadez Rial', pd:'Lois Carballo Send\u00f3n'}[rol];
  var m=(DATA.miembros||[]).filter(function(x){ return x.nombre===quien; })[0];
  if(!m) return false;
  YO=m;
  if(typeof _repartirEntregablesM_==='function') _repartirEntregablesM_(ENTREGABLES.concat(ENT_REV));
  /* 21/10 (auditor 19, 🟡 11): SUS horas y SUS puntos, no los de Nerea. `PARTES` y `MOVS` son de la semilla de Nerea;
     el resto lleva sólo lo que la semilla común dice de él (sus partes de `PARTES_DEMO`, por la puerta de los reales)
     y ningún movimiento: no se inventa. `MOVS` se vacía EN SITIO porque hay quien guarda la referencia. */
  if(!_cambiarRolDemo_.nerea) _cambiarRolDemo_.nerea={partes:PARTES.slice(), movs:MOVS.slice()};
  var _sem=_cambiarRolDemo_.nerea, _esNerea=(rol==='miembro');
  PARTES = _esNerea ? _sem.partes.slice()
         : PARTES_DEMO.filter(function(p){ return p.autor===m.nombre; }).map(normPMovil);
  MOVS.length=0;
  if(_esNerea) _sem.movs.forEach(function(x){ MOVS.push(x); });
  return true;
}
$$('#rolsel button').forEach(function(b){
  b.onclick=function(){
    ST.rol=b.dataset.rol;
    $$('#rolsel button').forEach(function(x){x.classList.toggle('on',x===b);});
    /* 956.ª: la cabecera por SU puerta. Aquí se tecleaba «ESTRUCTURAS · COORDINADOR», saltándose la regla de
       `_pintarCabecera_`: con la maqueta no se veía lo que ve un coordinador de verdad. */
    if(_cambiarRolDemo_(ST.rol)) _pintarCabecera_();
    pintar();
    if(DEMO) _partesDemo_().then(pintar);   /* 20/10: la cola de partes es la del rol nuevo */
  };
});

/* arranque */
pintar();
setTimeout(function(){ colocarViaje(false); }, 60);
/* Registra el service worker y, si ya habia permiso y sesion, re-guarda la suscripcion:
   los navegadores la rotan y, si no se vuelve a guardar, los avisos dejan de llegar sin
   que nadie se entere. No pide permiso por su cuenta: eso solo pasa si pulsas el boton. */
setTimeout(function(){ try{ _pushInit_(); }catch(_){} }, 800);

/* Login OBLIGATORIO (salvo ?demo para verla en local): reanuda sesión guardada
   (<50 min) sin pasar por Google; si no, muestra el gate de marca. La app publicada
   NUNCA entra a datos falsos. */
if(GOOGLE_CLIENT_ID && !DEMO){
  _gate_(SPLASH+'<div style="opacity:.7">Cargando…</div>');
  /* PRIMERO LAS NOTIFICACIONES, ANTES DE PODER SIQUIERA INICIAR SESION (Daniel, 28/07).
     Estaba despues de resolver la identidad y eso es tarde: te dejaba escribir el correo,
     elegir cuenta y esperar a que cargue todo para luego decirte que no pasas. */
  var _entrar=function(){
    var _tok=_tokenGuardadoUtil_(_sesionGuardada_());
    if(_tok) _onCredencial_({credential:_tok}, true);
    else _arrancarGis_();
  };
  var _faltaN=_faltanNotis_();
  if(_faltaN) _gateNotis_(_faltaN, _entrar); else _entrar();
}
