<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://accounts.google.com/gsi/client" async></script>
<title>Solaris · Puente de mando</title>
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   SOLARIS · PUENTE DE MANDO — dirección definitiva, ESCRITORIO
   ───────────────────────────────────────────────────────────────────────────
   Público: consejo, junta y Project Director. NO es la app del miembro
   estirada — es otro producto. Aquí se GOBIERNA: firmar horas, decidir
   expedientes, cerrar bloques de sanciones, cerrar el mes, mirar al equipo
   entero. El móvil (`movil.html`) es la herramienta del miembro.

   Paleta medida en Insignia_Solaris.png (docs/identidad-visual.md §4 y §4-ter):
   #231F20 (52,3 %) · #FFFFFF (24,9 %) · #E41E25 (21,9 %). La rampa de grises
   se deriva del neutro conservando H=345° y S=6,1 %.

   Fuera, por orden de Daniel: el apartado de ECONOMÍA (cuotas/gastos/tesorería)
   no va en el panel. Las cuotas se leen en el Ranking, junto a las horas.
   ═══════════════════════════════════════════════════════════════════════════ */
:root{
  --bg:#0C0B0B; --sur:#181616; --sur2:#221E1F; --gris:#231F20;
  --line:#322C2E; --line2:#463E40; --ink3:#7C6E72; --ink2:#B2A8AB; --ink:#F4F3F3;
  --red:#E41E25; --red2:#FF4A4F; --red3:#8E1418;
  --ok:#3EB489; --warn:#E8912E; --tel:#3f9ed6;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:10px; --r2:8px;
  --sal:cubic-bezier(.16,.84,.44,1);
  --arco:cubic-bezier(.34,1.42,.5,1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13.5px;line-height:1.45;
  -webkit-font-smoothing:antialiased;min-height:100vh;padding:18px;display:flex;flex-direction:column;gap:13px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sc{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);line-height:1}
.up{color:var(--ok)} .dn{color:var(--red2)} .wa{color:var(--warn)}

/* cartel */
.cartel{border:1px solid var(--line);border-radius:var(--r);
  background:linear-gradient(180deg,var(--sur2),var(--sur));padding:15px 18px}
.cartel h1{margin:0;font-size:19px;letter-spacing:-.01em}
.cartel h1 span{color:var(--red2)}
.cartel p{margin:7px 0 0;font-size:12.5px;color:var(--ink2);line-height:1.6;max-width:1100px}
.cartel p b{color:var(--ink)}

/* ═══ MARCO ══════════════════════════════════════════════════════════════ */
.marco{position:relative;display:grid;grid-template-columns:238px 1fr;grid-template-rows:56px 1fr;
  height:calc(100vh - 150px);min-height:660px;border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;background:var(--bg);box-shadow:0 26px 60px rgba(0,0,0,.45)}

/* lateral */
aside{grid-row:1/3;border-right:1px solid var(--line);background:var(--sur);
  display:flex;flex-direction:column;min-height:0;position:relative}
.marca{display:flex;align-items:center;gap:10px;padding:13px 14px;border-bottom:1px solid var(--line)}
.marca .ins{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;
  background:linear-gradient(155deg,#3d2427,#20161a);color:var(--red2);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.marca .ins svg{width:16px;height:16px;fill:currentColor}
.marca .ins img{width:24px;height:24px;object-fit:contain;display:block}
/* marca de agua del lienzo: fija al marco, nunca sobre el contenido */
.marcagua{position:absolute;right:-5%;bottom:-6%;width:40%;height:auto;opacity:.04;
  z-index:0;pointer-events:none}
main{z-index:1}
.marca .nm{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase}
.marca .nm span{display:block;font-size:8px;letter-spacing:.12em;color:var(--ink3);margin-top:3px}
.nav{flex:1;min-height:0;overflow-y:auto;padding:6px 0 12px;position:relative;scrollbar-width:thin}
.nav::-webkit-scrollbar{width:5px}
.nav::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.grupo{padding:12px 13px 5px;display:flex;align-items:center;gap:8px}
.grupo .ln{flex:1;height:1px;background:var(--line)}
.item{width:100%;text-align:left;padding:7px 12px 7px 18px;display:flex;align-items:center;gap:8px;
  color:var(--ink2);font-size:12.5px;position:relative;
  transition:color .15s linear,background .15s linear}
/* NO se desplaza al pasar el ratón: es un blanco de clic (decisión cerrada) */
.item:hover{color:var(--ink);background:rgba(255,255,255,.025)}
.item .rail{position:absolute;left:0;top:3px;bottom:3px;width:2px;background:var(--red);border-radius:2px;
  transform:scaleY(0);transform-origin:50% 50%;transition:transform .26s var(--sal)}
.item:hover .rail{transform:scaleY(.38)}
.item.on{color:var(--ink);background:rgba(228,30,37,.08)}
.item.on .rail{transform:scaleY(1)}
.item .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .cnt{font-family:var(--mono);font-size:9.5px;color:var(--ink3);background:var(--sur2);
  border:1px solid var(--line);border-radius:9px;padding:0 6px;line-height:15px;min-width:20px;
  text-align:center;flex:none}
.item .cnt.hot{color:#fff;background:var(--red);border-color:var(--red)}
.item .cnt.wa{color:#241a08;background:var(--warn);border-color:var(--warn)}
/* la estrella que viaja, en vertical, con la comba proporcional a la distancia */
.viajev{position:absolute;left:3px;top:0;width:15px;height:15px;pointer-events:none;z-index:4;
  color:var(--red2);transition:transform .38s var(--arco)}
.viajev svg{width:15px;height:15px;fill:currentColor;display:block;
  filter:drop-shadow(0 0 7px rgba(255,74,79,.75))}
.viajev.vuela svg{animation:arcoX .38s var(--arco)}
@keyframes arcoX{50%{transform:translateX(var(--comba,16px)) scale(1.5) rotate(120deg)}}
.pielat{flex:none;border-top:1px solid var(--line);padding:9px 13px;display:flex;gap:9px;align-items:center}

/* barra superior */
.top{grid-column:2;border-bottom:1px solid var(--line);background:var(--sur);
  display:flex;align-items:center;gap:13px;padding:0 15px}
.miga{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);white-space:nowrap}
.miga b{color:var(--ink);font-weight:500}
.buscar{flex:1;max-width:330px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);
  background:var(--bg);border-radius:var(--r2);padding:6px 10px}
.buscar:focus-within{border-color:var(--line2);box-shadow:0 0 0 3px rgba(228,30,37,.1)}
.buscar input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);font:inherit;font-size:12px}
.buscar input::placeholder{color:var(--ink3)}
.topd{margin-left:auto;display:flex;align-items:center;gap:11px}

/* ── «ACTÚAS COMO» — el conmutador de versión ────────────────────────────
   De la 04b, con los dos ajustes que pidió Daniel: la estrella un pelín más a
   la IZQUIERDA y la comba AL REVÉS (se hunde en vez de arquearse hacia arriba).
   No es un adorno: hace demostrable el enrutado por rango. ───────────────── */
.actua{position:relative;display:flex;align-items:center;gap:2px;border:1px solid var(--line);
  border-radius:22px;background:var(--sur2);padding:3px 3px 3px 22px}
.actua .est{position:absolute;left:5px;top:50%;width:13px;height:13px;margin-top:-6.5px;
  color:var(--red2);pointer-events:none;transition:transform .34s var(--arco)}
.actua .est svg{width:13px;height:13px;fill:currentColor;display:block;
  filter:drop-shadow(0 0 6px rgba(255,74,79,.7))}
.actua .est.vuela svg{animation:combaAbajo .34s var(--arco)}
/* comba invertida: baja y vuelve, en vez de subir */
@keyframes combaAbajo{50%{transform:translateY(9px) scale(1.45) rotate(-120deg)}}
.actua button{padding:5px 11px;border-radius:18px;font-family:var(--mono);font-size:9px;
  letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);white-space:nowrap;
  transition:color .16s linear,background .16s linear}
.actua button.on{background:var(--red);color:#fff}

.yo{display:flex;align-items:center;gap:8px;padding:4px 9px 4px 4px;border:1px solid var(--line);
  border-radius:var(--r2);background:var(--sur2)}
.yo .av{width:23px;height:23px;border-radius:6px;display:grid;place-items:center;flex:none;
  font-family:var(--mono);font-size:9px;color:#efe3e3;background:linear-gradient(155deg,#5c2226,#2a1214)}
.yo .n{font-size:11.5px;line-height:1.2}
.yo .rl{font-family:var(--mono);font-size:8px;color:var(--ink3);letter-spacing:.08em;text-transform:uppercase}

/* lienzo */
main{grid-column:2;min-height:0;overflow-y:auto;padding:15px;scrollbar-width:thin;position:relative}
main::-webkit-scrollbar{width:8px}
main::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
main.fundiendo{opacity:.25;transition:opacity .14s linear}
main.entrando>*{animation:entra .38s var(--sal) both}
main.entrando>*:nth-child(2){animation-delay:.05s}
main.entrando>*:nth-child(3){animation-delay:.1s}
main.entrando>*:nth-child(4){animation-delay:.15s}
@keyframes entra{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.cabp{display:flex;align-items:flex-end;gap:13px;margin-bottom:14px;flex-wrap:wrap}
.cabp h2{margin:0;font-size:18px;font-weight:600;letter-spacing:-.015em}
.cabp .meta{font-family:var(--mono);font-size:9.5px;color:var(--ink3);letter-spacing:.08em}
.cabp .acts{margin-left:auto;display:flex;gap:7px}

/* paneles */
.pan{background:var(--sur);border:1px solid var(--line);border-radius:var(--r);margin-bottom:13px;
  position:relative}
.pan>.ph{display:flex;align-items:center;gap:9px;padding:10px 13px;border-bottom:1px solid var(--line)}
.pan>.ph .ln{flex:1;height:1px;background:var(--line)}
.pan>.pb{padding:13px}
.pan.destaca{border-color:rgba(228,30,37,.42);box-shadow:0 0 0 1px rgba(228,30,37,.12)}
.pan.destaca>.ph{background:rgba(228,30,37,.06)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);
  background:var(--sur2);border-radius:var(--r2);padding:7px 13px;font-size:12px;font-weight:600;
  position:relative;overflow:hidden;transition:background .16s linear,border-color .16s linear}
.btn::after{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--red2);
  transform:scaleY(0);transform-origin:50% 50%;transition:transform .16s var(--sal)}
.btn.pulsa::after{transform:scaleY(1);box-shadow:0 0 9px var(--red2)}
.btn:hover{border-color:var(--line2);background:#221D1E}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.pri:hover{background:var(--red2);border-color:var(--red2)}
.btn.ok{color:var(--ok);border-color:rgba(62,180,137,.45)}
.btn.no{color:var(--red2);border-color:rgba(255,74,79,.45)}
.btn.sm{padding:5px 10px;font-size:11px;font-weight:500}
.btn[disabled]{opacity:.45;cursor:not-allowed;pointer-events:none}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:13px}
@media(max-width:1150px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--sur);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px 11px;
  position:relative;overflow:hidden;transition:border-color .2s linear}
.kpi:hover{border-color:var(--line2)}
.kpi .val{font-family:var(--mono);font-size:29px;font-weight:600;letter-spacing:-.035em;line-height:1.1;margin:9px 0 3px}
.kpi .val small{font-size:13px;color:var(--ink3);font-weight:400;letter-spacing:0}
.kpi .d{font-size:11px;color:var(--ink3)}
.kpi .bar{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.05)}
.kpi .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red3),var(--red2));
  transition:width 1s var(--sal)}

/* tablas densas */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
thead th{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);font-family:var(--mono);
  font-size:8.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);font-weight:400;white-space:nowrap}
thead th.r,td.r{text-align:right}
tbody td{padding:8px 12px;border-bottom:1px solid rgba(50,44,46,.6);font-size:12.5px}
tbody tr{transition:background .14s linear}
tbody tr:hover{background:rgba(255,255,255,.028)}
td .mem{display:flex;align-items:center;gap:8px}
td .av{width:21px;height:21px;border-radius:5px;background:var(--sur2);border:1px solid var(--line);
  display:grid;place-items:center;font-family:var(--mono);font-size:9px;color:var(--ink2);flex:none}

/* chips y pastillas */
.chip{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;
  padding:3px 8px;border-radius:20px;border:1px solid var(--line);color:var(--ink3);background:var(--sur2);white-space:nowrap}
.chip.ok{color:var(--ok);border-color:rgba(62,180,137,.42);background:rgba(62,180,137,.08)}
.chip.wa{color:var(--warn);border-color:rgba(232,145,46,.45);background:rgba(232,145,46,.09)}
.chip.no{color:var(--red2);border-color:rgba(255,74,79,.45);background:rgba(228,30,37,.09)}
.chip.tel{color:var(--tel);border-color:rgba(63,158,214,.45);background:rgba(63,158,214,.09)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
/* chip seleccionable de miembro (bloque de horas) */
.pick{cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.03em;padding:5px 11px;border-radius:20px;
  border:1px solid var(--line);color:var(--ink2);background:var(--sur2);white-space:nowrap;transition:border-color .12s,color .12s,background .12s}
.pick:hover{border-color:var(--ink3);color:var(--ink)}
.pick.on{color:#fff;border-color:var(--red);background:rgba(228,30,37,.18)}
.pick.on::before{content:'\2713 '}
/* reparto del turno: una fila por persona marcada, con su rol y sus distintivos */
.repf{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid var(--line)}
.repf:last-child{border-bottom:0}
.repf b{min-width:96px;font-size:12.5px}
.repf input{flex:1;min-width:130px;background:#0A0909;border:1px solid var(--line);border-radius:7px;
  padding:6px 9px;color:var(--ink);font:inherit;font-size:12px}
.mini{cursor:pointer;font-family:var(--mono);font-size:10px;letter-spacing:.04em;padding:5px 9px;
  border-radius:20px;border:1px solid var(--line);background:transparent;color:var(--ink3)}
.mini:hover{border-color:var(--ink3);color:var(--ink)}
.mini.on{color:#fff;border-color:var(--red);background:rgba(228,30,37,.18)}
.mini.x:hover{border-color:var(--red);color:var(--red2)}

/* ── ZONA FIJA «REQUIERE TU DECISIÓN» ────────────────────────────────────
   De la 02b, con lo que Daniel pidió encima: cada fila LLEVA al sitio exacto
   (al expediente, al parte, al bloque), no a la sección genérica. ──────── */
.dec{display:flex;align-items:center;gap:12px;padding:11px 13px;border-top:1px solid var(--line);
  cursor:pointer;transition:background .14s linear}
.dec:first-child{border-top:0}
.dec:hover{background:rgba(255,255,255,.03)}
.dec .ic{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;flex:none;
  background:var(--sur2);border:1px solid var(--line);color:var(--red2)}
.dec .ic svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8}
.dec .tx{flex:1;min-width:0}
.dec .tx b{display:block;font-size:13px}
.dec .tx small{display:block;font-size:11px;color:var(--ink3);margin-top:2px}
.dec .der{display:flex;align-items:center;gap:9px;flex:none}
.dec .chev{color:var(--ink3);font-family:var(--mono)}

/* tarjeta de parte de horas */
.parte{border-top:1px solid var(--line);padding:13px}
.parte:first-child{border-top:0}
.parte .h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.parte .h b{font-size:13.5px}
.parte .h .u{font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.parte .h .q{margin-left:auto;font-family:var(--mono);font-size:18px;font-weight:600;color:var(--warn);letter-spacing:-.02em}
.parte .just{margin-top:9px;padding:9px 11px;border:1px solid var(--line);border-left:2px solid var(--tel);
  background:#0A0909;border-radius:var(--r2);font-size:12px;color:var(--ink2);line-height:1.55}
.parte .just .sc{display:block;margin-bottom:4px}
.parte .fl{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.parte .ruta{margin-top:9px;font-size:11.5px;color:var(--ink3);line-height:1.5}
.parte .ruta b{color:var(--ink2)}
.parte .acts{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap;align-items:center}
.parte textarea{width:100%;background:#0A0909;border:1px solid var(--line);border-radius:var(--r2);
  color:var(--ink);font-family:var(--sans);font-size:12.5px;padding:8px 10px;outline:0;resize:vertical;
  min-height:52px;margin-top:8px}
.parte.asienta{opacity:.25;transition:opacity .4s linear}

/* bloque de sanciones */
.lote{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--sur)}
.lote-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:14px}
.lote-m{font-size:12px;color:var(--ink2);margin-top:5px;line-height:1.5}
.lrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid rgba(50,44,46,.8);flex-wrap:wrap}
.lrow .nm{flex:1;min-width:130px;font-size:12.5px;font-weight:600}
.lrow .vl{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--red2);width:52px;text-align:right}
.lrow .vl.tach{opacity:.38;text-decoration:line-through}
.decs{display:inline-flex;border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.decs button{border-right:1px solid var(--line);padding:5px 10px;font-size:11px;font-weight:600;color:var(--ink3);white-space:nowrap}
.decs button:last-child{border-right:0}
.decs button.on.a{background:var(--ok);color:#fff}
.decs button.on.j{background:var(--ink2);color:#1a1616}
.decs button.on.r{background:var(--red2);color:#fff}
.cierrel{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:var(--r2);
  background:rgba(127,127,127,.05);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.cierrel .tx{flex:1;min-width:200px;font-size:12.5px;color:var(--ink2)}
.cierrel em{display:block;font-style:normal;font-size:11px;color:var(--ink3);margin-top:5px;line-height:1.45}

/* instrumento de puntos (media del equipo — admite decimales) */
.anillo{position:relative;width:150px;height:150px;flex:none}
.anillo svg{position:absolute;inset:0;width:150px;height:150px;overflow:visible}
.anillo .pista{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:2 5}
.anillo .seg{fill:none;stroke-width:7.5;stroke-linecap:round}
.anillo .seg.vac{stroke:var(--sur2)}
.anillo .seg.zc{stroke:rgba(232,145,46,.16)}
.anillo .tk{stroke:var(--line2);stroke-width:1.6;stroke-linecap:round}
.anillo .tk.f{stroke:var(--red2)}
.anillo .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;pointer-events:none}
.anillo .mid .n{font-family:var(--mono);font-size:34px;font-weight:600;letter-spacing:-.04em;line-height:1}
.anillo .mid .n small{font-size:14px;color:var(--ink3)}
.anillo .mid .u{font-family:var(--mono);font-size:8px;letter-spacing:.15em;color:var(--ink3);margin-top:5px}

/* desplegable por reunión (disponibilidad y riesgo) */
.acord{border:1px solid var(--line);border-radius:var(--r2);margin-bottom:9px;overflow:hidden;background:var(--sur)}
.acord>.hh{display:flex;align-items:center;gap:11px;padding:11px 13px;cursor:pointer}
.acord>.hh:hover{background:rgba(255,255,255,.025)}
.acord>.hh .tx{flex:1;min-width:0}
.acord>.hh .tx b{display:block;font-size:13px}
.acord>.hh .tx small{display:block;font-size:11px;color:var(--ink3);margin-top:2px}
.acord>.hh svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.2;color:var(--ink3);
  transition:transform .3s var(--sal);flex:none}
.acord.ab>.hh svg{transform:rotate(180deg)}
.acord>.bb{max-height:0;overflow:hidden;transition:max-height .42s var(--sal)}
.acord.ab>.bb{max-height:1200px}

/* mapa de calor */
.heat{overflow-x:auto;padding-bottom:4px}
.hg{display:grid;gap:2px;min-width:430px}
.hc{font-family:var(--mono);font-size:8.5px;color:var(--ink3);display:flex;align-items:center;justify-content:center;min-height:18px}
.hc.rd{justify-content:flex-end;padding-right:7px;white-space:nowrap;font-size:9.5px;color:var(--ink2)}
.hc.rh{position:relative;overflow:visible;align-items:flex-start;min-height:15px}
/* etiqueta al LÍMITE izquierdo = hora de inicio (decisión cerrada) */
.hc.rh span{position:absolute;left:0;top:2px;transform:translateX(-50%);white-space:nowrap;font-size:8.5px}
.cel{height:19px;border-radius:2px;display:grid;place-items:center;font-family:var(--mono);
  font-size:8.5px;color:rgba(244,243,243,.9)}
.cel.best{outline:1px solid var(--ink);outline-offset:-1px}

/* fichajes en curso */
.curso{display:flex;align-items:center;gap:12px;padding:11px 13px;border-top:1px solid var(--line)}
.curso:first-child{border-top:0}
.curso .pt{width:8px;height:8px;border-radius:50%;background:var(--red);flex:none;
  animation:latido 1.9s ease-in-out infinite}
.curso.wa .pt{background:var(--warn)}
.curso .tx{flex:1;min-width:0}
.curso .tx b{display:block;font-size:13px}
.curso .tx small{display:block;font-size:11px;color:var(--ink3);margin-top:2px}
.curso .q{font-family:var(--mono);font-size:15px;font-weight:600}
.curso.wa .q{color:var(--warn)}

/* checklist de cierre */
.paso{display:flex;align-items:center;gap:12px;padding:11px 13px;border-top:1px solid var(--line)}
.paso:first-child{border-top:0}
.paso .bx{width:17px;height:17px;border-radius:5px;border:1px solid var(--ink3);flex:none;position:relative}
.paso.ok .bx{background:var(--ok);border-color:var(--ok)}
.paso.ok .bx::after{content:"";position:absolute;left:5px;top:2px;width:4px;height:8px;
  border:solid #0A0909;border-width:0 1.6px 1.6px 0;transform:rotate(42deg)}
.paso.bloq .bx{border-color:var(--red2)}
.paso .tx{flex:1;min-width:0}
.paso .tx b{display:block;font-size:12.5px}
.paso .tx small{display:block;font-size:11px;color:var(--ink3);margin-top:2px}

.nota{font-size:11.5px;color:var(--ink3);line-height:1.6;padding:11px 13px;border-top:1px solid var(--line)}
.nota b{color:var(--ink2)}
.vac{padding:26px 14px;text-align:center;color:var(--ink3);font-size:12.5px;line-height:1.6}
.vac b{display:block;color:var(--ink2);font-family:var(--mono);font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;margin-bottom:6px}
.tost{position:fixed;left:50%;bottom:26px;transform:translate(-50%,12px);z-index:80;background:var(--sur2);
  border:1px solid var(--line);border-left:2px solid var(--red);border-radius:var(--r2);padding:9px 15px;
  font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .2s linear,transform .28s var(--sal);
  box-shadow:0 12px 30px rgba(0,0,0,.5)}
.tost.on{opacity:1;transform:translate(-50%,0)}
@keyframes latido{0%,100%{opacity:.5;transform:scale(.9)}50%{opacity:1;transform:scale(1)}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;
    transition-duration:.001ms !important}
  .viajev,.actua .est{display:none}
  main.entrando>*{animation:none}
}
</style>
</head>

/* Sin IIFE, igual que app.html: sus funciones son globales y eso es lo que

"use strict";
var $=function(s,c){return (c||document).querySelector(s);};
var $$=function(s,c){return Array.prototype.slice.call((c||document).querySelectorAll(s));};
var RM=window.matchMedia('(prefers-reduced-motion: reduce)');
function redu(){return RM.matches;}
function nf(v,d){return new Intl.NumberFormat('es-ES',{minimumFractionDigits:d||0,maximumFractionDigits:d||0}).format(v);}
function h1(v){return nf(v,1)+' h';}
function pc(v){return (v>=0?'+':'−')+nf(Math.abs(v),1)+' %';}

/* instrumento de puntos — geometría de gauge(): 10 arcos de 36°, hueco de 8°.
   Aquí admite DECIMALES, porque lo que se mide es la MEDIA del equipo (04b). */
var ACX=75,ACY=75,AR=52,AGAP=8,ASTEP=36;
function arco(i,r,frac){
  var a0=(-90+i*ASTEP+AGAP/2)*Math.PI/180;
  var a1=(-90+i*ASTEP+AGAP/2+(ASTEP-AGAP)*frac)*Math.PI/180;
  return 'M'+(ACX+r*Math.cos(a0)).toFixed(2)+' '+(ACY+r*Math.sin(a0)).toFixed(2)+
    ' A'+r+' '+r+' 0 0 1 '+(ACX+r*Math.cos(a1)).toFixed(2)+' '+(ACY+r*Math.sin(a1)).toFixed(2);
}
function anilloHTML(valor,etiqueta){
  var segs='',ticks='',i;
  for(i=0;i<10;i++){
    var f=Math.max(0,Math.min(1,valor-i));
    segs+='<path class="seg vac'+(i<3?' zc':'')+'" d="'+arco(i,AR,1)+'"/>';
    if(f>0) segs+='<path class="seg" stroke="'+(i<3?'var(--warn)':'var(--red)')+'" d="'+arco(i,AR,f)+'"/>';
    var a=(-90+i*ASTEP)*Math.PI/180;
    ticks+='<line class="tk'+(f>0?' f':'')+'" x1="'+(ACX+60*Math.cos(a)).toFixed(1)+'" y1="'+(ACY+60*Math.sin(a)).toFixed(1)+
      '" x2="'+(ACX+66*Math.cos(a)).toFixed(1)+'" y2="'+(ACY+66*Math.sin(a)).toFixed(1)+'"/>';
  }
  return '<div class="anillo"><svg viewBox="0 0 150 150"><circle class="pista" cx="75" cy="75" r="'+AR+'"/>'+
    ticks+segs+'</svg><div class="mid"><div class="n mono">'+nf(valor,1)+'<small>/10</small></div>'+
    '<div class="u">'+esc(etiqueta)+'</div></div></div>';
}

/* lecturas automáticas: lo que un humano no ve de un vistazo en una tabla */
function insightsHTML(){
  var xs=[];
  /* se ordena por el MISMO porcentaje que luego se imprime: si no, el rotulo nombra
     a uno y ensena un numero que no es el mayor. */
  var conAnt=DATA.miembros.filter(function(m){ return m.hAnt!=null && m.hAnt>0; });
  if(conAnt.length>=2){
    var vpc=function(m){ return (m.hMes-m.hAnt)/m.hAnt*100; };
    var subida=conAnt.slice().sort(function(a,b){return vpc(b)-vpc(a);})[0];
    var bajada=conAnt.slice().sort(function(a,b){return vpc(a)-vpc(b);})[0];
    xs.push(['up',esc(subida.pila)+' es quien m\u00e1s sube: '+pc(vpc(subida))+
      ' respecto al mes pasado ('+h1(subida.hAnt)+' \u2192 '+h1(subida.hMes)+').']);
    xs.push(['dn',esc(bajada.pila)+' es quien m\u00e1s baja: '+pc(vpc(bajada))+
      ' ('+h1(bajada.hAnt)+' \u2192 '+h1(bajada.hMes)+').']);
  } else {
    /* no se finge una comparativa que no existe: se dice que falta el dato */
    xs.push(['wa','Todav\u00eda no hay horas del mes anterior, as\u00ed que no se puede comparar la evoluci\u00f3n.']);
    var top=DATA.miembros.slice().sort(function(a,b){return (b.hMes||0)-(a.hMes||0);})[0];
    if(top) xs.push(['up',esc(top.pila)+' es quien m\u00e1s horas lleva este mes: '+h1(top.hMes||0)+'.']);
  }
  var enAire=pendientes().reduce(function(a,p){return a+p.horas;},0);
  if(enAire>0) xs.push(['wa',nf(enAire,1)+' h están sin firmar. Mientras sigan ahí, el umbral del mes y el '+
    'ranking se calculan con datos incompletos.']);
  var sinCubrir=REUS.reduce(function(a,r){
    var sc = r.sinCubrir || _cobertura_(r).sinCubrir;   /* el dato real no lo trae: se deriva */
    return a+((sc&&sc.length)||0); },0);
  if(sinCubrir) xs.push(['wa',sinCubrir+' personas no han cubierto alguna disponibilidad abierta. '+
    'Mira «Disponibilidad y riesgo» para ver qué sanción implicaría a cada una.']);
  var largos=CURSO.filter(function(c){return c.min>=600;}).length;
  if(largos) xs.push(['wa',largos+' fichaje'+(largos===1?'':'s')+' lleva'+(largos===1?'':'n')+
    ' más de 10 h abierto. A las 14 h se cierran solos con la hora de la última actividad.']);
  return xs.map(function(x){
    return '<div style="display:flex;gap:9px;padding:8px 0;border-top:1px solid rgba(50,44,46,.7);font-size:12.5px;color:var(--ink2);line-height:1.55">'+
      '<span class="'+x[0]+'" style="flex:none;font-family:var(--mono)">'+(x[0]==='up'?'▲':x[0]==='dn'?'▼':'!')+'</span>'+
      '<span>'+x[1]+'</span></div>';
  }).join('');
}

/* ---- Convocar turno -------------------------------------------------------------
   Escribe DIRECTO en la base de Notion (v31). El campo autoritativo de roles es
   `Reparto` ("Nombre \u2014 rol"), que es el que lee la app; las columnas People de Notion
   se rellenan a partir de los mismos nombres para que la ficha se vea bien allí.
   El estado vive fuera de render() para que un repintado no borre lo que llevas puesto. */
var TUR_SEL = {};        // nombre -> {rol, coche}
var TUR_RESP = null;     // nombre del responsable de turno

function pintarReparto(){
  var c=document.getElementById('tuLista'); if(!c) return;
  var nn=Object.keys(TUR_SEL);
  if(!nn.length){
    c.innerHTML='<p style="margin:0;font-size:12px;color:var(--ink3)">Nadie marcado todav\u00eda. '+
      'Pulsa arriba a qui\u00e9n convocas y aqu\u00ed le pones su papel.</p>';
    return;
  }
  c.innerHTML=nn.map(function(n){
    var e=TUR_SEL[n], m=_m(n);
    return '<div class="repf">'+
      '<b>'+esc((m&&m.pila)||n)+'</b>'+
      '<input data-rol="'+esc(n)+'" value="'+esc(e.rol||'')+'" placeholder="su papel (opcional)">'+
      '<button type="button" class="mini'+(TUR_RESP===n?' on':'')+'" data-resp="'+esc(n)+'">responsable</button>'+
      '<button type="button" class="mini'+(e.coche?' on':'')+'" data-coche="'+esc(n)+'">coche</button>'+
      '<button type="button" class="mini x" data-quita="'+esc(n)+'">quitar</button>'+
    '</div>';
  }).join('');
  cablearReparto();
}

function cablearReparto(){
  $$('#tuLista [data-rol]').forEach(function(i){
    i.oninput=function(){ if(TUR_SEL[i.dataset.rol]) TUR_SEL[i.dataset.rol].rol=i.value; };
  });
  $$('#tuLista [data-resp]').forEach(function(b){
    b.onclick=function(){ var n=b.dataset.resp; TUR_RESP=(TUR_RESP===n?null:n); pintarReparto(); };
  });
  $$('#tuLista [data-coche]').forEach(function(b){
    b.onclick=function(){ var n=b.dataset.coche; TUR_SEL[n].coche=!TUR_SEL[n].coche; pintarReparto(); };
  });
  $$('#tuLista [data-quita]').forEach(function(b){
    b.onclick=function(){
      var n=b.dataset.quita; delete TUR_SEL[n]; if(TUR_RESP===n) TUR_RESP=null;
      var chip=document.querySelector('#tuPool [data-tu="'+n.replace(/"/g,'&quot;')+'"]');

V.registro={g:'Horas',t:'Registro del mes',f:function(){
  /* solo entran los que traen horas: con la forma MIEMBRO el backend no sirve
     las ajenas, y una tabla de 32 filas vacias no es un registro, es ruido. */
  var VIS=DATA.miembros.filter(function(m){ return typeof m.hMes==='number'; });
  if(!VIS.length) return pan('Registro del mes','sin datos',
    vac('Sin horas del equipo','Tu cuenta solo tiene acceso a tus propias horas, no a las del resto. '+
      'Si necesitas el registro completo del mes, pídeselo al Project Director.'));
  var tot=VIS.reduce(function(a,m){return a+(m.hMes||0);},0);
  return '<div class="chips"><span class="chip">TOTAL <b style="color:var(--ink)">'+nf(tot,1)+' h</b></span>'+
    '<span class="chip">MEDIA <b style="color:var(--ink)">'+nf(tot/VIS.length,1)+' h</b></span>'+
    '<span class="chip">OBJETIVO <b style="color:var(--ink)">'+nf(UMBRAL,1)+' h/mes</b></span>'+
    (VIS.length<DATA.miembros.length?'<span class="chip wa">solo '+VIS.length+' de '+DATA.miembros.length+' visibles</span>':'')+'</div>'+
    pan('Horas por miembro · julio 2026','confirmadas',
      tabla([['Miembro'],['Unidad'],['Julio',1],['Junio',1],['Δ',1],['vs. objetivo',1]],
        VIS.slice().sort(function(a,b){return (b.hMes||0)-(a.hMes||0);}).map(function(m){
          /* hAnt (mes anterior) NO existe en el dato real del panel: hoy nadie lo
             sirve. Antes de inventarlo, se dice que no esta. */
          var hay=(m.hAnt!=null && m.hAnt>0);
          var d=hay?((m.hMes-m.hAnt)/m.hAnt*100):null, o=UMBRAL?((m.hMes-UMBRAL)/UMBRAL*100):0;
          return '<tr><td><span class="mem"><span class="av">'+ini(m.nombre)+'</span>'+esc(m.pila||m.nombre)+'</span></td>'+
            '<td style="color:var(--ink3)">'+esc(m.unidad)+'</td>'+
            '<td class="r mono">'+nf(m.hMes||0,1)+'</td>'+
            '<td class="r mono" style="color:var(--ink3)">'+(hay?nf(m.hAnt,1):'\u2014')+'</td>'+
            '<td class="r mono '+(d==null?'':(d>=0?'up':'dn'))+'">'+(d==null?'\u2014':pc(d))+'</td>'+
            '<td class="r mono '+(o>=0?'up':'dn')+'">'+pc(o)+'</td></tr>';
        }).join('')));
}};

function filaDoc(d){
  var rev=revisoresDeDoc(d).map(function(n){return miembro(n)?miembro(n).pila:n;}).join(' o ');
  /* NADIE FIRMA LO SUYO: faltaba excluir al autor, asi que el PD podia aprobar su propio
     informe general. El backend ya lo impide; esta cara no lo reflejaba. */
  var _rev=revisoresDeDoc(d);
  var puede=(d.autor!==ACTOR) &&
    (_rev.indexOf(ACTOR)>=0 || rangoNom(ACTOR)>Math.max.apply(null,_rev.map(rangoNom)));
  return '<div class="dec" id="doc-'+d.id+'" style="cursor:default">'+
    '<span class="ic"><svg><use href="#i-doc"/></svg></span>'+
    '<span class="tx"><b>'+esc(d.tit)+'</b><small><span class="mono">'+d.ref+'</span> · '+
      esc(_m(d.autor).pila)+' · ámbito '+d.amb+' · firma '+esc(rev)+
      (d.iss?' · '+d.iss+' aviso'+(d.iss===1?'':'s'):'')+'</small></span>'+
    '<span class="der"><span class="chip '+(d.sev==='alta'?'no':d.sev==='media'?'wa':'ok')+'">sev. '+d.sev+'</span>'+
      (d.est==='revision'&&puede
        ?'<button class="btn sm" data-doc="'+d.id+'" data-acc="cambios">Cambios</button>'+
         '<button class="btn sm pri" data-doc="'+d.id+'" data-acc="aprobar">Aprobar</button>'
        :'<span class="chip '+(d.est==='publicado'?'ok':d.est==='cambios'?'no':'')+'">'+d.est+'</span>')+
    '</span></div>';
}

/* ── DISCIPLINA ──────────────────────────────────────────────────────────── */
/* el rango de puntos del bloque se CALCULA, nunca se escribe a mano: un aviso (0
   puntos) no es «-1 punto», y un bloque puede mezclar valores. */
function rangoLote(){
  var vals=[],avisos=0;
  LOTE.items.forEach(function(x){ if(!Number(x.pts)) avisos++; else if(vals.indexOf(x.pts)<0) vals.push(x.pts); });
  vals.sort(function(a,b){return Math.abs(a)-Math.abs(b);});
  var et=function(pp){ return (pp>0?'+':'−')+Math.abs(pp)+' '+(Math.abs(pp)===1?'punto':'puntos'); };
  var nS=LOTE.items.length-avisos;
  var t = !vals.length ? '' : (vals.length===1 ? et(vals[0])+(nS>1?' c/u':'')
        : 'de '+et(vals[0])+' a '+et(vals[vals.length-1]));
  if(avisos) t += (t?' · ':'')+avisos+' aviso'+(avisos===1?'':'s');
  return t;
}
/* ── Sanciones sueltas e historial ────────────────────────────────────────────
   El backend las sirve desde siempre y el panel no las pintaba: se podia dejar a
   alguien sancionado sin que nadie lo viera. Las sueltas no son un bloque (cada una
   tiene su motivo y su articulo), asi que van en su propia tabla. */
function _sancSueltas_(){
  if(!Array.isArray(SANC_BACK)) return [];
  return SANC_BACK.filter(function(s){ return s.estado==='pendiente' && !s.lote; });
}
function _sancHist_(){
  if(!Array.isArray(SANC_BACK)) return [];
  return SANC_BACK.filter(function(s){ return s.estado && s.estado!=='pendiente'; })
    .sort(function(a,b){ return String(b.creado_at||'').localeCompare(String(a.creado_at||'')); });
}
function _selectorLotes_(){
  if(LOTES_PEND.length<2) return '';
  return '<div class="pb" style="padding-bottom:0"><label style="display:block">'+
    '<span class="sc" style="display:block;margin-bottom:5px">Hay '+LOTES_PEND.length+' bloques pendientes</span>'+
    '<select id="loteSel" style="width:100%;max-width:340px;background:#0A0909;border:1px solid var(--line);'+
    'border-radius:8px;padding:8px 10px;color:var(--ink);font:inherit;font-size:12.5px">'+
    LOTES_PEND.map(function(l,i){
      return '<option value="'+i+'"'+(i===LOTE_SEL?' selected':'')+'>'+esc(l)+'</option>'; }).join('')+
    '</select></label></div>';
}

/* Disponibilidad y riesgo: por reunión, un desplegable con quién no ha cubierto
   y QUÉ SANCIÓN le caería, según la escala cerrada del PD. */
/* ═══════════════════════════════════════════════════════════════════════════
   La rejilla real NO es un rectangulo lleno: la del 28/07 son 14 dias x 13 franjas
   = 182 celdas, pero solo 102 estan OFERTADAS, y `resp[nombre]` es un vector plano
   indexado contra `bloques`, no contra [dia][franja]. Leerlo como matriz densa da
   basura. Esto reproduce lo que ya hace app.html: matriz dispersa con null en lo
   no ofertado. Si la reunion trae `calor` (semilla ficticia), se respeta.
   ═══════════════════════════════════════════════════════════════════════════ */
/* pond=true -> vista PONDERADA: suma los valores (presencial+telematico 2, telematico 1) en vez
   de contar personas. Solo tiene sentido en hibridas. Los null (no ofertado) siguen a null. */
/* Las franjas pueden venir SIN ORDENAR (la General llego de Xoyondo como 18..22,10..17)
   y el mapa saltaba de 23:00 a 10:00. Se ordenan y se remapea el indice de franja de cada
   bloque; el ORDEN DE LOS BLOQUES no se toca, porque `resp[n]` esta alineado a esa posicion. */
/* ═══ GEMELAS de movil.html: misma familia de horas, mismos nombres. ═══
   Aguantan 'HH:MM' y {ini:'HH:MM'}: antes cada sitio tenia su propio parser. */
function _minHM_(v){
  var t=(v && typeof v==='object') ? v.ini : v;
  var p=String(t==null?'':t).split(':');
  return (parseInt(p[0],10)||0)*60 + (parseInt(p[1],10)||0);
}
function _hmMin_(m){ m=(+m||0); var p=function(x){ return (x<10?'0':'')+x; };
  return p(Math.floor(m/60)%24)+':'+p(m%60); }
function _horasHM_(v){ return _minHM_(v)/60; }
/* ═══ GEMELA · existe una copia IDENTICA en movil.html. Si tocas una, toca la otra. ═══
   Ordena las franjas por hora y REMAPEA el indice de franja de cada bloque. El ORDEN DE
   LOS BLOQUES no se toca: `resp[nombre]` esta alineado a esa posicion y reordenarlo pegaria
   cada disponibilidad a la franja equivocada. */
function _ordenarFranjas_(r){
  var F=(r&&r.franjas)||[], bl=(r&&r.bloques)||[], fij=(r&&r.fijadaBl)||[];
  var idx=F.map(function(_,i){ return i; });
  if(idx.every(function(i){ return i===0 || _minHM_(F[i-1])<=_minHM_(F[i]); }))
    return {franjas:F, bloques:bl, fijadaBl:fij, cambio:false};
  idx.sort(function(a,b){ return _minHM_(F[a])-_minHM_(F[b]); });
  var pos=[]; idx.forEach(function(vi,k){ pos[vi]=k; });
  return {
    franjas:  idx.map(function(i){ return F[i]; }),
    bloques:  bl.map(function(b){ return Array.isArray(b)?[b[0],pos[b[1]]]:b; }),
    fijadaBl: fij.map(function(b){ return Array.isArray(b)?[b[0],pos[b[1]]]:b; }),
    cambio:   true
  };
}
function _calorDe_(r, pond){
  if(!pond && Array.isArray(r.calor) && r.calor.length) return r.calor;      // semilla
  var nD=(r.dias||[]).length, nF=(r.franjas||[]).length;
  var cel=[]; for(var i=0;i<nD;i++){ cel.push(new Array(nF).fill(null)); }
  var nombres=Object.keys(r.resp||{}).filter(function(n){ return Array.isArray(r.resp[n]); });
  (r.bloques||[]).forEach(function(b,i){
    if(!Array.isArray(b)) return;
    var d=b[0], f=b[1];
    if(!(cel[d]) || f<0 || f>=nF) return;
    var n=0; nombres.forEach(function(nm){ var v=+r.resp[nm][i]||0; if(v>0) n+= (pond? v : 1); });
    cel[d][f]=n;
  });
  return cel;
}
/* etiqueta de franja: el dato real las trae como {ini,dur}; la semilla, como string */
function _iniF(f){ return (f&&typeof f==='object') ? String(f.ini||'') : String(f||''); }
/* ═══════════════════════════════════════════════════════════════════════════
   EL MÍNIMO EXIGIDO · Reforma §P3. No es una heurística: es una regla del PD.
   25 % de los bloques ofertados en MAYO–AGOSTO y DICIEMBRE–ENERO; 30 % el resto.
   La AUTORIDAD es `minimo_por_periodo()` en flujos/construir_reunion.py — el motor
   es quien sanciona; aquí solo se muestra. Si esa función cambia, esto cambia.
   El periodo se toma de la FECHA DE LA REUNIÓN (o de su límite), no de hoy: una
   reunión de septiembre convocada en agosto exige el 30 %, no el 25 %.
   ═══════════════════════════════════════════════════════════════════════════ */
var MESES_MINIMO_BAJO=[1,5,6,7,8,12];
function _pctMinimo_(iso){
  var mes=null;
  var m=String(iso||'').match(/^(\d{4})-(\d{2})/);
  if(m) mes=+m[2];
  if(mes==null) mes=new Date().getMonth()+1;
  return MESES_MINIMO_BAJO.indexOf(mes)>=0 ? 0.25 : 0.30;
}
function _minimoExigido_(r){
  var tot = r.total || (r.bloques||[]).length || 0;
  var ref = r.fecha || r.limite || (typeof DATA!=='undefined'?DATA.generado:'');
  return Math.max(1, Math.round(tot*_pctMinimo_(ref)));
}
function _etiquetaMinimo_(r){
  var pct=Math.round(_pctMinimo_(r.fecha||r.limite||DATA.generado)*100);
  return _minimoExigido_(r)+' franjas ('+pct+' % de '+(r.total||(r.bloques||[]).length||0)+')';
}
/* quien ha cubierto, quien no y cuantos estaban convocados — derivado, no inventado */
function _cobertura_(r){
  var resp=r.resp||{};
  var cubren=Object.keys(resp).filter(function(n){ return Array.isArray(resp[n]); });
  var universo = (r.invitados&&r.invitados.length) ? r.invitados
               : (r.tipo==='general' ? DATA.miembros.map(function(m){return m.nombre;}) : cubren);
  /* el convocante organiza: esta exento de cubrir su propia encuesta */
  universo = universo.filter(function(n){ return n!==r.convocante; });
  var sin = universo.filter(function(n){ return cubren.indexOf(n)<0; });
  var minimo = r.minimo!=null ? r.minimo : _minimoExigido_(r);
  var bajo = cubren.filter(function(n){
    var v=resp[n]||[]; var c=0; v.forEach(function(x){ if((+x||0)>0) c++; });
    return c>0 && c<minimo && n!==r.convocante;
  });
  return {cubren:cubren.length, conv:universo.length, sinCubrir:sin, bajoMin:bajo, minimo:minimo};
}
var DISPO_POND=false;   // conmutador personas/ponderada del mapa (solo hibridas)
V.dispo={g:'Reuniones',t:'Disponibilidad y riesgo',f:function(){
  if(!REUS.length) return pan('Disponibilidad y riesgo','',
    vac('No hay ninguna reuni\u00f3n','Cuando se convoque una, aqu\u00ed sale su mapa de calor y a qui\u00e9n le caer\u00eda sanci\u00f3n por no cubrirla.'));
  return REUS.map(function(r0){
    var cob=_cobertura_(r0);
    var hib=(r0.modalidad==='hibrida');
    var pondOn=hib && DISPO_POND;
    var _o=_ordenarFranjas_(r0);
    if(_o.cambio) r0=Object.assign({}, r0, {franjas:_o.franjas, bloques:_o.bloques, calor:null});
    var r=Object.assign({}, r0, {calor:_calorDe_(r0, pondOn), _hib:hib, _pond:pondOn, conv:(r0.conv!=null?r0.conv:cob.conv),
      cubren:(r0.cubren!=null?r0.cubren:cob.cubren), minimo:cob.minimo,
      sinCubrir:(r0.sinCubrir||cob.sinCubrir), bajoMin:(r0.bajoMin||cob.bajoMin),
      mod:r0.mod||r0.modalidad, tit:r0.tit||r0.titulo, limite:r0.limite||'sin l\u00edmite'});
    var max=0; r.calor.forEach(function(f){f.forEach(function(v){if(v!=null&&v>max)max=v;});});
    var best={d:0,f:0,v:-1};
    r.calor.forEach(function(f,di){f.forEach(function(v,fi){if(v!=null&&v>best.v)best={d:di,f:fi,v:v};});});
    var g='';
    if(hib) g+='<div class="decs" style="margin-bottom:9px">'+

/* ═══════════════════════════════════════════════════════════════════════════
   LOGIN · mismo gate que app.html: Google Sign-In restringido a
   @uvigoaerotech.com, sesión guardada en localStorage para volver a entrar sin
   pasar por Google si el token sigue vivo (<50 min), y re-login silencioso con
   FedCM + login_hint. Si GIS no carga (sin red), NO hay gate y la pantalla se
   queda con la semilla ficticia: la maqueta sigue siendo demostrable.
   ═══════════════════════════════════════════════════════════════════════════ */
function _gate_(html){

    g.style.cssText='position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;'+
      'align-items:center;justify-content:center;gap:16px;background:#0C0B0B;color:#F4F3F3;'+
      'font:15px/1.5 system-ui,-apple-system,sans-serif;text-align:center;padding:24px';
    document.body.appendChild(g); }
  g.innerHTML=html; return g;
}

  return i ? '<img src="'+i.src+'" alt="Solaris" style="width:96px;height:96px;object-fit:contain">' : '';
}
/* Dos formas del panel, exactamente como las manda el backend:
   · MIEMBRO  -> {yo:<mi ficha completa>, miembros:[solo identidad], ranking:{puesto,total}}
   · ADMIN    -> {miembros:[fichas completas]}
   El escritorio es de coordinación, así que con la forma de miembro habrá vistas
   que se queden a medias: se dice en pantalla en vez de fingir que hay datos. */
/* `listarReuniones` no devuelve las respuestas (viven en su propia hoja y las sirve
   `getReunion`). Sin pedirlas, el mapa de calor salia ENTERO A CERO, el panel decia "0 de N
   han cubierto" y metia a TODOS los convocados en la lista de riesgo con su sancion
   propuesta al lado: se proponia castigar a quien si habia cubierto. Es el mismo hidratado
   que ya hacia el movil en `_hidratarReuM_`. */
async function _hidratarReus_(){
  if(typeof backendOK==='undefined' || !backendOK || !SESION) return;
  for(var i=0;i<REUS.length;i++){
    var r=REUS[i];
    if(r.resp && Object.keys(r.resp).length) continue;
    try{
      var d=await api.get(r.id);
      if(d && d.resp){ r.resp=d.resp; r.calor=null; }   // calor null: se recalcula con las respuestas
    }catch(_){ /* una reunion que no se puede leer no debe tumbar el resto */ }
  }
  try{ pintar(); }catch(_){}
}
function _aplicarPanel_(pnl){
  if(!pnl) return;
  if(pnl.generado) DATA.generado=pnl.generado;
  if(pnl.temporada) DATA.temporada=pnl.temporada;
  if(pnl.reunion) DATA.reunion=pnl.reunion;
  if(Array.isArray(pnl.subsistemas)&&pnl.subsistemas.length) DATA.subsistemas=pnl.subsistemas;
  if(pnl.yo){                                   // forma MIEMBRO
    var pub=(pnl.miembros||[]).slice();
    var ix=-1;
    for(var i=0;i<pub.length;i++) if(pub[i].nombre===pnl.yo.nombre) ix=i;
    if(ix>=0) pub[ix]=pnl.yo; else pub.push(pnl.yo);
    DATA.miembros=pub; DATA._rol='miembro'; DATA._ranking=pnl.ranking||null;
  } else if(Array.isArray(pnl.miembros)&&pnl.miembros.length){   // forma ADMIN
    DATA.miembros=pnl.miembros; DATA._rol='admin'; DATA._ranking=null;
  }
  /* El backend manda `horasMes`; TODA esta cara lee `hMes`. Sin esta traduccion el PD veia
     "H/mes —" y "TOTAL 0,0 h" con las horas ahi mismo. Mismo fallo de forma que ya se cazo
     en turnos, tareas y documentos: el backend habla largo y la vista lee corto. */
  (DATA.miembros||[]).forEach(function(m){
    if(m.hMes==null && typeof m.horasMes==='number') m.hMes=m.horasMes;
  });
  _rederivarCargos_();
}
function _aplicarBootstrap_(boot){
  _aplicarPanel_(boot.panel);
  if(Array.isArray(boot.tareas)){ TAREAS.length=0; boot.tareas.forEach(function(t){TAREAS.push(t);}); }
  if(Array.isArray(boot.turnos)){ TURNOS.length=0; boot.turnos.forEach(function(t){TURNOS.push(t);}); }
  if(Array.isArray(boot.entregables)){ DOCS.length=0; boot.entregables.forEach(function(d,i){DOCS.push(_normDocE_(d,i));}); }
  if(Array.isArray(boot.reuniones)){
    REUS.length=0; boot.reuniones.map(normReu).forEach(function(r){REUS.push(r);});
    _hidratarReus_();          // el bootstrap NO trae `resp`: sin esto el mapa sale a cero
  }
  backendOK=true;
}

/* Mapea un parte del BACKEND (subsistema/justificacion/estado 'pendiente'…) al modelo que
   pinta el escritorio (unidad/just/estado 'pend'…). Sin datos inventados: los flags de
   calidad de la maqueta no existen en real, salvo los que el propio dato delata. */
function _isoADMY_(f){ f=String(f||''); var m=f.match(/^(\d{4})-(\d{2})-(\d{2})/); return m?(m[3]+'/'+m[2]+'/'+m[1]):f; }
var _EST_PARTE_={pendiente:'pend',aprobada:'aprobado',rechazada:'rechazado',detalle:'detalle',otorgada:'aprobado',aplicada:'aprobado',sin_declarar:'sindecl',caducada:'cad'};
function normParte(p){
  var fl=[];
  if(p.autocierre) fl.push(['wa','autocerrado al tope de 14 h']);
  if(p.sinFichaje) fl.push(['wa','declarado sin fichaje']);
  if(p.origen==='otorgada') fl.push(['ok','otorgada por '+((p.decidido_por)||'coordinación')]);
  return { id:p.id, autor:p.autor, unidad:p.subsistema||'—', fecha:_isoADMY_(p.fecha),
    ini:p.ini||'—', fin:p.fin||'—', horas:Number(p.horas)||0, tarea:p.tarea||'',
    origen:p.sinFichaje?'bloque':'turno', just:p.justificacion||'', flags:fl,
    estado:_EST_PARTE_[p.estado]||'pend', decisor:p.decidido_por||null,
    dec:p.decidido_at?_isoADMY_(String(p.decidido_at).slice(0,10)):null, motivo:p.motivo||null, _real:true };
}
/* Vuelca la cola real de partes sobre PARTES (que si no se queda con la semilla). */
function _partesReal_(){
  if(!Array.isArray(PART_BACK)) return;                 // sin backend: semilla
  PARTES=PART_BACK.map(normParte);
}
async function _cargarPartes_(){
  try{ var arr=await api.getPartes({}); if(Array.isArray(arr)) PART_BACK=arr; }
  catch(e){ PART_BACK=null; }
  _partesReal_();
}
/* Construye el BLOQUE de sanciones desde la cola REAL del backend (SANC_BACK) cuando hay
   pendientes agrupadas en un lote. Con ids reales, marcar una decisión viaja al backend y
   «cerrar el bloque» levanta el flag que lee el motor Python. Sin backend o sin lote
   pendiente, se queda la semilla de demostración (LOTE.real queda sin marcar). */
function _loteReal_(){
  if(!Array.isArray(SANC_BACK)) return;                                   // sin backend
  var pend=SANC_BACK.filter(function(s){ return s.estado==='pendiente' && s.lote; });
  if(!pend.length) return;                                                // nada agrupado
  /* Antes se cogia SIEMPRE `pend[0].lote`: con dos bloques, el segundo no existia para
     el panel. Ahora se listan todos y se puede cambiar de uno a otro. */
  LOTES_PEND=[]; pend.forEach(function(x){ if(LOTES_PEND.indexOf(x.lote)<0) LOTES_PEND.push(x.lote); });
  var lote=LOTES_PEND[Math.min(LOTE_SEL, LOTES_PEND.length-1)] || LOTES_PEND[0];
  var its=pend.filter(function(s){ return s.lote===lote; });
  LOTE={ real:true, lote:lote, nombre:lote, cerrado:false,
    motivo:its[0].motivo||'—', art:its[0].articulo||'libre',
    items:its.map(function(s){ return {id:s.id, n:s.nombre, pts:Number(s.puntos)||0,
      dec:s.decision||'aceptar'}; }) };
}
async function _onCredencial_(resp,_silente){
  _gate_(_insigniaHTML_()+'<div style="opacity:.8">Verificando…</div>');
  try{
    var boot=null; try{ boot=await api.bootstrap(resp.credential); }catch(_){ boot=null; }
    if(boot && boot.identidad){
      SESION={token:resp.credential,email:boot.identidad.email,nombre:boot.identidad.nombre,rango:boot.identidad.rango};
      _aplicarBootstrap_(boot);

function _arrancarGis_(){

var vista='panel';
function conteo(k){
  if(k==='partes') return pendientes().filter(function(p){return puedeDecidirParte(p,ACTOR);}).length;
  if(k==='sindeclarar') return PARTES.filter(function(p){return p.estado==='sindecl';}).length;
  if(k==='curso')  return CURSO.length;
  if(k==='docdec') return docsMios().length;
  if(k==='docurso')return DOCS.filter(function(d){return ['recibido','analizado','revision','cambios'].indexOf(d.est)>=0;}).length;
  if(k==='docpub') return DOCS.filter(function(d){return d.est==='publicado';}).length;

  if(k==='tareas') return TAREAS.length;

      b.innerHTML='<span class="rail"></span><span class="tx">'+V[k].t+'</span>'+
        (n?'<span class="cnt'+cls+'">'+n+'</span>':'');

var ultY=null;
function colocarEstrella(animar){
  var nav=$('#nav'), v=$('#viajev'), act=$('.item.on',nav);
  if(!act||!v) return;
  var y=act.offsetTop+act.offsetHeight/2-7.5;
  var y0=(ultY==null)?y:ultY, d=Math.abs(y-y0);
  var comba=Math.min(30,9+d*0.13);

/* El pie del lateral decia 'EN LINEA' y 'Temporada 25/26' a fuego: afirmaba dos cosas que

function pintar(){
  _pintarPie_();
  _cablearSalir_();
  /* Decidir una SUELTA. A diferencia del bloque, aqui no hay borrador: se aplica al
     momento, porque cada una tiene su motivo y su comunicado. Por eso se pide confirmar. */
  $$('[data-sid] [data-sdec]').forEach(function(b){
    b.onclick=async function(){
      var id=+b.parentNode.dataset.sid, acc=b.dataset.sdec;
      var s=(SANC_BACK||[]).filter(function(x){ return x.id===id; })[0]; if(!s) return;
      if(!backendOK||!SESION){ tost('Sin conexión no se puede decidir.'); return; }
      var eti={aprobar:'aplicar',justificar:'justificar',rechazar:'rechazar'}[acc]||acc;
      var m=_m(s.nombre);
      var aviso='¿Seguro que quieres '+eti+' la sanción de '+((m&&m.pila)||s.nombre)+'?'
        + String.fromCharCode(10) + (s.motivo||'')
        + String.fromCharCode(10,10) + 'Esto se aplica ya, no es un borrador.';
      if(!confirm(aviso)) return;
      var just=null;
      if(acc==='justificar'){ just=prompt('Motivo de la justificación:'); if(!just) return; }
      b.disabled=true;
      try{
        await api.decidirSancion(id, acc, just?{justificacion:just}:{});
        s.estado = acc==='aprobar'?'aplicada':(acc==='justificar'?'justificada':'rechazada');
        tost('Sanción '+s.estado+'.'); pintar();
      }catch(e){ b.disabled=false; tost('No se pudo: '+((e&&e.message)||e)); }
    };
  });
  /* cambiar de bloque pendiente */
  var _ls=$('#loteSel');
  if(_ls) _ls.onchange=function(){ LOTE_SEL=+_ls.value||0; _loteReal_(); pintar(); };
  /* fijar fecha / orden del dia: api.fijar y api.setOrdenDia existian y no las llamaba nadie */
  var _rs=$('#reSel');
  if(_rs) _rs.onchange=function(){ RE_SEL=+_rs.value||0; pintar(); };
  var _reuSel=function(){ return REUS[Math.min(RE_SEL, REUS.length-1)]||REUS[0]; };
  $$('[data-fijar]').forEach(function(b){
    b.onclick=async function(){
      var r=_reuSel(); if(!r) return;
      var di=+($('#reDia')||{}).value||0, f0=+($('#reF0')||{}).value||0, f1=+($('#reF1')||{}).value||0;
      if(f1<f0){ var t=f0; f0=f1; f1=t; }
      var bloques=[]; for(var f=f0;f<=f1;f++) bloques.push([di,f]);
      var fin=_iniF((r.franjas||[])[f1]);
      var finM=_minHM_(fin)+((r.franjas||[])[f1]&&+r.franjas[f1].dur||60);
      var etiqueta=(r.dias||[])[di]+' \u00b7 '+_iniF((r.franjas||[])[f0])+'\u2013'+_hmMin_(finM);
      if(!backendOK||!SESION){ tost('Sin conexi\u00f3n no se puede fijar la fecha.'); return; }
      b.disabled=true; var prev=b.textContent; b.textContent='Fijando\u2026';
      try{
        await api.fijar(r.id, {label:etiqueta, bloques:bloques, franjas:[f0,f1]});
        r.fijada=etiqueta; r.fijadaBl=bloques;
        tost('Reuni\u00f3n fijada: '+etiqueta+'. La disponibilidad queda cerrada.');
        pintar();
      }catch(e){ b.disabled=false; b.textContent=prev; tost('No se pudo fijar: '+((e&&e.message)||e)); }
    };
  });
  $$('[data-desfijar]').forEach(function(b){
    b.onclick=async function(){
      var r=_reuSel(); if(!r) return;
      if(!backendOK||!SESION){ tost('Sin conexi\u00f3n no se puede cancelar el fijado.'); return; }
      b.disabled=true;
      try{ await api.fijar(r.id, null); r.fijada=''; r.fijadaBl=[];
        tost('Fijado cancelado: se reabre la disponibilidad.'); pintar();
      }catch(e){ b.disabled=false; tost('No se pudo cancelar: '+((e&&e.message)||e)); }
    };
  });
  $$('[data-orden]').forEach(function(b){
    b.onclick=async function(){
      var r=_reuSel(); if(!r) return;
      var txt=(($('#reOrden')||{}).value||'').trim();
      if(!backendOK||!SESION){ tost('Sin conexi\u00f3n no se puede guardar el orden del d\u00eda.'); return; }
      b.disabled=true; var prev=b.textContent; b.textContent='Guardando\u2026';
      try{ await api.setOrdenDia(r.id, txt); r.ordenDia=txt;
        tost('Orden del d\u00eda guardado.'); pintar();
      }catch(e){ b.disabled=false; b.textContent=prev; tost('No se pudo guardar: '+((e&&e.message)||e)); }
    };
  });

  var m=$('#main');
  m.innerHTML=V[vista].f();
  $('#migaA').textContent=V[vista].g;
  $('#migaB').textContent=V[vista].t;
  pintarNav();
  colocarEstrella(false);
  /* barras de los KPI: setTimeout, no rAF (en pestaña de fondo rAF no dispara) */
  $$('.kpi .bar i',m).forEach(function(i){
    i.style.width='0';
    setTimeout(function(){ i.style.width=i.dataset.w; }, redu()?0:70);
  });
  enganchar();
}
function ir(k,foco){
  if(k===vista && !foco) return;
  vista=k;
  var m=$('#main');
  if(redu()){ pintar(); m.scrollTop=0; colocarEstrella(true); if(foco) enfocar(foco); return; }
  m.classList.add('fundiendo');
  setTimeout(function(){
    pintar(); m.scrollTop=0;
    m.classList.remove('fundiendo'); m.classList.add('entrando');
    setTimeout(function(){ m.classList.remove('entrando'); },820);
    colocarEstrella(true);
    if(foco) enfocar(foco);
  },150);
}
/* llevar al sitio EXACTO, no a la sección: la fila que se abre queda marcada */
function enfocar(id){
  setTimeout(function(){
    var el=document.getElementById(id); if(!el) return;
    if(el.classList.contains('acord')) el.classList.add('ab');
    el.scrollIntoView({block:'center',behavior:redu()?'auto':'smooth'});
    el.style.transition='box-shadow .3s linear';
    el.style.boxShadow='0 0 0 2px var(--red)';
    setTimeout(function(){ el.style.boxShadow=''; },1600);
  },80);
}

/* ═══════════════════════════════════════════════════════════════════════════
   ENGANCHES
   ═══════════════════════════════════════════════════════════════════════════ */
function enganchar(){
  $$('[data-ir]').forEach(function(el){
    el.onclick=function(){ ir(el.dataset.ir, el.dataset.foco); };
  });
  $$('[data-pond]').forEach(function(b){ b.onclick=function(e){ e.stopPropagation(); DISPO_POND=(b.dataset.pond==='1'); pintar(); }; });
  $$('[data-acord]').forEach(function(h){
    h.onclick=function(){ h.parentNode.classList.toggle('ab'); };
  });
  /* decidir un parte: PERSISTE (api.decidirParte). Aprobar levanta aplicar_horas=true → el
     motor Python suma las horas al ledger y recalcula cuota/ranking. La app flaguea, el motor
     ejecuta. Rechazar/detalle exigen motivo. Con datos reales viaja; con la semilla, memoria. */
  $$('[data-parte]').forEach(function(b){
    b.onclick=async function(){
      if(b.disabled) return;
      var p=PARTES.filter(function(x){return x.id===+b.dataset.parte;})[0]; if(!p) return;
      var card=b.closest('.parte'), ta=card.querySelector('[data-motivo]');
      var mot=ta?ta.value.trim():'';
      var acc=b.dataset.acc==='si'?'aprobar':b.dataset.acc==='no'?'rechazar':'detalle';
      if(acc!=='aprobar' && mot.length<8){
        if(ta){ ta.focus(); ta.style.borderColor='rgba(232,145,46,.6)';
          setTimeout(function(){ta.style.borderColor='';},1600); }
        tost('Rechazar o pedir detalle exige un motivo. Sin él no se envía.');
        return;
      }
      var okMsg=acc==='aprobar'
        ? h1(p.horas)+' aprobadas: se suman a las horas de '+_m(p.autor).pila+' y actualizan su cuota y su puesto.'
        : (acc==='rechazar'?'Parte rechazado, con su motivo.':'Devuelto: le pides detalle al autor.');
      if(p._real && backendOK && SESION){
        var acts=card.querySelectorAll('.acts .btn'); acts.forEach(function(x){x.disabled=true;});
        try{
          var upd=await api.decidirParte(p.id, acc, mot||null);
          if(upd){ var i=PART_BACK.findIndex(function(x){return x.id===p.id;}); if(i>=0) PART_BACK[i]=upd; _partesReal_(); }
          card.classList.add('asienta'); tost(okMsg); setTimeout(pintar,420);
        }catch(e){ acts.forEach(function(x){x.disabled=false;}); tost('No se pudo: '+((e&&e.message)||e)); }
        return;
      }
      p.estado = acc==='aprobar'?'aprobado':acc==='rechazar'?'rechazado':'detalle';   // semilla local
      p.decisor=ACTOR; p.dec=HOY; if(mot) p.motivo=mot;
      card.classList.add('asienta'); tost(okMsg); setTimeout(pintar,420);
    };
  });
  /* otorgar horas directas: lee el mini-formulario y PERSISTE (api.otorgarHoras). */
  $$('[data-otorgar]').forEach(function(b){
    b.onclick=async function(){
      if(b.disabled) return;

      var nombre=(caja.querySelector('select')||{}).value||'';
      var horas=parseFloat(String((caja.querySelector('input.mono')||{}).value||'').replace(',','.'))||0;
      var concepto=(caja.querySelector('input:not(.mono)')||{}).value||'';
      if(!nombre || horas<=0){ tost('Elige a quién y unas horas > 0.'); return; }
      if(PART_BACK!==null && backendOK && SESION){    // hay backend: persiste de verdad
        b.disabled=true; var prev=b.textContent; b.textContent='Otorgando…';
        try{
          var rec=await api.otorgarHoras({nombre:nombre, horas:horas, tarea:concepto});
          if(rec){ PART_BACK.push(rec); _partesReal_(); }
          tost(h1(horas)+' otorgadas a '+(_m(nombre).pila||nombre)+': ya cuentan en sus horas del mes.');
          pintar();
        }catch(e){ b.disabled=false; b.textContent=prev; tost('No se pudo otorgar: '+((e&&e.message)||e)); }
        return;
      }
      tost('Sin conexión no se pueden otorgar horas: no se ha guardado nada.');
    };
  });
  /* bloque de horas: marca a varios de tu subsistema y otórgales lo mismo (api.otorgarBloque).
     Un solo disparo crea todas las partes 'otorgada'; el servidor revalida jurisdicción por token
     y persona. Con backend real viaja; sin él, semilla local. */

    var u=_bs.value;

        nota:($('#tuNota')||{}).value||'', principales:lin('tuObj1'), secundarios:lin('tuObj2'),

      b.disabled=true; var prev=b.textContent; b.textContent='Convocando\u2026';
      try{
        var r=await api.crearTurno(t);

        TUR_SEL={}; TUR_RESP=null;
        try{ var tt=await api.getTurnos(); if(Array.isArray(tt)){ TURNOS.length=0; tt.forEach(function(x){TURNOS.push(x);}); } }catch(_){}
        tost('Turno '+(r&&r.id||'')+' convocado en Notion'+
          (sin.length?' \u00b7 no se pudo etiquetar a: '+sin.join(', '):'')+'.');
        pintar();
      }catch(e){ b.disabled=false; b.textContent=prev;
        tost('No se pudo convocar: '+((e&&e.message)||e)); }
    };
  });
  /* documentos: decidir PERSISTE en el backend (api.decidir, ya desplegada). La app
     flaguea, el motor/Cowork ejecuta. El servidor revalida la autoridad por token;
     esto es solo el disparo. Con backend caído cae al cambio en memoria (semilla). */
  $$('[data-doc]').forEach(function(b){
    if(b._wired) return; b._wired=true;   // no duplicar el envío si pintar() re-engancha
    b.onclick=async function(){
      if(b.disabled) return;
      var d=DOCS.filter(function(x){return x.id===+b.dataset.doc;})[0]; if(!d) return;
      var accion = b.dataset.acc==='aprobar' ? 'aprobado' : 'cambios';
      var motivo = accion==='cambios' ? (prompt('Motivo para el autor (obligatorio en «cambios»):')||'').trim() : '';
      if(accion==='cambios' && !motivo){ tost('Sin motivo no se piden cambios.'); return; }
      b.disabled=true; var prev=b.textContent; b.textContent='Enviando…';
      try{
        if(typeof backendOK!=='undefined' && backendOK && SESION){
          var upd=await api.decidir(d.id, accion, motivo, null);   // el actor sale del token
          if(upd){ var i=DOCS.findIndex(function(x){return x.id===d.id;}); if(i>=0) DOCS[i]=upd; }
          tost(accion==='aprobado'
            ? 'Aprobado. Se publica en Notion, Drive y el Libro de Datos.'
            : 'Cambios pedidos. Le llega al autor.');
        } else {                                                   // sin backend: semilla
          d.est = accion==='aprobado' ? 'publicado' : 'cambios'; if(motivo) d.nota=motivo;
          tost('Sin conexión: '+(accion==='aprobado'?'la aprobación no se ha guardado.':'los cambios no se han guardado.'));
        }
        pintar();
      }catch(e){ b.disabled=false; b.textContent=prev; tost('No se pudo: '+((e&&e.message)||e)); }
    };
  });
  /* bloque de sanciones: marcar es BORRADOR (no aplica nada). Con bloque real viaja al
     backend (api.decidirSancion acción «marcar»); con la semilla, solo memoria. */
  $$('.decs button').forEach(function(b){
    b.onclick=async function(){
      var id=+b.parentNode.dataset.lid, dec=b.dataset.dec;
      var it=LOTE.items.filter(function(x){ return x.id===id; })[0]; if(!it) return;
      if(LOTE.real && backendOK && SESION){
        var prev=it.dec; it.dec=dec; pintar();                 // optimista
        try{ await api.decidirSancion(id,'marcar',{decision:dec}); }
        catch(e){ it.dec=prev; pintar(); tost('No se pudo marcar: '+((e&&e.message)||e)); }
        return;
      }
      it.dec=dec; pintar();                                    // semilla local
    };
  });
  $$('[data-mod]').forEach(function(b){
    b.onclick=function(){ tost('Editor de la sanción: artículo del RRI y puntos, solo para esta persona.'); };
  });
  /* cerrar el bloque: es el DISPARO. Con bloque real, api.confirmarLote lo cierra entero
     bajo lock y levanta aplicar_sanciones=true (una vez) para que el motor lo escriba en
     Notion y mande el comunicado. La app flaguea, el motor ejecuta. */
  $$('[data-lote]').forEach(function(b){
    b.onclick=async function(){
      if(b.disabled) return;
      var c=0; LOTE.items.forEach(function(x){ if(x.dec==='aceptar') c++; });
      if(!confirm('Vas a cerrar el bloque «'+LOTE.nombre+'».\n\n'+c+' se aplican.\n\n'+
        'Esto aplica las sanciones aceptadas en Notion y manda el comunicado. ¿Seguimos?')) return;
      if(LOTE.real && backendOK && SESION){
        b.disabled=true; var prev=b.textContent; b.textContent='Cerrando…';
        try{
          var r=await api.confirmarLote(LOTE.lote);
          LOTE.cerrado=true;
          var ap=(r&&r.aprobadas!=null)?r.aprobadas:c;
          tost('Bloque cerrado: '+ap+' aplicada'+(ap===1?'':'s')+'. Se escriben en Notion y sale el comunicado.');
          pintar();
        }catch(e){ b.disabled=false; b.textContent=prev; tost('No se pudo cerrar: '+((e&&e.message)||e)); }
        return;
      }
      LOTE.cerrado=true;                                       // semilla local
      tost('Bloque cerrado entero. O entra todo, o no entra nada.');
      pintar();
    };
  });
  $$('[data-cerrarmes]').forEach(function(b){ b.onclick=function(){ tost('Mes cerrado y comunicado enviado.'); }; });
  $$('[data-nueva]').forEach(function(b){ b.onclick=function(){ tost('Abre el creador de reuniones: tipo, modalidad, fechas y franjas.'); }; });
  /* acuse de pulsación: <120 ms, en la propia pieza, nunca bajo el cursor */
  $$('.btn').forEach(function(b){
    b.addEventListener('pointerdown',function(){
      b.classList.add('pulsa'); setTimeout(function(){b.classList.remove('pulsa');},120);
    });
  });
}

/* ═══════════════════════════════════════════════════════════════════════════
   «ACTÚAS COMO» · solo la cuenta admin puede cambiar de identidad, igual que el
   selector de persona de app.html. Para el resto se oculta y ACTOR es quien eres.
   Se pinta desde el roster REAL: PD, revisor fijo y los coordinadores que haya.
   ═══════════════════════════════════════════════════════════════════════════ */
function _pintarActua_(){
  var caja=$('#actua'); if(!caja) return;
  var m=miembro(ACTOR);
  $('#yoN').textContent = m ? m.nombre.split(' ').slice(0,2).join(' ') : (SESION?SESION.nombre:'—');
  $('#yoR').textContent = _rolDe_(ACTOR);
  $('#yoAv').textContent = ini(m?m.nombre:(SESION&&SESION.nombre)||'??');
  if(!_puedeImpersonar_() && SESION){ caja.style.display='none'; return; }
  caja.style.display='';
  var opts=[];
  if(miembro(PD_NOM)) opts.push([PD_NOM,'Project Director']);
  if(miembro(REV2_NOM)) opts.push([REV2_NOM,'Revisor fijo']);
  DATA.miembros.filter(function(x){ return x.cargo==='Coordinador' && x.nombre!==PD_NOM && x.nombre!==REV2_NOM; })
    .slice(0,3).forEach(function(x){ opts.push([x.nombre, x.pila||x.nombre.split(' ')[0]]); });
  if(!opts.length) opts=[[ACTOR,'Yo']];
  $$('#actua button',caja).forEach(function(b){ b.remove(); });
  opts.forEach(function(o){
    var b=document.createElement('button');
    b.dataset.nom=o[0]; b.textContent=o[1];
    b.className=(o[0]===ACTOR?'on':'');
    caja.appendChild(b);
  });
  $$('#actua button').forEach(function(b){
    b.onclick=function(){
      $$('#actua button').forEach(function(x){x.classList.toggle('on',x===b);});
      ACTOR=b.dataset.nom;
      $('#yoN').textContent=(miembro(ACTOR)||{}).nombre||ACTOR;
      $('#yoR').textContent=_rolDe_(ACTOR);
      $('#yoAv').textContent=ini(ACTOR);
      var est=$('#actuaEst');
      var dx=Math.abs((b.offsetLeft-5)-(parseFloat(est.style.transform.replace(/[^0-9.-]/g,''))||0));
      est.style.transform='translateX('+(b.offsetLeft-5)+'px)';
      if(!redu() && dx>2){ est.classList.remove('vuela'); void est.offsetWidth; est.classList.add('vuela');
        setTimeout(function(){est.classList.remove('vuela');},380); }
      pintar();
    };
  });
}

window.addEventListener('resize',function(){ ultY=null; colocarEstrella(false); });

/* ═══════════════════════════════════════════════════════════════════════════
   ARRANQUE · se pinta la semilla para que nunca haya pantalla en blanco, y por
   encima entra el login. Si hay sesión guardada de menos de 50 min, se entra sin
   pasar por Google (mismo criterio que app.html).
   ═══════════════════════════════════════════════════════════════════════════ */
_pintarActua_();
pintar();
setTimeout(function(){
  colocarEstrella(false);
  var on=$('#actua button.on'); if(on) $('#actuaEst').style.transform='translateX('+(on.offsetLeft-5)+'px)';
},60);

if(GOOGLE_CLIENT_ID && !window.__SIN_LOGIN__){
  _gate_(_insigniaHTML_()+'<div style="opacity:.7">Cargando…</div>');
  var _sg=null; try{ _sg=JSON.parse(localStorage.getItem('sol_sess')||'null'); }catch(_){}
  var _tok=(_sg && _sg.token && (Date.now()-(_sg.ts||0) < 50*60*1000)) ? _sg.token : null;
  if(_tok) _onCredencial_({credential:_tok}, true);
  else _arrancarGis_();
}
</script>
