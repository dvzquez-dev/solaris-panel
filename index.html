<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Solaris · Instrumento — la app del miembro (ronda 3)</title>
<script src="https://accounts.google.com/gsi/client" async></script>
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   SOLARIS · INSTRUMENTO — dirección definitiva, MÓVIL (el miembro)
   ───────────────────────────────────────────────────────────────────────────
   Público: el miembro. Su estado, sus horas, sus turnos, sus documentos, su
   disponibilidad. El escritorio (consejo/junta/PD) es OTRO producto y vive en
   `escritorio.html`: no es esta pantalla estirada.

   Tesis: el panel es un INSTRUMENTO. Mide, dice qué falta, y no deja disparar
   hasta que la figura cierra. Nada estalla bajo el dedo.

   PALETA — medida, no elegida (docs/identidad-visual.md §4 y §4-ter):
   · rojo    #E41E25  → 664.483 px de Insignia_Solaris.png (21,9 % de los opacos)
   · neutro  #231F20  → 1.587.031 px (52,3 %). H=345° S=6,1% L=12,9%
   · blanco  #FFFFFF  → 755.286 px (24,9 %)
   La insignia es LITERALMENTE esos tres colores. La rampa de grises se deriva
   del neutro conservando su tono y saturación: solo cambia la luminosidad.
   Semánticos (ok/warn/telemático) son derivados nuestros ya cerrados en la app.

   DATOS: ficticios con el ESQUEMA REAL de app.html (nombre·pila·unidad·cargo·
   puntos·estado·infraccion·hMes·horasTemp·meses·cuota·cuota_base·coche·puesto).
   Ni un nombre real: esto se publica.
   ═══════════════════════════════════════════════════════════════════════════ */

:root{
  /* rampa derivada de #231F20 — H 345° · S 6,1 % · solo cambia L */
  --bg:#0C0B0B;        /* L 4,5 % */
  --sur:#181616;       /* L 9,0 % */
  --sur2:#221E1F;      /* L 12,5 % */
  --gris:#231F20;      /* L 12,9 % — EL gris de la insignia */
  --line:#322C2E;      /* L 18,5 % */
  --line2:#463E40;     /* L 26,0 % */
  --ink3:#7C6E72;      /* L 46,0 % */
  --ink2:#B2A8AB;      /* L 68,0 % */
  --ink:#F4F3F3;       /* L 95,5 % */

  --red:#E41E25; --red2:#FF4A4F; --red3:#8E1418;
  --ok:#3EB489; --warn:#E8912E; --tel:#3f9ed6;

  --mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;

  --r:12px; --r2:9px;
  --sal:cubic-bezier(.16,.84,.44,1);
  --arco:cubic-bezier(.34,1.42,.5,1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;touch-action:manipulation}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:14px;
  line-height:1.45; -webkit-font-smoothing:antialiased;
  height:100vh; height:100dvh; display:flex; flex-direction:column;
  overflow:hidden; position:relative;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sc{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);line-height:1}

/* ── cartel de la maqueta ─────────────────────────────────────────────────── */
.cartel{max-width:760px;width:100%;border:1px solid var(--line);border-radius:var(--r);
  background:linear-gradient(180deg,var(--sur2),var(--sur));padding:16px 18px}
.cartel h1{margin:0 0 3px;font-size:19px;letter-spacing:-.01em}
.cartel h1 span{color:var(--red2)}
.cartel p{margin:7px 0 0;font-size:12.5px;color:var(--ink2);line-height:1.6}
.cartel p b{color:var(--ink)}
.cartel .tres{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}
.mues{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;
  padding:4px 10px 4px 5px;font-family:var(--mono);font-size:10px;color:var(--ink2)}
.mues i{width:14px;height:14px;border-radius:50%;display:block}

/* ── chasis del teléfono ──────────────────────────────────────────────────── */
.fono{width:390px;height:844px;border-radius:38px;padding:9px;position:relative;flex:none;
  background:linear-gradient(160deg,#2a2325,#100e0e);border:1px solid #3a3234;
  box-shadow:0 0 0 1px rgba(0,0,0,.6),0 30px 70px rgba(0,0,0,.6)}
.pant{position:relative;width:100%;height:100%;border-radius:30px;overflow:hidden;
  background:var(--bg);display:flex;flex-direction:column}
.isla{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:104px;height:24px;
  border-radius:14px;background:#080707;z-index:30}
.stbar{flex:none;height:44px;display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 18px 6px;font-family:var(--mono);font-size:11px;color:var(--ink2);z-index:20}
.stbar .sig{display:flex;gap:3px;align-items:flex-end}
.stbar .sig i{display:block;width:3px;background:var(--ink2);border-radius:1px}

/* ── cabecera ─────────────────────────────────────────────────────────────── */
header{flex:none;display:flex;align-items:center;gap:10px;padding:4px 16px 12px;position:relative;z-index:12}
header::after{content:"";position:absolute;left:16px;right:16px;bottom:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--line) 20%,var(--line) 80%,transparent)}
.avat{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;
  background:linear-gradient(155deg,#3d2427,#20161a);color:var(--red2);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.avat svg{width:17px;height:17px;fill:currentColor}
.avat img{width:30px;height:30px;object-fit:contain;display:block}
/* marca de agua: la insignia real, en % para que ocupe igual en cualquier ancho */
.marcagua{position:absolute;bottom:88px;right:-12%;width:88%;height:auto;opacity:.05;
  z-index:0;pointer-events:none}
.hquien b{display:block;font-size:15px;font-weight:600;letter-spacing:-.01em}
.hquien span{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--ink3)}
.hlado{margin-left:auto;display:flex;align-items:center;gap:8px}

/* ── cuerpo con scroll ────────────────────────────────────────────────────── */
main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:10px 15px 18px;scrollbar-width:thin}
main::-webkit-scrollbar{width:5px}
main::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.vis{display:none} .vis.on{display:block}
.h1{font-size:20px;font-weight:600;letter-spacing:-.02em;margin:2px 0 2px}
.h1s{font-size:12px;color:var(--ink3);margin:0 0 14px}
h2.sec{font-size:9.5px;font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink3);font-weight:500;margin:20px 2px 9px;display:flex;align-items:center;gap:8px}
h2.sec .ln{flex:1;height:1px;background:var(--line)}

.tarj{background:var(--sur);border:1px solid var(--line);border-radius:var(--r);padding:14px;
  margin-bottom:10px;position:relative}
.tarj.acc{background:linear-gradient(160deg,#241416,#171112);border-color:#3d2224}
.tarj .tt{display:flex;align-items:center;gap:8px;margin:-2px 0 10px}
.tarj .tt .sc{flex:none} .tarj .tt .ln{flex:1;height:1px;background:var(--line)}

/* ── PULSAR: acuse barato, <120 ms, en el propio elemento ─────────────────── */
/* Decisión cerrada: NADA de círculo que se expande bajo el dedo, y no se mueve
   un blanco de clic. La pieza se hunde un pelo y se le enciende el canto. */
[data-p]{position:relative;transition:transform .11s var(--sal),border-color .16s linear}
[data-p].pulsa{transform:scale(.985)}   /* acuse: solo un leve hundido; nada de barra roja */

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  border:1px solid var(--line);background:var(--sur2);border-radius:var(--r2);
  padding:10px 15px;font-size:13px;font-weight:600;overflow:hidden;
  transition:background .16s linear,border-color .16s linear,opacity .2s linear}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.pri[disabled]{background:var(--sur2);border-color:var(--line);color:var(--ink3)}
.btn.full{width:100%}
.btn[disabled]{opacity:.55;cursor:not-allowed;pointer-events:none}
.btn.mini{padding:6px 11px;font-size:11.5px;font-weight:500}
.btn.ok{color:var(--ok);border-color:rgba(62,180,137,.45)}
.btn.no{color:var(--red2);border-color:rgba(255,74,79,.45)}

/* ═══ EL MEDIDOR DE PUNTOS ════════════════════════════════════════════════
   Geometría EXACTA de gauge() en app.html: 10 arcos de 36° con 8° de hueco.
   Decisión cerrada: los puntos son enteros, jamás un anillo continuo.
   · secuencia de ENCENDIDO por tramos, con fogonazo de grosor (de la 02a)
   · CHISPA en la marca de cada tramo al prender — lo que más gustó de la 02a
   · los 3 primeros tramos son ZONA CRÍTICA, en ámbar (de la 02b)
   · estrella de marca montada en la punta del arco
   · centrado (de la 06a), no arrinconado
   NO lleva la cota gris al pasar el dedo: molestaba y se ha quitado.
   ═════════════════════════════════════════════════════════════════════════ */
.medcaja{display:flex;flex-direction:column;align-items:center;padding:6px 0 2px}
.med{position:relative;width:172px;height:172px;flex:none}
.med svg.dial{position:absolute;inset:0;width:172px;height:172px;overflow:visible}
.med .fili{transform-box:view-box;transform-origin:86px 86px;opacity:.05;fill:var(--ink);
  animation:giroLento 30s linear infinite}
.med .pista{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:2 5;opacity:.8}
.med .seg{fill:none;stroke-width:8.5;stroke-linecap:round;pathLength:100}
.med .seg.vac{stroke:var(--sur2)}
.med .seg.zc{stroke:rgba(232,145,46,.16)}
.med .seg.on{stroke-dasharray:100;stroke-dashoffset:100;
  transition:stroke-dashoffset .42s var(--sal),stroke-width .42s var(--sal)}
.med.arm .seg.on{stroke-dashoffset:0}
.med.arm .seg.on.fog{stroke-width:11.5}
.med .halo{fill:none;stroke-width:10;opacity:.26;filter:blur(6px)}
.med.late .halo{animation:latido 2.8s ease-in-out infinite}
/* AURA de elegible: el anillo respira y suelta un halo alrededor. Solo cuando lo eres;
   si estuviera siempre, dejaria de significar nada. Se apaga con reduced-motion. */
.med.aura .halo{opacity:.5;stroke-width:13;animation:auralatido 2.2s ease-in-out infinite}
.med.aura::after{content:'';position:absolute;inset:-14px;border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side,rgba(62,180,137,.22),rgba(63,158,214,.13) 62%,transparent 74%);
  animation:aurapulso 2.2s ease-in-out infinite}

@keyframes auralatido{0%,100%{opacity:.42;stroke-width:11}50%{opacity:.72;stroke-width:15}}
@keyframes aurapulso{0%,100%{opacity:.55;transform:scale(.97)}50%{opacity:1;transform:scale(1.04)}}
/* LA FILIGRANA DEL CENTRO NO SE TOCA. La tine de verde y volvia verduzco todo el centro
   del medidor; Daniel se referia a la estrella del INDICADOR (la punta que gira), no a
   esta. Se queda como siempre: fondo al 5 %, gris, girando despacio. */
/* El aura va en la ESTRELLA DEL INDICADOR: la punta de cuatro picos que marca tu posicion.
   Es la que celebra, porque es la que ha llegado hasta ahi. */
.med.aura .tip i{color:var(--ok);
  filter:drop-shadow(0 0 10px rgba(62,180,137,.9)) drop-shadow(0 0 20px rgba(62,180,137,.5));
  animation:estrellaviva 1.8s ease-in-out infinite}
@keyframes estrellaviva{0%,100%{transform:scale(1) rotate(0deg);
    filter:drop-shadow(0 0 8px rgba(62,180,137,.75)) drop-shadow(0 0 16px rgba(62,180,137,.35))}
  50%{transform:scale(1.28) rotate(45deg);
    filter:drop-shadow(0 0 14px rgba(62,180,137,1)) drop-shadow(0 0 28px rgba(62,180,137,.7))}}
@media (prefers-reduced-motion:reduce){
  .med.aura .halo,.med.aura::after,.med.aura .tip i,.med.aura .tk.cierra{animation:none}
}
/* las marcas: una por tramo, FUERA del anillo. Al prender su tramo, chispean. */
.med .tk{stroke:var(--line2);stroke-width:1.7;stroke-linecap:round;transition:stroke .25s linear}
.med .tk.f{stroke:var(--red2)}
.med .tk.chispa{animation:chispazo .5s var(--sal)}
@keyframes chispazo{
  0%{stroke:#fff;stroke-width:3.4;filter:drop-shadow(0 0 9px #fff) drop-shadow(0 0 14px var(--red2))}
  55%{stroke:var(--red2);stroke-width:2.2;filter:drop-shadow(0 0 7px var(--red2))}
  100%{stroke:var(--red2);stroke-width:1.7;filter:none}}
.med .tk.zc.f{stroke:var(--warn)}
/* ⚠️ ESTAS TRES VAN AL FINAL A PROPOSITO. Estaban mas arriba y NO hacian nada: tienen la
   misma especificidad que `.med .tk.zc.f` (cuatro clases), asi que ganaba la de mas abajo
   y la barrita de las 12 seguia naranja con el aura encendida. Si mueves esto hacia arriba,
   vuelve a romperse. */
.med.aura .tk{stroke:rgba(63,158,214,.45)}
.med.aura .tk.f{stroke:var(--tel)}
/* La barrita de las 12 es la primera y la ultima a la vez, como en un reloj: marca donde
   empieza y donde acaba la vuelta. VERDE si y solo si tienes los 10. */
/* Sin `.f` a proposito: la barrita del 9 marca los 9 puntos aunque su tramo siga vacio. */
/* La barrita SIEMPRE a plena opacidad: latia bajando al 80 % y eso no se lee como «vivo»,
   se lee como APAGADO. (Daniel: «se ve opaco».) Lo que late es el resplandor, no la barra.
   Y se engorda un poco menos: 2,4 en vez de 2,8, que a 1,7 de las demas cantaba. */
.med.aura .tk.cierra{stroke:var(--ok);stroke-width:2.4;opacity:1;
  animation:barrita12 2.2s ease-in-out infinite}
@keyframes barrita12{
  0%,100%{filter:drop-shadow(0 0 3px rgba(62,180,137,.7))}
  50%{filter:drop-shadow(0 0 9px rgba(62,180,137,1)) drop-shadow(0 0 16px rgba(62,180,137,.45))}}
.med .tip{position:absolute;inset:0;transform:rotate(0deg);pointer-events:none;
  transition:transform .8s var(--arco)}
.med .tip i{position:absolute;left:50%;top:2px;margin-left:-8px;width:16px;height:16px;display:block;
  color:var(--red2);filter:drop-shadow(0 0 8px rgba(255,74,79,.75))}
.med .tip i svg{width:16px;height:16px;fill:currentColor}
.med .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;pointer-events:none}
.med .mid .n{font-family:var(--mono);font-size:44px;font-weight:600;letter-spacing:-.045em;line-height:1}
.med .mid .n small{font-size:16px;color:var(--ink3);letter-spacing:-.02em}
.med .mid .u{font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;color:var(--ink3);margin-top:5px}
.pips{display:flex;gap:4px;margin-top:13px;width:100%}
.pips i{flex:1;height:4px;border-radius:2px;background:#2C2527;display:block}
.pips i.on{background:var(--ok);box-shadow:0 0 7px rgba(62,180,137,.5)}
.pips i.zc{background:var(--warn);box-shadow:0 0 7px rgba(232,145,46,.5)}
.medley{margin-top:11px;font-size:11.5px;color:var(--ink2);text-align:center;line-height:1.5}
.medley b{color:var(--ink)}
.libro{overflow:hidden;height:0;transition:height .42s var(--sal)}
.retf{display:flex;align-items:center;gap:11px;padding:9px 2px;border-top:1px solid var(--line);font-size:12px}
.retf .pt{font-family:var(--mono);font-size:15px;font-weight:600;color:var(--red2);flex:none;width:26px}
.retf .pt.mas{color:var(--ok)}
.retf .mo{flex:1;min-width:0} .retf .mo b{display:block;font-size:12.5px;font-weight:600}
.retf .mo small{color:var(--ink3);font-size:10.5px;font-family:var(--mono);letter-spacing:.05em}
.retf .vv{font-size:10px;color:var(--ink3);text-align:right;line-height:1.35;flex:none}

/* ═══ BARRA DE HORAS ASINTÓTICA ═══════════════════════════════════════════
   Lo que pidió Daniel: cuantas más horas, más a la derecha — pero NUNCA se
   sale ni se rompe. Mapeo saturante w(h)=100·(1−e^(−h/K)); el objetivo y la
   media pasan por el MISMO mapeo, así siguen significando lo mismo.
   Tres capas: confirmadas (sólido) · otorgadas (sólido claro) · pendientes
   (rayado ámbar — lo pendiente NO suma, y se ve que no suma).
   ═════════════════════════════════════════════════════════════════════════ */
.barh{position:relative;height:22px;margin:13px 0 8px;border-radius:6px;background:#0A0909;
  border:1px solid var(--line);overflow:hidden}
.barh i{position:absolute;top:0;bottom:0;left:0;width:0;transition:width 1s var(--sal),left 1s var(--sal)}
.barh i.conf{background:linear-gradient(90deg,#2C8F6C,var(--ok))}
.barh i.otor{background:linear-gradient(90deg,#2C8F6C,var(--ok))}
.barh i.pend{background:repeating-linear-gradient(45deg,rgba(232,145,46,.9) 0 3px,transparent 3px 6px);
  border-left:1px solid rgba(232,145,46,.55)}
.barh .mk{position:absolute;top:-1px;bottom:-1px;width:2px;background:var(--ink);opacity:.85;
  transition:left 1s var(--sal);border-radius:1px}
.barh .mk.med{background:var(--ink3);width:1px}
.barhet{position:relative;height:15px;font-family:var(--mono);font-size:8.5px;color:var(--ink3);
  letter-spacing:.05em}
.barhet span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap;transition:left 1s var(--sal)}
.leyh{display:flex;flex-wrap:wrap;gap:5px 13px;font-size:10px;font-family:var(--mono);
  letter-spacing:.05em;color:var(--ink3);margin-top:9px}
.leyh i{width:10px;height:7px;border-radius:2px;display:inline-block;vertical-align:-1px;margin-right:5px}

/* cifras grandes de horas */
.cifh{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.cifh .g{font-family:var(--mono);font-size:38px;font-weight:600;letter-spacing:-.04em;line-height:1}
.cifh .g.late{animation:muelle .55s var(--arco)}
@keyframes muelle{0%{transform:scale(1)}38%{transform:scale(1.09)}100%{transform:scale(1)}}
.pil{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  padding:3px 8px;border-radius:20px;border:1px solid;white-space:nowrap}
.pil.pend{color:var(--warn);border-color:rgba(232,145,46,.45);background:rgba(232,145,46,.09)}
.pil.otor{color:var(--ok);border-color:rgba(62,180,137,.42);background:rgba(62,180,137,.08)}
.pil.conf{color:var(--ok);border-color:rgba(62,180,137,.42);background:rgba(62,180,137,.08)}
.pil.no{color:var(--red2);border-color:rgba(255,74,79,.42);background:rgba(228,30,37,.09)}
.pil.neu{color:var(--ink2);border-color:var(--line);background:var(--sur2)}

/* ═══ DELTAS — vs mes anterior · objetivo · equipo · subsistema ═══════════ */
.dlt{display:grid;grid-template-columns:76px 1fr 82px;gap:9px;align-items:center;padding:7px 0}
.dlt+.dlt{border-top:1px dashed rgba(50,44,46,.85)}
.dlt .k{font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.dlt .tr{position:relative;height:16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  background:repeating-linear-gradient(90deg,transparent 0 11px,rgba(50,44,46,.7) 11px 12px)}
.dlt .tr .z{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--ink3)}
.dlt .tr .f{position:absolute;top:4px;height:8px;width:0;left:50%;border-radius:2px;
  transition:width .9s var(--sal),left .9s var(--sal)}
.dlt.pos .tr .f{background:linear-gradient(90deg,rgba(62,180,137,.25),var(--ok))}
.dlt.neg .tr .f{background:linear-gradient(270deg,rgba(255,74,79,.25),var(--red2))}
.dlt .tr .m{position:absolute;top:50%;left:50%;width:9px;height:9px;border-radius:2px;background:var(--ink);
  transform:translate(-50%,-50%) rotate(45deg);box-shadow:0 0 8px rgba(255,255,255,.35);
  transition:left .9s var(--sal)}
.dlt .vv{text-align:right;font-family:var(--mono);font-size:12.5px;line-height:1.2}
.dlt .rr{display:block;font-size:8px;color:var(--ink3);letter-spacing:.04em;line-height:1.4}
.up{color:var(--ok)} .dn{color:var(--red2)}

/* ═══ FICHAR ══════════════════════════════════════════════════════════════ */
.modos{display:flex;border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;margin-bottom:12px}
/* convocar: subsistemas, invitados con autocompletado y horario por día */
.cmix{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px}
.cmixb{font-family:var(--mono);font-size:10.5px;padding:5px 10px;border-radius:20px;border:1px solid var(--line);
  color:var(--ink2);background:var(--sur2)}
.cmixb.on{color:#fff;border-color:var(--red);background:rgba(228,30,37,.18)}
.cchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.cchip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:4px 6px 4px 10px;border-radius:20px;
  border:1px solid var(--line);background:var(--sur2);color:var(--ink)}
.cchip button{color:var(--ink3);font-size:14px;line-height:1;padding:0 2px}
.csug{position:relative;border:1px solid var(--line);border-radius:9px;background:#0A0909;margin:-6px 0 10px;overflow:hidden}
.csug div{padding:8px 11px;font-size:12.5px;border-top:1px solid var(--line)}
.csug div:first-child{border-top:0}
.csug small{color:var(--ink3);margin-left:6px}
.cdias{display:flex;flex-direction:column;gap:6px;margin-bottom:11px}
.drow{display:flex;align-items:center;gap:7px;font-size:12px}
.drow span{flex:1;font-size:12px;color:var(--ink);text-transform:capitalize}
.drow select{background:#0A0909;border:1px solid var(--line);border-radius:7px;padding:5px 7px;color:var(--ink);font:inherit;font-size:11.5px}
.drow.off{opacity:.42}
.dtog{width:26px;height:26px;flex:none;border-radius:8px;border:1px solid var(--line);background:var(--sur2);position:relative}
.dtog::after{content:'';position:absolute;inset:7px;border-radius:3px;background:var(--ink3)}
.dtog.on{background:rgba(228,30,37,.16);border-color:var(--red)}
.dtog.on::after{background:var(--red)}
.drow{padding:5px 0;border-bottom:1px solid var(--line)}
.drow:last-child{border-bottom:0}
.modos button{flex:1;border-right:1px solid var(--line);padding:10px 4px;font-family:var(--mono);
  font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);
  transition:background .16s linear,color .16s linear}
.modos button:last-child{border-right:0}
.modos button.on{background:rgba(228,30,37,.12);color:var(--ink);box-shadow:inset 0 -2px 0 var(--red)}

/* sesión en vivo */
.sesion{display:flex;flex-direction:column;align-items:center;padding:14px 0 4px}
.sesion .rel{font-family:var(--mono);font-size:48px;font-weight:600;letter-spacing:-.05em;line-height:1}
.sesion .rel .c{animation:parpadeo 1s steps(2,start) infinite}
.sesion.pausada .rel{color:var(--ink3)}
.sesion.larga .rel{color:var(--warn)}
.sesion .est{margin-top:9px;display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink3)}
.sesion .est .d{width:7px;height:7px;border-radius:50%;background:var(--ink3);flex:none}
.sesion.corre .est .d{background:var(--red);animation:latido 1.9s ease-in-out infinite}
.sesion.corre .est{color:var(--red2)}
.sesion.pausada .est .d{background:var(--warn);animation:none}
.sesion.larga .est{color:var(--warn)}
.sesbtn{display:flex;gap:8px;margin-top:14px}
.sesbtn .btn{flex:1}
.avisolargo{margin-top:11px;padding:10px 12px;border-radius:var(--r2);font-size:11.5px;line-height:1.5;
  border:1px solid rgba(232,145,46,.4);background:rgba(232,145,46,.08);color:#f0d3a4}
.avisolargo b{color:var(--warn)}

/* campos */
.campo{display:flex;flex-direction:column;gap:6px;margin-bottom:11px}
.campo>.sc{display:flex;align-items:center;gap:6px}
.campo .req{color:var(--red2)}
.campo input,.campo select,.campo textarea{background:#0A0909;border:1px solid var(--line);
  border-radius:var(--r2);color:var(--ink);font-family:var(--sans);font-size:13.5px;padding:10px 11px;
  width:100%;outline:0;transition:border-color .18s linear,box-shadow .18s linear}
.campo input.mono,.campo select{font-family:var(--mono);font-size:13px}
.campo textarea{resize:vertical;min-height:74px;line-height:1.5}
.campo input:focus,.campo select:focus,.campo textarea:focus{border-color:var(--line2);
  box-shadow:0 0 0 3px rgba(228,30,37,.11)}
.campo input::placeholder,.campo textarea::placeholder{color:var(--ink3)}
.dosc{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* selector de horas: de/a en pasos de 15 min + duración calculada */
.selh{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end}
.selh .flecha{padding-bottom:12px;color:var(--ink3);font-family:var(--mono)}
.durb{margin-top:10px;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r2);
  border:1px solid var(--line);background:var(--sur2)}
.durb .q{font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:-.03em}
.durb .t{font-size:11.5px;color:var(--ink2);line-height:1.4}
.pasos{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.pasos button{border:1px solid var(--line);border-radius:20px;padding:5px 11px;font-family:var(--mono);
  font-size:11px;color:var(--ink2);transition:border-color .15s linear,color .15s linear}
.pasos button:hover{border-color:var(--line2);color:var(--ink)}

/* ── EL ANILLO DE LA JUSTIFICACIÓN ───────────────────────────────────────
   El contador de texto es un instrumento, no un número gris: el aro se
   rellena mientras escribes (0/25) y cierra al llegar. De la 04a el aro; de
   la 03b la lectura «cuánto te queda» en vez de «cuánto llevas».
   ─────────────────────────────────────────────────────────────────────── */
.justfila{display:flex;align-items:center;gap:11px;margin-top:-3px}
.aroJ{position:relative;width:38px;height:38px;flex:none}
.aroJ svg{width:38px;height:38px;transform:rotate(-90deg)}
.aroJ .f{fill:none;stroke:var(--sur2);stroke-width:3.4}
.aroJ .p{fill:none;stroke:var(--warn);stroke-width:3.4;stroke-linecap:round;
  stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset .34s var(--sal),stroke .3s linear}
.aroJ.ok .p{stroke:var(--ok)}
.aroJ .n{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);
  font-size:9.5px;color:var(--ink3)}
.aroJ.ok .n{color:var(--ok)}
.justfila .tx{font-size:11.5px;color:var(--ink3);line-height:1.45}
.justfila .tx b{color:var(--ink2)}

/* ── LA CONSTELACIÓN DE REQUISITOS ───────────────────────────────────────
   Lo mejor de la 03a: la regla de negocio DIBUJADA. Tres nodos —duración,
   imputación, justificación— que se encienden, y dos aristas que solo cierran
   cuando sus dos extremos están encendidos. Hasta que la figura no cierra, el
   botón no es un botón. Aquí las aristas van con la estrella de marca.
   ─────────────────────────────────────────────────────────────────────── */
.const{position:relative;height:76px;margin:16px 0 2px}
.const svg.ar{position:absolute;inset:0;width:100%;height:76px;overflow:visible}
.const svg.ar path{fill:none;stroke:var(--red2);stroke-width:1.2;stroke-linecap:round;opacity:.55;
  stroke-dasharray:var(--L,80);stroke-dashoffset:var(--L,80);
  transition:stroke-dashoffset .55s var(--sal),opacity .3s linear}
.const svg.ar path.on{stroke-dashoffset:0;opacity:.9}
.const .nodo{position:absolute;top:8px;transform:translateX(-50%);display:flex;flex-direction:column;
  align-items:center;gap:7px;width:104px;text-align:center}
.const .nodo .es{width:19px;height:19px;color:#3A3032;
  transition:color .4s var(--sal),transform .55s var(--arco),filter .4s linear}
.const .nodo .es svg{width:19px;height:19px;fill:currentColor;display:block}
.const .nodo.on .es{color:var(--red2);transform:rotate(90deg);filter:drop-shadow(0 0 9px rgba(255,74,79,.85))}
.const .nodo span{font-family:var(--mono);font-size:8.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink3);line-height:1.4}
.const .nodo.on span{color:var(--ink2)}
.const .nodo em{font-style:normal;font-size:9px;color:var(--ink3);opacity:.75}
.figcierra{font-size:11.5px;margin:9px 2px 0;display:flex;align-items:center;gap:7px;color:var(--warn)}
.figcierra.ok{color:var(--ok)}
.figcierra .es{width:11px;height:11px;flex:none}
.figcierra .es svg{width:11px;height:11px;fill:currentColor;display:block}

/* ruta de aprobación */
.ruta{display:flex;gap:10px;padding:11px 12px;border-radius:var(--r2);margin:12px 0 0;
  border:1px solid var(--line);border-left:2px solid var(--tel);background:rgba(63,158,214,.055)}
.ruta .cu{flex:1;min-width:0}
.ruta b{font-size:12.5px}
.ruta p{margin:3px 0 0;font-size:11.5px;color:var(--ink2);line-height:1.5}
.ruta .esc{display:block;margin-top:5px;font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:var(--warn)}

/* ── FILAS DE DATO ───────────────────────────────────────────────────────── */
.fila{display:flex;align-items:center;gap:11px;padding:10px 0}
.fila+.fila{border-top:1px solid rgba(50,44,46,.75)}
.fila .a{flex:1;min-width:0}
.fila .a b{display:block;font-size:13px;font-weight:600}
.fila .a small{display:block;font-size:11px;color:var(--ink3);margin-top:2px;line-height:1.45}
.fila .d{text-align:right;white-space:nowrap;font-family:var(--mono);font-size:12.5px}
.fila.clic{cursor:pointer}
.fila .chev{color:var(--ink3);flex:none}
.borde-ok{border-left:2px solid var(--ok);padding-left:10px;margin-left:-12px}
.borde-pe{border-left:2px solid var(--warn);padding-left:10px;margin-left:-12px}
.borde-ot{border-left:2px solid var(--tel);padding-left:10px;margin-left:-12px}
.borde-no{border-left:2px solid var(--red2);padding-left:10px;margin-left:-12px}

/* avisos del home: dinámicos y clicables (decisión cerrada de la app) */
.aviso{display:flex;gap:10px;padding:11px 12px;border-radius:var(--r2);margin-bottom:9px;
  align-items:flex-start;border:1px solid rgba(232,145,46,.34);background:rgba(232,145,46,.07);
  cursor:pointer}
.aviso.mal{border-color:rgba(255,74,79,.34);background:rgba(228,30,37,.075)}
.aviso .ic{flex:none;margin-top:1px;color:var(--warn)} .aviso.mal .ic{color:var(--red2)}
.aviso .ic svg{width:15px;height:15px;display:block}
.aviso b{display:block;font-size:12.5px;margin-bottom:2px}
.aviso p{margin:0;font-size:11.5px;color:var(--ink2);line-height:1.5}
.aviso .chev{margin-left:auto;align-self:center;color:var(--ink3);font-family:var(--mono)}

/* ── ESTADO VACÍO / CARGANDO — el radar ──────────────────────────────────
   Gustó el radar mientras carga. Regla nueva: el radar es LA ESPERA. Cuando
   se confirma que no hay nada, el radar PARA y el texto dice exactamente qué
   no se encontró. Un radar girando para siempre miente.
   ─────────────────────────────────────────────────────────────────────── */
.vacio{padding:26px 14px 22px;text-align:center}
.vacio .rad{width:78px;height:78px;margin:0 auto 15px;border:1px solid var(--line);border-radius:50%;
  position:relative;overflow:hidden;background:radial-gradient(circle,rgba(228,30,37,.05),transparent 70%)}
.vacio .rad::after{content:"";position:absolute;inset:0;
  background:conic-gradient(from 0deg,rgba(228,30,37,.45),transparent 30%);
  animation:giroLento 2.2s linear infinite}
.vacio .rad i{position:absolute;inset:27%;border:1px solid var(--line);border-radius:50%}
.vacio .rad u{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line)}
.vacio.quieto .rad::after{animation:none;background:none}
.vacio.quieto .rad{border-style:dashed;opacity:.6}
.vacio h4{margin:0 0 7px;font-family:var(--mono);font-size:11px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink2);font-weight:500}
.vacio p{margin:0 auto;max-width:275px;font-size:12px;color:var(--ink3);line-height:1.6}
.vacio .sc{display:block;margin-top:13px}

/* ── ranking CENSURADO: ves tu puesto y a tus vecinos, nunca los nombres ─── */
.rank .r{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:12.5px}
.rank .r+.r{border-top:1px solid rgba(50,44,46,.65)}
.rank .p{width:26px;font-family:var(--mono);font-size:11px;color:var(--ink3)}
.rank .cens{flex:1;height:9px;border-radius:5px;
  background:repeating-linear-gradient(90deg,#2C2527 0 7px,#211B1D 7px 12px)}
.rank .r.yo{background:linear-gradient(90deg,rgba(228,30,37,.11),transparent);margin:0 -8px;
  padding:8px;border-radius:var(--r2)}
.rank .r.yo .n{flex:1;font-weight:600;color:var(--red2)}
.rank .r.yo .p{color:var(--red2)}
.rank .h{font-family:var(--mono);font-size:11.5px;color:var(--ink2)}

/* recibo de cuota */
.rl{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--ink2);padding:4px 0}
.rl .ra{font-family:var(--mono);color:var(--ink);font-weight:600;white-space:nowrap}
.rl.desc .ra{color:var(--ok)}
.rnota{font-size:11px;color:var(--ink3);margin-top:8px;line-height:1.5}

/* ═══ BARRA DE 7 · LA ESTRELLA QUE VIAJA ══════════════════════════════════
   Decisión cerrada: el indicador viaja en ARCO con la comba PROPORCIONAL a la
   distancia. Dos planos (06b): la estrella vuela y su sombra se queda abajo,
   se ensancha y se difumina. Añadido pedido: un brillito extra al aterrizar.
   ═════════════════════════════════════════════════════════════════════════ */
nav{flex:none;position:relative;height:70px;display:flex;align-items:stretch;z-index:20;
  background:rgba(24,22,22,.97);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
.estela{position:absolute;left:0;top:0;width:100%;height:40px;pointer-events:none;overflow:visible;z-index:3}
.estela path{fill:none;stroke:var(--red2);stroke-width:1.3;stroke-linecap:round;opacity:0}
@keyframes estelaAnim{0%{stroke-dashoffset:var(--L);opacity:.85}55%{stroke-dashoffset:0;opacity:.4}
  100%{stroke-dashoffset:0;opacity:0}}
.viaje,.sombra{position:absolute;left:0;top:0;pointer-events:none;transform:translateX(0);
  transition:transform .4s var(--arco)}
.viaje{z-index:5}
.sombra{top:9px;z-index:2}
.viaje i,.sombra i{display:block;position:absolute;top:0}
.viaje i{width:17px;height:17px;left:-8.5px;color:var(--red2)}
.viaje i svg{width:17px;height:17px;fill:currentColor;display:block;
  filter:drop-shadow(0 0 7px rgba(255,74,79,.8))}
.sombra i{width:18px;height:4px;left:-9px;border-radius:50%;background:rgba(0,0,0,.55);filter:blur(3px)}
.viaje.vuela i{animation:arcoY .4s var(--arco)}
.sombra.vuela i{animation:arcoS .4s var(--arco)}
@keyframes arcoY{50%{transform:translateY(var(--comba,-26px)) scale(1.5) rotate(120deg);
  filter:drop-shadow(0 15px 10px rgba(0,0,0,.5)) drop-shadow(0 0 12px rgba(228,30,37,.85))}}
@keyframes arcoS{50%{transform:scale(2.2,.5);opacity:.28;filter:blur(6px)}}
/* el brillito de aterrizaje: 4 chispas que salen y se apagan */
.chispas{position:absolute;top:0;left:0;width:0;height:0;pointer-events:none;z-index:6}
.chispas b{position:absolute;left:0;top:8px;width:3px;height:3px;border-radius:50%;
  background:var(--red2);box-shadow:0 0 6px var(--red2);opacity:0}
.chispas.on b{animation:chispita .46s var(--sal) forwards}
.chispas.on b:nth-child(1){--dx:-13px;--dy:-9px;animation-delay:0s}
.chispas.on b:nth-child(2){--dx:12px;--dy:-11px;animation-delay:.03s}
.chispas.on b:nth-child(3){--dx:-8px;--dy:-15px;animation-delay:.05s}
.chispas.on b:nth-child(4){--dx:7px;--dy:-16px;animation-delay:.02s}
@keyframes chispita{0%{opacity:1;transform:translate(0,0) scale(1)}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3)}}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  padding:12px 0 9px;font-family:var(--mono);font-size:7.5px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink3);position:relative;transition:color .18s linear}
.tab svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--ink)} .tab.on svg{stroke:var(--red2)}
.tab .nb{position:absolute;top:7px;right:calc(50% - 18px);min-width:15px;height:15px;padding:0 4px;
  border-radius:8px;background:var(--red);color:#fff;font-size:8.5px;font-weight:700;line-height:15px;
  text-align:center;box-shadow:0 0 0 1.5px rgba(24,22,22,.95)}
.tab .nb.wa{background:var(--warn);color:#241a08}

/* aviso flotante */
.tost{position:absolute;left:50%;bottom:84px;transform:translate(-50%,10px);z-index:40;
  background:var(--sur2);border:1px solid var(--line);border-left:2px solid var(--red);
  border-radius:var(--r2);padding:9px 14px;font-size:12px;opacity:0;pointer-events:none;
  transition:opacity .2s linear,transform .28s var(--sal);max-width:86%;text-align:center;
  box-shadow:0 12px 30px rgba(0,0,0,.5)}
.tost.on{opacity:1;transform:translate(-50%,0)}

/* ═══ MODAL — mismo patrón que app.html (#modal + #modal-body) ═══════════ */
.modal{position:absolute;inset:0;background:rgba(0,0,0,.66);display:none;z-index:50;
  align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.modal .card{background:var(--sur);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;
  max-height:92%;overflow-y:auto;padding:20px 16px 26px;position:relative;
  animation:sube .3s var(--sal)}
@keyframes sube{from{transform:translateY(26px);opacity:.4}to{transform:none;opacity:1}}
.modal .x{position:absolute;top:11px;right:11px;width:30px;height:30px;border-radius:50%;
  background:var(--sur2);border:1px solid var(--line);color:var(--ink2);font-size:13px;z-index:3}
.mtit{font-size:18px;font-weight:700;letter-spacing:-.015em;margin:0 34px 3px 0}
.msub{font-size:12px;color:var(--ink3);margin-bottom:12px;line-height:1.5}
.modal .card h4{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink3);margin:16px 0 7px;font-weight:500}
ul.obj{margin:0;padding-left:17px}
ul.obj li{font-size:12.5px;color:var(--ink2);line-height:1.55;margin-bottom:5px}

/* ═══ CAJÓN PLEGABLE (tareas finalizadas, turnos pasados, lote) ══════════ */
.cajon{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;margin-top:9px;
  border:1px solid var(--line);border-radius:var(--r2);background:var(--sur);font-size:12.5px;
  font-weight:600;color:var(--red2)}
.cajon svg{width:15px;height:15px;transition:transform .3s var(--sal);fill:none;stroke:currentColor;stroke-width:2.4}
.cajon.ab svg{transform:rotate(180deg)}
.cajon b{color:var(--ink2);font-weight:600}
/* menu de los tres puntos: lo que no es tarea diaria no ocupa sitio en la barra */
.kebab{position:relative;z-index:901;background:#141212;border:1px solid var(--line);border-radius:9px;color:var(--ink2);
  width:34px;height:34px;display:grid;place-items:center;cursor:pointer;font-size:16px;line-height:1}
.kebab:active{background:rgba(255,255,255,.06)}
.menu{position:fixed;inset:0;z-index:900;background:rgba(0,0,0,.35);display:none}
.menu.on{display:block}
/* Cuelga por DEBAJO del boton (la posicion se calcula al abrir): antes se pintaba encima
   y tapaba los propios tres puntos, que es justo lo que no debe pasar. */
.menu .caja{position:absolute;min-width:216px;
  background:#141212;border:1px solid var(--line);border-radius:13px;overflow:hidden;
  box-shadow:0 14px 40px rgba(0,0,0,.55)}
.menu button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;
  border-bottom:1px solid var(--line);color:var(--ink);font:inherit;font-size:13.5px;
  padding:13px 15px;text-align:left;cursor:pointer}
.menu button:last-child{border-bottom:0}
.menu button:active{background:rgba(255,255,255,.05)}
.menu button[disabled]{color:var(--ink3);cursor:default}
.menu button small{display:block;color:var(--ink3);font-size:11.5px;margin-top:3px}
/* Ajustes se lee de cerca y con una mano: texto mayor que el del resto de la app */
.ajus{font-size:14px;line-height:1.65;color:var(--ink2)}
.ajus h4{font-size:13px;margin:16px 0 8px}
.ajus .tarj p,.ajus .rnota{font-size:13.5px;line-height:1.6}
.ajus .btn{font-size:14px;padding:13px}
/* tu fila del reparto: un realce sobrio, en vez de repetir tu cargo en una pildora */
.fila.yo{background:rgba(228,30,37,.09);border-left:2px solid var(--red);padding-left:9px;margin-left:-11px;
  border-radius:0 6px 6px 0}
/* memoria del turno incrustada, con hechuras de documento */
.doc{margin-top:13px;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#0A0909}
.doc .dh{display:flex;align-items:center;gap:9px;padding:10px 12px;border-bottom:1px solid var(--line)}
.doc .dh b{font-size:12.5px}
.doc .dh small{display:block;color:var(--ink3);font-family:var(--mono);font-size:10px}
.doc .dp{height:104px;background:linear-gradient(#141212,#0A0909);position:relative;overflow:hidden}
.doc .dp i{position:absolute;left:14px;right:14px;height:5px;border-radius:3px;background:rgba(255,255,255,.07)}
/* visor incrustado: alto contenido, el zoom lo pone el propio visor de Drive */
.doc .dv{width:100%;height:52vh;min-height:280px;border:0;display:block;background:#2a2526}
.doc .dcar{padding:26px 12px;text-align:center;color:var(--ink3);font-size:12px;line-height:1.6}
.doc .da{display:block;padding:9px 12px;text-align:center;font-family:var(--mono);font-size:11px;
  color:var(--red2);border-top:1px solid var(--line);text-decoration:none}
.cajsec{max-height:0;overflow:hidden;transition:max-height .45s var(--sal)}
.cajsec.on{max-height:20000px}   /* 3000px cortaba la lista con 20+ turnos */

/* ═══ REJILLA DE DISPONIBILIDAD (cubrir · arrastre) ══════════════════════ */
.rejw{overflow-x:auto;margin:0 2px;padding-bottom:3px}
.rej{display:grid;gap:2px;touch-action:none;user-select:none}
.rc{font-family:var(--mono);font-size:8.5px;color:var(--ink3);display:flex;align-items:center;justify-content:center}
.rc.rd{justify-content:flex-end;padding-right:6px;white-space:nowrap;font-size:9.5px;color:var(--ink2);
  position:sticky;left:0;background:var(--sur);z-index:2}
.rc.rh{position:relative;overflow:visible;align-items:flex-start;min-height:15px}
/* decisión cerrada: la etiqueta va al LÍMITE izquierdo de la celda = hora de inicio */
.rc.rh span{position:absolute;left:0;top:2px;transform:translateX(-50%);white-space:nowrap;font-size:8.5px}
.rc.rh span.fin{left:auto;right:0;transform:none}
.ecel{height:27px;border-radius:3px;background:var(--sur2);cursor:pointer}
.ecel.on1{background:var(--tel)}          /* telemático */
.ecel.on2{background:var(--red)}          /* presencial + telemático */
.ecel.prev{outline:2px solid var(--red2);outline-offset:-1px}
.ecel.off{background:transparent;border:1px solid var(--line);opacity:.4;cursor:default}
.celc{height:23px;border-radius:2px;display:grid;place-items:center;font-family:var(--mono);
  font-size:8.5px;font-weight:600;color:#fff}
.celc.best{outline:1px solid var(--ink);outline-offset:-1px}
.celc.fij{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.92)}

/* ═══ COLA DE SANCIONES · BLOQUES (Panel PD) ════════════════════════════ */
.lote{background:var(--sur);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.lote.rev{border-left:3px solid var(--ok)}
.lote-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:13.5px}
.lote-m{font-size:12px;color:var(--ink2);margin-top:4px;line-height:1.45}
.lrow{display:flex;align-items:center;gap:9px;padding:9px 0;border-top:1px solid rgba(50,44,46,.8);flex-wrap:wrap}
.lrow .nm{flex:1;min-width:90px;font-size:13px;font-weight:600}
.lrow .vl{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--red2)}
.lrow .vl.tach{opacity:.4;text-decoration:line-through}
.decs{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.decs button{border-right:1px solid var(--line);padding:6px 10px;font-size:11.5px;font-weight:600;
  color:var(--ink3);white-space:nowrap}
.decs button:last-child{border-right:0}
.decs button.on.a{background:var(--ok);color:#fff}
.decs button.on.j{background:var(--ink2);color:#1a1616}
.decs button.on.r{background:var(--red2);color:#fff}
.cierre{margin-top:11px;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r2);
  background:rgba(127,127,127,.05)}
.cierre .tx{font-size:12.5px;color:var(--ink2)}
.cierre em{display:block;font-style:normal;font-size:11px;color:var(--ink3);margin-top:6px;line-height:1.45}

/* conmutador de rol (solo de la maqueta) */
.rolsel{display:flex;gap:5px;border:1px solid var(--line);border-radius:20px;padding:3px;background:var(--sur2)}
.rolsel button{padding:4px 10px;border-radius:16px;font-family:var(--mono);font-size:9px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.rolsel button.on{background:var(--red);color:#fff}

@keyframes giroLento{to{transform:rotate(360deg)}}
@keyframes latido{0%,100%{opacity:.5;transform:scale(.94)}50%{opacity:1;transform:scale(1)}}
@keyframes parpadeo{50%{opacity:.25}}
.entra{animation:entra .34s var(--sal) both}
@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ═══ MOVIMIENTO REDUCIDO — se apaga lo decorativo, se conserva lo que
   TRANSMITE ESTADO (colores, encendidos, posición del indicador). ════════ */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;
    transition-duration:.001ms !important}
  .med .fili,.vacio .rad::after,.estela,.chispas,.sombra{display:none}
  .sesion .rel .c{animation:none}
}
</style>
</head>

       identidad, panel, tareas, turnos y documentos: con eso hay pantalla. Lo demas cae
       despues, en PARALELO, y se repinta segun llega. */
    var g=document.getElementById('loginGate'); if(g) g.remove();
    var bs=$('#btnSalir'); if(bs) bs.style.display='';     // sí hay salir/cambiar de cuenta
    _pintarVerComo_();                                     // admin (solaris@): selector «ver como»; resto: sin conmutador
    if(esAdmin() && YO){ _partesAdmin=null; try{ PARTES=await _partesDe_(YO.nombre); }catch(_){} }   // admin: partes del miembro elegido
    // el backend NO sirve el detalle de movimientos de puntos: vaciamos la semilla (era ficticia,
    // enseñaba los de otra persona). Se muestra vacío hasta que haya fuente real.
    if(typeof MOVS!=='undefined') MOVS.length=0;
    _pintarCabecera_();                                    // la cabecera muestra al miembro (real o «visto como»)
    pintar();
    _arrancarRefrescoVivo_();                              // a partir de aqui se alimenta sola
    /* Las que faltan van a la vez y sin bloquear, pero se repinta UNA SOLA VEZ al final.
       Con un `pintar()` por carga, la pantalla se rehacia tres veces seguidas nada mas
       entrar: como `pintar()` reconstruye `#main`, cada repintado pierde el scroll y lo que
       tuvieras abierto, y se ve como si la app se recargara sola. (Daniel: «te hace refresh
       y se buguea la vista».) Ninguna espera a las otras para cargar; solo se junta el
       repintado. Y si una falla, `Promise.all` no se cae: cada una ya traga su error. */
    Promise.all([_cargarMisPartes_(), _cargarFichajeAbierto_(), _cargarReunionesM_()])
      .then(function(){ _repintarSuave_(); });
  }catch(e){
    if(_silente){ try{ localStorage.removeItem('sol_sess'); }catch(_){} _arrancarGis_(); return; }
    _gate_(SPLASH+'<div style="color:#ffb3b0;max-width:340px">No se pudo entrar: '+

    var b=document.getElementById('reGis'); if(b) b.onclick=_pintarLogin_;
  }
}

/* ═══════════════════════════════════════════════════════════════════════════
   EL MEDIDOR DE PUNTOS — geometría de gauge(): 10 arcos de 36°, hueco de 8°
   ═══════════════════════════════════════════════════════════════════════════ */
var MC=86, MR=62, MGAP=8, MSTEP=36;
/* Nudge de la estrella de la punta (pedido por Daniel 25/07): +3,5° en sentido horario
   —la aleja del final del arco y la inclina a la vez, porque va dentro del .tip que gira—
   y un poco más de radio en el CSS (.tip i top). */
var MTIP=3.5;
function arcoSeg(i,r){
  var a0=(-90+i*MSTEP+MGAP/2)*Math.PI/180, a1=(-90+(i+1)*MSTEP-MGAP/2)*Math.PI/180;
  return 'M'+(MC+r*Math.cos(a0)).toFixed(2)+' '+(MC+r*Math.sin(a0)).toFixed(2)+
         ' A'+r+' '+r+' 0 0 1 '+(MC+r*Math.cos(a1)).toFixed(2)+' '+(MC+r*Math.sin(a1)).toFixed(2);
}
function estadoPts(p){return p<=2?'evaluacion':(p>=9?'elegible':'normal');}
/* COLOR DE CADA TRAMO DEL MEDIDOR (decisión de Daniel, 27/07).
   Al ser ELEGIBLE el anillo deja de ser rojo: los tramos del medio pasan a AZUL y los dos
   últimos —9/10 y 10/10— a VERDE, que es lo que se está celebrando.
   OJO con la corrección del 27/07: el verde de los 10/10 va en la BARRITA RECTA de las 12
   (ver `_colorTick_`), no en el arco. Aquí el tramo de las 12 es azul como los demás: no
   es un caso especial. Los arcos son las curvas; los ticks, las rectas de fuera. */
function _colorSeg_(i, p){
  var eleg = p>=9;
  if(!eleg) return (i<3 && p<=3) ? 'url(#gWa)' : 'url(#gRed)';
  /* Las DOS ULTIMAS curvas van VERDES; las del medio, azules. */
  return (i>=8) ? 'url(#gVer)' : 'url(#gAzu)';
}
/* LA BARRITA DE LAS 12 es la primera y la última a la vez, como en un reloj: marca dónde
   empieza y dónde acaba la vuelta. Se pone verde SI Y SOLO SI tienes los 10; con 9 sigue
   azul, porque la vuelta no está cerrada. */
function _colorTick_(i, p){
  if(p<9) return '';                       // sin elegibilidad manda el CSS de siempre
  /* Cada barrita marca UNA cifra, y se enciende cuando esa cifra se alcanza:
       · la del 9  -> con 9 puntos (y sigue con 10);
       · la de las 12, que es a la vez la 0 y la 10 -> solo con los 10, la vuelta cerrada.
     OJO: la del 9 NO tiene la clase `f` con 9 puntos, porque `f` marca el tramo que
     ARRANCA en ella y ese tramo aun no esta lleno. Por eso el CSS del verde no puede
     colgar de `.f`. */
  if(i===9) return 'cierra';                              // 9 y 10
  if(i===0 && p>=10) return 'cierra';                     // solo 10
  return 'eleg';
}
function medidorHTML(){
  var p=YO.puntos, segs='', ticks='', halo='', i;
  for(i=0;i<10;i++){
    var lleno=i<p, crit=i<3;
    var col = lleno ? _colorSeg_(i,p) : '';
    segs+='<path class="seg '+(lleno?'on':'vac'+(crit?' zc':''))+'" '+
      (lleno?'stroke="'+col+'" ':'')+'d="'+arcoSeg(i,MR)+'"/>';
    if(lleno) halo+='<path class="halo" stroke="'+col+'" d="'+arcoSeg(i,MR)+'"/>';
    /* la marca de cada tramo, fuera del anillo: es la que CHISPEA al prender */
    var a=(-90+i*MSTEP)*Math.PI/180;
    /* El color NO depende de que el tramo este lleno: la barrita del 9 se pone verde con 9
       puntos aunque su tramo (el decimo) siga vacio. */
    ticks+='<line class="tk'+(crit?' zc':'')+(lleno?' f':'')+' '+_colorTick_(i,p)+'" data-i="'+i+'" '+
      'x1="'+(MC+72*Math.cos(a)).toFixed(1)+'" y1="'+(MC+72*Math.sin(a)).toFixed(1)+'" '+
      'x2="'+(MC+79*Math.cos(a)).toFixed(1)+'" y2="'+(MC+79*Math.sin(a)).toFixed(1)+'"/>';
  }
  var giro=p*MSTEP-MGAP/2+MTIP;
  var est=estadoPts(p);
  return '<div class="medcaja">'+
    '<div class="med late'+(est==='elegible'?' aura':'')+'" id="med" data-p role="button" tabindex="0" aria-label="Puntos de conducta: '+p+' de 10'+(est==='elegible'?', elegible':'')+'">'+
      '<svg class="dial" viewBox="0 0 172 172" aria-hidden="true">'+
        '<defs>'+
          '<linearGradient id="gRed" x1="0" y1="0" x2="1" y2="1">'+
            '<stop offset="0" stop-color="#FF6B6F"/><stop offset=".55" stop-color="#E41E25"/><stop offset="1" stop-color="#8E1418"/></linearGradient>'+
          '<linearGradient id="gWa" x1="0" y1="0" x2="1" y2="1">'+
            '<stop offset="0" stop-color="#F5B25E"/><stop offset="1" stop-color="#E8912E"/></linearGradient>'+
          /* Azul telemático y verde de la paleta: NO se inventan colores nuevos. */
          '<linearGradient id="gAzu" x1="0" y1="0" x2="1" y2="1">'+
            '<stop offset="0" stop-color="#7FC4EA"/><stop offset=".55" stop-color="#3f9ed6"/><stop offset="1" stop-color="#1E6A96"/></linearGradient>'+
          '<linearGradient id="gVer" x1="0" y1="0" x2="1" y2="1">'+

  var p=YO.puntos, giro=p*MSTEP-MGAP/2+MTIP;
  var tip=$('#medTip'), num=$('#medN');

  $$('#pips i').forEach(function(el){el.classList.remove('on','zc');});
  if(tip){tip.style.transition='none';tip.style.transform='rotate(0deg)';}

    return;

  /* secuencia de encendido: cada tramo prende con su fogonazo y su CHISPA en la marca */

        var t=$('.tk[data-i="'+k+'"]',med);

        if(num) num.textContent=k+1;

/* ═══════════════════════════════════════════════════════════════════════════
   LA BARRA ASINTÓTICA — más horas, más a la derecha; nunca se sale.
   w(h) = 100·(1 − e^(−h/K)). K elegido para que el umbral caiga sobre el 58 %.
   ═══════════════════════════════════════════════════════════════════════════ */
var K_BAR=13.6;
function wBar(h){ return 100*(1-Math.exp(-Math.max(0,h)/K_BAR)); }
function barraHorasHTML(id){
  var notion=(typeof YO.horasMes==='number');
  var cont=notion?YO.horasMes:sumaE('otor'), p=sumaE('pend');   /* otorgadas = todo lo que cuenta (Notion) */
  /* La barra NUNCA se llena (escala asintótica), pero dentro del ancho que ocupa el total
     (otorgadas+pendientes) el reparto es LINEAL: si 4 de 20 h están pendientes, el rayado
     ocupa 1/5 de lo pintado — no un pixel al final como si fueran un extra. */
  var tot=cont+p, wtot=wBar(tot);
  var wco = tot>0 ? wtot*(cont/tot) : 0, wcop = wtot;
  /* La MARCA del objetivo va en la MISMA escala que lo pintado: dentro del ancho reservado
     el reparto es lineal, así que el objetivo cae en wtot*(UMBRAL/tot). Con la escala asintótica
     se descolocaba (con 87 h la barra llega casi al borde y el objetivo se quedaba a media barra).
     Si aún no hay horas, o el objetivo queda más a la derecha que el total, se ancla al final. */
  var wu = tot>0 ? Math.min(98, wtot*(UMBRAL/tot)) : wBar(UMBRAL);
  return '<div class="barh" id="'+id+'">'+
      '<i class="otor" data-w="'+wco.toFixed(2)+'"></i>'+
      '<i class="pend" data-l="'+wco.toFixed(2)+'" data-w="'+(wcop-wco).toFixed(2)+'"></i>'+
      '<span class="mk" data-l="'+wu.toFixed(2)+'"></span>'+
    '</div>'+
    '<div class="barhet"><span data-l="'+wu.toFixed(2)+'">objetivo '+nf(UMBRAL,1)+' h</span></div>'+
    (tot>0
      ? '<div class="leyh">'+
          '<span><i style="background:var(--ok)"></i>cuentan</span>'+
          /* La leyenda va SIEMPRE, tengas o no horas pendientes: es la clave de colores de
             la barra, no un aviso. Que aparezca y desaparezca segun el dato hace que la
             barra cambie de significado sin avisar. (Daniel, 27/07.) */
          '<span'+(p>0?'':' style="opacity:.5"')+'><i style="background:repeating-linear-gradient(45deg,rgba(232,145,46,.9) 0 3px,transparent 3px 6px)"></i>pendientes · no cuentan</span>'+
        '</div>'
      : '')+
    (tot>0
      ? (p>0?'<p class="rnota" style="margin-top:9px">Lo rayado son '+nf2(p)+' h esperando firma: todavía no cuentan.</p>':'')
      : '<p class="rnota" style="margin-top:9px">Aún no tienes horas registradas este mes. El objetivo son '+nf(UMBRAL,1)+' h.</p>');
}
function animarBarras(root){
  $$('.barh',root||document).forEach(function(b){
    $$('i',b).forEach(function(i){
      var l=i.dataset.l, w=i.dataset.w;
      i.style.left=(l||0)+'%'; i.style.width='0';
      /* setTimeout, no rAF: en pestaña de fondo rAF no dispara y quedaría a cero */
      setTimeout(function(){ i.style.width=w+'%'; }, redu()?0:70);
    });
    $$('.mk',b).forEach(function(m){ m.style.left=m.dataset.l+'%'; });
  });
  $$('.barhet span',root||document).forEach(function(s){ s.style.left=s.dataset.l+'%'; });
}

/* ── deltas ─────────────────────────────────────────────────────────────── */
function deltaHTML(k,v,ref,txt){
  var d=ref?(v-ref)/ref*100:0, cls=d>=0?'pos':'neg';
  var w=Math.min(Math.abs(d),80)/80*50, left=d>=0?50:(50-w);
  return '<div class="dlt '+cls+'" data-w="'+w.toFixed(2)+'" data-l="'+left.toFixed(2)+'">'+
    '<span class="k">'+k+'</span>'+
    '<span class="tr"><i class="z"></i><b class="f"></b><s class="m"></s></span>'+
    '<span class="vv"><span class="'+(d>=0?'up':'dn')+'">'+pc(d)+'</span>'+
    '<span class="rr">'+esc(txt)+'</span></span></div>';
}
function animarDeltas(root){
  $$('.dlt',root||document).forEach(function(el){
    var w=parseFloat(el.dataset.w), l=parseFloat(el.dataset.l);
    var f=$('.f',el), m=$('.m',el);
    f.style.width='0'; f.style.left='50%'; m.style.left='50%';
    setTimeout(function(){
      f.style.width=w+'%'; f.style.left=l+'%';
      m.style.left=(el.classList.contains('pos')?50+w:50-w)+'%';
    }, redu()?0:80);
  });
}
function bloqueDeltas(){
  /* la base es la MISMA cifra que enseña la pantalla: el total real de Notion si lo hay.
     (Antes sumaba el estado 'conf', que ya no existe -> siempre 0 y los deltas salían rotos.) */
  var base=(typeof YO.horasMes==='number') ? YO.horasMes : sumaE('otor');
  return '<div>'+
    (typeof YO.hAnt==='number' ? deltaHTML('vs. '+(YO.mesAnt||'mes anterior'),base,YO.hAnt,nf(YO.hAnt,1)+' h en '+(YO.mesAnt||'el mes anterior')) : '')+
    deltaHTML('vs. objetivo',base,UMBRAL,'umbral '+nf(UMBRAL,1)+' h/mes')+
    deltaHTML('vs. equipo',base,MEDIA_EQ,'media '+nf(MEDIA_EQ,1)+' h')+
    deltaHTML('vs. unidad',base,mediaSub(YO.unidad),'Estructuras '+nf(mediaSub(YO.unidad),1)+' h')+
  '</div>';
}

/* ═══════════════════════════════════════════════════════════════════════════
   PANTALLA 2 · FICHAR — el corazón de la app del miembro

/* En la maqueta el reloj corre acelerado (1 s real = 1 min de trabajo) para que
   se pueda ver el aviso de las 10 h y el autocierre de las 14 h sin esperar un
   día. En la app real DEMO_X vale 1. */
var DEMO_X=60;
/* v27: minutos de pausa de la sesión en la nube (tramos cerrados; el abierto cuenta hasta ahora). */
function _pausaMinMovil_(pausas){ var now=Date.now(), t=0; (pausas||[]).forEach(function(p){ var pi=Date.parse(p.ini), pf=p.fin?Date.parse(p.fin):now; if(pf>pi) t+=(pf-pi); }); return Math.round(t/60000); }
function minSes(){
  var s=ST.ses;
  if(s.cloudIni) return Math.max(0, Math.min(840, Math.round((Date.now()-Date.parse(s.cloudIni))/60000)) - _pausaMinMovil_(s.pausas));  // nube: REAL menos pausas, tope 14 h (en pausa el reloj se congela)
  if(s.estado==='parada') return 0;
  if(s.estado==='pausada') return s.acum;
  return s.acum + Math.round((Date.now()-s.ini)/60000*DEMO_X);
}
/* al cerrar se redondea a cuartos de hora con suelo de 15 min: nadie declara 0 h */
function horasSesion(){ return Math.max(0.25, Math.round(minSes()/15)/4); }
function fmtHM(m){ return pad(Math.floor(m/60))+'<span class="c">:</span>'+pad(m%60); }
function durForm(){
  var a=ST.form.ini.split(':'), b=ST.form.fin.split(':');
  var d=(+b[0]*60 + +b[1]) - (+a[0]*60 + +a[1]);
  if(d<0) d+=1440;
  return Math.round(d/15)/4;
}
function optHoras(sel){
  var s='';
  for(var m=0;m<24*60;m+=15){
    var v=pad(Math.floor(m/60))+':'+pad(m%60);
    s+='<option value="'+v+'"'+(v===sel?' selected':'')+'>'+v+'</option>';
  }
  return s;
}

/* validación: los tres nodos y las dos aristas */
function validarFichaje(){
  var f=ST.form;
  var declP = f.declararId!=null ? PARTES.filter(function(x){return x.id===f.declararId;})[0] : null;
  var haySes = !!declP || ST.modo!=='vivo' || minSes()>0 || !!ST.ses.cloudIni;   /* declarar: ya hay sesión cerrada */
  var dur = declP ? declP.q : (ST.modo==='vivo' ? ((minSes()>0||ST.ses.cloudIni)?horasSesion():0) : durForm());
  var n1 = declP ? true : (haySes && dur>0 && dur<=12);
  /* la imputación depende de la categoría: tarea del desplegable, o el texto libre */
  var imput = f.cat==='tareas' ? (f.tarea==='__otro__' ? f.detalle.trim() : f.tarea) : f.detalle.trim();
  var n2 = !!imput;
  var n3 = f.just.trim().length>=25;

  var e1=$('#e1'), e2=$('#e2'), e3=$('#e3');
  /* Debajo de cada estrella NO va el valor: que se encienda ya dice que ese requisito
     esta cubierto, y repetirlo recargaba el dibujo. La unica excepcion es pasarse de
     12 h, que no es adorno sino un tope que bloquea el envio. */
  if(e1) e1.textContent = (dur>12) ? 'excede 12 h' : '';
  if(e2) e2.textContent = '';
  if(e3) e3.textContent = '';

  [['n1',n1],['n2',n2],['n3',n3]].forEach(function(x){
    var el=$('#'+x[0]); if(el) el.classList.toggle('on',x[1]);
  });
  var a1=$('#ar1'), a2=$('#ar2');
  if(a1) a1.classList.toggle('on', n1&&n2);
  if(a2) a2.classList.toggle('on', n2&&n3);

  /* el aro de la justificación */
  var pct=Math.min(1,f.just.trim().length/25);
  var aro=$('#aroJ'), p=$('.p',aro||document), n=$('#aroN'), tx=$('#justTx');
  if(p) p.style.strokeDashoffset=(100-pct*100).toFixed(1);
  if(aro) aro.classList.toggle('ok',n3);
  if(n) n.textContent=Math.min(25,f.just.trim().length);
  if(tx) tx.innerHTML = n3
    ? 'Justificación suficiente. <b>Cuanto más concreta, antes te la firman.</b>'
    : 'Te faltan <b>'+(25-f.just.trim().length)+' caracteres</b>.';

  var todo=n1&&n2&&n3;
  var msg=$('#figMsg');
  if(msg){
    msg.classList.toggle('ok',todo);
    $('span:last-child',msg).textContent = todo
      ? 'Todo listo: ya se puede enviar.'
      : 'Faltan datos: todavía no se puede enviar.';
  }
  var b=$('#btnEnviar'), l=$('#lblEnviar');
  if(b){
    b.disabled=!todo;
    if(l) l.textContent = todo ? ('Enviar '+nf(dur,2)+' h a aprobación')
      : (!n1?'Falta la duración':(!n2?'Falta a qué imputarlas':'Falta la justificación'));
  }
  return todo;
}
function medirAristas(){
  ['ar1','ar2'].forEach(function(id){
    var p=$('#'+id); if(!p) return;
    var L=80; try{ L=p.getTotalLength()||80; }catch(e){}
    p.style.setProperty('--L',L);
  });
}
function _dmyAISO_(f){ f=String(f||''); var m=f.match(/^(\d{2})\/(\d{2})\/(\d{4})$/); return m?(m[3]+'-'+m[2]+'-'+m[1]):f; }
/* Envío del fichaje. Con cuenta real y sesión EN VIVO → api.ficharSalida: la NUBE cierra
   la sesión abierta y calcula las horas (de la entrada al momento del envío). Un BLOQUE
   declarado a mano → api.pushParte (sin fichaje). Sin backend: memoria (semilla). */
function _imputacion_(f){ return f.cat==='tareas' ? (f.tarea==='__otro__' ? f.detalle.trim() : f.tarea) : f.detalle.trim(); }
async function enviarFichaje(){
  if(!validarFichaje()) return;
  var f=ST.form, imput=_imputacion_(f);
  if(f.declararId!=null && backendOK && SESION){   // declarar un parte 'sin declarar' ya cerrado
    tost('Declarando…');
    try{ var p=await api.declararParte(f.declararId, imput, f.just.trim(), f.cat);
      if(p){ var i=PARTES.findIndex(function(x){return x.id===f.declararId;}); if(i>=0) PARTES[i]=normPMovil(p); }
      f.declararId=null; f.just=''; f.tarea=''; f.detalle='';
      tost('Declarado · a la cola de tu coordinador.'); irA('horas');
    }catch(e){ tost('No se pudo declarar: '+((e&&e.message)||e)); }
    return;
  }
  if(backendOK && SESION){
    tost('Enviando…');
    try{
      var nuevo=null, h=0;
      if(ST.modo==='vivo' && ST.ses.cloudIni){
        var r=await api.ficharSalida(imput, f.just.trim(), f.cat);   // la nube cierra, calcula y guarda la categoría
        if(r && r.parte){ nuevo=normPMovil(r.parte); h=r.parte.horas; }
      } else {
        var dur=durForm();
        var rec=await api.pushParte({ fecha:_dmyAISO_(f.fecha), tarea:imput, categoria:f.cat, horas:dur,
          ini:f.ini, fin:f.fin, justificacion:f.just.trim(), sinFichaje:true });
        if(rec&&rec.partes&&rec.partes[0]){ nuevo=normPMovil(rec.partes[0]); h=dur; }
      }
      if(nuevo) PARTES.unshift(nuevo);
      ST.ses={estado:'parada'}; f.just=''; f.tarea=''; f.detalle='';
      tost('Fichaje enviado · '+nf(h,2)+' h a la cola de tu coordinador');
      irA('horas');
    }catch(e){ tost('No se pudo enviar: '+((e&&e.message)||e)); }
    return;
  }
  var durd = ST.modo==='vivo' ? horasSesion() : durForm();   // demo local (sin backend)
  PARTES.unshift({id:++SEQ, f:f.fecha, t:imput, cat:f.cat, q:durd, e:'pend',
    ini:f.ini, fin:f.fin, just:f.just.trim(),
    sinFichaje: ST.modo==='bloque'});
  ST.ses={estado:'parada',ini:null,acum:0,desde:null,ult:ST.ses.ult};
  f.just=''; f.tarea=''; f.detalle='';
  tost('Enviado · '+nf(durd,2)+' h pendientes de firma');
  irA('horas');
}

/* Etiqueta de la CATEGORÍA de Notion a la que suma cada imputación (fichaje u otorgamiento).
   El miembro la ve para reconciliar: 'esta hora cayó en Reuniones', 'esta en Carga tareas'.
   null = cajón por defecto (Compensaciones), igual que hace el motor (aplicar_horas.py). */
var CAT_ETI={tareas:'Carga tareas',reunion:'Reuniones',turno:'Turnos fabric.',compensacion:'Compensaciones'};
function catEti(c){ return CAT_ETI[c]||CAT_ETI.compensacion; }
/* Desglose de lo que TUS imputaciones sumaron a cada categoría (no el total de la categoría en
   Notion, que además lleva reuniones auto, cursos, etc.): es la parte que puedes verificar tú. */
function desgloseCat(ps){
  if(!ps.length) return '';
  var g={}, orden=['reunion','tareas','turno','compensacion'];
  ps.forEach(function(p){ var k=(p.cat in CAT_ETI)?p.cat:'compensacion'; g[k]=(g[k]||0)+p.q; });
  var chips=orden.filter(function(k){return g[k];}).map(function(k){
    return '<span class="pil neu" style="margin:0 6px 6px 0">'+esc(CAT_ETI[k])+' <b class="mono">'+nf(g[k],1)+' h</b></span>';
  }).join('');
  return '<div style="display:flex;flex-wrap:wrap;margin:2px 0 4px">'+chips+'</div>';
}
function filaParte(p){
  var cls = p.e==='conf'?'borde-ok':p.e==='otor'?'borde-ot':(p.e==='rech'||p.e==='cad')?'borde-no':'borde-pe';
  var pil = p.e==='conf'?'<span class="pil conf">aprobada</span>'
          : p.e==='otor'?'<span class="pil otor">otorgada</span>'
          : p.e==='rech'?'<span class="pil no">rechazada</span>'
          : p.e==='det' ?'<span class="pil pend">falta detalle</span>'
          : p.e==='cad' ?'<span class="pil no">caducada</span>'
          : p.e==='sindecl'?'<span class="pil pend">sin declarar</span>'
          : '<span class="pil pend">en cola</span>';
  var sub = p.e==='otor' ? (p.nota?esc(p.nota):(p.f+(p.ini?' · '+p.ini+'–'+p.fin:'')))
          : p.e==='pend' ? 'esperando aprobación'
          : p.e==='det'  ? 'te piden más detalle · edítala y vuelve a enviarla'
          : p.e==='rech' ? 'rechazada'+(p.nota?' · '+esc(p.nota):'')
          : p.e==='sindecl' ? (p.f+(p.ini?' · '+p.ini+'–'+p.fin:'')+(p.caduca?' · caduca '+_isoADMY_((''+p.caduca).slice(0,10)):''))
          : (p.f+(p.ini?' · '+p.ini+'–'+p.fin:''));
  var catTxt = (p.e==='conf'||p.e==='otor') ? ' · sumó a '+catEti(p.cat)
             : p.e==='pend' ? ' · irá a '+catEti(p.cat) : '';
  var accion = p.e==='sindecl' ? '<button class="btn mini" data-declarar="'+p.id+'" data-p style="margin-right:7px">Declarar</button>' : '';
  return '<div class="fila '+cls+'"><div class="a"><b>'+esc(p.t||'Fichaje sin declarar')+'</b><small>'+sub+catTxt+
    (p.sinFichaje?' · <span style="color:var(--warn)">sin fichaje</span>':'')+'</small></div>'+
    '<div class="d">'+accion+pil+' <b class="mono">'+nf(p.q,1)+' h</b></div></div>';
}

function _cablearMemoria_(){
  $$('[data-mem]').forEach(function(h){
    h.onclick=function(){
      var cuerpo=h.parentNode.querySelector('.memcuerpo'), sv=h.querySelector('svg');
      var abierto=!cuerpo.hasAttribute('hidden');
      if(abierto){ cuerpo.setAttribute('hidden',''); sv.style.transform=''; return; }
      cuerpo.removeAttribute('hidden'); sv.style.transform='rotate(180deg)';
      if(cuerpo.dataset.cargado) return;
      cuerpo.dataset.cargado='1';
      var id=h.dataset.mem;
      if(!id){ cuerpo.innerHTML='<div class="dcar">No se puede mostrar aquí. Ábrela en Drive.</div>'; return; }
      cuerpo.innerHTML='<div class="dcar">Cargando la memoria…</div>';
      var f=document.createElement('iframe');
      f.className='dv'; f.setAttribute('loading','lazy'); f.setAttribute('allow','autoplay');
      f.src='https://drive.google.com/file/d/'+id+'/preview';
      /* Si el visor no carga (CSP del artefacto, o sin permiso), se dice y se ofrece Drive. */
      var fallo=setTimeout(function(){
        if(cuerpo.dataset.ok) return;
        cuerpo.innerHTML='<div class="dcar">No se pudo incrustar el visor.<br>Ábrela en Drive con el enlace de abajo.</div>';
      }, 6000);
      f.onload=function(){ cuerpo.dataset.ok='1'; clearTimeout(fallo); };
      cuerpo.innerHTML=''; cuerpo.appendChild(f);
    };
  });
}

   tenia un boton apagado. Clave VAPID publica (no es un secreto: va en el cliente).

var VAPID_PUBLIC='BOcYdKPWxq5NAKS6AbZIW9UV7MOb7gmy1nP_KhdxZpvPa3O5jsZ-_jravOhHivQqQuJoJvLTcrc2xvZESc2g0Ag';
function _urlB64_(b64){
  var pad='='.repeat((4-b64.length%4)%4);
  var t=(b64+pad).replace(/-/g,'+').replace(/_/g,'/');
  var raw=atob(t), arr=new Uint8Array(raw.length);
  for(var i=0;i<raw.length;i++) arr[i]=raw.charCodeAt(i);

function _esStandalone_(){ return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone===true; }
var _swReg=null;
async function _registrarSW_(){
  if(!('serviceWorker' in navigator)) return null;
  try{ _swReg=await navigator.serviceWorker.register('sw.js'); return _swReg; }catch(e){ return null; }
}
function _notisMsg(t){ var b=$('#notisMsg'); if(b) b.textContent=t; }
async function activarNotis(btn){
  if(!_pushSoportado_()){ _notisMsg('Este navegador no admite notificaciones.'); return; }
  if(_esIOS_() && !_esStandalone_()){
    _notisMsg('En iPhone: Compartir → Añadir a pantalla de inicio, y abre la app desde ese icono.');
    return;
  }
  if(btn){ btn.disabled=true; btn.textContent='Activando…'; }
  try{
    var perm=await Notification.requestPermission();
    if(perm!=='granted'){ _notisMsg('Permiso denegado. Puedes darlo en los ajustes del móvil.'); return; }
    var reg=_swReg || await _registrarSW_();
    if(!reg){ _notisMsg('No se pudo preparar el service worker.'); return; }
    await navigator.serviceWorker.ready;
    var sub=await reg.pushManager.getSubscription();
    if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:_urlB64_(VAPID_PUBLIC)});
    if(typeof SESION!=='undefined' && SESION) await api.guardarPush(sub.toJSON());
    _notisMsg('Notificaciones activadas.');
  }catch(e){ _notisMsg('No se pudo activar: '+((e&&e.message)||e)); }
  finally{ if(btn){ btn.disabled=false; btn.textContent='Activar notificaciones'; } pintar(); }
}
/* Al abrir: registra el SW y, si ya habia permiso y sesion, re-guarda la suscripcion por si
   el navegador la roto (pasa, y si no se re-guarda dejan de llegar avisos en silencio). */
async function _pushInit_(){
  if(!_pushSoportado_()) return;
  var reg=await _registrarSW_();
  try{
    if(reg && Notification.permission==='granted'){
      await navigator.serviceWorker.ready;
      var sub=await reg.pushManager.getSubscription();
      if(sub && typeof SESION!=='undefined' && SESION) api.guardarPush(sub.toJSON());
    }
  }catch(_){}
}

function vReu(){

  if(_sinReuniones_())
    return '<div class="h1">Reuniones</div><p class="h1s">Tus reuniones y encuestas de disponibilidad.</p>'+
      '<button class="btn pri full" data-p id="btnCrear" style="margin-bottom:11px">Convocar '+(esCoord()?'reunión':'reunión de trabajo')+'</button>'+
      '<div class="tarj">'+vacio('Ninguna reunión convocada','Ahora mismo no estás convocado a ninguna '+
        'reunión. Cuando alguien convoque una, aparecerá aquí para que cubras tu disponibilidad.','',false)+'</div>';
  var R=REUNION, nF=R.franjas.length;
  /* Vista PONDERADA (solo tiene sentido en híbridas): presencial+telemático vale 2 y
     telemático 1, así que la ponderación es literalmente la suma de los valores. En
     «personas» se cuenta a cada uno una vez. Los null (no ofertado) no entran en nada. */
  var hib=(R.modalidad==='hibrida') && !!R.pond;
  var pondOn = hib && !!ST.pond;
  var M = pondOn ? R.pond : R.calor;
  var max=0; M.forEach(function(fila){fila.forEach(function(v){ if(v!=null&&v>max)max=v; });});
  var best={d:0,f:0,v:0};
  M.forEach(function(fila,di){fila.forEach(function(v,fi){ if(v!=null&&v>best.v)best={d:di,f:fi,v:v}; });});
  /* indice rapido de los bloques fijados, para pintarlos en verde */
  var fijSet={}; (R.fijadaBl||[]).forEach(function(b){ fijSet[b[0]+'-'+b[1]]=1; });
  /* ── LA MEJOR HORA ES UNA VENTANA, NO UNA CASILLA ──────────────────────────
     Con slots de 30 min y una reunion de 1 h, la casilla con mas gente no responde a
     nada: si a las 18:00 pueden 12 y a las 18:30 solo 2, a las 18:00 NO cabe la reunion.
     Se busca la mejor ventana de lo que dura, y se cuenta a quien puede en TODA ella:
     es una INTERSECCION de personas, no el minimo casilla a casilla. Sin respuestas
     cargadas (la lista no las trae hasta abrir la reunion) se cae a la casilla suelta,
     que es lo que habia. ───────────────────────────────────────────────────────── */
  var _slotR=+R.slot || (R.franjas[0] && +R.franjas[0].dur) || 60;
  var _minR=_slotsMin_(R.duracion, _slotR);
  var _ofR={}; (R.bloques||[]).forEach(function(b){ _ofR[b[0]+'_'+b[1]]=1; });
  var _quien=[];                                  // un Set de 'd_f' por persona
  Object.keys(R.resp||{}).forEach(function(n){
    var v=R.resp[n]||[], set={}, hay=false;
    (R.bloques||[]).forEach(function(b,i){ if(+v[i]>0){ set[b[0]+'_'+b[1]]=1; hay=true; } });
    if(hay) _quien.push(set);
  });
  var vent={d:best.d, f0:best.f, f1:best.f, v:best.v, exacta:false};
  if(_quien.length){
    var mejor={d:0,f0:0,f1:0,v:-1};
    R.dias.forEach(function(_,di){
      for(var f=0; f+_minR<=R.franjas.length; f++){
        var ok=true;
        for(var i=0;i<_minR;i++) if(!_ofR[di+'_'+(f+i)]){ ok=false; break; }
        if(!ok) continue;
        var n=0;
        _quien.forEach(function(set){
          for(var i=0;i<_minR;i++) if(!set[di+'_'+(f+i)]) return;
          n++;
        });
        if(n>mejor.v) mejor={d:di, f0:f, f1:f+_minR-1, v:n};

    if(mejor.v>=0) vent={d:mejor.d, f0:mejor.f0, f1:mejor.f1, v:mejor.v, exacta:true};
  }
  /* EJE DE TIEMPO, no de franjas. Con horarios distintos por dia la union mezcla :00 y

     dura, asi que la fila de cada dia sale de una pieza. */
  var _mm=_minHM_;                          // antes: parser propio, identico a este
  var _du=function(f){ return +f.dur||60; };
  var _mcd=function(a,b){ while(b){ var t=a%b; a=b; b=t; } return a; };
  var paso=0; R.franjas.forEach(function(f){ paso=_mcd(paso,_mm(f)); paso=_mcd(paso,_du(f)); });
  paso=Math.max(15, Math.min(60, paso||60));
  var t0=Math.min.apply(null, R.franjas.map(_mm));
  var t1=Math.max.apply(null, R.franjas.map(function(f){ return _mm(f)+_du(f); }));
  var eje=[]; for(var _t=t0; _t<t1; _t+=paso) eje.push(_t);
  var _hhmm=_hmMin_;                        // antes: formateador propio, identico a este
  /* para cada dia y cada instante, que franja OFERTADA lo cubre (-1 = ninguna) */
  var cubre=R.dias.map(function(_,di){
    return eje.map(function(t){
      for(var fi=0; fi<R.franjas.length; fi++){
        if(M[di][fi]==null) continue;
        var a=_mm(R.franjas[fi]);
        if(t>=a && t<a+_du(R.franjas[fi])) return fi;

      return -1;
    });
  });
  var g='<div style="overflow-x:auto;margin:0 2px"><div style="display:grid;gap:2px;grid-template-columns:auto repeat('+eje.length+',minmax(20px,1fr));min-width:280px">';
  g+='<div></div>';
  eje.forEach(function(t,ix){
    /* decision cerrada: la etiqueta va al LIMITE izquierdo = hora de inicio. Con paso fino
       solo se rotula la hora en punto, o no se leeria nada. */
    var enPunto=(t%60===0);
    g+='<div style="position:relative;min-height:15px">'+

      (ix===eje.length-1?'<span style="position:absolute;right:0;top:2px;font-family:var(--mono);'+
        'font-size:8.5px;color:var(--ink3)">'+_hhmm(t1).replace(':00','')+'</span>':'')+
      '</div>';
  });
  R.dias.forEach(function(d,di){
    g+='<div style="font-family:var(--mono);font-size:9.5px;color:var(--ink2);display:flex;'+
      'align-items:center;justify-content:flex-end;padding-right:6px">'+d+'</div>';
    /* UNA CELDA POR FRANJA, ancha lo que la franja dura. Antes se pintaba una celda por
       INSTANTE del eje y el numero solo en la que arrancaba: con paso de 30 min y franjas
       de una hora salia «3 · 3 · 3 ·», y parecia que en la mitad de los huecos no podia
       nadie. El eje de tiempo se queda; lo que cambia es que la franja no se trocea. */
    var ix=0;
    while(ix<eje.length){
      var fi=cubre[di][ix], k=1;

      if(fi<0){                                                // fuera del horario de ese dia
        g+='<div title="fuera del horario de ese d\u00eda" style="'+geo+';'+

      } else {

        var esBest=(di===vent.d && fi>=vent.f0 && fi<=vent.f1 && vent.v>0), fij=fijSet[di+'-'+fi];
        var fondo = fij ? 'rgba(53,199,89,.85)' : 'rgba(228,30,37,'+a+')';
        var borde = fij ? ';outline:1px solid var(--ok);outline-offset:-1px'
                   : (esBest?';outline:1px solid var(--ink);outline-offset:-1px':'');
        g+='<div title="'+_hhmm(ini)+'\u2013'+_hhmm(ini+_du(R.franjas[fi]))+' \u00b7 '+v+'" style="'+geo+';'+
          'display:grid;place-items:center;font-family:var(--mono);font-size:8.5px;color:#fff;'+
          'background:'+fondo+borde+'">'+v+'</div>';
      }
      ix+=k;
    }

  g+='</div></div>';

  return '<div class="h1">Reuniones</div><p class="h1s">Tus reuniones y encuestas de disponibilidad.</p>'+
    '<button class="btn pri full" data-p id="btnCrear" style="margin-bottom:11px">Convocar '+(esCoord()?'reunión':'reunión de trabajo')+'</button>'+
    '<h2 class="sec">Mis reuniones<span class="ln"></span>'+(REUNIONES_M.length||1)+'</h2>'+
    (REUNIONES_M.length>1

          var sel=(x.id===R.id);
          return '<div class="fila clic" data-reu="'+i+'" data-p'+(sel?' style="background:rgba(228,30,37,.07)"':'')+'>'+
            '<div class="a"><b>'+esc(x.titulo)+'</b><small>'+esc(x.tipo)+' · '+

            '<div class="d">'+(sel?'<span class="pil conf">viendo</span>':'<span class="chev">›</span>')+'</div></div>'; }).join('')+'</div>'
      : '')+
    '<div class="tarj">'+cab(R.tipo||'General', R.modalidad||'')+
      '<div class="fila" style="padding-top:0"><div class="a"><b>'+esc(R.titulo)+'</b>'+
      '<small>'+(R.convocante?'Convoca '+esc((_pilaDeM_(R.convocante)||R.convocante))+' · ':'')+(R.fijada?'📌 '+esc(_fijadaTxtM_(R.fijada)):'cierra el '+_limM_(R))+' · '+R.nInv+' convocados</small></div>'+

    /* si ya está fijada, el aviso de organizador sobra y quedaba colgando debajo del cartel verde */

/* ── CUBRIR DISPONIBILIDAD — pintar a dedo/arrastre, ciclo según modalidad ─
   telemática 0↔1 · presencial 0↔2 · híbrida 0→1→2→0 (decisión cerrada). ── */
function cubrirModal(){
  var R=REUNION, nF=R.franjas.length, nD=R.dias.length;
  var modo=R.modalidad;
  var _slot=+R.slot || (R.franjas[0] && +R.franjas[0].dur) || 60;

          : '<span><i style="background:var(--red)"></i>presencial + telemático</span><span><i style="background:var(--tel)"></i>solo telemático</span>';
  /* Precarga de lo ya enviado: sin esto, «Editar mi disponibilidad» abria la rejilla
     en blanco y guardar equivalia a borrar lo que tenias puesto.
     `resp[nombre]` esta alineado a la POSICION del bloque, no al indice de franja. */
  if(!ST.sel || ST._selDe!==R.id){
    ST.sel=new Map(); ST._selDe=R.id;
    var _mio=(R.resp||{})[(YO&&YO.nombre)||'']||[];
    (R.bloques||[]).forEach(function(b,i){

    });
  }
  var hd='<div class="rc"></div>';
  R.franjas.forEach(function(f,ix){
    hd+='<div class="rc rh"><span>'+f.ini.replace(':00','')+'</span>'+
      (ix===nF-1?'<span class="fin">23</span>':'')+'</div>';
  });

     marcadas, y al guardar se caian sin decir nada: `vals` se arma recorriendo `bloques`,

  var _ofer={}; (R.bloques||[]).forEach(function(b){ _ofer[b[0]+'_'+b[1]]=1; });
  var rows='';
  R.dias.forEach(function(d,di){
