    }
  });
  abrirModal('<div class="mtit">Marca tu disponibilidad</div>'+
    '<div class="msub">'+esc(YO.pila)+' · '+instr+'</div>'+
    (_minS>1?'<p class="rnota" style="margin:-4px 0 10px">La reunión dura <b>'+_durTxtM_(_minS*_slot)+
      '</b>, así que cada toque marca <b>'+_minS+' casillas seguidas</b> a partir de ahí. '+
      'Puedes estirar más arrastrando; lo que quede más corto se quita solo.</p>':'')+
    '<div class="rejw"><div class="rej" id="rejC" style="grid-template-columns:auto repeat('+nF+',minmax(30px,1fr))">'+hd+rows+'</div></div>'+

function engancharRejilla(){
  var grid=$('#rejC'); if(!grid) return;
  var R=REUNION, modo=R.modalidad, nF=(R.franjas||[]).length;
  var slot=+R.slot || (R.franjas[0] && +R.franjas[0].dur) || 60;
  var minS=_slotsMin_(R.duracion, slot);          // casillas seguidas que exige la reunión
  var ofer={}; (R.bloques||[]).forEach(function(b){ ofer[b[0]+'_'+b[1]]=1; });
  var hay=function(di,f){ return f>=0 && f<nF && !!ofer[di+'_'+f]; };
  var sig=function(cur){ return modo==='presencial'?(cur===2?0:2) : modo==='telematica'?(cur===1?0:1) : ((cur||0)+1)%3; };
  /* La unidad es el HUECO, no la casilla: una racha mas corta que la reunion no sirve
     para nada -no puedes ir- y ademas el pipeline de sanciones te daria por «cubierto». */
  var rachas=function(di){
    var out=[], f=0;
    while(f<nF){
      if(!ST.sel.get(di+'_'+f)){ f++; continue; }
      var a=f; while(f<nF && ST.sel.get(di+'_'+f)) f++;
      out.push([a,f-1]);
    }
    return out;
  };
  /* Lo que queda corto se QUITA, nunca se completa: completarlo seria inventarle
     disponibilidad a una persona, y de aqui salen sanciones reales. */
  var sanear=function(){
    var n=0;
    R.dias.forEach(function(_,di){
      rachas(di).forEach(function(r){
        if(r[1]-r[0]+1>=minS) return;
        for(var i=r[0];i<=r[1];i++) ST.sel.delete(di+'_'+i);
        n++;
      });
    });
    return n;
  };
  var cont=function(){
    var e=$('#ecount'); if(!e) return;
    var hue=0, cas=0, p=0, t=0;
    R.dias.forEach(function(_,di){ rachas(di).forEach(function(r){ hue++; cas+=r[1]-r[0]+1; }); });
    ST.sel.forEach(function(v){ v===2?p++:t++; });
    e.innerHTML = !hue
      ? 'Sin marcar todavía'+(minS>1?(' · cada toque marca '+_durTxtM_(minS*slot)):'')
      : '<b>'+hue+'</b> hueco'+(hue===1?'':'s')+' · '+_durTxtM_(cas*slot)+' en total'+
        (modo==='hibrida' ? (' · '+p+' presencial'+(p===1?'':'es')+' · '+t+' telemática'+(t===1?'':'s')) : '');
  };
  cont();
  var ancla=null, ultimo=null, target=1, borra=false;
  var kk=function(k){ return k.split('_').map(Number); };
  var cabe=function(di,f){ for(var i=0;i<minS;i++) if(!hay(di,f+i)) return false; return true; };
  /* EL MINIMO VA A LA DERECHA DEL TOQUE (decision de Daniel): el hueco nace donde pones
     el dedo y se lleva lo que dura la reunion. Estirar a partir de ahi es libre. */
  var rango=function(){
    var A=kk(ancla), B=kk(ultimo||ancla);
    var f0=Math.min(A[1],B[1]);
    var f1=borra ? Math.max(A[1],B[1]) : Math.max(A[1]+minS-1, B[1]);
    return { d0:Math.min(A[0],B[0]), d1:Math.max(A[0],B[0]), f0:f0, f1:Math.min(nF-1,f1) };
  };
  var barrer=function(fn){
    var r=rango();
    for(var d=r.d0; d<=r.d1; d++) for(var f=r.f0; f<=r.f1; f++) if(hay(d,f)) fn(d+'_'+f);
  };
  var limpia=function(){ $$('.ecel.prev',grid).forEach(function(c){ c.classList.remove('prev'); }); };
  var prev=function(){ limpia(); barrer(function(k){
    var c=grid.querySelector('[data-k="'+k+'"]'); if(c) c.classList.add('prev'); }); };
  /* Se repinta la rejilla ENTERA porque `sanear` puede tocar casillas fuera del arrastre. */
  var repinta=function(){
    $$('.ecel[data-k]',grid).forEach(function(c){
      var v=ST.sel.get(c.dataset.k)||0;
      c.classList.remove('on1','on2');
      if(v===1) c.classList.add('on1'); else if(v===2) c.classList.add('on2');
    });
  };
  var commit=function(){
    barrer(function(k){ if(target===0) ST.sel.delete(k); else ST.sel.set(k,target); });
    var q=sanear();
    limpia(); repinta(); cont();
    if(q) tost(q===1 ? ('Un hueco se quedó por debajo de '+_durTxtM_(minS*slot)+' y se ha quitado.')
                    : ('Se han quitado '+q+' huecos que quedaban por debajo de '+_durTxtM_(minS*slot)+'.'));
  };
  grid.addEventListener('pointerdown',function(ev){
    var el=ev.target.closest('.ecel'); if(!el || !el.dataset.k) return;   // no ofertada: no se toca
    ev.preventDefault();
    var A=kk(el.dataset.k);
    target=sig(ST.sel.get(el.dataset.k)||0); borra=(target===0);
    if(!borra && !cabe(A[0],A[1])){
      tost('Ahí no entra la reunión entera ('+_durTxtM_(minS*slot)+'): el horario de ese día acaba antes.');
      return;
    }
    ancla=el.dataset.k; ultimo=ancla;
    try{ grid.setPointerCapture(ev.pointerId); }catch(e){}
    prev();
  });
  grid.addEventListener('pointermove',function(ev){
    if(!ancla) return;
    var el=document.elementFromPoint(ev.clientX,ev.clientY);
    if(el && el.classList.contains('ecel') && el.dataset.k){ ultimo=el.dataset.k; prev(); }
  });
  grid.addEventListener('pointerup',function(){ if(ancla){ commit(); ancla=null; ultimo=null; } });
  var g=$('#btnGuardarDisp');
  /* GUARDA EN EL SERVIDOR. Antes solo ponia una marca local y decia «guardada»: en el
     servidor no quedaba nada, y de ahi come el pipeline de sanciones. `valores` va
     alineado a la POSICION de cada bloque, que es como lo espera `responder`. */
  if(g) g.onclick=async function(){
    if(g.disabled) return;
    var R2=REUNION;
    var vals=(R2.bloques||[]).map(function(b){ return ST.sel.get(b[0]+'_'+b[1])||0; });
    if(typeof backendOK!=='undefined' && backendOK && SESION){
      g.disabled=true; var prev=g.textContent; g.textContent='Guardando…';
      try{
        await api.responder(R2.id, (YO&&YO.nombre)||'', vals);
        if(!R2.resp) R2.resp={};
        R2.resp[(YO&&YO.nombre)||'']=vals;
        var re=_normReuM_(R2); REUNION=re;                    // recalcula el mapa con lo tuyo dentro
        var ix=REUNIONES_M.findIndex(function(x){ return x.id===re.id; });
        if(ix>=0) REUNIONES_M[ix]=re;
        ST._selDe=null;
        cerrarModal(); tost('Disponibilidad guardada.'); pintar();
      }catch(e){
        g.disabled=false; g.textContent=prev;
        tost('No se pudo guardar: '+((e&&e.message)||e)+'. Vuelve a intentarlo.');
      }
      return;
    }
    tost('Sin conexión no se puede guardar la disponibilidad.');
  };
}

function _sinTildesM_(t){ return (t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
/* `_dmyM_` se borro: era byte a byte `_isoADMY_` y ademas no la llamaba nadie. */
/* Las etiquetas de dia van en DD/MM, igual que la Reunion General: 'V 24' se lee
   peor y ademas pierde el mes, que importa cuando el rango cruza de mes. */
function _ddmmM_(d){ return pad(d.getDate())+'/'+pad(d.getMonth()+1); }
function _diasDesdeM_(iso,n){ var out=[],b=new Date(iso+'T00:00:00');
  for(var i=0;i<n;i++){ var d=new Date(b); d.setDate(b.getDate()+i); out.push(_ddmmM_(d)); } return out; }
var _DL_=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
/* nombres largos para la vista de 'horario distinto por día' (ahí caben y se leen mejor) */
function _diasLargosM_(modo,d0,d1,fecha,nd){
  var out=[], a, i;
  if(modo==='rango'){ if(!d0||!d1) return out; a=new Date(d0+'T00:00:00'); var b=new Date(d1+'T00:00:00');
    for(i=0;i<62&&a<=b;i++){ out.push(_DL_[a.getDay()]+' '+a.getDate()); a.setDate(a.getDate()+1); } }
  else { a=new Date((fecha||'')+'T00:00:00'); for(i=0;i<nd;i++){ var d=new Date(a); d.setDate(a.getDate()+i); out.push(_DL_[d.getDay()]+' '+d.getDate()); } }
  return out;

function _diasEntreM_(a0,a1){ var out=[]; if(!a0||!a1) return out;
  var a=new Date(a0+'T00:00:00'), b=new Date(a1+'T00:00:00'); if(b<a) return out;
  for(var i=0;i<62&&a<=b;i++){ out.push(_ddmmM_(a)); a.setDate(a.getDate()+1); } return out; }
/* UNA SOLA REJILLA para todos los dias, contigua y anclada al tamano de slot.
   Antes cada dia generaba SUS franjas desde SU hora de inicio y con una «cadencia» que
   podia solaparlas: un dia a las 17:00 y otro a las 17:30 daban franjas alternas, y con
   cadencia de 15 min y franja de 1 h salian cuatro franjas por hora pisandose entre si.
   Ahora el origen es comun (el inicio mas temprano, bajado al multiplo del slot) y cada
   dia solo OFERTA los slots que le caben enteros. Asi no hay solapes que dibujar.
   `rangos` son horas decimales [inicio, fin] por dia; [0,0] = dia apagado. */
function _genUnionM_(rangos, slot){
  slot=Math.max(5, Math.min(240, +slot||60));
  var act=rangos.filter(function(r){ return r && r[1]>r[0]; });
  if(!act.length) return { F:[], perDia:rangos.map(function(){ return []; }) };
  var m0=Math.min.apply(null, act.map(function(r){ return Math.round(r[0]*60); }));
  var m1=Math.max.apply(null, act.map(function(r){ return Math.round(r[1]*60); }));
  m0=Math.floor(m0/slot)*slot;                       // el origen cae en la rejilla
  var F=[];
  for(var t=m0; t+slot<=m1+1e-9 && F.length<400; t+=slot)
    F.push({ini:pad(Math.floor(t/60))+':'+pad(t%60), dur:slot});
  var perDia=rangos.map(function(r){
    var out=[]; if(!(r && r[1]>r[0])) return out;
    var a=Math.round(r[0]*60), b=Math.round(r[1]*60);
    F.forEach(function(_,i){ var ti=m0+i*slot; if(ti>=a && ti+slot<=b) out.push(i); });
    return out;                                      // solo los slots que caben ENTEROS
  });
  return { F:F, perDia:perDia };
}
/* Hora de inicio y de fin de una franja, para escribir un hueco como «18:00–19:00». */
function _hFranja_(R,fi){ var f=(R.franjas||[])[fi]; return f ? _hmMin_(_minHM_(f)) : '—'; }
function _hFinFranja_(R,fi){ var f=(R.franjas||[])[fi];
  return f ? _hmMin_(_minHM_(f) + (+f.dur>0 ? +f.dur : 60)) : '—'; }
/* Cuantas casillas seguidas hacen falta para cubrir la reunión. Se redondea HACIA ARRIBA:
   media casilla no existe, y quedarse corto es no poder ir. Sin `duracion` (reuniones de
   antes de este modelo) da 1, que es como se comportaba la app hasta ahora. */
function _slotsMin_(duracion, slot){
  var d=+duracion||0, s=Math.max(5, +slot||60);
  return Math.max(1, Math.ceil(d/s) || 1);
}
function _durTxtM_(min){
  min=Math.max(0, Math.round(+min||0));
  var h=Math.floor(min/60), m=min%60;
  if(!h) return m+' min';
  return h+' h'+(m?' '+m+' min':'');
}

/* Repintar SIN que se note: `pintar()` reconstruye `#main`, asi que el navegador manda el
   scroll a cero y parece que la app se ha recargado. Cuando el repintado no lo ha pedido el
   usuario -llega un dato de fondo- hay que devolverlo a donde estaba. */
function _repintarSuave_(){
  var m=document.getElementById('main');
  var y=m?m.scrollTop:0;
  pintar();
  if(m && y) m.scrollTop=y;
}
function pintar(){
  var f=VISTAS[ST.vista];
  var el=$('#v-'+ST.vista);
  if(f&&el){ el.innerHTML=f(); el.classList.add('entra'); setTimeout(function(){el.classList.remove('entra');},360); }
  $$('.vis').forEach(function(s){s.classList.toggle('on', s.id==='v-'+ST.vista);});
  pintarNav();
  colocarViaje(false);
  if(ST.vista==='estado'){ armarMedidor(); animarBarras(el); }
  if(ST.vista==='horas'){ animarBarras(el); animarDeltas(el); }
  if(ST.vista==='fichar'){ medirAristas(); validarFichaje(); }
  enganchar();
}
function irA(k){
  /* Al abrir Reuniones se pide ya, sin esperar al reloj: entras justo para ver quien ha
     contestado, y esperar 20 s para eso es raro. */
  if(k==='reu') setTimeout(_refrescarReuAbierta_, 60);
  if(k===ST.vista) return;
  /* pintar() recoloca el indicador y deja ultimoX en la posicion NUEVA. Hay que
     guardarla antes y restituirla, o la distancia sale 0 y no vuela nada: ni el
     arco, ni la comba proporcional, ni la estela, ni las chispas. */
  var xPrevio=ultimoX;
  ST.vista=k;
  $('#main').scrollTop=0;
  pintar();
  ultimoX=xPrevio;
  colocarViaje(true);
}

/* ── la estrella que viaja: comba PROPORCIONAL a la distancia ────────────── */
var ultimoX=null;
function colocarViaje(animar){
  var nav=$('#nav'), viaje=$('#viaje'), sombra=$('#sombra'), chi=$('#chispas');
  var act=$('.tab.on',nav); if(!act||!viaje) return;
  var rn=nav.getBoundingClientRect(), ra=act.getBoundingClientRect();
  var x=ra.left-rn.left+ra.width/2;
  var x0=(ultimoX==null)?x:ultimoX;
  var d=Math.abs(x-x0);
  var comba=Math.min(46,12+d*0.22);

  viaje.style.setProperty('--comba','-'+comba.toFixed(0)+'px');
  viaje.style.transform='translateX('+x.toFixed(1)+'px)';
  if(sombra) sombra.style.transform='translateX('+x.toFixed(1)+'px)';

  if(animar && !redu() && d>2){
    [viaje,sombra].forEach(function(el){
      if(!el) return;
      el.classList.remove('vuela'); void el.offsetWidth; el.classList.add('vuela');
      setTimeout(function(){el.classList.remove('vuela');},460);
    });
    /* la estela: Bézier cuadrática revelada por dashoffset */
    var p=$('#estelaP');
    if(p){
      p.setAttribute('d','M '+x0.toFixed(1)+' 3 Q '+((x0+x)/2).toFixed(1)+' '+(3-comba).toFixed(1)+' '+x.toFixed(1)+' 3');
      var L=1; try{L=p.getTotalLength()||1;}catch(e){}
      p.style.strokeDasharray=L; p.style.setProperty('--L',L);
      p.style.animation='none'; void p.getBoundingClientRect();
      p.style.animation='estelaAnim .52s cubic-bezier(.34,1.42,.5,1)';
    }
    /* brillito de aterrizaje */
    if(chi){
      chi.style.transform='translateX('+x.toFixed(1)+'px)';
      chi.classList.remove('on'); void chi.offsetWidth;
      setTimeout(function(){ chi.classList.add('on'); }, 300);
      setTimeout(function(){ chi.classList.remove('on'); }, 820);
    }
  } else if(chi){
    chi.style.transform='translateX('+x.toFixed(1)+'px)';
  }
  ultimoX=x;
}
window.addEventListener('resize',function(){ ultimoX=null; colocarViaje(false); });

/* ═══════════════════════════════════════════════════════════════════════════
   ENGANCHES
   ═══════════════════════════════════════════════════════════════════════════ */
function enganchar(){
  /* nav */
  $$('.tab').forEach(function(t){ t.onclick=function(){ irA(t.dataset.d); }; });
  /* avisos y tarjetas clicables */
  /* Una tarjeta que nombra una reunion concreta debe ABRIR ESA, no dejarte en la que
     estuvieras viendo: si no, pulsas el aviso y aterrizas en otra distinta. */
  $$('[data-ir]').forEach(function(el){ el.onclick=function(){
    /* Si la tarjeta nombra una reunión concreta, abre ESA. Antes te llevaba a Reuniones y
       te dejaba en la que estuvieras viendo, que podía ser otra distinta de la del aviso. */
    var rid=el.dataset.reuid;
    if(rid){
      var r=(REUNIONES_M||[]).filter(function(x){ return String(x.id)===String(rid); })[0];
      if(r){ REUNION=r; _hidratarReuM_(r).then(function(){ pintar(); }); }
    }
    irA(el.dataset.ir);
  }; });

  /* medidor */
  var med=$('#med');
  if(med) med.onclick=function(){ armarMedidor(); };
  var bl=$('#btnLibro');
  if(bl) bl.onclick=function(){
    ST.libro=!ST.libro;
    var lb=$('#libro'), inn=$('#libroIn');
    if(lb&&inn){ lb.style.height = ST.libro ? (inn.offsetHeight+8)+'px' : '0px'; }
    bl.textContent = ST.libro ? 'Ocultar desglose' : 'Desglose de puntos';
  };

  /* fichar */
  $$('#modos button').forEach(function(b){
    b.onclick=function(){ ST.modo=b.dataset.mo; pintar(); };
  });
  var bi=$('#btnIni');
  if(bi) bi.onclick=async function(){
    if(typeof backendOK!=='undefined' && backendOK && SESION){
      bi.disabled=true;
      try{
        var rec=await api.ficharEntrada();
        ST.ses={estado:'corriendo', cloudIni:rec.ini, desde:_hhmmDe_(rec.ini), ult:_hhmmDe_(rec.ini)};
        tost('Fichando. Corre en la nube: aunque cierres la app, sigue contando.');
        pintar();
      }catch(e){ bi.disabled=false; tost('No se pudo fichar entrada: '+((e&&e.message)||e)); }
      return;
    }
    var d=new Date();   // demo local (sin backend)
    ST.ses={estado:'corriendo',ini:Date.now(),acum:0,desde:pad(d.getHours())+':'+pad(d.getMinutes()),ult:pad(d.getHours())+':'+pad(d.getMinutes())};
    pintar(); tost('Sesión abierta.');
  };
  var bp=$('#btnPausa');
  if(bp) bp.onclick=async function(){
    var s=ST.ses;
    if(typeof backendOK!=='undefined' && backendOK && SESION && s.cloudIni){
      bp.disabled=true;
      try{ var f = s.estado==='pausada' ? await api.reanudarFichaje() : await api.pausarFichaje();
        s.pausas=(f&&f.pausas)||s.pausas||[]; var ult=s.pausas[s.pausas.length-1];
        s.estado=(ult&&!ult.fin)?'pausada':'corriendo';
        tost(s.estado==='pausada'?'En pausa. El reloj se queda donde está.':'Reanudada.'); pintar();
      }catch(e){ bp.disabled=false; tost('No se pudo: '+((e&&e.message)||e)); }
      return;
    }
    if(s.estado==='corriendo'){ s.acum=minSes(); s.estado='pausada'; s.ini=null; tost('En pausa. El reloj se queda donde está.'); }
    else { s.estado='corriendo'; s.ini=Date.now(); tost('Reanudada.'); }
    pintar();
  };
  var ba=$('#btnAdel');
  if(ba) ba.onclick=function(){
    /* solo de la maqueta: salta 9 h para ver el ambar de las 10 h y, al segundo
       toque, el autocierre de las 14 h sin esperar todo un dia. */
    ST.ses.acum=minSes()+540;
    if(ST.ses.estado==='corriendo') ST.ses.ini=Date.now();
    pintar();
    tost(minSes()>=600?'Más de 10 h abiertas: ya sale el aviso.':'Reloj adelantado.');
  };
  var bf=$('#btnFin');
  if(bf) bf.onclick=async function(){
    if(typeof backendOK!=='undefined' && backendOK && SESION && ST.ses.cloudIni){
      // en la nube: «fichar salida» SIEMPRE cierra. Si rellenaste la justificación, se declara ya;
      // si no, queda 'sin declarar' y lo justificas luego desde «Tus partes» (caduca a los 7 días).
      bf.disabled=true; var declara=validarFichaje(), f=ST.form;
      tost(declara?'Cerrando y declarando…':'Cerrando sin declarar…');
      try{
        var r=await api.ficharSalida(declara?_imputacion_(f):'', declara?f.just.trim():'', declara?f.cat:null);
        if(r && r.parte) PARTES.unshift(normPMovil(r.parte));
        ST.ses={estado:'parada'}; f.just=''; f.tarea=''; f.detalle='';
        tost(declara?'Fichaje declarado · a la cola de tu coordinador.':'Fichaje cerrado SIN declarar. Decláralo desde «Tus partes».');
        irA('horas');
      }catch(e){ bf.disabled=false; tost('No se pudo cerrar: '+((e&&e.message)||e)); }
      return;
    }
    var min=minSes();   // demo local: congela el reloj y abre la justificación
    ST.ses.acum=min; ST.ses.estado='pausada'; ST.ses.ini=null;
    ST.form.origen='turno';
    tost('Sesión de '+nf(horasSesion(),2)+' h cerrada. Falta la justificación.');
    pintar();
    var t=$('#fJust'); if(t) t.focus();
  };
  var fc=$('#fCat');
  if(fc) fc.onchange=function(){ ST.form.cat=fc.value; ST.form.tarea=''; ST.form.detalle=''; pintar(); };
  var ft=$('#fTarea');
  if(ft) ft.onchange=function(){ ST.form.tarea=ft.value; if(ft.value==='__otro__'){ ST.form.detalle=''; pintar(); } else validarFichaje(); };
  var fd=$('#fDetalle');
  if(fd) fd.oninput=function(){ ST.form.detalle=fd.value; validarFichaje(); };
  var fj=$('#fJust');
  if(fj) fj.oninput=function(){ ST.form.just=fj.value; validarFichaje(); };
  var ff=$('#fFecha');
  if(ff) ff.oninput=function(){ ST.form.fecha=ff.value; };
  ['fIni','fFin'].forEach(function(id){
    var e=$('#'+id);
    if(e) e.onchange=function(){
      ST.form[id==='fIni'?'ini':'fin']=e.value;
      var q=$('#fDurQ'); if(q) q.textContent=nf(durForm(),2)+' h';
      validarFichaje();
    };
  });
  $$('[data-add]').forEach(function(b){
    b.onclick=function(){
      var add=+b.dataset.add;
      var p=ST.form.fin.split(':'); var m=(+p[0]*60 + +p[1] + add + 1440)%1440;
      ST.form.fin=pad(Math.floor(m/60))+':'+pad(m%60);
      var s=$('#fFin'); if(s) s.value=ST.form.fin;
      var q=$('#fDurQ'); if(q) q.textContent=nf(durForm(),2)+' h';
      validarFichaje();
    };
  });
  var be=$('#btnEnviar');
  if(be) be.onclick=enviarFichaje;
  $$('[data-declarar]').forEach(function(b){ b.onclick=function(){ ST.form.declararId=+b.dataset.declarar; ST.form.cat='tareas'; ST.form.tarea=''; ST.form.detalle=''; ST.form.just=''; irA('fichar'); }; });
  var bcd=$('[data-canceldecl]'); if(bcd) bcd.onclick=function(){ ST.form.declararId=null; ST.form.just=''; irA('horas'); };

  /* reuniones */
  var bc=$('#btnCubrir'); if(bc) bc.onclick=cubrirModal;
  var bcr=$('#btnCrear'); if(bcr) bcr.onclick=crearModal;
  $$('[data-reu]').forEach(function(el){ el.onclick=async function(){ var x=REUNIONES_M[+el.dataset.reu]; if(x){ REUNION=x; pintar(); await _hidratarReuM_(x); pintar(); } }; });
  $$('#calModo button').forEach(function(b){ b.onclick=function(){ ST.pond=(b.dataset.pond==='1'); pintar(); }; });
  var bfj=$('#btnFijar'); if(bfj) bfj.onclick=fijarModal;
  /* Desfijar tampoco viajaba (agujero H14): se borraba en memoria y al recargar volvia.
     Y reabre la disponibilidad de TODO el equipo, asi que se confirma. */
  var bdf=$('#btnDesfijar');
  if(bdf) bdf.onclick=async function(){
    if(bdf.disabled) return;
    var R2=REUNION; if(!R2) return;
    if(typeof backendOK==='undefined' || !backendOK || !SESION){
      tost('Sin conexión no se puede cancelar el fijado.'); return; }
    if(!confirm('Cancelar la fecha fijada de «'+R2.titulo+'».'+String.fromCharCode(10,10)+
      'Se reabre la disponibilidad para todo el equipo. ¿Seguro?')) return;
    bdf.disabled=true;
    try{ await api.fijar(R2.id, null); R2.fijada=null; R2.fijadaBl=[];
      tost('Fijado cancelado: se reabre la disponibilidad.'); pintar();
    }catch(e){ bdf.disabled=false; tost('No se pudo cancelar: '+((e&&e.message)||e)); }
  };
  var bod=$('#btnOrden');
  if(bod) bod.onclick=function(){
    abrirModal('<div class="mtit">Orden del día</div>'+
      '<div class="msub">Pega el enlace del PDF o del documento de Drive. Basta con compartirlo con el dominio '+
      '<b>uvigoaerotech.com</b>: no hace falta que sea público.</div>'+
      '<label class="campo"><span class="sc">Enlace</span><input id="odIn" placeholder="https://drive.google.com/…"></label>'+
      '<button class="btn pri full" data-p data-cerrar>Guardar</button>');
  };
  /* BORRAR DE VERDAD (era el agujero H12: el boton solo se disculpaba). Se lleva por
     delante la disponibilidad que haya cubierto la gente, y eso no se deshace: se dice
     cuanta gente respondio ANTES de preguntar. */
  var bb=$('#btnBorrar');
  if(bb) bb.onclick=async function(){
    if(bb.disabled) return;
    var R=REUNION; if(!R) return;
    if(!_puedeBorrarReuM_(R)){ tost('Solo puede eliminarla quien la convocó.'); return; }
    if(typeof backendOK==='undefined' || !backendOK || !SESION){
      tost('Sin conexión no se puede eliminar una reunión.'); return; }
    var nResp=Object.keys(R.resp||{}).filter(function(n){
      return (R.resp[n]||[]).some(function(v){ return +v>0; }); }).length;
    var aviso='Eliminar «'+R.titulo+'».'+String.fromCharCode(10,10)+
      (nResp? ('Se borra también la disponibilidad que ya cubrieron '+nResp+' persona'+(nResp===1?'':'s')+'.')
            : 'Todavía no la ha cubierto nadie.')+
      String.fromCharCode(10)+'Esto no se puede deshacer. ¿Seguro?';
    if(!confirm(aviso)) return;
    bb.disabled=true; var prev=bb.textContent; bb.textContent='Eliminando…';
    try{
      await api.borrarReunion(R.id);
      var ix=REUNIONES_M.findIndex(function(x){ return x.id===R.id; });
      if(ix>=0) REUNIONES_M.splice(ix,1);
      REUNION=_proximaReuM_()||REUNIONES_M[0]||REUNION;
      ST.sel=null; ST._selDe=null;              // la seleccion era de la que ya no existe
      tost('Reunión eliminada.');
      pintar();
    }catch(e){ bb.disabled=false; bb.textContent=prev;
      tost('No se pudo eliminar: '+((e&&e.message)||e)); }
  };

  /* cajones plegables */
  $$('[data-caj]').forEach(function(b){
    b.onclick=function(){
      var s=b.nextElementSibling; if(!s) return;
      var ab=s.classList.toggle('on'); b.classList.toggle('ab',ab);
    };
  });
  /* turnos y documentos */
  $$('[data-turno]').forEach(function(el){
    el.onclick=function(){
      var t=TURNOS.filter(function(x){return x.id===el.dataset.turno;})[0]; if(!t) return;
      var lista=function(a,tit){ return (a&&a.length)?'<h4>'+tit+'</h4><ul class="obj">'+
        a.map(function(o){return '<li>'+esc(o)+'</li>';}).join('')+'</ul>':''; };
      abrirModal('<div class="mtit">'+t.f+'</div>'+
        '<div class="msub">'+esc(t.punto)+' · '+t.hora+' · '+t.dur+'</div>'+
        '<h4>Quién va</h4><div class="tarj" style="margin:0">'+t.roles.map(function(r){
          return '<div class="fila'+(r[2]?' yo':'')+'"><div class="a"><b>'+esc(r[0])+'</b>'+
            '<small>'+esc(r[1])+'</small></div></div>';
        }).join('')+'</div>'+
        lista(t.principales,'Objetivos principales')+lista(t.secundarios,'Objetivos secundarios')+
        (t.nota?'<p class="rnota" style="margin-top:10px"><b>Nota:</b> '+esc(t.nota)+'</p>':'')+
        /* la memoria se incrusta como DOCUMENTO (igual que un orden del día), no como
           un enlace suelto: se ve que hay un papel detrás y se abre desde ahí. */
        (t.memoria ? _memoriaHTML_(t)
          : '<p class="rnota" style="margin-top:14px;border-top:1px solid var(--line);padding-top:11px">'+
            'Memoria del turno · <span style="color:var(--ink3)">aún no subida</span></p>'));
      _cablearMemoria_();
    };
  });
  $$('[data-doc]').forEach(function(el){ el.onclick=function(){ verDoc(+el.dataset.doc); }; });
  var _bn=$('#btnNotis'); if(_bn) _bn.onclick=function(){ activarNotis(_bn); };
  var _bm=$('#btnMenu'); if(_bm) _bm.onclick=function(){ _abrirMenu_(true); };
  var _mn=$('#menu');
  if(_mn) _mn.onclick=function(ev){ if(ev.target===_mn) _abrirMenu_(false); };
  $$('#menu [data-mnu]').forEach(function(b){
    b.onclick=function(){
      var q=b.dataset.mnu;
      _abrirMenu_(false);
      if(q==='salir'){ cerrarSesion(); return; }
      if(q==='buzon'){ buzonModal('bug'); return; }
      if(q==='equipo'){ abrirModal(_coordinacionHTML_()); return; }
      if(q==='ajustes'){ abrirModal(_ajustesHTML_());
        var b2=$('#btnNotis'); if(b2) b2.onclick=function(){ activarNotis(b2); }; }
    };
  });

  /* bloque de sanciones: MARCAR no aplica nada */
  $$('.decs button').forEach(function(b){
    b.onclick=function(){
      var id=+b.parentNode.dataset.lid;
      LOTE.items.forEach(function(x){ if(x.id===id) x.dec=b.dataset.dec; });
      pintar();
    };
  });
  var blt=$('#btnLote');
  if(blt) blt.onclick=function(){
    LOTE.cerrado=true; tost('Bloque cerrado. Entra entero.'); pintar();
  };
  var bsn=$('#btnSancionar'); if(bsn) bsn.onclick=sancionarModal;
}
/* decisiones sobre un documento (dentro del modal) */
document.addEventListener('click',function(ev){
  var b=ev.target&&ev.target.closest?ev.target.closest('[data-dec][data-id]'):null;
  if(!b) return;
  var acc=b.dataset.dec, id=+b.dataset.id;
  var e=ENTREGABLES.concat(ENT_REV).filter(function(x){return x.id===id;})[0];
  if(!e) return;
  var mot=($('#dMot')&&$('#dMot').value||'').trim();
  if((acc==='cambios'||acc==='rechazado') && !mot){
    if($('#dMot')){ $('#dMot').focus(); $('#dMot').style.borderColor='var(--red)'; }
    tost('Cambios y rechazo exigen motivo.');
    return;
  }
  /* Aplica la decision al objeto local. Se usa DESPUES de que el servidor la acepte, o
     directamente cuando no hay backend (maqueta). */
  var _aplicar=function(){
    if(acc==='reenviar'){ e.estado='revision'; e.nota=null; }
    else if(acc==='aprobado'||acc==='anot'){
      if(acc==='anot'){ var nt=(($('#dTit')&&$('#dTit').value)||'').trim(); if(nt) e.titulo=nt; }
      e.estado='publicado';
    }
    else if(acc==='cambios'){ e.estado='cambios'; e.nota=mot; }
    else { e.estado='rechazado'; e.nota=mot; }
    if(acc!=='reenviar') e.revisor=_pilaDeM_(yoNombre());   /* constancia de quien decidio */
  };
  var _aviso={reenviar:'Reenviado a revisión.',
    aprobado:'Aprobado · publicado en Notion y en el Libro de Datos.',
    anot:'Aprobado con anotaciones · título ajustado.',
    cambios:'Cambios pedidos: le llega al autor.',
    rechazado:'Rechazado.'}[acc]||'Hecho.';

  /* PERSISTE. Antes esto solo mutaba memoria: el revisor creia que habia firmado y no
     habia firmado nada. Si el servidor dice que no, no se toca el estado ni se miente. */
  if(typeof backendOK!=='undefined' && backendOK && SESION){
    if(b.disabled) return;
    b.disabled=true;
    var extra=null;
    if(acc==='anot'){ var t2=(($('#dTit')&&$('#dTit').value)||'').trim(); if(t2) extra={titulo:t2}; }
    api.decidir(id, acc, mot||null, extra).then(function(){
      _aplicar(); cerrarModal(); tost(_aviso); pintar();
    }).catch(function(err){
      b.disabled=false;
      tost('No se pudo registrar la decisión: '+((err&&err.message)||err));
    });
    return;
  }
  _aplicar(); cerrarModal(); tost(_aviso+' (sin conexión: solo en este teléfono)'); pintar();
});

/* reloj de la barra de estado + cronómetro de la sesión */
setInterval(function(){
  var d=new Date();
  var r=$('#reloj'); if(r) r.textContent=pad(d.getHours())+':'+pad(d.getMinutes());
  if(!ST.ses.cloudIni && ST.ses.estado==='corriendo' && minSes()>=840){
    /* 14 h (solo en DEMO local): la sesión se cierra sola. En la nube esto lo hace el
       backend (cerrarFichajesVencidos, barrido del gate), no el navegador. */
    ST.ses.acum=840; ST.ses.estado='pausada'; ST.ses.ini=null;
    tost('Sesión cerrada automáticamente a las 14 h. Ajústala antes de enviarla.');
    if(ST.vista==='fichar') pintar();
  }
  if(ST.vista==='fichar' && ST.ses.estado==='corriendo'){
    var el=$('#relSes'); if(el) el.innerHTML=fmtHM(minSes());
    var s=$('#sesion'); if(s) s.classList.toggle('larga', minSes()>=600);
    var e2=$('#estSes'); if(e2 && minSes()>=600) e2.textContent='MÁS DE 10 H ABIERTA · CIÉRRALA';
  }
}, 1000);

/* conmutador de rol — solo de la maqueta: enseña los tres estados de la app
   (miembro · coordinador · PD) sin tener que cambiar de cuenta. */

    else { n.textContent='Nerea'; r.textContent='ESTRUCTURAS · MIEMBRO'; }
    pintar();
  };
});

/* arranque */
pintar();
setTimeout(function(){ colocarViaje(false); }, 60);

   los navegadores la rotan y, si no se vuelve a guardar, los avisos dejan de llegar sin
   que nadie se entere. No pide permiso por su cuenta: eso solo pasa si pulsas el boton. */
setTimeout(function(){ try{ _pushInit_(); }catch(_){} }, 800);

   (<50 min) sin pasar por Google; si no, muestra el gate de marca. La app publicada
   NUNCA entra a datos falsos. */
if(GOOGLE_CLIENT_ID && !DEMO){
  _gate_(SPLASH+'<div style="opacity:.7">Cargando…</div>');
  var _sg=null; try{ _sg=JSON.parse(localStorage.getItem('sol_sess')||'null'); }catch(_){}
  var _tok=(_sg && _sg.token && (Date.now()-(_sg.ts||0) < 50*60*1000)) ? _sg.token : null;
  if(_tok) _onCredencial_({credential:_tok}, true);
  else _arrancarGis_();
}
