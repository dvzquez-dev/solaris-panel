untos de la temporada.\n- La **compensación en horas** de un reporte sale de una **matriz ponderada redondeada a cuartos**,\n  con la escala de **0,25 «algo normal»** a **2,00 «un bug crítico»**. El techo son 2 h; por encima\n  las da Daniel a mano.\n- **Manda el número que teclees**: se quitó el redondeo que pisaba el valor escrito. Redondear vale\n  para lo que **propone** la app, no para lo que decide una persona.\n- **Las mejoras ya se valoran**. Antes todas caían en el escalón mínimo dieran lo que dieran: el\n  eje que decide se estaba guardando en una columna que el buzón de mejoras no tiene, y se perdía\n  sin avisar. Ahora una mejora se valora por **`valor`** (Alto · Medio · Bajo) y se ve en su\n  tarjeta. **Una mejora topa en 1,50 h**; las 2 h se quedan para un bug crítico.\n\n- 🔴 **Las notificaciones del escritorio no se registraban en el servidor.** Se activaban, se\n  veía «Notificaciones activadas»… y el aviso no llegaba nunca, o dejaba de llegar cuando el\n  navegador renovaba la suscripción. Faltaba una línea (`api.guardarPush`) que sí estaba en el\n  móvil, y el fallo se lo tragaba un `catch` vacío: **llevaba roto desde siempre, sin dar señal.**\n- **Se arregló que no se pudieran otorgar horas.** La ficha de un reporte ya publicado no\n  llegaba a pintarse, que es justo donde se compensa.\n\n- **El cierre mensual ya se ve entero aquí, y se puede aplicar.** Antes esta pantalla se quedaba\n  en «plan calculado» pasara lo que pasara: no sabía si el cierre ya estaba aplicado —decía «no se\n  ha aplicado nada» con las 32 fichas ya escritas—, no enseñaba qué le cambiaba a cada persona, y\n  el botón de aplicar solo existía en el móvil. Ahora hay **tabla con el cambio de cada uno**,\n  estado real (**aplicado** · **parado a medias**, con cuántas fichas y cuáles faltaron) y\n  **botón de aplicar**.\n- **Recalcular un cierre ya aplicado avisa antes.** Sobreescribe el plan y deja la pantalla sin\n  saber que el mes se cerró (lo escrito en Notion no se toca). A s y mejoras**, cuatro buzones separados (bug/mejora × móvil/escritorio). Se reporta\n  desde el menú ⋮ y **la cara va dentro del identificador**, para que se sepa de qué se habla.\n- **Fotos en el reporte, con pintor encima**: adjuntas una imagen, se abre a pantalla completa y la\n  marcas —paleta, tres grosores, deshacer, zoom con dos dedos—; al enviar se fusionan las capas.\n- **Poner y decidir sanciones**, con su **modelo de autoridad**: cada uno solo alcanza a quien le\n  corresponde, y **lo comprueba el servidor**, no solo la pantalla.\n- **Un solo visor de documentos**, con pantalla completa. Antes había tres copias distintas.\n- El **fichaje reintenta** cuando el envío se pierde por el camino. Antes fallaba a la primera y\n  decía «respuesta no válida».\n\n**🖥️ Escritorio**\n\n- **Convocar reunión** con horario **distinto por día** (con días apagables) y **copiar la\n  distribución** de otra reunión.\n- La **propuesta de compensación en horas**, editable y junto al reporte.\n- **Cola de sanciones**: aceptar o rechazar todas, editar una suelta y agrupar en un paquete.\n\n**⚙️ Backend v43 → v51**\n\n- Buzón: estados, anotaciones y capturas a Drive.\n- Preferencias de notificación, con el filtro **en el servidor**.\n- `getFichajesAbiertos` y `getDatos`.\n- `moverLimiteTarea`: mueve la fecha límite de una tarea **en Notion**.\n- La **autoridad de sanciones**, comprobada por persona.\n- **Último acceso** de cada persona, el dato que pide la regla semanal del RRI.\n- El **id de Notion** se lee bien aunque el título lleve guiones.\n\n---\n\n## Antes de los números — hasta el 28/07/2026, 07:37\n\nLo que había en producción **sin versión**: la app se publicaba directamente y el backend iba por su\ncuenta. No hay historial versión a versión porque no se numeraba; esto es el resumen de lo que ya\nfuncionaba cuando empezaron los números.\n\n**Las dos caras**\n\n- **Reuniones y disponibilidad** propias, en sustitución de Xoyondo y when2meet: convocar con tipos\n  gateados V.panel={g:'Operación',t:'Panel de mando',f:function(){
  var cola=colaDecision();
  /* Con la forma MIEMBRO el backend solo manda identidad de los demas (nombre,
     pila, unidad, cargo): no hay puntos ni horas ajenas. Se agrega SOLO sobre
     quien trae el dato, y si no hay nadie se dice, en vez de pintar NaN. */
  /* SOLO LOS ACTIVOS (decision de Daniel, 27/07). El roster son 32 con 9 de baja; contarlas
     ponia «13 en infraccion, 41 %» cuando de esos 13 habia 7 que ya se habian ido: la cifra
     real es 6 de 23, un 26 %. Y la media de horas subia de 17,70 a 19,70. Su historia se
     conserva en su ficha y en el cierre; en la foto del equipo, no. */
  var EQUIPO=_activos_();
  var conPts=EQUIPO.filter(function(m){return typeof m.puntos==='number';});
  var conH  =EQUIPO.filter(function(m){return typeof m.hMes==='number';});
  var media=conPts.length?conPts.reduce(function(a,m){return a+m.puntos;},0)/conPts.length:null;
  var totH =conH.reduce(function(a,m){return a+m.hMes;},0);
  var bajo =conH.filter(function(m){return m.hMes<UMBRAL;}).length;
  var infra=EQUIPO.filter(function(m){return m.infraccion;}).length;
  var parcial = conH.length < EQUIPO.length;
  /* ESTE MES: `hMes` es el campo vivo de Notion «Horas empleadas (este mes)» y SI son las
     de este mes. Lo di por falso comparandolo contra un snapshot viejo; ver `_hMesReal_`. */
  var baseMes=conH, mesReal=conH.length>0;
  var totMes=baseMes.reduce(function(a,m){ return a+m.hMes; },0);
  var enAire=pendientes().reduce(function(a,p){return a+p.horas;},0);

  var lista = cola.length
    ? cola.map(function(x){
        return '<div class="dec" data-ir="'+x.ir+'" data-foco="'+x.foco+'">'+
          '<span class="ic"><svg><use href="#'+x.ic+'"/></svg></span>'+
          '<span class="tx"><b>'+x.b+'</b><small>'+x.s+'</small></span>'+
          '<span class="der">'+x.chip+'<span class="chev">›</span></span></div>';
      }).join('')
    : vacioSimple('Nada requiere tu decisión','No hay partes de horas, expedientes ni sanciones esperando tu firma. Lo que te toque decidir aparecerá aquí.');

  return pan('Requiere tu decisión',cola.length+' asuntos',lista,'destaca')+
    '<div class="kpis">'+
      kpi('Horas en el aire',nf(enAire,1)+'<small> h</small>','no cuentan hasta que se firmen','wa')+
      kpi('Expedientes esperándote',docsMios().length,'los firmas tú',docsMios().length?'wa':'up')+
      /* Se compara la MEDIA de la temporada, no lo que lleve este mes: el umbral tambien
         es una media por mes, y contrastar un mes a medias contra un listón de mes
         entero marcaría a todo el equipo cada día 2. La etiqueta lo dice. */
      kpi('Bajo el umbral',bajo,'de '+conH.length+' · media de temporada bajo '+nf2(UMBRAL)+' h/mes','wa',(conH.length?(bajo/conH.length*100).toFixed(0):0)+'%')+
      kpi('En infracción este mes',infra,'marcados en Notion',infra?'dn':'up',(EQUIPO.length?(infra/EQUIPO.length*100).toFixed(0):0)+'%')+
    '</div>'+
    '<div style="display:grid;grid-template-columns:300px 1fr;gap:13px;align-items:start">'+
      pan('Conducta del equipo', media==null?'sin datos':('media de '+conPts.length),
        '<div class="pb" style="display:flex;flex-direction:column;align-items:center;gap:12px">'+
          (media==null
            ? vacioSimple('Sin puntos del equipo','Tu cuenta solo ve el nombre, la unidad y el cargo del resto del '+
                'equipo, no sus puntos. Si necesitas la conducta del equipo, pídesela al Project Director.')
            : anilloHTML(media,'media del equipo'))+
          '<p style="margin:0;font-size:11.5px;color:var(--ink3);line-height:1.6;text-align:center">'+
          'Media de puntos de todo el equipo, sobre 10. Los tres primeros tramos, en '+
          '<b style="color:var(--ink2)">ámbar</b>, son la zona de riesgo disciplinario.</p></div>')+
      pan(mesReal?'Este mes':'Media de la temporada', mesReal?'julio 2026':'sobre '+baseMes.length+' personas',
        '<div class="pb">'+
          '<div class="chips">'+
            '<span class="chip">TOTAL <b style="color:var(--ink)">'+h1(totMes)+'</b>'+(parcial?' <span style="color:var(--warn)">(parcial)</span>':'')+'</span>'+
            '<span class="chip">MEDIA <b style="color:var(--ink)">'+(baseMes.length?nf(totMes/baseMes.length,1):'—')+' h</b></span>'+
            '<span class="chip">OBJETIVO <b style="color:var(--ink)">'+h1(UMBRAL)+'</b></span>'+
            '<span class="chip">CIERRA <b style="color:var(--ink)">31/07</b></span>'+
          '</div>'+
          insightsHTML()+
        '</div>')+
    '</div>';
}};

V.registro={g:'Horas',t:'Registro del mes',f:function(){

    vacioSimple('Sin horas del equipo','Tu cuenta solo tiene acceso a tus propias horas, no a las del resto. '+
      'Si necesitas el registro completo del mes, pídeselo al Project Director.'));
  var tot=VIS.reduce(function(a,m){return a+(m.hMes||0);},0);
  return '<div class="chips"><span class="chip">TOTAL <b style="color:var(--ink)">'+h1(tot)+'</b></span>'+
    '<span class="chip">MEDIA <b style="color:var(--ink)">'+h1(tot/VIS.length)+'</b></span>'+
    '<span class="chip">OBJETIVO <b style="color:var(--ink)">'+h1(UMBRAL)+'/mes</b></span>'+
    (VIS.length<DATA.miembros.length?'<span class="chip wa">solo '+VIS.length+' de '+DATA.miembros.length+' visibles</span>':'')+'</div>'+
    pan('Horas por miembro · julio 2026','confirmadas',
      tabla([['Miembro'],['Unidad'],['Julio',1],['Junio',1],['Δ',1],['vs. objetivo',1]],
        VIS.slice().sort(function(a,b){return (b.hMes||0)-(a.hMes||0);}).map(function(m){

          var hay=(m.hAnt!=null && m.hAnt>0);

/* ── CIERRE MENSUAL ──────────────────────────────────────────────────────── */
/* Estado del cierre traido del backend. `null` = todavia no se ha preguntado; distinguirlo
   de «no hay nada» importa, o la pantalla diria que todo esta listo sin haber mirado. */
var CIERRE=null, CIERRE_ERR=null;


/* El mes que se CIERRA no es el que corre. Lo dijo Daniel el 04/08: «el cierre va del anterior
   cierre al cierre actual», y se lanza cuando el mes ya ha terminado — o sea que el 4 de agosto
   lo que se cierra es JULIO.
   ⛔ Antes esta pantalla decía el mes EN CURSO («Cerrar agosto» el día 4) y el botón no mandaba
   periodo, así que el backend caía a `_periodoActual_()` y encolaba **2026-08**. El contenido
   habría sido el correcto —lo acumulado desde el corte anterior— pero etiquetado como agosto
   siendo casi todo julio, y esa etiqueta es la que acaba en el nombre del plan, en el registro
   de lo aplicado y en el histórico. */


V.cierre={g:'Horas',t:'Cierre mensual',f:function(){
  var fin=_finDeMes_(), cer=_mesACerrar_();
  if(CIERRE===null && !CIERRE_ERR)
    return pan('Cierre de '+cer.mes,'comprobando…',
      '<div class="nota" style="border-top:0">Preguntando al servidor en qué punto está el cierre…</div>');
  if(CIERRE_ERR)
    return pan('Cierre de '+cer.mes,'no se pudo comprobar',
      vacioSimple('No se pudo leer el estado del cierre', esc(CIERRE_ERR)+'. No es que esté todo listo: '+
        'es que no se ha podido comprobar, y cerrar a ciegas mueve la cuota de 32 personas.'));
  var bloq=(CIERRE.bloqueos)||[], enc=CIERRE.encolado||null, plan=CIERRE.plan||null;
  /* Los bloqueos los da el SERVIDOR mirando el dato. La vista ya no los deduce por su
     cuenta: si la cuenta local y la del backend no coinciden, gana la del backend, que es
     la que va a decidir si deja cerrar. */
  var listo=!bloq.length;
  /* ⛔ El estado se leia del plan y PARABA en «calculado»: aplicado y parado-a-medias no
     existian en esta cara, asi que un cierre ya escrito en 32 fichas de Notion se veia
     igual que uno recien calculado. `aplicado` sale del registro, no de esta pasada. */
  var res=plan?(plan.resultado||null):null, hecho=!!(plan&&(plan.aplicado||res));
  var estado = (plan&&plan.parado) ? ['PARADO A MEDIAS','no']
             : hecho ? ['APLICADO','ok']
             : plan ? ['PLAN CALCULADO','ok'] : enc ? ['CALCULÁNDOSE','wa']
             : listo ? ['LISTO PARA CALCULAR','ok'] : ['BLOQUEADO','no'];
  var pasos=[
    ['Decidir los partes de horas', !bloq.filter(function(b){return b.que==='partes';}).length,
     (bloq.filter(function(b){return b.que==='partes';})[0]||{}).texto || 'todo decidido'],
    ['Confirmar las sanciones pendientes', !bloq.filter(function(b){return b.que==='sanciones';}).length,
     (bloq.filter(function(b){return b.que==='sanciones';})[0]||{}).texto || 'ninguna sin confirmar']
  ];

       franja al reordenarlas —los calcula bien, línea a línea— y este `Object.assign` se
       quedaba solo con `franjas` y `bloques`, así que sobrevivía el índice VIEJO.
       Efecto: la Reunión General llegó de Xoyondo con las franjas 18,19,20,21,22,10,11…17;
       ordenadas, el índice 4 pasa de ser las 22:00 a ser las 14:00. El verde se pintaba —
       ocho horas antes de la reunión. Dos fallos encadenados: primero el dato no llegaba
       (`normReu` lo tiraba) y, en cuanto llegó, se pintaba en la hora equivocada. */
    if(_o.cambio) r0=Object.assign({}, r0, {franjas:_o.franjas, bloques:_o.bloques,
                                            fijadaBl:_o.fijadaBl, calor:null});
    var r=Object.assign({}, r0, {calor:_calorDe_(r0, pondOn), _hib:hib, _pond:pondOn, conv:(r0.conv!=null?r0.conv:cob.conv),
      cubren:(r0.cubren!=null?r0.cubren:cob.cubren), minimo:cob.minimo,
      sinCubrir:(r0.sinCubrir||cob.sinCubrir), bajoMin:(r0.bajoMin||cob.bajoMin),
      mod:r0.mod||r0.modalidad, tit:r0.tit||r0.titulo, limite:r0.limite||'sin l\u00edmite'});
    var max=0; r.calor.forEach(function(f){f.forEach(function(v){if(v!=null&&v>max)max=v;});});
    var best={d:0,f:0,v:-1};
    r.calor.forEach(function(f,di){f.forEach(function(v,fi){if(v!=null&&v>best.v)best={d:di,f:fi,v:v};});});
    var g='';
    if(hib) g+='<div class="decs" style="margin-bottom:9px">'+
      '<button data-pond="0" class="'+(pondOn?'':'on')+'">Personas</button>'+
      '<button data-pond="1" class="'+(pondOn?'on':'')+'">Ponderada</button></div>';
    /* EJE DE TIEMPO, no una columna por franja (portado del movil, 27/07).

       `repeat(nFranjas)` solo es cierto si todas duran lo mismo y van seguidas, y no es el
       caso: las reuniones de antes del modelo de slot traen franjas de 60 min SOLAPADAS cada
       30. Con columnas iguales, una franja de 30 min ocupaba lo mismo que una de 2 h y el
       mapa mentia sobre el tiempo — que es justo lo unico que se le pide.

       El eje se trocea en pasos finos, pero la FRANJA NO SE TROCEA: cada una es una celda
       con `span k`, ancha lo que dura, con su numero una vez. (Trocearla ponia el numero
       solo donde arranca y salia «3 · 3 · 3 ·», como si en la mitad no pudiera nadie.) */
    var _fj={};
    (r.fijadaBl||[]).forEach(function(b){
      var f=r.franjas[b[1]]; if(!f) return;
      var a=_minHM_(f), z=a+_duF(f), q=_fj[b[0]];
      _fj[b[0]] = q ? [Math.min(q[0],a), Math.max(q[1],z)] : [a,z];
    });
    /* La fijada se pinta por RANGO DE MINUTOS y no por indice de franja: con franjas que se
       solapan, el indice no identifica un rato. Le paso al movil y no se veia. */
    var _esFijada_=function(di,t,hasta){ var q=_fj[di]; return !!q && t>=q[0] && hasta<=q[1]; };
    var _paso=0; r.franjas.forEach(function(f){ _paso=_mcd_(_paso,_minHM_(f)); _paso=_mcd_(_paso,_duF(f)); });
    _paso=Math.max(15, Math.min(60, _paso||60));
    var _t0=Math.min.apply(null, r.franjas.map(_minHM_));
    var _t1=Math.max.apply(null, r.franjas.map(function(f){ return _minHM_(f)+_duF(f); }));
    var _eje=[]; for(var _t=_t0; _t<_t1; _t+=_paso) _eje.push(_t);
    /* que franja OFERTADA cubre cada instante de cada dia (-1 = ninguna) */
    var _cubre=r.dias.map(function(_,di){
      return _eje.map(function(t){
        for(var fi=0; fi<r.franjas.length; fi++){
          if(r.calor[di][fi]==null) continue;
          var a=_minHM_(r.franjas[fi]);
          if(t>=a && t<a+_duF(r.franjas[fi])) return fi;
        }
        return -1;
      });
    });
    g+='<div class="heat"><div class="hg" style="grid-template-columns:auto repeat('+_eje.length+',minmax(20px,1fr))">';
    g+='<div class="hc"></div>';
    /* etiqueta al LIMITE izquierdo (= hora de inicio) y solo en punto: decision cerrada. */
    _eje.forEach(function(t){
      g+='<div class="hc rh">'+((t%60===0)?'<span>'+pad(Math.floor(t/60)%24)+'</span>':'')+'</div>';
    });
    r.dias.forEach(function(d,di){
      g+='<div class="hc rd">'+d+'</div>';
      var ix=0;
      while(ix<_eje.length){
        var fi=_cubre[di][ix], k=1;
        while(ix+k<_eje.length && _cubre[di][ix+k]===fi) k++;      // hasta donde llega la franja
        var _ta=_eje[ix], _tz=(ix+k<_eje.length? _eje[ix+k] : _t1);
        var geo='grid-column:span '+k;
        if(fi<0){
          /* Fuera del horario de ese dia... salvo que ahi este la FIJADA, que es una
             decision y tiene que verse aunque esa franja no se ofertara. */
          if(_esFijada_(di,_ta,_tz)) g+='<div class="cel" title="reuni\u00f3n fijada" style="'+geo+';background:rgba(53,199,89,.85)"></div>';
          else g+='<div class="cel" style="'+geo+';background:transparent"></div>';
        } else {
          var v=r.calor[di][fi], a=max?(0.12+0.88*v/max).toFixed(3):'0.12';
          var fij=_esFijada_(di,_ta,_tz);
          g+='<div class="cel'+((di===best.d&&fi===best.f)?' best':'')+'" title="'+
            _hmMin_(_minHM_(r.franjas[fi]))+'\u2013'+_hmMin_(_minHM_(r.franjas[fi])+_duF(r.franjas[fi]))+' \u00b7 '+v+'" style="'+geo+';'+
            'background:'+(fij?'rgba(53,199,89,.85)':'rgba(228,30,37,'+a+')')+'">'+v+'</div>';
        }
        ix+=k;
      }
    });
    g+='</div></div>';
    g+='<div class="nota" style="margin-top:7px">'+(pondOn
      ? 'El número son <b>puntos</b>: presencial y telemático 2 · solo telemático 1. Las celdas vacías son franjas que <b>no se ofrecieron</b>.'
      : 'El número es <b>cuánta gente puede</b>. Las celdas vacías son franjas que <b>no se ofrecieron</b>.')+'</div>';
    var riesgo=r.sinCubrir.map(function(n){
      var s=sancionPor(r.tipo,n), m=miembro(n);
      return '<div class="dec" style="cursor:default"><span class="tx"><b>'+esc(m?m.nombre:n)+'</b>'+
        '<small>no ha cubierto · '+(VECES[n]||0)+' antecedente'+((VECES[n]||0)===1?'':'s')+' esta temporada</small></span>'+
        '<span class="der"><span class="chip '+(s.p===0?'':(s.p>=2?'no':'wa'))+'">'+esc(s.txt)+'</span></span></div>';
    }).join('');
    var bajo=r.bajoMin.map(function(n){
      var m=miembro(n);
      return '<div class="dec" style="cursor:default"><span class="tx"><b>'+esc(m?m.nombre:n)+'</b>'+
        '<small>cubrió por debajo del mínimo exigido · '+_etiquetaMinimo_(r)+'</small></span>'+
        '<span class="der"><span class="chip wa">−1 punto · Art. 30·P3</span></span></div>';
    }).join('');
    return '<div class="acord" id="reu-'+r.id+'"><div class="hh" data-acord>'+
      '<span class="tx"><b>'+esc(r.tit)+'</b><small>'+r.tipo+' · '+(MOD_ET[r.mod]||r.mod)+' · '+r.cubren+' de '+r.conv+
      ' han cubierto · cierra el '+r.limite+'</small></span>'+
      '<span class="chip '+(r.sinCubrir.length||r.bajoMin.length?'no':'ok')+'">'+
        (r.sinCubrir.length+r.bajoMin.length)+' en riesgo</span>'+
      '<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></div>'+
      '<div class="bb"><div style="padding:13px">'+
        '<p style="margin:0 0 11px;font-size:12.5px;color:var(--ink2)">Mejor franja: <b>'+r.dias[best.d]+' '+
        _iniF(r.franjas[best.f])+'</b> — '+Math.max(0,best.v)+' de '+r.conv+' pueden.</p>'+g+
        (riesgo?'<h4 class="sc" style="margin:16px 0 2px">Sin cubrir · sanción que implicaría</h4>'+riesgo:'')+
        (bajo?'<h4 class="sc" style="margin:16px 0 2px">Por debajo del mínimo</h4>'+bajo:'')+
        (!riesgo&&!bajo?'<div class="vac"><b>Nadie en riesgo</b>Todo el mundo ha cubierto y por encima del mínimo.</div>':'')+
        '<div class="nota" style="margin-top:12px;border:0;padding:11px 0 0">El <b>mínimo exigido</b> lo fija el '+
        'RRI (Reforma §P3): hay que marcar el <b>25 %</b> de las franjas ofrecidas de mayo a agosto y en diciembre '+
        'y enero, y el <b>30 %</b> el resto del año.<br>Solo sancionan de oficio la general, la junta y el '+
        'consejo. En la general la escala es <b>0, 1, 2, 2…</b> (la primera vez es un aviso); en junta y consejo, '+
        '<b>1 punto siempre</b>. Las de subsistema, mixtas y de trabajo las decide su coordinador. '+
        'Aquí solo se <b>avisa</b>: todavía no hay nada aplicado.</div>'+
      '</div></div></div>';
  }).join('');
}};

   horas en mi panel del escritorio, modificables tambien». Y el 28/07: «debe ser editable y al
   lado de cada modificacion aprobada, con la propuesta por la matriz».

   LA MATRIZ VIVE AQUI Y SOLO AQUI. Cambiar la escala tiene que ser tocar estos numeros, no

   ⚠️ ESTOS VALORES SON UNA PROPUESTA MIA, NO LA ESCALA DE DANIEL. La suya lleva pendiente
   desde el 27/07 (ver `docs/plan-compensar-reportes.md`). La pantalla lo dice: presentar un
   numero inventado como si fuera suyo es pedirle que firme a ciegas. */
/* ═══ LA ESCALA DE COMPENSACION (Daniel, 29/07) ═══════════════════════════════════
   Dictada por el, literal, y sustituye a la suma de ejes que habia antes -que daba lo MISMO a
   los siete reportes publicados porque todos tocaban el tope-.

   No es una formula: es un JUICIO, en ocho escalones de cuarto de hora. Los ejes del triaje
   (`gravedad`, `alcance`, `calidad`) dejan de sumar horas y pasan a ser lo que siempre debieron
   ser: PISTAS para elegir escalon.

   ⛔ POR ENCIMA DE 2 h NO PROPONE NADIE: eso lo da Daniel a mano. */
var ESCALA_COMP=[
  [0.25, 'algo normal'],
  [0.50, 'algo decente'],
  [0.75, 'algo bueno'],
  [1.00, 'algo excelente'],
  [1.25, 'algo impresionante'],
  [1.50, 'algo espectacularmente útil'],
  [1.75, 'algo importante en el funcionamiento y muy útil'],
  [2.00, 'un bug crítico que casi tumba la app y la ponía en riesgo']
];
/* LOS PESOS. Sesgados a la baja a proposito (Daniel: «ser poco generoso a no ser que sea algo
   super critico»): la gravedad es la unica que puede empujar al techo, y los otros dos ejes
   describen el REPORTE, no el hallazgo, asi que suman poco. */


var PESOS_COMP={
  /* ⛔ CADA TIPO TIENE SU EJE, Y NO ES COSMETICA: en el esquema del buzon las mejoras **no
     tienen columna `gravedad`** (`COLS_MEJ` trae `valor`), asi que escribir ahi se perdia SIN
     DAR ERROR — paso el 29/07 con los 7 reportes de Adrian.

     LA CALIBRACION, con los otros dos ejes en su valor normal (equipo + reproducible):

        BUG    Cosmetico 0,25 · Molesta 0,50 · Bloquea 2,00   <- la que valido Daniel el 29/07
        MEJORA Bajo      0,25 · Medio   0,50 · Alto    1,50   <- topa en 1,50 (ver `topeMejora`)

     Los dos escalones de abajo son el mismo numero en los dos ejes a proposito; el de arriba NO,
     porque el peldano de 2,00 de la escala es «un bug critico que casi tumba la app». */
  gravedad:{ 'Bloquea':1.75, 'Molesta':0.35, 'Cosmético':0.10, 'Cosmetico':0.10 },
  /* `Alto` vale MENOS que `Bloquea` (1,25 vs 1,75) por decision de Daniel (30/07): el peldano
     de 2,00 de su escala dice «un bug critico que casi tumba la app», y eso en una mejora no se
     sostiene. Una mejora impecable llega a 1,50, «algo espectacularmente util». */
  valor:{ 'Alto':1.25, 'Medio':0.35, 'Bajo':0.10 },
  ejeSinMedir:0.05,                           // sin el eje medido: casi no puntua
  /* Alcance y calidad suman POCO a proposito: si suman mas, tapan a la gravedad y todo lo
     cosmetico bien reportado se planta en 0,50. Con esto, «letra un poco mas grande» -cosmetico,
     de equipo, impecablemente reportado- cae donde debe: 0,25. */
  alcance:{ 'equipo':0.15, 'subsistema':0.10, 'persona':0.05 },
  calidad:{ 'reproducible':0.10, 'con_preguntas':0.05, 'no_reproducible':0 },
  minimo:0.25,                                 // si algo se paga, se paga el escalon mas bajo
  tope:2.00,                                   // por encima, SOLO Daniel a mano
  /* El techo de una MEJORA. Va EXPLICITO y no confiado a que 1,25+0,15+0,10 salga justo 1,50:
     el dia que alguien recalibre `alcance` o `calidad`, el techo tiene que seguir en pie. */
  topeMejora:1.50
};

/* Dos formas del panel, exactamente como las manda el backend:
   · MIEMBRO  -> {yo:<mi ficha completa>, miembros:[solo identidad], ranking:{puesto,total}}
   · ADMIN    -> {miembros:[fichas completas]}
   El escritorio es de coordinación, así que con la forma de miembro habrá vistas
   que se queden a medias: se dice en pantalla en vez de fingir que hay datos. */
/* `listarReuniones` no devuelve las respuestas (viven en su propia hoja y las sirve
   `getReunion`). Sin pedirlas, el mapa de calor salia ENTERO A CERO, el panel decia "0 de N
   han cubierto" y metia a TODOS los convocados en la lista de riesgo con su sancion

   -se usa `confirm`/`prompt`, que bloquean el hilo- pero SI hay formularios: el buzon, el
   motivo de una sancion, el enlace del orden del dia. Repintar mientras alguien escribe le
   borra lo escrito, y eso es peor que un dato con 90 segundos de retraso. */
function _escribiendoE_(){

var _REFRESCANDO_=false, _ULT_REFRESCO_=0;
/* EL ESCRITORIO SE ALIMENTA SOLO. Es la cara que mas rato se deja abierta -es un panel de
   mando, vive en una pestaña toda la tarde- y se quedaba con lo que trajo al entrar: quien
   coordina veia una cola de decisiones congelada a la hora del login, sin saberlo.
   Antes esto solo traia turnos y tareas, y una sola vez. */
async function _refrescoVivo_(motivo){
  if(typeof backendOK==='undefined' || !backendOK || !SESION) return;
  if(_REFRESCANDO_ || document.hidden) return;      // nadie mira: no se gasta cuota
  if(_escribiendoE_()) return;
  var ahora=Date.now();
  if(motivo==='vuelta' && (ahora-_ULT_REFRESCO_) < 30000) return;
  _REFRESCANDO_=true; _ULT_REFRESCO_=ahora;
  try{
    var _t=_pide_('getTurnos').then(function(t){ if(Array.isArray(t)&&t.length){ TURNOS.length=0; t.forEach(function(x){TURNOS.push(x);}); } });
    var _q=_pide_('getTareas').then(function(q){ if(Array.isArray(q)&&q.length){ TAREAS.length=0; q.forEach(function(x){TAREAS.push(x);}); } });
    var _p=_pide_('getPanel').then(function(p){ if(p) _aplicarPanel_(p); });
    var _s=_pide_('getSanciones',{}).then(function(a){ if(Array.isArray(a)) SANC_BACK=a; });
    var _r=_pide_('getPartes',{}).then(function(a){ if(Array.isArray(a)) PART_BACK=a; });
    var _d=_pide_('getEntregables').then(function(a){ if(Array.isArray(a)){ DOCS.length=0; a.forEach(function(x,i){ DOCS.push(_normDocE_(x,i)); }); } });
    /* Las reuniones, con cuidado: la lista NO trae las respuestas (viven en su propia hoja),
       asi que refrescarla a lo bruto deja los mapas de calor a cero. Se conservan las que ya
       estaban hidratadas, emparejando por id. */
    var _u=_pide_('listar').then(function(a){
      if(!Array.isArray(a) || !a.length) return;
      var prev={}; REUS.forEach(function(x){ if(x && x.resp && Object.keys(x.resp).length) prev[x.id]=x.resp; });
      REUS.length=0;
      a.map(normReu).forEach(function(r){ if(prev[r.id]){ r.resp=prev[r.id]; r.calor=null; } REUS.push(r); });
    });
    await Promise.all([_t,_q,_p,_s,_r,_d,_u]);
    if(!_escribiendoE_()) _repintarSuave_();          // pudo empezar a escribir mientras cargaba
  } finally { _REFRESCANDO_=false; }
}
function _arrancarRefrescoVivo_(){
  document.addEventListener('visibilitychange', function(){

function _aplicarPanel_(pnl){
  if(!pnl) return;
  if(pnl.generado) DATA.generado=pnl.generado;
  if(pnl.temporada) DATA.temporada=pnl.temporada;
  /* Los ingredientes del umbral: medias mensuales de la temporada y la del mes
     abierto. El peso del dia lo pone `_umbral_()` al calcular, no el backend. */
  if(pnl.umbral) DATA.umbral=pnl.umbral;
  /* `horasMesReal` se dejo de usar: derivaba de un snapshot y le ganaba al dato vivo.
     Si el backend lo sigue mandando, se ignora. */
  if(pnl.reunion) DATA.reunion=pnl.reunion;
  if(Array.isArray(pnl.subsistemas)&&pnl.subsistemas.length) DATA.subsistemas=pnl.subsistemas;
  if(pnl.yo){                                   // forma MIEMBRO
    var pub=(pnl.miembros||[]).slice();
    var ix=-1;
    for(var i=0;i<pub.length;i++) if(pub[i].nombre===pnl.yo.nombre) ix=i;
    if(ix>=0) pub[ix]=pnl.yo; else pub.push(pnl.yo);
    DATA.miembros=pub; DATA._rol='miembro'; DATA._ranking=pnl.ranking||null;
  } else if(Array.isArray(pnl.miembros)&&pnl.miembros.length){   // forma ADMIN
    DATA.miembros=pnl.miembros; DATA._rol='admin'; DATA._ranking=null;
  }
  /* El backend manda `horasMes`; TODA esta cara lee `hMes`. Sin esta traduccion el PD veia
     "H/mes —" y "TOTAL 0,0 h" con las horas ahi mismo. Mismo fallo de forma que ya se cazo
     en turnos, tareas y documentos: el backend habla largo y la vista lee corto. */
  (DATA.miembros||[]).forEach(function(m){
    if(m.hMes==null && typeof m.horasMes==='number') m.hMes=m.horasMes;
  });
  _rederivarCargos_();
  UMBRAL=_umbral_();      // despues de traducir horasMes->hMes, que es de donde sale
}

      'anterior y marca las infracciones. De ahi salen la cuota y la renovacion.'+
      String.fromCharCode(10,10)+'¿Lo has revisado persona a persona?')) return;
    _ac.disabled=true; var prev=_ac.textContent; _ac.textContent='Encolando…';
    try{
      await api.aplicarCierre(pl.periodo);
      tost('Cierre encolado para aplicar. La rutina lo recoge en la siguiente pasada.');
      await _cargarCierre_(); pintar();
    }catch(e){ _ac.disabled=false; _ac.textContent=prev;
      tost('No se pudo aplicar: '+((e&&e.message)||e)); }
  };
}

function _pinBuzon_(m){
  /* buzon: abrir/cerrar un reporte y las tres decisiones. Ninguna aplica nada: mueven
     el estado. Construir y publicar siguen siendo pasos aparte. */
  $$('[data-bzsel]',m).forEach(function(el){
    el.onclick=function(ev){ ev.stopPropagation(); var v=el.dataset.bzsel;
      /* Cambiar de reporte cancela la confirmacion a medias, pero NO el borrador de
         anotaciones: ese es trabajo escrito y se conserva por si vuelve. */
      if(BZ_CONF && BZ_CONF.id!==v) BZ_CONF=null;
      BUZON_SEL=v||null; pintar(); };
  });
}

function _pinAnotaciones_(m){
  /* La caja de anotaciones. Se apunta a CADA TECLA en `BZ_NOTAS` para que un repintado
     -o volver de otra pestaña- no se lleve por delante lo escrito. */
  $$('[data-bznotas]',m).forEach(function(ta){
    ta.oninput=function(){ BZ_NOTAS[ta.dataset.bznotas]=ta.value; };
  });
  $$('[data-bzacc]',m).forEach(function(b){
    b.onclick=function(){
      if(b.disabled) return;
      var id=b.dataset.bz, acc=b.dataset.bzacc;
      /* `Adelante+` y `Descartado+` NO son estados: son el mismo estado con instrucciones.
         Se guarda `Adelante`/`Descartado` y las anotaciones van en su columna. Un estado
         nuevo habria que pintarlo en todos los sitios que pintan estados y no diria nada
         que no diga el texto. */
      var conNotas=/\+$/.test(acc);
      if(conNotas) acc=acc.slice(0,-1);
      var ta=$('[data-bznotas="'+id+'"]',m);
      if(ta) BZ_NOTAS[id]=ta.value;
      /* Sin anotaciones, «con anotaciones» es la version seca y para eso esta el otro boton. */
      if(conNotas && !String(BZ_NOTAS[id]||'').trim()){
        tost('Escribe las anotaciones en la caja de arriba.');
        if(ta) ta.focus();
        return;
      }
      BZ_CONF={id:id, acc:acc, notas:conNotas};
      pintar();
    };
  });
  $$('[data-comp]',m).forEach(function(b){
    b.onclick=async function(){
      var id=b.dataset.comp, r=((BUZON||[]).filter(function(x){ return x.id===id; })[0]||null);
      if(!r) return;
      var caja=$('[data-comph="'+id+'"]',m);
      /* Se otorga LO QUE HAY EN LA CAJA, no lo que propuso la matriz: si él lo cambió, su
         número es el bueno. Esa es toda la gracia de que sea editable. */
      /* SIN REDONDEAR: si escribe 0,3 se otorgan 0,3. Redondear a cuartos aqui convertia su
         0,3 en 0,25 y contradecia el comentario de arriba — la caja es editable para que su
         numero mande. El redondeo vale para lo que PROPONE la app, no para lo que teclea el. */
      var horas=parseFloat(caja&&caja.value)||0;
      if(!(horas>0)){ tost('Pon las horas antes de otorgar.'); if(caja) caja.focus(); return; }
      b.disabled=true; var prev=b.textContent; b.textContent='Otorgando…';
      try{
        /* EL ORDEN IMPORTA, y es al revés de lo natural: PRIMERO se anota en el reporte y
           solo si eso queda escrito se otorgan las horas.

           Si se otorgara antes, y el backend no supiera guardar `horas_otorgadas` -pasa: la
           columna es de v46 y hasta entonces el campo se ignora EN SILENCIO-, las horas
           estarían dadas y el reporte no lo sabría. Volverías a verlo sin marca y podrías
           pagarlo otra vez. Así, si el backend no lo admite, no se paga nada y se dice. */
        var t = r.tipo==='bug'?'bug':'mejora';
        await api.decidirReporte(t, id, {horas_otorgadas:horas});
        var vuelta=(await api.getBuzon()||[]).filter(function(x){ return x.id===id; })[0];
        if(!vuelta || String(vuelta.horas_otorgadas||'')===''){
          tost('El backend no guarda todavía la compensación (falta desplegar v46). NO se ha otorgado nada.');
          b.disabled=false; b.textContent=prev; return;
        }
        await api.otorgarHoras({nombre:r.quien, horas:horas,
          tarea:'Compensación por el reporte '+id, categoria:'compensacion'});
        tost(id+': '+horas+' h a '+_m(r.quien).pila+'.'); _cargarBuzon_();
      }catch(e){ b.disabled=false; b.textContent=prev; tost('No se pudo: '+((e&&e.message)||e)); }
    };
  });
  $$('[data-bzno]',m).forEach(function(b){ b.onclick=function(){ BZ_CONF=null; pintar(); }; });
  $$('[data-bzok]',m).forEach(function(b){
    b.onclick=async function(){
      if(b.disabled || !BZ_CONF) return;
      var id=b.dataset.bzok, tipo=b.dataset.bzt, acc=BZ_CONF.acc, conNotas=BZ_CONF.notas;
      var campos={estado:acc};
      if(conNotas) campos.anotaciones=String(BZ_NOTAS[id]||'').trim();
      b.disabled=true; var prev=b.textContent; b.textContent='Guardando…';
      try{ await api.decidirReporte(tipo, id, campos);
        tost(id+': '+acc+(conNotas?' con anotaciones.':'.'));
        /* El borrador se tira SOLO cuando el servidor ya lo tiene. Si falla, sigue ahi. */
        delete BZ_NOTAS[id]; BZ_CONF=null; _cargarBuzon_(); }
      catch(e){ b.disabled=false; b.textContent=prev; tost('No se pudo: '+((e&&e.message)||e)); }
    };
  });
  var _b=document.getElementById('hBeta');
  if(_b) _b.style.display = (CANAL==='beta') ? '' : 'none';
  $('#migaA').textContent=V[vista].g;
  $('#migaB').textContent=V[vista].t;
  pintarNav();
  colocarEstrella(false);
  /* barras de los KPI: setTimeout, no rAF (en pestaña de fondo rAF no dispara) */
  $$('.kpi .bar i',m).forEach(function(i){
    i.style.width='0';
    setTimeout(function(){ i.style.width=i.dataset.w; }, redu()?0:70);
  });
  enganchar();
}

/* ⛔ ERA UNA SOLA FUNCIÓN DE 275 LÍNEAS. Ahora es la lista de lo que hace, y cada pieza se
   lee sola. El corte es MECÁNICO: por los comentarios de sección que ya estaban, en el
   mismo orden y sin mover una línea de dentro. Comprobado que ninguna variable local cruza
   de tramo — si cruzara, el troceador se planta en vez de cortar. */
function pintar(){
  var m=$('#main');
  _pinPie_(m);
  _pinHTML_(m);
  _pinSancSuelta_(m);
  _pinSancEditar_(m);
  _pinSancAgrupar_(m);
  _pinReunionFijar_(m);
  _pinCerrarMes_(m);
  _pinAplicarCierre_(m);
  _pinBuzon_(m);
  _pinAnotaciones_(m);
}
function ir(k,foco){
  /* Al abrir el cierre se pregunta al servidor en que punto esta: los bloqueos y el plan
     los tiene el, no se deducen aqui. */
  if(k==='cierre' && CIERRE===null && !CIERRE_ERR) setTimeout(_cargarCierre_,60);
  if(k===vista && !foco) return;
  vista=k;
  var m=$('#main');
  if(redu()){ pintar(); m.scrollTop=0; colocarEstrella(true); if(foco) enfocar(foco); return; }
  m.classList.add('fundiendo');
  setTimeout(function(){
    pintar(); m.scrollTop=0;
    m.classList.remove('fundiendo'); m.classList.add('entrando');
    setTimeout(function(){ m.classList.remove('entrando'); },820);
    colocarEstrella(true);
    if(foco) enfocar(foco);
  },150);
}

function _engPartes_(){
  /* decidir un parte: PERSISTE (api.decidirParte). Aprobar levanta aplicar_horas=true → el
     motor Python suma las horas al ledger y recalcula cuota/ranking. La app flaguea, el motor
     ejecuta. Rechazar/detalle exigen motivo. Con datos reales viaja; con la semilla, memoria. */
  $$('[data-parte]').forEach(function(b){
    b.onclick=async function(){
      if(b.disabled) return;
      var p=PARTES.filter(function(x){return x.id===+b.dataset.parte;})[0]; if(!p) return;
      var card=b.closest('.parte'), ta=card.querySelector('[data-motivo]');
      var mot=ta?ta.value.trim():'';
      var acc=b.dataset.acc==='si'?'aprobar':b.dataset.acc==='no'?'rechazar':'detalle';
      if(acc!=='aprobar' && mot.length<8){
        if(ta){ ta.focus(); ta.style.borderColor='rgba(232,145,46,.6)';
          setTimeout(function(){ta.style.borderColor='';},1600); }
        tost('Rechazar o pedir detalle exige un motivo. Sin él no se envía.');
        return;
      }
      var okMsg=acc==='aprobar'
        ? h1(p.horas)+' aprobadas: se suman a las horas de '+_m(p.autor).pila+' y actualizan su cuota y su puesto.'
        : (acc==='rechazar'?'Parte rechazado, con su motivo.':'Devuelto: le pides detalle al autor.');
      if(p._real && backendOK && SESION){
        var acts=card.querySelectorAll('.acts .btn'); acts.forEach(function(x){x.disabled=true;});
        try{
          var upd=await api.decidirParte(p.id, acc, mot||null);
          if(upd){ var i=PART_BACK.findIndex(function(x){return x.id===p.id;}); if(i>=0) PART_BACK[i]=upd; _partesReal_(); }
          card.classList.add('asienta'); tost(okMsg); setTimeout(pintar,420);
        }catch(e){ acts.forEach(function(x){x.disabled=false;}); tost('No se pudo: '+((e&&e.message)||e)); }
        return;
      }
      p.estado = acc==='aprobar'?'aprobado':acc==='rechazar'?'rechazado':'detalle';   // semilla local
      p.decisor=ACTOR; p.dec=HOY; if(mot) p.motivo=mot;
      card.classList.add('asienta'); tost(okMsg); setTimeout(pintar,420);
    };
  });
}

function _engBloqueHoras_(){
  /* bloque de horas: marca a varios de tu subsistema y otórgales lo mismo (api.otorgarBloque).
     Un solo disparo crea todas las partes 'otorgada'; el servidor revalida jurisdicción por token
     y persona. Con backend real viaja; sin él, semilla local. */
  var _bs=$('#bloSub');

    var u=_bs.value;
    $$('#bloPool .pick').forEach(function(c){
      var vis=!u||c.dataset.unidad===u; c.style.display=vis?'':'none'; if(!vis) c.classList.remove('on');
    });
  };
  $$('#bloPool .pick').forEach(function(c){ c.onclick=function(){ c.classList.toggle('on'); }; });
  $$('[data-bloque]').forEach(function(b){
    b.onclick=async function(){
      if(b.disabled) return;
      var marcados=$$('#bloPool .pick.on').map(function(c){ return c.dataset.nom; });
      var horas=parseFloat(String(($('#bloH')||{}).value||'').replace(',','.'))||0;

      if(!marcados.length){ tost('Marca al menos a una persona del subsistema.'); return; }
      if(horas<=0){ tost('Pon unas horas > 0.'); return; }

        b.disabled=true; var prev=b.textContent; b.textContent='Otorgando\u2026';

          var cat=($('#bloCat')||{}).value||'compensacion';

          res.forEach(function(x){ if(x&&x.id) PART_BACK.push(x); });         // las partes creadas
          if(res.length) _partesReal_();
          var fallos=res.filter(function(x){ return x&&x.error; }).length;
          tost(h1(horas)+' a '+okN+' de '+marcados.length+(fallos?' \u00b7 '+fallos+' sin permiso o con error':'')+'. Ya cuentan en sus horas del mes.');
          pintar();
        }catch(e){ b.disabled=false; b.textContent=prev; tost('No se pudo otorgar el bloque: '+((e&&e.message)||e)); }
        return;
      }
      tost('Sin conexi\u00f3n no se puede otorgar el bloque: no se ha guardado nada.');
    };

}

function _engDocsDecidir_(){
  /* LAS CUATRO ACCIONES del correo real, mas deshacer y reenviar. Todas viajan a
     `api.decidir`, que ya estaba desplegada aceptandolas desde v28 y de la que esta cara
     solo usaba dos. El servidor revalida la autoridad por token; esto es el disparo.
     El motivo y el titulo salen de la propia ficha: un prompt() no deja releer el
     expediente mientras escribes por que lo rechazas. */
  var ETI_DOC={aprobado:'Aprobado. Se publica en Notion, Drive y el Libro de Datos.',
    anot:'Aprobado con anotaciones. Se publica con el título corregido.',
    cambios:'Cambios pedidos. Le llega al autor, que podrá reenviarlo corregido.',
    rechazado:'Rechazado. El autor recibe el motivo.',
    deshacer:'Decisión deshecha: vuelve a revisión.',
    reenviar:'Reenviado a revisión.'};
  $$('.acts [data-doc]').forEach(function(b){
    b.onclick=async function(){
      if(b.disabled) return;
      var d=DOCS.filter(function(x){return x.id===+b.dataset.doc;})[0]; if(!d) return;
      var accion=b.dataset.acc, ficha=document.getElementById('doc-'+d.id);
      var ta=ficha&&ficha.querySelector('[data-motivo]');
      var motivo=(ta&&ta.value||'').trim();
      var ti=document.getElementById('dtit-'+d.id);
      var titulo=(ti&&ti.value||'').trim();
      if((accion==='cambios'||accion==='rechazado') && !motivo){
        tost(accion==='cambios'?'Sin motivo no se piden cambios: el autor no sabría qué corregir.'
          :'Sin motivo no se rechaza.'); if(ta) ta.focus(); return; }
      if(accion==='anot' && !titulo){ tost('Con anotaciones hace falta un título.'); return; }
      if(accion==='rechazado' && !confirm('Rechazar «'+d.tit+'». El expediente queda cerrado y el autor'+
        ' tendrá que enviar uno nuevo. ¿Seguro?')) return;
      if(accion==='deshacer' && !confirm('Devolver «'+d.tit+'» a revisión y borrar la decisión de '+
        (d.revisor||'quien la tomó')+'. ¿Seguro?')) return;
      var extra = accion==='anot' ? {titulo:titulo} : null;
      b.disabled=true; var prev=b.textContent; b.textContent='Enviando…';
      try{
        if(typeof backendOK!=='undefined' && backendOK && SESION){
          var upd=await api.decidir(d.id, accion, motivo, extra);   // el actor sale del token
          /* `upd` viene con las claves LARGAS del backend. Metiendolo crudo en DOCS la fila
             se quedaba sin titulo y con el estado en blanco hasta recargar. */
          if(upd){ var i=DOCS.findIndex(function(x){return x.id===d.id;}); if(i>=0) DOCS[i]=_normDocE_(upd,i); }
          tost(ETI_DOC[accion]||'Hecho.');
        } else {
          tost('Sin conexión con el backend: la decisión NO se ha guardado.');
          b.disabled=false; b.textContent=prev; return;
        }
        if(accion!=='deshacer') DOC_SEL=null;
        pintar();
      }catch(e){ b.disabled=false; b.textContent=prev; tost('No se pudo: '+((e&&e.message)||e)); }
    };
  });
  /* bloque de sanciones: marcar es BORRADOR (no aplica nada). Con bloque real viaja al
     backend (api.decidirSancion acción «marcar»); con la semilla, solo memoria. */
}

function _engSancMarcar_(){

  $$('.decs[data-lid] button').forEach(function(b){

    };
  });

function _engSancTodas_(){
  /* MARCAR TODAS DE GOLPE. Sigue siendo borrador -no aplica nada-, solo evita veinte
     clics. EN SERIE a proposito: cada `decidirSancion` coge un `LockService` en el
     backend y veinte llamadas a la vez se pisan entre ellas (pasó esta misma noche
     escribiendo el buzón, con «otro proceso ha retenido el bloqueo»). */
  $$('[data-todas]').forEach(function(b){
    b.onclick=async function(){
      var dec=b.dataset.todas;
      var faltan=LOTE.items.filter(function(x){ return x.dec!==dec; });
      if(!faltan.length){ tost('Ya estaban todas así.'); return; }
      if(!confirm('Marcar '+faltan.length+' como «'+dec+'».'+String.fromCharCode(10,10)+
        'Esto NO aplica nada: el bloque se cierra aparte.')) return;
      if(!(LOTE.real && backendOK && SESION)){
        faltan.forEach(function(x){ x.dec=dec; }); pintar(); return;   // semilla local
      }
      b.disabled=true; var prev=b.textContent;
      var mal=0;
      for(var i=0;i<faltan.length;i++){
        b.textContent=(i+1)+'/'+faltan.length+'…';
        try{ await api.decidirSancion(faltan[i].id,'marcar',{decision:dec}); faltan[i].dec=dec; }
        catch(e){ mal++; }
      }
      b.disabled=false; b.textContent=prev;
      /* Si alguna falla se dice CUANTAS: dar por buenas veinte cuando entraron
         dieciocho es exactamente como se cierra un bloque a medias sin enterarse. */
      tost(mal ? ('Marcadas '+(faltan.length-mal)+' de '+faltan.length+'; '+mal+' fallaron.')
               : ('Marcadas '+faltan.length+'. Sigue sin aplicarse nada.'));
      pintar();
    };
  });
}

function _engSancCerrar_(){
  /* cerrar el bloque: es el DISPARO. Con bloque real, api.confirmarLote lo cierra entero
     bajo lock y levanta aplicar_sanciones=true (una vez) para que el motor lo escriba en
     Notion y mande el comunicado. La app flaguea, el motor ejecuta. */
  $$('[data-lote]').forEach(function(b){
    b.onclick=async function(){
      if(b.disabled) return;
      var c=0; LOTE.items.forEach(function(x){ if(x.dec==='aceptar') c++; });
      if(!confirm('Vas a cerrar el bloque «'+LOTE.nombre+'».\n\n'+c+' se aplican.\n\n'+
        'Esto aplica las sanciones aceptadas en Notion y manda el comunicado. ¿Seguimos?')) return;
      if(LOTE.real && backendOK && SESION){
        b.disabled=true; var prev=b.textContent; b.textContent='Cerrando…';
        try{
          var r=await api.confirmarLote(LOTE.lote);
          LOTE.cerrado=true;
          var ap=(r&&r.aprobadas!=null)?r.aprobadas:c;
          tost('Bloque cerrado: '+ap+' aplicada'+(ap===1?'':'s')+'. Se escriben en Notion y sale el comunicado.');
          pintar();
        }catch(e){ b.disabled=false; b.textContent=prev; tost('No se pudo cerrar: '+((e&&e.message)||e)); }
        return;
      }
      LOTE.cerrado=true;                                       // semilla local
      tost('Bloque cerrado entero. O entra todo, o no entra nada.');
      pintar();
    };
  });
  /* 🔴 AQUI HABIA UN BOTON QUE MENTIA. `$$('[data-cerrarmes]')` pisaba el manejador de
     verdad que `pintar()` acababa de poner —confirmar, `api.calcularCierre`, recargar el
     plan— con un `tost('Mes cerrado y comunicado enviado.')`. El ultimo que escribe gana,
     y ganaba el falso: pulsar «Calcular el cierre» no encolaba nada y contestaba que el
     mes estaba cerrado y el comunicado enviado. Resto de cuando la pantalla era maqueta.
     No se sustituye por nada: el manejador bueno ya existe, solo estaba tapado. */
  /* El botón «Convocar reunión» era un `tost` descriptivo. Ahora lleva al panel de verdad,
     que vive en esta misma vista, y le da el foco. */
  $$('[data-nueva]').forEach(function(b){ b.onclick=function(){
    var p=$('#cvTipo'); if(p){ p.scrollIntoView({block:'center'}); p.focus(); }
    else tost('La convocatoria es solo para coordinación.');
  }; });
  _cablearConvocar_();
  /* acuse de pulsación: <120 ms, en la propia pieza, nunca bajo el cursor */
  $$('.btn').forEach(function(b){
    b.addEventListener('pointerdown',function(){
      b.classList.add('pulsa'); setTimeout(function(){b.classList.remove('pulsa');},120);
    });
  });
}

/* ⛔ ERA UNA SOLA FUNCIÓN DE 290 LÍNEAS. Ahora es la lista de lo que hace, y cada pieza se
   lee sola. El corte es MECÁNICO: por los comentarios de sección que ya estaban, en el
   mismo orden y sin mover una línea de dentro. Comprobado que ninguna variable local cruza
   de tramo — si cruzara, el troceador se planta en vez de cortar. */
function enganchar(){
  _engIrYAcordeones_();

  _engOtorgar_();
  _engBloqueHoras_();

  _engDocsAbrir_();
  _engDocsDecidir_();

}
