<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://accounts.google.com/gsi/client" async></script>
<title>Solaris · Puente de mando</title>
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   SOLARIS · PUENTE DE MANDO — dirección definitiva, ESCRITORIO
   ───────────────────────────────────────────────────────────────────────────
   Público: consejo, junta y Project Director. NO es la app del miembro
   estirada — es otro producto. Aquí se GOBIERNA: firmar horas, decidir
   expedientes, cerrar bloques de sanciones, cerrar el mes, mirar al equipo
   entero. El móvil (`movil.html`) es la herramienta del miembro.

   Paleta medida en Insignia_Solaris.png (docs/identidad-visual.md §4 y §4-ter):
   #231F20 (52,3 %) · #FFFFFF (24,9 %) · #E41E25 (21,9 %). La rampa de grises
   se deriva del neutro conservando H=345° y S=6,1 %.

   Fuera, por orden de Daniel: el apartado de ECONOMÍA (cuotas/gastos/tesorería)
   no va en el panel. Las cuotas se leen en el Ranking, junto a las horas.
   ═══════════════════════════════════════════════════════════════════════════ */
:root{
  --bg:#0C0B0B; --sur:#181616; --sur2:#221E1F; --gris:#231F20;
  --line:#322C2E; --line2:#463E40; --ink3:#7C6E72; --ink2:#B2A8AB; --ink:#F4F3F3;
  --red:#E41E25; --red2:#FF4A4F; --red3:#8E1418;
  --ok:#3EB489; --warn:#E8912E; --tel:#3f9ed6;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:10px; --r2:8px;
  --sal:cubic-bezier(.16,.84,.44,1);
  --arco:cubic-bezier(.34,1.42,.5,1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13.5px;line-height:1.45;
  -webkit-font-smoothing:antialiased;min-height:100vh;padding:18px;display:flex;flex-direction:column;gap:13px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sc{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);line-height:1}
.up{color:var(--ok)} .dn{color:var(--red2)} .wa{color:var(--warn)}

/* cartel */
.cartel{border:1px solid var(--line);border-radius:var(--r);
  background:linear-gradient(180deg,var(--sur2),var(--sur));padding:15px 18px}
.cartel h1{margin:0;font-size:19px;letter-spacing:-.01em}
.cartel h1 span{color:var(--red2)}
.cartel p{margin:7px 0 0;font-size:12.5px;color:var(--ink2);line-height:1.6;max-width:1100px}
.cartel p b{color:var(--ink)}

/* ═══ MARCO ══════════════════════════════════════════════════════════════ */
.marco{position:relative;display:grid;grid-template-columns:238px 1fr;grid-template-rows:56px 1fr;
  height:calc(100vh - 150px);min-height:660px;border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;background:var(--bg);box-shadow:0 26px 60px rgba(0,0,0,.45)}

/* lateral */
aside{grid-row:1/3;border-right:1px solid var(--line);background:var(--sur);
  display:flex;flex-direction:column;min-height:0;position:relative}
.marca{display:flex;align-items:center;gap:10px;padding:13px 14px;border-bottom:1px solid var(--line)}
.marca .ins{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;
  background:linear-gradient(155deg,#3d2427,#20161a);color:var(--red2);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.marca .ins svg{width:16px;height:16px;fill:currentColor}
.marca .ins img{width:24px;height:24px;object-fit:contain;display:block}
/* marca de agua del lienzo: fija al marco, nunca sobre el contenido */
.marcagua{position:absolute;right:-5%;bottom:-6%;width:40%;height:auto;opacity:.04;
  z-index:0;pointer-events:none}
main{z-index:1}
.marca .nm{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase}
.marca .nm span{display:block;font-size:8px;letter-spacing:.12em;color:var(--ink3);margin-top:3px}
.nav{flex:1;min-height:0;overflow-y:auto;padding:6px 0 12px;position:relative;scrollbar-width:thin}
.nav::-webkit-scrollbar{width:5px}
.nav::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.grupo{padding:12px 13px 5px;display:flex;align-items:center;gap:8px}
.grupo .ln{flex:1;height:1px;background:var(--line)}
.item{width:100%;text-align:left;padding:7px 12px 7px 18px;display:flex;align-items:center;gap:8px;
  color:var(--ink2);font-size:12.5px;position:relative;
  transition:color .15s linear,background .15s linear}
/* NO se desplaza al pasar el ratón: es un blanco de clic (decisión cerrada) */
.item:hover{color:var(--ink);background:rgba(255,255,255,.025)}
.item .rail{position:absolute;left:0;top:3px;bottom:3px;width:2px;background:var(--red);border-radius:2px;
  transform:scaleY(0);transform-origin:50% 50%;transition:transform .26s var(--sal)}
.item:hover .rail{transform:scaleY(.38)}
.item.on{color:var(--ink);background:rgba(228,30,37,.08)}
.item.on .rail{transform:scaleY(1)}
.item .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .cnt{font-family:var(--mono);font-size:9.5px;color:var(--ink3);background:var(--sur2);
  border:1px solid var(--line);border-radius:9px;padding:0 6px;line-height:15px;min-width:20px;
  text-align:center;flex:none}
.item .cnt.hot{color:#fff;background:var(--red);border-color:var(--red)}
.item .cnt.wa{color:#241a08;background:var(--warn);border-color:var(--warn)}
/* la estrella que viaja, en vertical, con la comba proporcional a la distancia */
.viajev{position:absolute;left:3px;top:0;width:15px;height:15px;pointer-events:none;z-index:4;
  color:var(--red2);transition:transform .38s var(--arco)}
.viajev svg{width:15px;height:15px;fill:currentColor;display:block;
  filter:drop-shadow(0 0 7px rgba(255,74,79,.75))}
.viajev.vuela svg{animation:arcoX .38s var(--arco)}
@keyframes arcoX{50%{transform:translateX(var(--comba,16px)) scale(1.5) rotate(120deg)}}
.pielat{flex:none;border-top:1px solid var(--line);padding:9px 13px;display:flex;gap:9px;align-items:center}

/* barra superior */
.top{grid-column:2;border-bottom:1px solid var(--line);background:var(--sur);
  display:flex;align-items:center;gap:13px;padding:0 15px}
.miga{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);white-space:nowrap}
.miga b{color:var(--ink);font-weight:500}
.buscar{flex:1;max-width:330px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);
  background:var(--bg);border-radius:var(--r2);padding:6px 10px}
.buscar:focus-within{border-color:var(--line2);box-shadow:0 0 0 3px rgba(228,30,37,.1)}
.buscar input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);font:inherit;font-size:12px}
.buscar input::placeholder{color:var(--ink3)}
.topd{margin-left:auto;display:flex;align-items:center;gap:11px}

/* ── «ACTÚAS COMO» — el conmutador de versión ────────────────────────────
   De la 04b, con los dos ajustes que pidió Daniel: la estrella un pelín más a
   la IZQUIERDA y la comba AL REVÉS (se hunde en vez de arquearse hacia arriba).
   No es un adorno: hace demostrable el enrutado por rango. ───────────────── */
.actua{position:relative;display:flex;align-items:center;gap:2px;border:1px solid var(--line);
  border-radius:22px;background:var(--sur2);padding:3px 3px 3px 22px}
.actua .est{position:absolute;left:5px;top:50%;width:13px;height:13px;margin-top:-6.5px;
  color:var(--red2);pointer-events:none;transition:transform .34s var(--arco)}
.actua .est svg{width:13px;height:13px;fill:currentColor;display:block;
  filter:drop-shadow(0 0 6px rgba(255,74,79,.7))}
.actua .est.vuela svg{animation:combaAbajo .34s var(--arco)}
/* comba invertida: baja y vuelve, en vez de subir */
@keyframes combaAbajo{50%{transform:translateY(9px) scale(1.45) rotate(-120deg)}}
.actua button{padding:5px 11px;border-radius:18px;font-family:var(--mono);font-size:9px;
  letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);white-space:nowrap;
  transition:color .16s linear,background .16s linear}
.actua button.on{background:var(--red);color:#fff}

.yo{display:flex;align-items:center;gap:8px;padding:4px 9px 4px 4px;border:1px solid var(--line);
  border-radius:var(--r2);background:var(--sur2)}
.yo .av{width:23px;height:23px;border-radius:6px;display:grid;place-items:center;flex:none;
  font-family:var(--mono);font-size:9px;color:#efe3e3;background:linear-gradient(155deg,#5c2226,#2a1214)}
.yo .n{font-size:11.5px;line-height:1.2}
.yo .rl{font-family:var(--mono);font-size:8px;color:var(--ink3);letter-spacing:.08em;text-transform:uppercase}

/* lienzo */
main{grid-column:2;min-height:0;overflow-y:auto;padding:15px;scrollbar-width:thin;position:relative}
main::-webkit-scrollbar{width:8px}
main::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
main.fundiendo{opacity:.25;transition:opacity .14s linear}
main.entrando>*{animation:entra .38s var(--sal) both}
main.entrando>*:nth-child(2){animation-delay:.05s}
main.entrando>*:nth-child(3){animation-delay:.1s}
main.entrando>*:nth-child(4){animation-delay:.15s}
@keyframes entra{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.cabp{display:flex;align-items:flex-end;gap:13px;margin-bottom:14px;flex-wrap:wrap}
.cabp h2{margin:0;font-size:18px;font-weight:600;letter-spacing:-.015em}
.cabp .meta{font-family:var(--mono);font-size:9.5px;color:var(--ink3);letter-spacing:.08em}
.cabp .acts{margin-left:auto;display:flex;gap:7px}

/* paneles */
.pan{background:var(--sur);border:1px solid var(--line);border-radius:var(--r);margin-bottom:13px;
  position:relative}
.pan>.ph{display:flex;align-items:center;gap:9px;padding:10px 13px;border-bottom:1px solid var(--line)}
.pan>.ph .ln{flex:1;height:1px;background:var(--line)}
.pan>.pb{padding:13px}
.pan.destaca{border-color:rgba(228,30,37,.42);box-shadow:0 0 0 1px rgba(228,30,37,.12)}
.pan.destaca>.ph{background:rgba(228,30,37,.06)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);
  background:var(--sur2);border-radius:var(--r2);padding:7px 13px;font-size:12px;font-weight:600;
  position:relative;overflow:hidden;transition:background .16s linear,border-color .16s linear}
.btn::after{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--red2);
  transform:scaleY(0);transform-origin:50% 50%;transition:transform .16s var(--sal)}
.btn.pulsa::after{transform:scaleY(1);box-shadow:0 0 9px var(--red2)}
.btn:hover{border-color:var(--line2);background:#221D1E}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.pri:hover{background:var(--red2);border-color:var(--red2)}
.btn.ok{color:var(--ok);border-color:rgba(62,180,137,.45)}
.btn.no{color:var(--red2);border-color:rgba(255,74,79,.45)}
.btn.sm{padding:5px 10px;font-size:11px;font-weight:500}
.btn[disabled]{opacity:.45;cursor:not-allowed;pointer-events:none}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:13px}
@media(max-width:1150px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--sur);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px 11px;
  position:relative;overflow:hidden;transition:border-color .2s linear}
.kpi:hover{border-color:var(--line2)}
.kpi .val{font-family:var(--mono);font-size:29px;font-weight:600;letter-spacing:-.035em;line-height:1.1;margin:9px 0 3px}
.kpi .val small{font-size:13px;color:var(--ink3);font-weight:400;letter-spacing:0}
.kpi .d{font-size:11px;color:var(--ink3)}
.kpi .bar{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.05)}
.kpi .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red3),var(--red2));
  transition:width 1s var(--sal)}

/* tablas densas */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
thead th{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);font-family:var(--mono);
  font-size:8.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);font-weight:400;white-space:nowrap}
thead th.r,td.r{text-align:right}
tbody td{padding:8px 12px;border-bottom:1px solid rgba(50,44,46,.6);font-size:12.5px}
tbody tr{transition:background .14s linear}
tbody tr:hover{background:rgba(255,255,255,.028)}
td .mem{display:flex;align-items:center;gap:8px}
td .av{width:21px;height:21px;border-radius:5px;background:var(--sur2);border:1px solid var(--line);
  display:grid;place-items:center;font-family:var(--mono);font-size:9px;color:var(--ink2);flex:none}

/* chips y pastillas */
.chip{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;
  padding:3px 8px;border-radius:20px;border:1px solid var(--line);color:var(--ink3);background:var(--sur2);white-space:nowrap}
.chip.ok{color:var(--ok);border-color:rgba(62,180,137,.42);background:rgba(62,180,137,.08)}
.chip.wa{color:var(--warn);border-color:rgba(232,145,46,.45);background:rgba(232,145,46,.09)}
.chip.no{color:var(--red2);border-color:rgba(255,74,79,.45);background:rgba(228,30,37,.09)}
.chip.tel{color:var(--tel);border-color:rgba(63,158,214,.45);background:rgba(63,158,214,.09)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
/* chip seleccionable de miembro (bloque de horas) */
.pick{cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.03em;padding:5px 11px;border-radius:20px;
  border:1px solid var(--line);color:var(--ink2);background:var(--sur2);white-space:nowrap;transition:border-color .12s,color .12s,background .12s}
.pick:hover{border-color:var(--ink3);color:var(--ink)}
.pick.on{color:#fff;border-color:var(--red);background:rgba(228,30,37,.18)}
.pick.on::before{content:'\2713 '}
/* reparto del turno: una fila por persona marcada, con su rol y sus distintivos */
.repf{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid var(--line)}
.repf:last-child{border-bottom:0}
.repf b{min-width:96px;font-size:12.5px}
.repf input{flex:1;min-width:130px;background:#0A0909;border:1px solid var(--line);border-radius:7px;
  padding:6px 9px;color:var(--ink);font:inherit;font-size:12px}
.mini{cursor:pointer;font-family:var(--mono);font-size:10px;letter-spacing:.04em;padding:5px 9px;
  border-radius:20px;border:1px solid var(--line);background:transparent;color:var(--ink3)}
.mini:hover{border-color:var(--ink3);color:var(--ink)}
.mini.on{color:#fff;border-color:var(--red);background:rgba(228,30,37,.18)}
.mini.x:hover{border-color:var(--red);color:var(--red2)}

/* ── ZONA FIJA «REQUIERE TU DECISIÓN» ────────────────────────────────────
   De la 02b, con lo que Daniel pidió encima: cada fila LLEVA al sitio exacto
   (al expediente, al parte, al bloque), no a la sección genérica. ──────── */
.dec{display:flex;align-items:center;gap:12px;padding:11px 13px;border-top:1px solid var(--line);
  cursor:pointer;transition:background .14s linear}
.dec:first-child{border-top:0}
.dec:hover{background:rgba(255,255,255,.03)}
.dec .ic{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;flex:none;
  background:var(--sur2);border:1px solid var(--line);color:var(--red2)}
.dec .ic svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8}
.dec .tx{flex:1;min-width:0}
.dec .tx b{display:block;font-size:13px}
.dec .tx small{display:block;font-size:11px;color:var(--ink3);margin-top:2px}
.dec .der{display:flex;align-items:center;gap:9px;flex:none}
.dec .chev{color:var(--ink3);font-family:var(--mono)}

/* tarjeta de parte de horas */
.parte{border-top:1px solid var(--line);padding:13px}
.parte:first-child{border-top:0}
.parte .h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.parte .h b{font-size:13.5px}
.parte .h .u{font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.parte .h .q{margin-left:auto;font-family:var(--mono);font-size:18px;font-weight:600;color:var(--warn);letter-spacing:-.02em}
.parte .just{margin-top:9px;padding:9px 11px;border:1px solid var(--line);border-left:2px solid var(--tel);
  background:#0A0909;border-radius:var(--r2);font-size:12px;color:var(--ink2);line-height:1.55}
.parte .just .sc{display:block;margin-bottom:4px}
.parte .fl{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.parte .ruta{margin-top:9px;font-size:11.5px;color:var(--ink3);line-height:1.5}
.parte .ruta b{color:var(--ink2)}
.parte .acts{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap;align-items:center}
.parte textarea{width:100%;background:#0A0909;border:1px solid var(--line);border-radius:var(--r2);
  color:var(--ink);font-family:var(--sans);font-size:12.5px;padding:8px 10px;outline:0;resize:vertical;
  min-height:52px;margin-top:8px}
.parte.asienta{opacity:.25;transition:opacity .4s linear}
/* GEMELA de movil.html: visor de documento plegado. El iframe se crea al desplegar,
   no antes; un expediente se abre casi siempre para ver de que va, no para leerlo. */
.doc{margin-top:11px;border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;background:#0A0909}
.doc .dh{display:flex;align-items:center;gap:9px;padding:9px 11px;border-bottom:1px solid var(--line);cursor:pointer}
.doc .dh:hover{background:rgba(255,255,255,.03)}
.doc .dh b{font-size:12.5px}
.doc .dh small{display:block;color:var(--ink3);font-family:var(--mono);font-size:10px;margin-top:2px}
.doc .dv{width:100%;height:64vh;min-height:340px;border:0;display:block;background:#2a2526}
.doc .dcar{padding:26px 12px;text-align:center;color:var(--ink3);font-size:12px;line-height:1.6}
.doc .da{display:block;padding:9px 12px;text-align:center;font-family:var(--mono);font-size:11px;
  color:var(--red2);border-top:1px solid var(--line);text-decoration:none}
/* ficha de expediente: reaprovecha .parte (misma gramatica que un parte de horas) */
.parte .pils{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.parte .obj{margin:5px 0 0;padding-left:17px;font-size:12px;color:var(--ink2);line-height:1.6}
.parte .sub{margin-top:11px}

/* bloque de sanciones */
.lote{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--sur)}
.lote-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:14px}
.lote-m{font-size:12px;color:var(--ink2);margin-top:5px;line-height:1.5}
.lrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid rgba(50,44,46,.8);flex-wrap:wrap}
.lrow .nm{flex:1;min-width:130px;font-size:12.5px;font-weight:600}
.lrow .vl{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--red2);width:52px;text-align:right}
.lrow .vl.tach{opacity:.38;text-decoration:line-through}
.decs{display:inline-flex;border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.decs button{border-right:1px solid var(--line);padding:5px 10px;font-size:11px;font-weight:600;color:var(--ink3);white-space:nowrap}
.decs button:last-child{border-right:0}
.decs button.on.a{background:var(--ok);color:#fff}
.decs button.on.j{background:var(--ink2);color:#1a1616}
.decs button.on.r{background:var(--red2);color:#fff}
.cierrel{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:var(--r2);
  background:rgba(127,127,127,.05);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.cierrel .tx{flex:1;min-width:200px;font-size:12.5px;color:var(--ink2)}
.cierrel em{display:block;font-style:normal;font-size:11px;color:var(--ink3);margin-top:5px;line-height:1.45}

/* instrumento de puntos (media del equipo — admite decimales) */
.anillo{position:relative;width:150px;height:150px;flex:none}
.anillo svg{position:absolute;inset:0;width:150px;height:150px;overflow:visible}
.anillo .pista{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:2 5}
.anillo .seg{fill:none;stroke-width:7.5;stroke-linecap:round}
.anillo .seg.vac{stroke:var(--sur2)}
.anillo .seg.zc{stroke:rgba(232,145,46,.16)}
.anillo .tk{stroke:var(--line2);stroke-width:1.6;stroke-linecap:round}
.anillo .tk.f{stroke:var(--red2)}
.anillo .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;pointer-events:none}
.anillo .mid .n{font-family:var(--mono);font-size:34px;font-weight:600;letter-spacing:-.04em;line-height:1}
.anillo .mid .n small{font-size:14px;color:var(--ink3)}
.anillo .mid .u{font-family:var(--mono);font-size:8px;letter-spacing:.15em;color:var(--ink3);margin-top:5px}

/* desplegable por reunión (disponibilidad y riesgo) */
.acord{border:1px solid var(--line);border-radius:var(--r2);margin-bottom:9px;overflow:hidden;background:var(--sur)}
.acord>.hh{display:flex;align-items:center;gap:11px;padding:11px 13px;cursor:pointer}
.acord>.hh:hover{background:rgba(255,255,255,.025)}
.acord>.hh .tx{flex:1;min-width:0}
.acord>.hh .tx b{display:block;font-size:13px}
.acord>.hh .tx small{display:block;font-size:11px;color:var(--ink3);margin-top:2px}
.acord>.hh svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.2;color:var(--ink3);
  transition:transform .3s var(--sal);flex:none}
.acord.ab>.hh svg{transform:rotate(180deg)}
.acord>.bb{max-height:0;overflow:hidden;transition:max-height .42s var(--sal)}
.acord.ab>.bb{max-height:1200px}

/* mapa de calor */
.heat{overflow-x:auto;padding-bottom:4px}
.hg{display:grid;gap:2px;min-width:430px}
.hc{font-family:var(--mono);font-size:8.5px;color:var(--ink3);display:flex;align-items:center;justify-content:center;min-height:18px}
.hc.rd{justify-content:flex-end;padding-right:7px;white-space:nowrap;font-size:9.5px;color:var(--ink2)}
.hc.rh{position:relative;overflow:visible;align-items:flex-start;min-height:15px}
/* etiqueta al LÍMITE izquierdo = hora de inicio (decisión cerrada) */
.hc.rh span{position:absolute;left:0;top:2px;transform:translateX(-50%);white-space:nowrap;font-size:8.5px}
.cel{height:19px;border-radius:2px;display:grid;place-items:center;font-family:var(--mono);
  font-size:8.5px;color:rgba(244,243,243,.9)}
.cel.best{outline:1px solid var(--ink);outline-offset:-1px}

/* fichajes en curso */
.curso{display:flex;align-items:center;gap:12px;padding:11px 13px;border-top:1px solid var(--line)}
.curso:first-child{border-top:0}
.curso .pt{width:8px;height:8px;border-radius:50%;background:var(--red);flex:none;
  animation:latido 1.9s ease-in-out infinite}
.curso.wa .pt{background:var(--warn)}
.curso .tx{flex:1;min-width:0}
.curso .tx b{display:block;font-size:13px}
.curso .tx small{display:block;font-size:11px;color:var(--ink3);margin-top:2px}
.curso .q{font-family:var(--mono);font-size:15px;font-weight:600}
.curso.wa .q{color:var(--warn)}

/* checklist de cierre */
.paso{display:flex;align-items:center;gap:12px;padding:11px 13px;border-top:1px solid var(--line)}
.paso:first-child{border-top:0}
.paso .bx{width:17px;height:17px;border-radius:5px;border:1px solid var(--ink3);flex:none;position:relative}
.paso.ok .bx{background:var(--ok);border-color:var(--ok)}
.paso.ok .bx::after{content:"";position:absolute;left:5px;top:2px;width:4px;height:8px;
  border:solid #0A0909;border-width:0 1.6px 1.6px 0;transform:rotate(42deg)}
.paso.bloq .bx{border-color:var(--red2)}
.paso .tx{flex:1;min-width:0}
.paso .tx b{display:block;font-size:12.5px}
.paso .tx small{display:block;font-size:11px;color:var(--ink3);margin-top:2px}

.nota{font-size:11.5px;color:var(--ink3);line-height:1.6;padding:11px 13px;border-top:1px solid var(--line)}
.nota b{color:var(--ink2)}
.vac{padding:26px 14px;text-align:center;color:var(--ink3);font-size:12.5px;line-height:1.6}
.vac b{display:block;color:var(--ink2);font-family:var(--mono);font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;margin-bottom:6px}
/* El distintivo de BETA. Va en la cabecera y no en Ajustes: tiene que verse SIN buscarlo,
   o acabas reportando contra la versión equivocada. Ámbar, que es el color de «ojo» en
   esta paleta, y no rojo: rojo aquí significa Solaris, no aviso. */
.beta{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;
  color:#241a08;background:var(--warn);border-radius:5px;padding:2px 5px;flex:none}
.tost{position:fixed;left:50%;bottom:26px;transform:translate(-50%,12px);z-index:80;background:var(--sur2);
  border:1px solid var(--line);border-left:2px solid var(--red);border-radius:var(--r2);padding:9px 15px;
  font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .2s linear,transform .28s var(--sal);
  box-shadow:0 12px 30px rgba(0,0,0,.5)}
.tost.on{opacity:1;transform:translate(-50%,0)}
@keyframes latido{0%,100%{opacity:.5;transform:scale(.9)}50%{opacity:1;transform:scale(1)}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;
    transition-duration:.001ms !important}
  .viajev,.actua .est{display:none}
  main.entrando>*{animation:none}
}
/* ═══ FOTO EN EL BUZÓN + PINTOR ═══════════════════════════════════════════
   Diseño de Daniel (28/07): subes una foto, un lapicito abre un lienzo a pantalla
   completa, pintas encima con zoom para precisar, y al salir se fusionan las dos capas.
   ═════════════════════════════════════════════════════════════════════════ */
.bzfoto{display:flex;align-items:center;gap:10px;margin:2px 0 12px}
.bzfoto .mini{width:54px;height:54px;border-radius:8px;object-fit:cover;flex:none;
  border:1px solid var(--line);background:#000}
.bzfoto .tx{flex:1;min-width:0;font-size:11.5px;color:var(--ink3);line-height:1.45}
.bzfoto .tx b{display:block;color:var(--ink2);font-size:12.5px}
.bzfoto button{flex:none}
/* A PANTALLA COMPLETA de verdad: `position:fixed;inset:0` sale del modal y tapa la app
   entera. Se pinta mejor cuanto más grande, que es justo lo que se pidió. */
.pintor{position:fixed;inset:0;z-index:90;background:#0A0909;display:none;
  flex-direction:column;touch-action:none;overscroll-behavior:none}
.pintor.on{display:flex}
/* El lienzo se ancla ARRIBA A LA IZQUIERDA del area y se coloca solo con `transform`.
   Estaba centrado por el grid, asi que `vista.x` era un desplazamiento sobre una
   posicion ya centrada mientras el pellizco calculaba con coordenadas de PANTALLA: al
   ampliar, la imagen se iba del dedo casi dos mil pixeles. Con el origen en 0,0 las dos
   cuentas hablan del mismo sitio. */
.pzona{flex:1;min-height:0;position:relative;overflow:hidden}
.plienzo{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;line-height:0}
.plienzo img{display:block;max-width:none;user-select:none;-webkit-user-drag:none}
.plienzo canvas{position:absolute;left:0;top:0;width:100%;height:100%}
/* La barra respeta el indicador de inicio: si no, «Listo» queda medio tapado y hay que
   pulsar dos veces (mismo fallo que se arregló en la barra de abajo). */
.pbarra{flex:none;background:rgba(24,22,22,.98);border-top:1px solid var(--line);
  padding:9px 12px calc(9px + env(safe-area-inset-bottom,0px));display:flex;
  flex-direction:column;gap:9px}
.pfila{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pcol{width:26px;height:26px;border-radius:50%;flex:none;border:2px solid transparent;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.5)}
.pcol.on{border-color:var(--ink)}
.pintor input[type=color]{width:30px;height:30px;padding:0;border:1px solid var(--line);
  border-radius:8px;background:none;flex:none}
.pgr{display:flex;gap:6px;align-items:center;flex:none}
.pgr button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);
  display:grid;place-items:center;background:var(--sur2)}
.pgr button.on{border-color:var(--red2)}
.pgr button i{display:block;border-radius:50%;background:var(--ink)}
.pintor .modos{flex:none}
.pintor .crece{flex:1}
</style>
</head>

   sobre los 32 de la temporada). Se calcula igualmente, porque un numero a mano deja de

     «cada mes tiene un peso de 1 y dentro de ese mes se reparte equitativamente entre los
      miembros activos; luego se normaliza a los meses que hay. Un mes con menos gente
      cuenta lo mismo que uno con mas: solo importa la media local de ese mes.»

   Sin eso, cada dia 1 el umbral pegaria un salto al aparecer un mes entero de golpe; con
   eso se mueve poco a poco. Por eso se calcula AQUI y no viene ya hecho del backend: el
   peso cambia cada dia, y un numero subido ayer ya no seria el de hoy.

   Los ingredientes -las medias mensuales ya cerradas y la del mes abierto- SI vienen del
   panel (`flujos/umbral.py`), porque salen del historico mensual y eso la app no lo tiene.

   OJO: la poblacion del umbral NO es la de las estadisticas, y es a proposito.

   Las estadisticas del panel (medias, «en infraccion») miden al equipo que hay HOY, asi que
   van sobre `_activos_()`. El umbral es otra cosa: sale del RRI y mide la TEMPORADA, asi que
   entran TODOS los que estuvieron en ella —tambien quien luego se fue—, cada uno por los
   meses que estuvo. Si alguien curro medio año, ese medio año cuenta.

   Y la magnitud tampoco es `hMes` (lo que llevas ESTE mes) sino **horas de temporada
   divididas por meses de estancia**, que es lo que dice la primera linea de
   `reglas/cuota.py`. Asi quien lleva 3 meses no sale hundido frente a quien lleva 11: la
   ponderacion por meses ya esta dentro del propio ratio.

   No las 'armonices' en una sola: son dos preguntas distintas con dos respuestas distintas.
   (Lo hice y salio 13,13 donde tocaba 11,80.) */
function _fraccionDelMes_(d){
  d=d||new Date();
  var dias=new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();   // dia 0 del siguiente
  return Math.max(0, Math.min(1, d.getDate()/dias));

function _umbral_(){
  var ing=DATA.umbral;

    var ma=ing.mesAbierto;
    if(ma && typeof ma.media==='number'){

      num+=ma.media*w; den+=w;

     aproximacion por persona: media de `horasTemp/meses` de TODOS los de la temporada. No
     es la misma cuenta -pondera por persona, no por mes- pero es del mismo orden y honesta.
     Y si ni eso, al ultimo valor conocido: nunca a 2/3 de tus propias horas, que no es el
     umbral de nadie. */
  var hs=(DATA.miembros||[]).map(function(m){
      return (typeof m.horasTemp==='number' && m.meses) ? (m.horasTemp/m.meses) : null;
    }).filter(function(h){ return typeof h==='number'; });
  if(hs.length<2) return UMBRAL;
  var media=hs.reduce(function(a,h){ return a+h; },0)/hs.length;
  return Math.max(UMBRAL_LO, Math.min(UMBRAL_HI, UMBRAL_FRAC*media));

/* instrumento de puntos — geometría de gauge(): 10 arcos de 36°, hueco de 8°.
   Aquí admite DECIMALES, porque lo que se mide es la MEDIA del equipo (04b). */
var ACX=75,ACY=75,AR=52,AGAP=8,ASTEP=36;
function arco(i,r,frac){
  var a0=(-90+i*ASTEP+AGAP/2)*Math.PI/180;
  var a1=(-90+i*ASTEP+AGAP/2+(ASTEP-AGAP)*frac)*Math.PI/180;
  return 'M'+(ACX+r*Math.cos(a0)).toFixed(2)+' '+(ACY+r*Math.sin(a0)).toFixed(2)+
    ' A'+r+' '+r+' 0 0 1 '+(ACX+r*Math.cos(a1)).toFixed(2)+' '+(ACY+r*Math.sin(a1)).toFixed(2);
}

/* lecturas automáticas: lo que un humano no ve de un vistazo en una tabla */
function insightsHTML(){
  var xs=[];
  /* se ordena por el MISMO porcentaje que luego se imprime: si no, el rotulo nombra
     a uno y ensena un numero que no es el mayor. */
  /* Tambien solo activos: «quien mas sube este mes» no puede ser alguien que se fue. */
  var conAnt=_activos_().filter(function(m){ return m.hAnt!=null && m.hAnt>0; });
  if(conAnt.length>=2){
    var vpc=function(m){ return (m.hMes-m.hAnt)/m.hAnt*100; };
    var subida=conAnt.slice().sort(function(a,b){return vpc(b)-vpc(a);})[0];
    var bajada=conAnt.slice().sort(function(a,b){return vpc(a)-vpc(b);})[0];
    xs.push(['up',esc(subida.pila)+' es quien m\u00e1s sube: '+pc(vpc(subida))+
      ' respecto al mes pasado ('+h1(subida.hAnt)+' \u2192 '+h1(subida.hMes)+').']);
    xs.push(['dn',esc(bajada.pila)+' es quien m\u00e1s baja: '+pc(vpc(bajada))+
      ' ('+h1(bajada.hAnt)+' \u2192 '+h1(bajada.hMes)+').']);
  } else {
    /* no se finge una comparativa que no existe: se dice que falta el dato */
    xs.push(['wa','Todav\u00eda no hay horas del mes anterior, as\u00ed que no se puede comparar la evoluci\u00f3n.']);
    var top=_activos_().slice().sort(function(a,b){return (b.hMes||0)-(a.hMes||0);})[0];
    if(top) xs.push(['up',esc(top.pila)+' es quien m\u00e1s horas lleva este mes: '+h1(top.hMes||0)+'.']);
  }
  var enAire=pendientes().reduce(function(a,p){return a+p.horas;},0);
  if(enAire>0) xs.push(['wa',nf(enAire,1)+' h están sin firmar. Mientras sigan ahí, el umbral del mes y el '+
    'ranking se calculan con datos incompletos.']);
  var sinCubrir=REUS.reduce(function(a,r){
    var sc = r.sinCubrir || _cobertura_(r).sinCubrir;   /* el dato real no lo trae: se deriva */
    return a+((sc&&sc.length)||0); },0);
  if(sinCubrir) xs.push(['wa',sinCubrir+' personas no han cubierto alguna disponibilidad abierta. '+
    'Mira «Disponibilidad y riesgo» para ver qué sanción implicaría a cada una.']);
  var largos=CURSO.filter(function(c){return c.min>=600;}).length;
  if(largos) xs.push(['wa',largos+' fichaje'+(largos===1?'':'s')+' lleva'+(largos===1?'':'n')+
    ' más de 10 h abierto. A las 14 h se cierran solos con la hora de la última actividad.']);
  return xs.map(function(x){
    return '<div style="display:flex;gap:9px;padding:8px 0;border-top:1px solid rgba(50,44,46,.7);font-size:12.5px;color:var(--ink2);line-height:1.55">'+
      '<span class="'+x[0]+'" style="flex:none;font-family:var(--mono)">'+(x[0]==='up'?'▲':x[0]==='dn'?'▼':'!')+'</span>'+
      '<span>'+x[1]+'</span></div>';
  }).join('');
}

/* GEMELA · movil.html */
function _sinTildes_(t){ return (t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
/* GEMELA · movil.html — las etiquetas de día van en DD/MM: 'V 24' se lee peor y pierde
   el mes, que importa cuando el rango cruza de mes. */
function _ddmm_(d){ return pad(d.getDate())+'/'+pad(d.getMonth()+1); }
/* GEMELA · movil.html */
function _diasDesde_(iso,n){ var out=[],b=new Date(iso+'T00:00:00');
  for(var i=0;i<n;i++){ var d=new Date(b); d.setDate(b.getDate()+i); out.push(_ddmm_(d)); } return out; }
/* GEMELA · movil.html */
function _diasEntre_(a0,a1){ var out=[]; if(!a0||!a1) return out;
  var a=new Date(a0+'T00:00:00'), b=new Date(a1+'T00:00:00'); if(b<a) return out;
  for(var i=0;i<62&&a<=b;i++){ out.push(_ddmm_(a)); a.setDate(a.getDate()+1); } return out; }
/* GEMELA · movil.html — UNA SOLA REJILLA para todos los días, contigua y anclada al
   tamaño de slot. Antes cada día generaba SUS franjas desde SU hora de inicio, y un día a
   las 17:00 y otro a las 17:30 daban franjas alternas que se pisaban. Ahora el origen es
   común (el inicio más temprano, bajado al múltiplo del slot) y cada día solo OFERTA los
   slots que le caben enteros. `rangos` son horas decimales [ini,fin]; [0,0] = día off. */
function _genUnion_(rangos, slot){
  slot=Math.max(5, Math.min(240, +slot||60));
  var act=rangos.filter(function(r){ return r && r[1]>r[0]; });
  if(!act.length) return { F:[], perDia:rangos.map(function(){ return []; }) };
  var m0=Math.min.apply(null, act.map(function(r){ return Math.round(r[0]*60); }));
  var m1=Math.max.apply(null, act.map(function(r){ return Math.round(r[1]*60); }));
  m0=Math.floor(m0/slot)*slot;
  var F=[];
  for(var t=m0; t+slot<=m1+1e-9 && F.length<400; t+=slot)
    F.push({ini:pad(Math.floor(t/60))+':'+pad(t%60), dur:slot});
  var perDia=rangos.map(function(r){
    var out=[]; if(!(r && r[1]>r[0])) return out;
    var a=Math.round(r[0]*60), b=Math.round(r[1]*60);
    F.forEach(function(_,i){ var ti=m0+i*slot; if(ti>=a && ti+slot<=b) out.push(i); });
    return out;
  });
  return { F:F, perDia:perDia };
}

   media casilla no existe, y quedarse corto es no poder ir. */

  var d=+duracion||0, s=Math.max(5, +slot||60);
  return Math.max(1, Math.ceil(d/s) || 1);
}

  var h=Math.floor(min/60), m=min%60;
  if(!h) return m+' min';
  return h+' h'+(m?' '+m+' min':'');
}

/* CABLEADO DE LA CONVOCATORIA. Va aparte de `enganchar()` porque `pintar()` lo llama
   justo después de meter el HTML, y porque tiene su propio estado (`CONV_INV`) que hay
   que conservar entre repintados: si se reconstruyera, marcar a alguien y que el refresco
   en vivo lo borrase sería exactamente el fallo que se arregló en el móvil. */
function _cablearConvocar_(){
  var t=$('#cvTipo'); if(!t) return;                  // no está la vista o no hay potestad
  var val=function(id){ var e=$('#'+id); return e?e.value:''; };
  var dias=function(){ return _diasEntre_(val('cvD0'), val('cvD1')); };
  var rangos=function(){ var h0=_horasHM_(val('cvH0')), h1=_horasHM_(val('cvH1'));
    return dias().map(function(){ return [h0,h1]; }); };
  function pintaChips(){
    $$('#cvPool [data-cinv]').forEach(function(b){
      b.classList.toggle('on', CONV_INV.has(b.dataset.cinv)); });
    var n=$('#cvN'); if(n) n.textContent=CONV_INV.size;
  }
  function upd(){
    var sl=+val('cvSlot')||30, du=+val('cvDura')||60;
    var u=_genUnion_(rangos(), sl);
    var nb=u.perDia.reduce(function(a,x){ return a+x.length; },0), nd=dias().length;
    var nS=_slotsMin_(du,sl);
    var p=$('#cvPrev'); if(!p) return;
    /* La cuenta se dice ANTES de convocar: cuántas casillas salen, cuántas hay que juntar
       y a cuánta gente se le va a reclamar. Es lo que decide si el mapa sirve. */
    p.innerHTML = (!nd) ? 'Revisa las fechas: el rango está vacío o al revés.'
      : (!u.F.length || !nb) ? 'Con ese horario no sale ninguna casilla.'
      : '<b>'+u.F.length+'</b> casilla'+(u.F.length===1?'':'s')+' de <b>'+_durTxt_(sl)+'</b> · '+
        '<b>'+nb+'</b> bloques en <b>'+nd+'</b> día'+(nd===1?'':'s')+' · '+
        'hay que juntar <b>'+nS+'</b> seguida'+(nS===1?'':'s')+' ('+_durTxt_(nS*sl)+') para que cuente · '+
        '<b>'+CONV_INV.size+'</b> convocados'+
        (du%sl ? ' · la duración no es múltiplo de la casilla, se redondea hacia arriba' : '');
  }
  t.onchange=function(){
    /* Al cambiar el tipo se rehace la lista de convocados: es lo que espera cualquiera
       que elige «General» después de haber trasteado. Los tipos sin preset (consejo,
       mixta, trabajo) la dejan VACÍA a propósito, para que se elija a mano. */
    CONV_INV=new Set(_presetInvitados_(t.value)); pintaChips(); upd();
  };
  $$('[data-csub]').forEach(function(b){
    b.onclick=function(){
      b.classList.toggle('on');
      var u=b.dataset.csub, on=b.classList.contains('on');
      _activos_().forEach(function(m){ if(m.unidad===u && m.nombre!==ACTOR){
        if(on) CONV_INV.add(m.nombre); else CONV_INV.delete(m.nombre); } });
      pintaChips(); upd();
    };
  });
  $$('#cvPool [data-cinv]').forEach(function(b){
    b.onclick=function(){ var n=b.dataset.cinv;
      if(CONV_INV.has(n)) CONV_INV.delete(n); else CONV_INV.add(n);
      pintaChips(); upd(); };
  });
  ['cvD0','cvD1','cvH0','cvH1','cvSlot','cvDura'].forEach(function(id){
    var e=$('#'+id); if(e) e.onchange=upd; });
  upd();
  var bt=$('[data-convreu]');
  if(bt) bt.onclick=async function(){
    if(bt.disabled) return;
    var ds=dias(); if(!ds.length){ tost('Revisa las fechas: no hay días.'); return; }
    if(!CONV_INV.size){ tost('No has convocado a nadie.'); return; }
    var sl=+val('cvSlot')||30, du=+val('cvDura')||60;
    var u=_genUnion_(rangos(), sl), bloques=[];
    u.perDia.forEach(function(idxs,d){ idxs.forEach(function(fi){ bloques.push([d,fi]); }); });
    if(!u.F.length || !bloques.length){ tost('Con ese horario no sale ninguna casilla.'); return; }
    var nS=_slotsMin_(du,sl);
    /* Si el horario no da para la reunión entera, NADIE podrá marcar y la reunión nace
       muerta. Se avisa una vez y se deja convocar igual: puede ser a propósito. */
    if(u.F.length<nS && !bt.dataset.avisado){
      bt.dataset.avisado='1';
      tost('Ojo: el horario no da para '+_durTxt_(nS*sl)+' seguidos, así que nadie podrá '+
        'marcar. Pulsa otra vez para convocarla igual.');
      return;
    }
    var reu={ titulo:(val('cvTit')||'').trim()||'Reunión sin título',
      tipo:val('cvTipo')||'trabajo', modalidad:val('cvMod')||'hibrida',
      convocante:ACTOR||'', invitados:Array.from(CONV_INV),
      dias:ds, franjas:u.F, bloques:bloques, total:bloques.length,
      limite:val('cvLim')||null,
      /* `duracion` va REDONDEADA al múltiplo de casilla, igual que en el móvil: es lo que
         hay que juntar seguido para que valga, no la duración cruda. Si aquí se mandara
         la cruda, el mínimo al cubrir saldría distinto en cada cara. */
      slot:sl, duracion:nS*sl,
      ordenDia:(val('cvOrden')||'').trim(), vision:'anonima', resp:{} };
    if(!backendOK || !SESION){ tost('Sin conexión no se puede convocar.'); return; }
    if(!confirm('Convocar «'+reu.titulo+'» a '+reu.invitados.length+' personas.'+
      String.fromCharCode(10,10)+'Les tocará cubrir su disponibilidad, y de no cubrirla '+
      'salen sanciones.')) return;
    bt.disabled=true; var prev=bt.textContent; bt.textContent='Convocando…';
    try{
      await api.crear(reu);
      CONV_INV=null;                                  // la siguiente empieza limpia
      tost('Reunión convocada · '+reu.invitados.length+' convocados, '+bloques.length+' bloques.');
      /* Se RECARGA del servidor en vez de fabricar una copia local: así no se enseña algo
         que en la nube no está. Se conservan las respuestas ya hidratadas —la lista NO las
         trae, viven en su propia hoja— o los mapas de calor se quedarían a cero. */
      var lista=await api.listar();
      if(Array.isArray(lista) && lista.length){
        var prevResp={}; REUS.forEach(function(x){ if(x && x.resp && Object.keys(x.resp).length) prevResp[x.id]=x.resp; });
        REUS.length=0;
        lista.map(normReu).forEach(function(r){ if(prevResp[r.id]){ r.resp=prevResp[r.id]; r.calor=null; } REUS.push(r); });
      }
      pintar();
    }catch(e){ bt.disabled=false; bt.textContent=prev;
      tost('No se pudo convocar: '+((e&&e.message)||e)); }
  };
}

        VIS.slice().sort(function(a,b){return (b.hMes||0)-(a.hMes||0);}).map(function(m){

             sirve. Antes de inventarlo, se dice que no esta. */
          var hay=(m.hAnt!=null && m.hAnt>0);
          var d=hay?((m.hMes-m.hAnt)/m.hAnt*100):null, o=UMBRAL?((m.hMes-UMBRAL)/UMBRAL*100):0;
          return '<tr><td><span class="mem"><span class="av">'+ini(m.nombre)+'</span>'+esc(m.pila||m.nombre)+'</span></td>'+
            '<td style="color:var(--ink3)">'+esc(m.unidad)+'</td>'+
            '<td class="r mono">'+nf(m.hMes||0,1)+'</td>'+
            '<td class="r mono" style="color:var(--ink3)">'+(hay?nf(m.hAnt,1):'\u2014')+'</td>'+
            '<td class="r mono '+(d==null?'':(d>=0?'up':'dn'))+'">'+(d==null?'\u2014':pc(d))+'</td>'+
            '<td class="r mono '+(o>=0?'up':'dn')+'">'+pc(o)+'</td></tr>';
        }).join('')));
}};

/* ── CIERRE MENSUAL ──────────────────────────────────────────────────────── */
/* Estado del cierre traido del backend. `null` = todavia no se ha preguntado; distinguirlo
   de «no hay nada» importa, o la pantalla diria que todo esta listo sin haber mirado. */
var CIERRE=null, CIERRE_ERR=null;
async function _cargarCierre_(){
  if(typeof backendOK==='undefined' || !backendOK || !SESION){ CIERRE_ERR='sin conexión'; return; }
  try{ CIERRE=await api.getCierre(); CIERRE_ERR=null; }
  catch(e){ CIERRE=null; CIERRE_ERR=(e&&e.message)||String(e); }
  pintar();
}
/* El ultimo dia del mes y los que faltan, CALCULADOS. Estaban escritos a mano en el HTML
   («31/07/2026», «7 días»): en octubre habrian seguido diciendo lo mismo. */
function _finDeMes_(){
  var h=new Date(), fin=new Date(h.getFullYear(), h.getMonth()+1, 0);
  var dias=Math.max(0, Math.ceil((fin-new Date(h.getFullYear(),h.getMonth(),h.getDate()))/86400000));
  var p=function(x){ return (x<10?'0':'')+x; };
  return { txt:p(fin.getDate())+'/'+p(fin.getMonth()+1)+'/'+fin.getFullYear(), dias:dias,
           mes:['enero','febrero','marzo','abril','mayo','junio','julio','agosto',
                'septiembre','octubre','noviembre','diciembre'][h.getMonth()] };
}
V.cierre={g:'Horas',t:'Cierre mensual',f:function(){
  var fin=_finDeMes_();
  if(CIERRE===null && !CIERRE_ERR)
    return pan('Cierre de '+fin.mes,'comprobando…',

  var bloq=(CIERRE.bloqueos)||[], enc=CIERRE.encolado||null, plan=CIERRE.plan||null;

     cuenta: si la cuenta local y la del backend no coinciden, gana la del backend, que es

  var listo=!bloq.length;

             : listo ? ['LISTO PARA CALCULAR','ok'] : ['BLOQUEADO','no'];

    ['Decidir los partes de horas', !bloq.filter(function(b){return b.que==='partes';}).length,
     (bloq.filter(function(b){return b.que==='partes';})[0]||{}).texto || 'todo decidido'],
    ['Confirmar las sanciones pendientes', !bloq.filter(function(b){return b.que==='sanciones';}).length,
     (bloq.filter(function(b){return b.que==='sanciones';})[0]||{}).texto || 'ninguna sin confirmar']
  ];
  return '<div class="chips">'+
      '<span class="chip">CIERRA <b style="color:var(--ink)">'+fin.txt+'</b></span>'+

      '<span class="chip '+estado[1]+'">'+estado[0]+'</span></div>'+
    pan('Antes de cerrar', bloq.length? (bloq.length+' sin resolver') : 'nada pendiente',
      pasos.map(function(p){
        return '<div class="paso'+(p[1]?' ok':' bloq')+'"><span class="bx"></span>'+
          '<span class="tx"><b>'+esc(p[0])+'</b><small>'+esc(p[2])+'</small></span>'+

      }).join('')+
      '<div class="nota">Estas dos <b>bloquean</b> porque entran en la cuenta: unas horas que se '+

/* ── DOCUMENTOS ──────────────────────────────────────────────────────────── */
/* Estados y ambitos EN CASTELLANO. El chip pintaba el enum tal cual -«revision»,
   «analizado», «ambito archivo»-, que es vocabulario del pipeline, no de quien firma. */
var EST_DOC={recibido:['recibido',''],analizado:['analizado',''],revision:['en revisión','wa'],
  aprobado:['aprobado','ok'],anot:['aprobado con anotaciones','ok'],publicado:['publicado','ok'],
  cambios:['cambios pedidos','no'],rechazado:['rechazado','no'],publicando:['publicando','']};
var AMB_DOC={archivo:'archivo de miembro',subsistema:'informe de subsistema',general:'informe general'};
function estDoc(e){ return EST_DOC[e]||[String(e||'—'),'']; }
/* `severidad` mide LO MALO: severidad alta = calidad baja. Pintar «calidad alta» en el
   expediente con mas avisos decia justo lo contrario. GEMELA del `sevTxt` del movil. */
var CAL_DOC={baja:'alta',media:'media',alta:'baja'};
function calDoc(sev){ return 'calidad '+(CAL_DOC[sev]||'sin medir'); }
function ambDoc(a){ return AMB_DOC[a]||String(a||'—'); }
/* GEMELA de `puedeDecidirDoc` del movil y de `_puedeDecidir_` del backend: nadie firma
   lo suyo, el primero que decide bloquea a sus iguales, y solo alguien de MAS rango
   puede pisar esa decision. La fila solo miraba `est==='revision'`, asi que una vez
   decidido no habia forma de corregir un error desde aqui. */
function rangoPila(pila){ for(var i=0;i<DATA.miembros.length;i++)
  if(DATA.miembros[i].pila===pila) return rangoNom(DATA.miembros[i].nombre); return 0; }
function puedeDecidirDoc(d){
  if(!d || d.autor===ACTOR) return false;
  var rev=revisoresDeDoc(d), maxR=Math.max.apply(null,rev.map(rangoNom));
  if(rev.indexOf(ACTOR)<0 && rangoNom(ACTOR)<=maxR) return false;
  if(['revision','recibido','analizado'].indexOf(d.est)>=0) return true;
  return d.revisor===_m(ACTOR).pila || rangoNom(ACTOR)>rangoPila(d.revisor);
}
function _idDrive_(u){ var m=String(u||'').match(/\/d\/([A-Za-z0-9_-]{20,})/); return m?m[1]:null; }
/* La fila YA NO DECIDE. Tenia «Aprobar» y «Cambios» ahi mismo, con el titulo por toda
   informacion: eso es firmar a ciegas, justo lo que la pantalla venia a evitar. Ahora
   se pulsa y se abre el expediente entero (`docCard`), que es donde estan los botones. */
var DOC_SEL=null;                 // expediente desplegado en las listas compactas
function filaDoc(d){
  if(DOC_SEL===d.id) return docCard(d);
  var rev=revisoresDeDoc(d).map(function(n){return _m(n).pila;}).join(' o ');
  var st=estDoc(d.est), mio=puedeDecidirDoc(d) && d.est==='revision';
  return '<div class="dec" id="doc-'+d.id+'" data-docsel="'+d.id+'">'+
    '<span class="ic"><svg><use href="#i-doc"/></svg></span>'+
    '<span class="tx"><b>'+esc(d.tit)+'</b><small><span class="mono">'+esc(d.ref)+'</span> · '+
      esc(_m(d.autor).pila)+' · '+ambDoc(d.amb)+' · firma '+esc(rev)+
      (d.iss?' · '+d.iss+' aviso'+(d.iss===1?'':'s'):'')+'</small></span>'+
    '<span class="der">'+
      (mio?'<span class="chip wa">te toca</span>':'')+
      '<span class="chip '+(d.sev==='alta'?'no':d.sev==='media'?'wa':'ok')+'">'+calDoc(d.sev)+'</span>'+
      '<span class="chip '+st[1]+'">'+st[0]+'</span><span class="chev">›</span>'+
    '</span></div>';
}
/* EL EXPEDIENTE ENTERO, que es lo que hay que leer antes de firmar: resumen ejecutivo,
   analisis, avisos de calidad, la ultima decision con su motivo, el documento de Drive
   incrustado, y las cuatro palabras clave del correo real -aprobar, aprobar con
   anotaciones, solicitar cambios, rechazar- mas deshacer y reenviar. */
function docCard(d){
  var revs=revisoresDeDoc(d), rev=revs.map(function(n){return _m(n).pila;}).join(' o ');
  var puede=puedeDecidirDoc(d), st=estDoc(d.est), an=d.analisis||null, secs='';
  var lista=function(t,xs){ return (xs&&xs.length)
    ? '<div class="sub"><span class="sc">'+t+'</span><ul class="obj">'+
      xs.map(function(v){return '<li>'+esc(v)+'</li>';}).join('')+'</ul></div>' : ''; };
  if(an){
    if(an.proposito) secs+='<div class="sub"><span class="sc">Propósito</span>'+
      '<p style="margin:4px 0 0;font-size:12.5px;color:var(--ink2);line-height:1.6">'+esc(an.proposito)+'</p></div>';
    secs+=lista('Alcance',an.alcance)+lista('Decisiones',an.decisiones)+
          lista('Riesgos',an.riesgos)+lista('Fechas clave',an.fechasClave);
  }
  var avisos = (d.avisos&&d.avisos.length) ? lista('Avisos de calidad · '+d.avisos.length, d.avisos)
    : (d.iss ? '<div class="sub"><span class="sc">Calidad</span><p style="margin:4px 0 0;font-size:12px;'+
        'color:var(--ink3);line-height:1.55">'+d.iss+' aviso'+(d.iss===1?'':'s')+' de calidad, sin detalle. '+
        'Los manda Cowork con el expediente.</p></div>' : '');
  /* La decision anterior se ve SIN desplegar: es lo que hay que juzgar para deshacerla. */
  var previa = (d.est==='cambios'||d.est==='rechazado'||d.revisor)
    ? '<div class="just" style="border-left-color:var(--warn)"><span class="sc">'+
      (d.revisor?('decidió '+esc(d.revisor)):'última decisión')+' · '+st[0]+'</span>'+
      esc(d.nota||'Sin motivo escrito.')+'</div>' : '';
  var idD=_idDrive_(d.drive);
  var visor = d.drive
    ? '<div class="doc"><div class="dh" data-vdoc="'+esc(idD||'')+'">'+
      '<b>El documento</b><small>'+esc(d.ref)+' · pulsa para leerlo</small>'+
      '<svg viewBox="0 0 24 24" style="margin-left:auto;width:15px;height:15px;fill:none;'+
      'stroke:currentColor;stroke-width:2.4;transition:transform .3s"><path d="M6 9l6 6 6-6"/></svg></div>'+
      '<div class="vcuerpo" hidden></div>'+
      '<a class="da" href="'+esc(d.drive)+'" target="_blank" rel="noopener">abrir en Drive</a></div>'
    : '<div class="doc"><div class="dcar">Este expediente no trae enlace al archivo.<br>'+
      'Cowork lo manda en <span class="mono">enlaceDrive</span>; sin él no hay nada que leer aquí.</div></div>';
  var acc;
  if(puede){
    acc='<label style="display:block;margin-top:11px">'+
      '<span class="sc" style="display:block;margin-bottom:5px">Título · puedes corregirlo al aprobar con anotaciones</span>'+
      '<input id="dtit-'+d.id+'" value="'+esc(d.tit)+'" style="'+CAMPO_CSS+'"></label>'+
      '<textarea data-motivo placeholder="Motivo — obligatorio para pedir cambios o rechazar. Lo lee el autor…"></textarea>'+
      '<div class="acts">'+
        '<button class="btn pri" data-doc="'+d.id+'" data-acc="aprobado">Aprobar</button>'+
        '<button class="btn" data-doc="'+d.id+'" data-acc="anot">Aprobar con anotaciones</button>'+
        '<button class="btn" data-doc="'+d.id+'" data-acc="cambios">Solicitar cambios</button>'+
        '<button class="btn no" data-doc="'+d.id+'" data-acc="rechazado">Rechazar</button>'+
        (d.est!=='revision'&&d.revisor?'<button class="btn" data-doc="'+d.id+'" data-acc="deshacer">Deshacer y devolver a revisión</button>':'')+
      '</div>';
  } else if(d.autor===ACTOR && d.est==='cambios'){
    acc='<div class="acts"><button class="btn pri" data-doc="'+d.id+'" data-acc="reenviar">Reenviar corregido</button></div>';
  } else if(d.autor===ACTOR){
    acc='<div class="ruta">Es tuyo: lo firma <b>'+esc(rev)+'</b>. Nadie decide lo suyo, tampoco tú.</div>';
  } else if(d.revisor){
    acc='<div class="ruta">Ya lo decidió <b>'+esc(d.revisor)+'</b>. Puedes consultarlo; para cambiar la '+
      'decisión hace falta más rango que quién la tomó.</div>';
  } else {
    acc='<div class="ruta">Lo firma <b>'+esc(rev)+'</b>, no tú.</div>';
  }
  return '<div class="parte" id="doc-'+d.id+'">'+
    '<div class="h"><b>'+esc(d.tit)+'</b>'+
      '<span class="u">'+esc(d.ref)+'</span>'+
      '<span class="u">'+esc(d.tipo||'documento')+'</span>'+
      '<button class="btn sm" style="margin-left:auto" data-docsel="">Cerrar</button></div>'+
    '<div class="pils">'+
      '<span class="chip">'+esc(_m(d.autor).pila)+' · '+esc(d.sub||'—')+'</span>'+
      '<span class="chip">'+ambDoc(d.amb)+'</span>'+
      '<span class="chip '+st[1]+'">'+st[0]+'</span>'+
      '<span class="chip '+(d.sev==='alta'?'no':d.sev==='media'?'wa':'ok')+'">'+calDoc(d.sev)+'</span>'+
      (d.fecha?'<span class="chip">'+esc(d.fecha)+'</span>':'')+
    '</div>'+
    '<div class="just"><span class="sc">Resumen ejecutivo</span>'+
      esc(d.resumen||'El expediente llegó sin resumen. Léelo abajo antes de firmar.')+'</div>'+
    previa+secs+avisos+visor+
    '<div class="ruta" style="margin-top:11px">'+(puede?'Lo firmas tú.':'Firma: <b>'+esc(rev)+'</b>')+
      ' · Decidir aquí sustituye a contestar el correo de aprobación.</div>'+
    acc+
  '</div>';
}

/* ── DISCIPLINA ──────────────────────────────────────────────────────────── */
/* el rango de puntos del bloque se CALCULA, nunca se escribe a mano: un aviso (0
   puntos) no es «-1 punto», y un bloque puede mezclar valores. */
function rangoLote(){
  var vals=[],avisos=0;
  LOTE.items.forEach(function(x){ if(!Number(x.pts)) avisos++; else if(vals.indexOf(x.pts)<0) vals.push(x.pts); });
  vals.sort(function(a,b){return Math.abs(a)-Math.abs(b);});
  var et=function(pp){ return (pp>0?'+':'−')+Math.abs(pp)+' '+(Math.abs(pp)===1?'punto':'puntos'); };
  var nS=LOTE.items.length-avisos;
  var t = !vals.length ? '' : (vals.length===1 ? et(vals[0])+(nS>1?' c/u':'')
        : 'de '+et(vals[0])+' a '+et(vals[vals.length-1]));
  if(avisos) t += (t?' · ':'')+avisos+' aviso'+(avisos===1?'':'s');
  return t;
}
/* ── Sanciones sueltas e historial ────────────────────────────────────────────
   El backend las sirve desde siempre y el panel no las pintaba: se podia dejar a
   alguien sancionado sin que nadie lo viera. Las sueltas no son un bloque (cada una
   tiene su motivo y su articulo), asi que van en su propia tabla. */
function _sancSueltas_(){
  if(!Array.isArray(SANC_BACK)) return [];
  return SANC_BACK.filter(function(s){ return s.estado==='pendiente' && !s.lote; });
}
function _sancHist_(){
  if(!Array.isArray(SANC_BACK)) return [];
  return SANC_BACK.filter(function(s){ return s.estado && s.estado!=='pendiente'; })
    .sort(function(a,b){ return String(b.creado_at||'').localeCompare(String(a.creado_at||'')); });
}
function _selectorLotes_(){

    'border-radius:8px;padding:8px 10px;color:var(--ink);font:inherit;font-size:12.5px">'+
    LOTES_PEND.map(function(l,i){
      return '<option value="'+i+'"'+(i===LOTE_SEL?' selected':'')+'>'+esc(l)+'</option>'; }).join('')+
    '</select></label></div>';
}

/* Disponibilidad y riesgo: por reunión, un desplegable con quién no ha cubierto

/* ═══════════════════════════════════════════════════════════════════════════
   La rejilla real NO es un rectangulo lleno: la del 28/07 son 14 dias x 13 franjas
   = 182 celdas, pero solo 102 estan OFERTADAS, y `resp[nombre]` es un vector plano
   indexado contra `bloques`, no contra [dia][franja]. Leerlo como matriz densa da
   basura. Esto reproduce lo que ya hace app.html: matriz dispersa con null en lo
   no ofertado. Si la reunion trae `calor` (semilla ficticia), se respeta.

   bloque; el ORDEN DE LOS BLOQUES no se toca, porque `resp[n]` esta alineado a esa posicion. */

   LOS BLOQUES no se toca: `resp[nombre]` esta alineado a esa posicion y reordenarlo pegaria
   cada disponibilidad a la franja equivocada. */

  var idx=F.map(function(_,i){ return i; });

    return {franjas:F, bloques:bl, fijadaBl:fij, cambio:false};

    fijadaBl: fij.map(function(b){ return Array.isArray(b)?[b[0],pos[b[1]]]:b; }),

   25 % de los bloques ofertados en MAYO–AGOSTO y DICIEMBRE–ENERO; 30 % el resto.

/* ── BUZON: la cola de reportes ───────────────────────────────────────────────
   Solo el PD. El backend lo revalida por token; esto es la puerta, no la cerradura.
   Esta pantalla NO aplica nada: mueve el estado del reporte y ya. Construir y publicar
   siguen siendo pasos aparte, y la vista previa es un Artifact, nunca produccion.
   ─────────────────────────────────────────────────────────────────────────── */
var BUZON=null, BUZON_ERR=null, BUZON_SEL=null;
/* Reportar desde el escritorio. Mismo criterio que en el movil: dos campos a mano y el
   resto lo rellena la app. Se hace con un `prompt` encadenado a proposito -esta cara no
   tiene modales y montar uno solo para esto seria mas superficie de la que vale-. */
var BZ_FOTO=null;                 // {url, w, h} — lo que se enviará, ya fusionado
var PINT_MAX=1600;                // lado mayor. Una captura de iPhone son 1179x2556 y 4 MB
var PINT_COLORES=['#E41E25','#F2C94C','#3EB489','#3f9ed6','#FFFFFF','#111111'];
var PINT_GROSORES=[0.004,0.008,0.016];   // fracción del lado mayor: el trazo escala con la foto

/* Reduce ANTES de nada. No es solo por el peso del envío: pintar sobre un lienzo de 12 Mpx
   en un móvil va a tirones, y la captura se sigue leyendo a 1600. */
function _leerImagen_(file){
  return new Promise(function(ok,mal){
    if(!file){ mal(new Error('sin fichero')); return; }
    if(!/^image\//.test(file.type||'')){ mal(new Error('eso no es una imagen')); return; }
    var fr=new FileReader();
    fr.onerror=function(){ mal(new Error('no se pudo leer el fichero')); };
    fr.onload=function(){
      var im=new Image();
      im.onerror=function(){ mal(new Error('no se pudo abrir la imagen')); };
      im.onload=function(){
        var k=Math.min(1, PINT_MAX/Math.max(im.naturalWidth, im.naturalHeight));
        var w=Math.max(1,Math.round(im.naturalWidth*k)), h=Math.max(1,Math.round(im.naturalHeight*k));
        var c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(im,0,0,w,h);
        ok({ url:c.toDataURL('image/jpeg',0.85), w:w, h:h });
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function _pesoKB_(dataUrl){
  var i=(dataUrl||'').indexOf(',');
  return i<0 ? 0 : Math.round((dataUrl.length-i-1)*0.75/1024);   // base64 → bytes
}

/* EL PINTOR. `alTerminar(dataUrl)` recibe las dos capas YA fusionadas, o no se llama si
   se cancela. Todo el estado vive aquí dentro: al cerrarse no queda nada. */
function _abrirPintor_(fondoUrl, alTerminar){
  var caja=$('#pintor'), zona=$('#pzona'), lienzo=$('#plienzo');
  var img=$('#pfondo'), cv=$('#ptrazos');
  if(!caja||!img||!cv) return;
  var ctx=cv.getContext('2d');
  /* TRAZOS, no píxeles: cada uno es {color, grosor, pts:[[x,y],…]} en coordenadas de
     IMAGEN. Deshacer es quitar el último y repintar. Con capturas de pantalla a resolución
     completa, guardar un snapshot por trazo se come la memoria de un móvil. */
  var trazos=[], activo=null;
  var color=PINT_COLORES[0], grosor=PINT_GROSORES[1], modo='pintar';
  var vista={e:1, x:0, y:0}, punteros={}, pellizco=null;

  function aplicarVista(){
    lienzo.style.transform='translate('+vista.x.toFixed(1)+'px,'+vista.y.toFixed(1)+'px) scale('+vista.e.toFixed(4)+')';
  }
  function repintar(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.lineCap='round'; ctx.lineJoin='round';
    trazos.concat(activo?[activo]:[]).forEach(function(t){
      if(!t.pts.length) return;
      ctx.strokeStyle=t.color; ctx.lineWidth=t.grosor;
      ctx.beginPath(); ctx.moveTo(t.pts[0][0], t.pts[0][1]);
      /* Un toque sin arrastre es un punto: sin esto, marcar algo pequeño no pinta nada. */
      if(t.pts.length===1) ctx.lineTo(t.pts[0][0]+0.01, t.pts[0][1]);
      else for(var i=1;i<t.pts.length;i++) ctx.lineTo(t.pts[i][0], t.pts[i][1]);
      ctx.stroke();
    });
  }
  /* LA CONVERSIÓN QUE IMPORTA. El lienzo va dentro de un contenedor con `transform`, así
     que su `getBoundingClientRect()` YA incluye zoom y desplazamiento: dividir por el ancho
     del rectángulo da la coordenada en píxeles de imagen sin tocar la matriz a mano. Con
     cuentas propias, el trazo se desplaza en cuanto haces zoom. */
  function aImagen(ev){
    var r=cv.getBoundingClientRect();
    return [ (ev.clientX-r.left)/r.width*cv.width, (ev.clientY-r.top)/r.height*cv.height ];
  }
  function encajar(){
    var rz=zona.getBoundingClientRect();
    var k=Math.min(rz.width/cv.width, rz.height/cv.height);
    vista.e=k; vista.x=(rz.width-cv.width*k)/2; vista.y=(rz.height-cv.height*k)/2;
    aplicarVista();
  }
  function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }

  zona.onpointerdown=function(ev){
    /* La captura va en `try` y ANTES de nada: `setPointerCapture` LANZA si el navegador no
       reconoce ese puntero, y sin el try la excepción se lleva por delante el resto del
       manejador — el dedo no se registra, `punteros` se queda con uno solo y el pellizco no
       llega a existir. Que la captura falle no puede impedir seguir el gesto. */
    try{ zona.setPointerCapture(ev.pointerId); }catch(_){}
    punteros[ev.pointerId]={x:ev.clientX,y:ev.clientY};
    var ids=Object.keys(punteros);
    if(ids.length===2){
      /* DOS DEDOS SIEMPRE HACEN ZOOM, aunque estés en modo pintar: es el gesto que todo el
         mundo prueba primero. Si había un trazo empezado se descarta, porque era el primer
         dedo del pellizco y no un trazo de verdad. */
      activo=null; repintar();
      var a=punteros[ids[0]], b=punteros[ids[1]], rz=zona.getBoundingClientRect();
      /* El punto medio se guarda RELATIVO al area, que es el sistema en el que vive
         `vista.x`. Con coordenadas de pantalla se mezclan dos origenes distintos. */
      pellizco={ d:dist(a,b), cx:(a.x+b.x)/2-rz.left, cy:(a.y+b.y)/2-rz.top,
                 e:vista.e, x:vista.x, y:vista.y };
      return;
    }
    if(ids.length>2) return;
    if(modo==='pintar'){
      var p=aImagen(ev);
      activo={ color:color, grosor:Math.max(1, grosor*Math.max(cv.width,cv.height)), pts:[p] };
      repintar();
    } else {
      /* Arrastrar es un DELTA, asi que aqui el origen da igual; se guarda en pantalla.
         `d:0` es lo que distingue arrastre de pellizco. */
      pellizco={ d:0, cx:ev.clientX, cy:ev.clientY, e:vista.e, x:vista.x, y:vista.y };
    }
  };
  zona.onpointermove=function(ev){
    if(!punteros[ev.pointerId]) return;
    punteros[ev.pointerId]={x:ev.clientX,y:ev.clientY};
    var ids=Object.keys(punteros);
    if(ids.length>=2 && pellizco && pellizco.d){
      var a=punteros[ids[0]], b=punteros[ids[1]];
      var k=Math.max(0.2, Math.min(8, dist(a,b)/pellizco.d));
      var e2=Math.max(0.1, Math.min(12, pellizco.e*k));
      var kk=e2/pellizco.e;
      /* El punto medio de los dedos se queda quieto: es lo que hace que el pellizco se
         sienta bien. Sin esto la imagen se va del dedo al ampliar. */
      var rz=zona.getBoundingClientRect();
      var cx=(a.x+b.x)/2-rz.left, cy=(a.y+b.y)/2-rz.top;
      vista.e=e2;
      vista.x=cx-(pellizco.cx-pellizco.x)*kk;
      vista.y=cy-(pellizco.cy-pellizco.y)*kk;
      aplicarVista(); return;
    }
    if(activo && modo==='pintar'){
      var p=aImagen(ev);
      var u=activo.pts[activo.pts.length-1];
      /* Se descartan los puntos que no aportan: con el dedo llegan decenas por segundo y
         guardarlos todos engorda el repintado sin cambiar el trazo. */
      if(Math.hypot(p[0]-u[0], p[1]-u[1]) > 0.7){ activo.pts.push(p); repintar(); }
      return;
    }
    if(pellizco && !pellizco.d && modo==='mover'){
      vista.x=pellizco.x+(ev.clientX-pellizco.cx);
      vista.y=pellizco.y+(ev.clientY-pellizco.cy);
      aplicarVista();
    }
  };
  function soltar(ev){
    delete punteros[ev.pointerId];
    if(!Object.keys(punteros).length){
      pellizco=null;
      if(activo){ trazos.push(activo); activo=null; repintar(); }
    }
  }
  zona.onpointerup=soltar; zona.onpointercancel=soltar; zona.onpointerleave=soltar;
  /* ÚNICA DIFERENCIA CON EL MÓVIL, y va marcada: con ratón no hay dos dedos, así que la
     rueda hace zoom. Misma cuenta que el pellizco —el punto bajo el cursor se queda
     quieto—, con el cursor haciendo de punto medio. */
  zona.onwheel=function(ev){
    ev.preventDefault();
    var rz=zona.getBoundingClientRect();
    var px=ev.clientX-rz.left, py=ev.clientY-rz.top;
    var k=Math.exp(-ev.deltaY*0.0015);
    var e2=Math.max(0.1, Math.min(12, vista.e*k)), kk=e2/vista.e;
    vista.x=px-(px-vista.x)*kk;
    vista.y=py-(py-vista.y)*kk;
    vista.e=e2; aplicarVista();
  };

  /* la paleta: los presets más el selector de color del sistema, que es el «típico» */
  var pc=$('#pcolores');
  pc.innerHTML=PINT_COLORES.map(function(c,i){
    return '<button class="pcol'+(i===0?' on':'')+'" data-pc="'+c+'" style="background:'+c+'" data-p aria-label="color"></button>';
  }).join('')+'<input type="color" id="pcolorlibre" value="'+PINT_COLORES[0]+'" aria-label="otro color">';
  function marcarColor(c){
    color=c;
    $$('#pcolores .pcol').forEach(function(b){ b.classList.toggle('on', b.dataset.pc===c); });
  }
  $$('#pcolores .pcol').forEach(function(b){ b.onclick=function(){ marcarColor(b.dataset.pc); }; });
  var cl=$('#pcolorlibre'); if(cl) cl.oninput=function(){ marcarColor(cl.value); };

  var pg=$('#pgrosor');
  pg.innerHTML=PINT_GROSORES.map(function(g,i){
    var d=Math.round(4+i*4);
    return '<button data-pg="'+g+'"'+(i===1?' class="on"':'')+' data-p aria-label="grosor">'+
      '<i style="width:'+d+'px;height:'+d+'px"></i></button>';
  }).join('');
  $$('#pgrosor button').forEach(function(b){ b.onclick=function(){
    grosor=+b.dataset.pg;
    $$('#pgrosor button').forEach(function(x){ x.classList.toggle('on', x===b); }); }; });

  $$('#pmodo button').forEach(function(b){ b.onclick=function(){
    modo=b.dataset.pm;
    $$('#pmodo button').forEach(function(x){ x.classList.toggle('on', x===b); }); }; });
  $('#pdeshacer').onclick=function(){
    if(!trazos.length){ tost('No hay nada que deshacer.'); return; }
    trazos.pop(); repintar();
  };

  function cerrar(){ caja.classList.remove('on'); caja.setAttribute('aria-hidden','true'); }
  $('#pcancelar').onclick=function(){
    if(trazos.length && !confirm('Vas a salir sin guardar lo que has pintado. ¿Seguro?')) return;
    cerrar();
  };
  $('#plisto').onclick=function(){
    /* LA FUSIÓN POR CAPAS: la de abajo es la foto tal cual, la de arriba lo pintado. Sale
       un solo fichero, que es lo que se puede abrir en cualquier parte. */
    var out=document.createElement('canvas');
    out.width=cv.width; out.height=cv.height;
    var o=out.getContext('2d');
    o.drawImage(img, 0, 0, out.width, out.height);
    o.drawImage(cv, 0, 0);
    cerrar();
    alTerminar(out.toDataURL('image/jpeg', 0.82), trazos.length);
  };

  img.onload=function(){
    cv.width=img.naturalWidth; cv.height=img.naturalHeight;
    img.style.width=cv.width+'px'; img.style.height=cv.height+'px';
    repintar(); encajar();
  };
  img.src=fondoUrl;
  caja.classList.add('on'); caja.setAttribute('aria-hidden','false');
  if(img.complete && img.naturalWidth) img.onload();
}

/* ADJUNTAR EN EL ESCRITORIO. Aqui no hay modal —reportar es una cadena de `prompt()`—,
   asi que se pregunta y se abre el selector. **Despues** de los `prompt`, nunca durante:
   un `prompt` bloquea el hilo y el selector de fichero no llegaria a abrirse. */
function _pedirCaptura_(){
  return new Promise(function(ok){
    var f=document.createElement('input');
    f.type='file'; f.accept='image/*'; f.style.display='none';
    document.body.appendChild(f);
    /* Si se cierra el selector sin elegir nada no salta ningun evento, asi que la
       promesa se resolveria nunca. Se resuelve al volver el foco a la ventana. */
    var cerrado=false;
    function fin(v){ if(cerrado) return; cerrado=true; f.remove(); ok(v); }
    f.onchange=async function(){
      var file=f.files&&f.files[0];
      if(!file){ fin(null); return; }
      try{
        var im=await _leerImagen_(file);
        _abrirPintor_(im.url, function(url){ fin(url); });
      }catch(err){ tost('No se pudo usar esa imagen: '+((err&&err.message)||err)); fin(null); }
    };
    window.addEventListener('focus', function ret(){
      window.removeEventListener('focus', ret);
      setTimeout(function(){ if(!(f.files&&f.files.length)) fin(null); }, 400);
    });
    f.click();
  });
}

      try{ console.warn('api.'+accion+' no existe: ese dato no se refresca'); }catch(_){}
      return Promise.resolve(null);

function ir(k,foco){
  /* Al abrir el cierre se pregunta al servidor en que punto esta: los bloqueos y el plan
     los tiene el, no se deducen aqui. */
  if(k==='cierre' && CIERRE===null && !CIERRE_ERR) setTimeout(_cargarCierre_,60);
  if(k===vista && !foco) return;
  vista=k;
  var m=$('#main');
  if(redu()){ pintar(); m.scrollTop=0; colocarEstrella(true); if(foco) enfocar(foco); return; }
  m.classList.add('fundiendo');
  setTimeout(function(){
    pintar(); m.scrollTop=0;
    m.classList.remove('fundiendo'); m.classList.add('entrando');
    setTimeout(function(){ m.classList.remove('entrando'); },820);
    colocarEstrella(true);
    if(foco) enfocar(foco);
  },150);
}
/* llevar al sitio EXACTO, no a la sección: la fila que se abre queda marcada */
function enfocar(id){
  setTimeout(function(){
    var el=document.getElementById(id); if(!el) return;
    if(el.classList.contains('acord')) el.classList.add('ab');
    el.scrollIntoView({block:'center',behavior:redu()?'auto':'smooth'});
    el.style.transition='box-shadow .3s linear';
    el.style.boxShadow='0 0 0 2px var(--red)';
    setTimeout(function(){ el.style.boxShadow=''; },1600);
  },80);
}

  $$('[data-parte]').forEach(function(b){

        return;
